output_root: ./out

dataset_name: strict_repro_geometry
instance_version: v1
image_format: png
strict_repro: true
max_attempts_per_instance: 180
sampling_seed: 0
tasks:
  - task_id: task_geometry_measurement_angle
    count: 8
    params:
      min_angle: 30
      max_angle: 150
      angle_step: 1
      quantization_tolerance_degrees: 0.5
      max_abs_vector_component: 20
      min_ray_length_units: 2
      balanced_sampling: true
      source_kind_weights:
        primitive_angle: 1.0
        intersection_lines: 1.0
  - task_id: task_geometry_measurement_area
    count: 8
  - task_id: task_geometry_measurement_perimeter
    count: 8
  - task_id: task_geometry_measurement_length
    count: 8
  - task_id: task_geometry_measurement_slope
    count: 8
  - task_id: task_geometry_analytical_2d_area
    count: 8
