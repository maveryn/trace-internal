output_root: ./out

dataset_name: strict_repro_geometry
instance_version: v1
image_format: png
strict_repro: true
max_attempts_per_instance: 180
sampling_seed: 0
tasks:
  - task_id: task_geometry_measurement_value
    count: 8
    params:
      scene_variant: angle
      query_variant: angle
  - task_id: task_geometry_transformation_match
    count: 8
    params:
      scene_variant: triangle
      query_variant: reflection_match
  - task_id: task_geometry_similarity_count
    count: 8
    params:
      scene_variant: quadrilateral
      query_variant: similar_count
  - task_id: task_geometry_measurement_value
    count: 8
    params:
      scene_variant: circle
      query_variant: perimeter
  - task_id: task_geometry_comparison_value
    count: 8
    params:
      scene_variant: rectangle
      query_variant: largest_area
  - task_id: task_geometry_counting_value
    count: 8
    params:
      scene_variant: triangle
      query_variant: right_triangle
  - task_id: task_geometry_analytical_2d_value
    count: 8
    params:
      scene_variant: composite_region
      query_variant: composite_area
  - task_id: task_geometry_analytical_3d_value
    count: 8
    params:
      scene_variant: cylinder
      query_variant: volume
