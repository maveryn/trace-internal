output_root: ./out

dataset_name: strict_repro_geometry
instance_version: v1
image_format: png
strict_repro: true
max_attempts_per_instance: 150
sampling_seed: 0
tasks:
  - task_id: geometry_angle_value_query
    count: 5
    params:
      candidate_count: 7
      angle_step: 15
      target_x: 90
    query_weights:
      min: 1.0
      max: 1.0
      median: 1.0
      closest_to_x: 1.0
      smallest_above_x: 1.0
      largest_below_x: 1.0
      difference_max_min: 1.0
