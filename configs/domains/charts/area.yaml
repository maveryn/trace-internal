generation:
  shared:
    point_count_min: 7
    point_count_max: 10
    interval_span_min: 3
    interval_span_max: 5
    single_value_min: 8
    single_value_max: 44
    stacked_value_min: 4
    stacked_value_max: 16
    category_count_min: 3
    category_count_max: 4
    category_label_max_chars: 6
    dominance_margin_min: 4
  task_overrides:
    task_charts__area__interval_area_value:
      interval_span_min: 3
      interval_span_max: 3
      single_value_min: 8
      single_value_max: 30

rendering:
  shared:
    canvas_width: 1060
    canvas_height: 680
    plot_margin_left_px: 84
    plot_margin_right_px: 172
    plot_margin_top_px: 48
    plot_margin_bottom_px: 84
    axis_line_width_px_min: 2
    axis_line_width_px_max: 3
    grid_line_width_px_min: 1
    grid_line_width_px_max: 2
    tick_length_px: 8
    label_font_size_px: 19
    tick_font_size_px: 16
    value_font_size_px: 14
    legend_font_size_px: 17
    label_stroke_width_px_min: 1
    label_stroke_width_px_max: 2
    area_outline_width_px: 3
    point_radius_px: 6
    y_axis_tick_step: 10
    layout_jitter_enabled: true
    layout_jitter_x_px_min: -18
    layout_jitter_x_px_max: 18
    layout_jitter_y_px_min: -12
    layout_jitter_y_px_max: 12
    layout_jitter_min_margin_px: 22
    series_palette_rgb:
      - [72, 132, 204]
      - [225, 127, 72]
      - [92, 166, 106]
      - [166, 114, 190]
      - [214, 177, 69]
      - [86, 170, 176]
  task_overrides:
    task_charts__area__interval_area_value:
      value_font_size_px: 16

complexity:
  task_overrides:
    charts_area_panel_query_base:
      criteria_weights:
        visual_scan: 0.35
        reasoning_load: 0.45
        interval_span: 0.20
        scene_variant_load: 0.0

prompt:
  shared:
    bundle_id: charts_area_v0
    scene_key: area
    task_key: area_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint_integer: set "answer" to the requested value as an integer
    answer_hint_label: set "answer" to the requested category label as a string
    object_description_single_area: one filled area chart with labeled x-axis positions and numeric values shown at the points
    object_description_stacked_area: one stacked area chart with colored category bands, numeric band values, and a legend
    evidence_hint_interval_area_value: set "evidence" to an array of [x,y] pixel points for every point value from the first queried x-axis label through the second queried x-axis label
    evidence_hint_stacked_band_interval_sum_value: set "evidence" to an array of [x,y] pixel points for the queried category's band-value points from the first queried x-axis label through the second queried x-axis label
    evidence_hint_stacked_dominance_label: set "evidence" to an array of [x,y] pixel points for all category band-value points in the queried x-axis interval
    json_example_interval_area_value: '{"evidence":[[180,420],[280,360],[380,300],[480,260]],"answer":72}'
    json_example_stacked_band_interval_sum_value: '{"evidence":[[220,380],[330,340],[440,310]],"answer":36}'
    json_example_stacked_dominance_label: '{"evidence":[[210,420],[210,350],[210,280],[330,390],[330,330],[330,260]],"answer":"Orion"}'
    json_example_answer_only_interval_area_value: '{"answer":72}'
    json_example_answer_only_stacked_band_interval_sum_value: '{"answer":36}'
    json_example_answer_only_stacked_dominance_label: '{"answer":"Orion"}'
