visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [248, 248, 248]
      cool_light:
        kind: solid
        color: [246, 249, 252]
      warm_light:
        kind: solid
        color: [251, 249, 244]
      mint_light:
        kind: solid
        color: [246, 250, 247]
      lavender_gray:
        kind: solid
        color: [249, 248, 252]
      cool_grid:
        kind: grid
        base_color: [247, 250, 253]
        line_color: [233, 238, 244]
        spacing: 34
        line_width: 1
        major_every: 0
      warm_grid:
        kind: grid
        base_color: [252, 250, 245]
        line_color: [238, 232, 222]
        spacing: 36
        line_width: 1
        major_every: 0
      mint_grid:
        kind: grid
        base_color: [247, 251, 248]
        line_color: [232, 240, 234]
        spacing: 38
        line_width: 1
        major_every: 0
