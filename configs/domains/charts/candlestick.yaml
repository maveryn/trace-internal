generation:
  shared:
    candle_count_min: 7
    candle_count_max: 10
    value_min: 8
    value_max: 96
    body_size_min: 4
    body_size_max: 20
    wick_size_min: 2
    wick_size_max: 10
    counterfactual_change_min: 2
    counterfactual_change_max: 6
    balanced_query_id_sampling: true
    query_id_weights:
      wick_range_extremum_label: 1.0
      body_range_extremum_label: 1.0
      close_after_body_change_value: 1.0

rendering:
  shared:
    canvas_width: 1440
    canvas_height: 820
    plot_margin_left_px: 94
    plot_margin_right_px: 70
    plot_margin_top_px: 82
    plot_margin_bottom_px: 108
    y_axis_min: 0
    y_axis_max: 100
    y_tick_step: 20
    axis_line_width_px: 2
    grid_line_width_px: 1
    wick_line_width_px: 4
    body_outline_width_px: 2
    tick_length_px: 8
    title_font_size_px: 26
    tick_font_size_px: 16
    label_font_size_px: 18
    value_font_size_px: 15
    candle_width_fraction: 0.36
    up_fill_rgb_options:
      - [59, 151, 119]
      - [66, 143, 100]
      - [54, 139, 154]
    down_fill_rgb_options:
      - [210, 93, 83]
      - [196, 99, 70]
      - [188, 82, 108]
    wick_rgb_options:
      - [54, 60, 70]
      - [64, 66, 72]
      - [50, 66, 78]
    body_outline_rgb_options:
      - [38, 44, 54]
      - [50, 50, 54]
      - [42, 52, 62]

prompt:
  shared:
    bundle_id: charts_candlestick_v0
    scene_key: candlestick
    task_key: candlestick_ohlc_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint_value: set "answer" to the requested integer value
    answer_hint_label: set "answer" to the exact period label as a string
    object_description_candlestick: a candlestick OHLC chart with labeled periods; each candle has printed O, H, L, and C values for open, high, low, and close
    evidence_hint_value: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] around the candle body and printed values needed for the computation
    evidence_hint_label: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] around the answer candle, its period label, and the printed values needed for the comparison
    json_example_value: '{"evidence":[[240,220,284,340],[202,295,236,314],[286,241,323,260]],"answer":4}'
    json_example_label: '{"evidence":[[520,180,564,330],[508,640,532,662],[500,150,538,169],[502,352,540,371]],"answer":"K"}'
    json_example_answer_only_value: '{"answer":4}'
    json_example_answer_only_label: '{"answer":"K"}'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.30
      reasoning_load: 0.50
      scene_variant_load: 0.20
