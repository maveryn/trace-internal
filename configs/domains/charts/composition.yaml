prompt:
  shared:
    bundle_id: charts_composition_v0
    scene_key: composition_small_multiples
    task_key: small_multiples_aggregate_value_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested integer; for percentage-point questions, omit the percent sign
    object_description_small_multiple_pie: several small pie charts. Each panel has the same segment legend, slice numbers are percentages, and each panel title includes its total count
    object_description_small_multiple_donut: several small donut charts. Each panel has the same segment legend, slice numbers are percentages, and each panel title includes its total count
    evidence_hint_top_k_by_segment_then_sum_other_segment_count: 'set "evidence" to an object using exactly these keys: {evidence_key_list}. Put [x,y] pixel points at the centers of the corresponding selected-panel percentage labels or total-count text'
    evidence_hint_conditioned_panel_sum_from_percent: 'set "evidence" to an object using exactly these keys: {evidence_key_list}. Put [x,y] pixel points at the centers of the corresponding selected-panel percentage labels or total-count text'
    evidence_hint_average_top_k_minus_average_bottom_k: 'set "evidence" to an object using exactly these keys: {evidence_key_list}. Put [x,y] pixel points at the centers of the corresponding highest/lowest panel percentage labels'
    evidence_hint_composition_shift_l1_distance: 'set "evidence" to an object using exactly these keys: {evidence_key_list}. Put [x,y] pixel points at the centers of the corresponding start/end panel segment percentage labels'
    json_example_top_k_by_segment_then_sum_other_segment_count: '{"evidence":{"rank|2020|A":[230,250],"target|2020|B":[260,280],"total|2020":[245,110],"rank|2021|A":[500,255],"target|2021|B":[520,300],"total|2021":[505,112]},"answer":780}'
