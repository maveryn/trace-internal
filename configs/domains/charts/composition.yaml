      evidence_hint_chart_order_remaining_count: set "evidence" to an object mapping each excluded category label to the [x,y] pixel point at the center of its chart segment
      evidence_hint_sector_share_to_angle: set "evidence" to an object mapping each included category label to the [x,y] pixel point at the center of its chart segment
      evidence_hint_chart_order_adjacent_transfer_gap: set "evidence" to an object mapping the source category label and adjacent target category label to [x,y] pixel points at the centers of their chart segments
