generation:
  shared:
    category_count_min: 6
    category_count_max: 9
    series_count_min: 5
    series_count_max: 7
    query_category_subset_size_min: 3
    query_category_subset_size_max: 4
    query_series_subset_size_min: 3
    query_series_subset_size_max: 4
    comparison_subset_size_min: 2
    comparison_subset_size_max: 3
    value_min: 4
    value_max: 18
    task_variant_weights:
      category_subset_sum: 1.0
      series_across_categories_sum: 1.0
      subset_margin_sum: 1.0
    scene_variant_weights:
      stacked_bar: 1.0
      stacked_horizontal_bar: 1.0
    balanced_task_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 1120
    canvas_height: 720
    plot_margin_left_px: 120
    plot_margin_right_px: 72
    plot_margin_top_px: 44
    plot_margin_bottom_px: 112
    label_font_size_px: 24
    tick_font_size_px: 20
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.62
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    axis_color_rgb: [74, 78, 86]
    grid_color_rgb: [224, 227, 232]
    text_color_rgb: [38, 41, 48]
    text_stroke_rgb: [255, 255, 255]
    plot_fill_rgb: [255, 255, 255]

complexity:
  task_overrides:
    task_charts_composition_subset_value:
      criteria_weights:
        visual_scan: 0.35
        reasoning_load: 0.45
        scene_variant_load: 0.20

prompt:
  shared:
    bundle_id: charts_composition_v2
    task_family_key: composition_chart_value
    task_key: stacked_composition_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested integer value
    object_description_stacked_bar: a stacked bar chart with category stacks, a color legend, and printed segment values
    object_description_stacked_horizontal_bar: a stacked horizontal bar chart with category stacks, a color legend, and printed segment values
    evidence_hint_category_subset_sum: set "evidence" to an array [v1, v2, ...] listing the selected segment values in legend order for the queried stack
    evidence_hint_series_across_categories_sum: set "evidence" to an array [v1, v2, ...] listing the selected segment values in category order for the queried legend label
    evidence_hint_subset_margin_sum: set "evidence" to an array [m1, m2, ...] listing, in category order, the per-category margin sum(left subset) minus sum(right subset)
    json_example_category_subset_sum: '{"evidence":[6,9,5],"answer":20}'
    json_example_series_across_categories_sum: '{"evidence":[7,11,8],"answer":26}'
    json_example_subset_margin_sum: '{"evidence":[5,-3,9,1],"answer":15}'
    json_example_answer_only_category_subset_sum: '{"answer":20}'
    json_example_answer_only_series_across_categories_sum: '{"answer":26}'
    json_example_answer_only_subset_margin_sum: '{"answer":15}'
