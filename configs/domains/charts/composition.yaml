      json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
      answer_hint: set "answer" to the requested integer; for share values, omit the percent sign
      object_description_pie: one pie chart with a table of exact integer category shares
      object_description_donut: one donut chart with a table of exact integer category shares
      object_description_stacked_bar: one vertical 100% stacked bar with a table of exact integer category shares
      object_description_stacked_horizontal_bar: one horizontal 100% stacked bar with a table of exact integer category shares
      evidence_hint_contiguous_chart_order_sum: set "evidence" to an object mapping each included category label to the [x,y] pixel point at the center of its chart segment
      evidence_hint_positional_segment_share_sum: set "evidence" to an object mapping the anchor category label and each target category label to [x,y] pixel points at the centers of their chart segments
