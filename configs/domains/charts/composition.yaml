generation:
  shared:
    category_count_min: 4
    category_count_max: 7
    series_count_min: 3
    series_count_max: 5
    value_min: 4
    value_max: 18
    task_variant_weights:
      stack_total_at_label: 1.0
      stack_segment_value: 1.0
      combined_share_subset: 1.0
    scene_variant_weights:
      stacked_bar: 1.0
      stacked_horizontal_bar: 1.0
      pie: 1.0
      donut: 1.0
    balanced_task_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 980
    canvas_height: 620
    plot_margin_left_px: 108
    plot_margin_right_px: 56
    plot_margin_top_px: 44
    plot_margin_bottom_px: 100
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.62
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    axis_color_rgb: [74, 78, 86]
    grid_color_rgb: [224, 227, 232]
    text_color_rgb: [38, 41, 48]
    text_stroke_rgb: [255, 255, 255]
    plot_fill_rgb: [255, 255, 255]

prompt:
  shared:
    bundle_id: charts_composition_v1
    task_family_key: composition_chart_value
    task_key: subset_value_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    answer_hint: set "answer" to the requested integer value
    object_description_stacked_bar: a stacked bar chart. Each category has one bar divided into differently colored segments, a legend on the right maps segment colors to segment labels, and the integer segment values are printed inside the segments
    object_description_stacked_horizontal_bar: a stacked horizontal bar chart. Each category has one horizontal bar divided into differently colored segments, a legend on the right maps segment colors to segment labels, and the integer segment values are printed inside the segments
    object_description_pie: a pie chart with differently colored slices. A legend on the right maps each slice color to its label, and the relevant values are the percentages printed on the slices
    object_description_donut: a donut chart with differently colored slices. A legend on the right maps each slice color to its label, and the relevant values are the percentages printed on the slices
    evidence_hint_stack_total_at_label: set "evidence" to an array [v1, v2, ...] listing the segment values in legend order for the queried stack
    evidence_hint_stack_segment_value: set "evidence" to an array [v1, v2, ...] listing the segment values in legend order for the queried stack
    evidence_hint_combined_share_subset: set "evidence" to an array [v1, v2, ...] listing the slice percentages in legend order for the whole chart
    json_example_stack_total_at_label: '{"evidence":[6,9,5],"answer":20}'
    json_example_stack_segment_value: '{"evidence":[6,9,5],"answer":9}'
    json_example_combined_share_subset: '{"evidence":[18,27,22,33],"answer":45}'
    json_example_answer_only_stack_total_at_label: '{"answer":20}'
    json_example_answer_only_stack_segment_value: '{"answer":9}'
    json_example_answer_only_combined_share_subset: '{"answer":45}'
