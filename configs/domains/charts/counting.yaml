generation:
  shared:
    mark_count_min: 8
    mark_count_max: 20
    value_min: 1
    value_max: 99
    target_answer_min: 0
    target_answer_max: 20
    query_variant_weights:
      threshold_count: 1.0
      in_interval: 1.0
    comparison_weights:
      greater_than: 1.0
      less_than: 1.0
    scene_variant_weights:
      area: 1.0
      bar: 1.0
      line: 1.0
      scatter: 1.0
      horizontal_bar: 1.0
      dot_plot: 1.0
      lollipop: 1.0
    balanced_query_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 800
    canvas_height: 600
    plot_margin_left_px: 92
    plot_margin_right_px: 46
    plot_margin_top_px: 44
    plot_margin_bottom_px: 92
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.58
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.50
      reasoning_load: 0.30
      scene_variant_load: 0.20

prompt:
  shared:
    bundle_id: charts_counting_v0
    scene_key: labeled_chart_counting
    task_key: value_count_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the number of matching marks as an integer
    object_description_area: a labeled area chart where point labels identify y-values on the vertical axis
    object_description_bar: a labeled bar chart where each bar height is read from the vertical axis
    object_description_horizontal_bar: a labeled horizontal bar chart where each bar length is read from the horizontal axis
    object_description_line: a labeled line chart where point labels identify y-values on the vertical axis
    object_description_scatter: a labeled scatter plot where point labels identify y-values on the vertical axis
    object_description_dot_plot: a labeled dot plot where point labels identify y-values on the vertical axis
    object_description_lollipop: a labeled lollipop chart where point labels identify y-values on the vertical axis
    evidence_hint_threshold_count: set "evidence" to an array of [x, y] pixel points at the centers of all marks with values matching the strict threshold comparison
    evidence_hint_in_interval: set "evidence" to an array of [x, y] pixel points at the centers of all marks with values in the inclusive interval
    json_example_threshold_count: '{"evidence":[[180,260],[390,180],[610,320]],"answer":3}'
    json_example_in_interval: '{"evidence":[[165,310],[380,250],[590,285]],"answer":3}'
    json_example_answer_only_threshold_count: '{"answer":3}'
    json_example_answer_only_in_interval: '{"answer":3}'
