prompt:
  shared:
    bundle_id: charts_dashboard_v0
    scene_key: dashboard_mixed_chart
    task_key: dashboard_cross_panel_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint_value: set "answer" to the requested integer value
    answer_hint_count: set "answer" to the requested integer count
    answer_hint_label: set "answer" to the requested visible category label as a string
    answer_hint_option_letter: set "answer" to the selected option letter as a capital letter
    unanswerable_instruction: If either named panel is not shown, answer exactly "unanswerable".
    annotation_hint_source_rank_metric: set "annotation" to an object mapping "source_panel" and "target_panel" to [x,y] pixel points on the selected category marks in those panels
    annotation_hint_dual_source_target_sum: set "annotation" to an object mapping "first_source_panel", "second_source_panel", "target_first_category", and "target_second_category" to [x,y] pixel points on the corresponding category marks
    annotation_hint_count: set "annotation" to an array of [x,y] pixel points on each counted category mark
    annotation_hint_label: set "annotation" to an object mapping "first_panel" and "second_panel" to [x,y] pixel points on the compared category marks; if the answer is "unanswerable", use an empty object
    annotation_hint_shared_label_pair: set "annotation" to an object mapping "first_panel" and "second_panel" to [x,y] pixel points on the answer category marks in those panels
    annotation_hint_statement_option: set "annotation" to an object mapping "first_mark" and "second_mark" to [x,y] pixel points on the two chart marks that verify the selected statement
    json_example_source_rank_metric: '{"annotation":{"source_panel":[180,220],"target_panel":[860,260]},"answer":47}'
    json_example_dual_source_target_sum: '{"annotation":{"first_source_panel":[180,220],"second_source_panel":[410,250],"target_first_category":[760,260],"target_second_category":[880,300]},"answer":91}'
    json_example_count: '{"annotation":[[190,240],[790,245],[845,298]],"answer":3}'
    json_example_label: '{"annotation":{"first_panel":[175,240],"second_panel":[805,250]},"answer":"Flint"}'
    json_example_statement_option: '{"annotation":{"first_mark":[175,240],"second_mark":[805,250]},"answer":"C"}'
    json_example_answer_only_value: '{"answer":47}'
    json_example_answer_only_count: '{"answer":3}'
    json_example_answer_only_label: '{"answer":"Flint"}'
    json_example_answer_only_option_letter: '{"answer":"C"}'
    object_description_mixed_dashboard: a dashboard with {panel_count} titled panels named {panel_name_list}. Styles may be bar, line, donut, or radar, and a style may repeat. All panels share the same {category_count} category labels and colors, with exact integer values shown
