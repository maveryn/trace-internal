prompt:
  shared:
    bundle_id: charts_dashboard_v0
    scene_key: dashboard_mixed_chart
    task_key: dashboard_cross_panel_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint_value: set "answer" to the requested integer value
    answer_hint_count: set "answer" to the requested integer count
    answer_hint_label: set "answer" to the requested visible category label as a string
    unanswerable_instruction: If either named panel is not shown, answer exactly "unanswerable".
    evidence_hint_value: set "evidence" to an array of [x0,y0,x1,y1] boxes around the chart marks or value labels used in the calculation
    evidence_hint_count: set "evidence" to an array of [x0,y0,x1,y1] boxes for each counted category mark or label
    evidence_hint_label: set "evidence" to an array of [x0,y0,x1,y1] boxes around the compared category marks in the two panels
    json_example_value: '{"evidence":[[180,220,236,286],[860,260,924,318]],"answer":47}'
    json_example_count: '{"evidence":[[190,240,246,292],[790,245,846,298]],"answer":3}'
    json_example_label: '{"evidence":[[175,240,230,292],[805,250,862,306]],"answer":"C"}'
    json_example_answer_only_value: '{"answer":47}'
    json_example_answer_only_count: '{"answer":3}'
    json_example_answer_only_label: '{"answer":"C"}'
    object_description_mixed_dashboard: a dashboard with {panel_count} titled panels named {panel_name_list}. Styles may be bar, line, donut, or radar, and a style may repeat. All panels share the same {category_count} category labels and colors, with exact integer values shown
