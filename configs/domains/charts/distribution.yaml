prompt:
  shared:
    bundle_id: charts_distribution_v0
    scene_key: distribution_chart
    task_key: histogram_count_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested count as an integer
    answer_hint_cumulative_rank: set "answer" to the requested x-axis value as an integer
    object_description_histogram: a histogram with integer value labels on the horizontal axis. Each bar height gives the count for that value
    object_description_boxplot: a set of labeled boxplots. Each box spans the interquartile range, the line inside the box marks the median, and the whiskers show the minimum and maximum values shown
    object_description_paired_boxplot: two side-by-side boxplot panels with matching labels. The left panel is Before and the right panel is After
    object_description_violin: a set of labeled violin plots. Wider parts of each shape show where that label's values are denser on the vertical axis
    evidence_hint_interval_mass: set "evidence" to an array of [x0, y0, x1, y1] pixel boxes for all bars matching the requested interval relation
    evidence_hint_bin_count_between_values: set "evidence" to an array of [x0, y0, x1, y1] pixel boxes for all bars inside the queried value interval
    evidence_hint_rank_item_bin_label: set "evidence" to an array containing one [x0, y0, x1, y1] pixel box for the answer bar
    json_example_interval_mass: '{"evidence":[[160,260,204,520],[212,300,256,520],[264,240,308,520]],"answer":15}'
    json_example_bin_count_between_values: '{"evidence":[[160,260,204,520],[212,300,256,520],[264,240,308,520]],"answer":3}'
    json_example_rank_item_bin_label: '{"evidence":[[264,240,308,520]],"answer":18}'
    json_example_answer_only_interval_mass: '{"answer":15}'
    json_example_answer_only_bin_count_between_values: '{"answer":3}'
    json_example_answer_only_rank_item_bin_label: '{"answer":18}'
  task_overrides:
    charts_distribution_boxplot_label_base:
      task_key: boxplot_label_query
      answer_hint: set "answer" to the exact visible boxplot label as a string
      evidence_hint_median_reference_label: set "evidence" to an object with keys "reference_boxplot" and "answer_boxplot", each mapped to that boxplot's [x,y] pixel point
      evidence_hint_iqr_extremum_label: set "evidence" to an array of [x, y] pixel points at the center of the winning boxplot
      json_example_median_reference_label: '{"evidence":{"reference_boxplot":[240,300],"answer_boxplot":[430,250]},"answer":"Maple"}'
      json_example_iqr_extremum_label: '{"evidence":[[430,250]],"answer":"Ivory"}'
      json_example_answer_only_median_reference_label: '{"answer":"Maple"}'
      json_example_answer_only_iqr_extremum_label: '{"answer":"Ivory"}'
    charts_distribution_violin_label_base:
      task_key: violin_label_query
      answer_hint: set "answer" to the exact visible label string of the requested violin plot
      evidence_hint: set "evidence" to an array containing one [x0, y0, x1, y1] pixel box around the winning violin plot
      json_example: '{"evidence":[[240,140,330,520]],"answer":"Q"}'
      json_example_answer_only: '{"answer":"Q"}'
    task_charts__boxplot__median_rank_difference_value:
      task_key: boxplot_median_rank_difference_query
      answer_hint: set "answer" to the median difference as an integer
      evidence_hint: set "evidence" to an object with role keys for the two ranked boxplots used in the difference, each mapped to that boxplot's [x,y] pixel point
      json_example: '{"evidence":{"highest_median_boxplot":[240,300],"second_highest_median_boxplot":[430,250]},"answer":7}'
      json_example_answer_only: '{"answer":7}'
    task_charts__boxplot__paired_median_shift_label:
      task_key: boxplot_paired_median_shift_query
      answer_hint: set "answer" to the exact visible matched label as a string
      evidence_hint: set "evidence" to an object with keys "before_boxplot" and "after_boxplot", each mapped to that winning label's [x,y] pixel point
      json_example: '{"evidence":{"before_boxplot":[240,300],"after_boxplot":[305,250]},"answer":"Maple"}'
      json_example_answer_only: '{"answer":"Maple"}'
