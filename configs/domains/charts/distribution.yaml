generation:
  shared:
    bin_count_min: 4
    bin_count_max: 7
    bin_width_min: 2
    bin_width_max: 4
    bin_start_min: 0
    bin_start_max: 12
    bin_frequency_min: 1
    bin_frequency_max: 12
    category_count_min: 4
    category_count_max: 7
    violin_category_count_min: 4
    violin_category_count_max: 7
    value_min: 1
    value_max: 20
    balanced_task_variant_sampling: true
  task_overrides:
    task_charts_distribution_histogram_count:
      task_variant_weights:
        cumulative_count_to_bin: 1.0
        interval_mass: 1.0
        modal_bin_count: 1.0
    task_charts_distribution_boxplot_label:
      task_variant_weights:
        median_above_reference_q3: 1.0
        largest_iqr: 1.0
        smallest_iqr: 1.0
    task_charts_distribution_density_label:
      task_variant_weights:
        bimodal_label: 1.0
        highest_mode: 1.0
        lowest_mode: 1.0

rendering:
  shared:
    canvas_width: 860
    canvas_height: 620
    plot_margin_left_px: 104
    plot_margin_right_px: 54
    plot_margin_top_px: 44
    plot_margin_bottom_px: 110
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.58
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    axis_color_rgb: [74, 78, 86]
    grid_color_rgb: [224, 227, 232]
    text_color_rgb: [38, 41, 48]
    text_stroke_rgb: [255, 255, 255]
    plot_fill_rgb: [255, 255, 255]

complexity:
  task_overrides:
    task_charts_distribution_histogram_count:
      criteria_weights:
        visual_scan: 0.55
        reasoning_load: 0.45
        scene_variant_load: 0.0
    task_charts_distribution_boxplot_label:
      criteria_weights:
        visual_scan: 0.40
        reasoning_load: 0.60
        scene_variant_load: 0.0
    task_charts_distribution_density_label:
      criteria_weights:
        visual_scan: 0.30
        reasoning_load: 0.70
        scene_variant_load: 0.0

prompt:
  shared:
    bundle_id: charts_distribution_v1
    task_family_key: distribution_chart
    task_key: histogram_count_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested count as an integer
    object_description_histogram: a histogram with contiguous numeric interval bins on the horizontal axis. Each bar height gives the count for that interval
    object_description_boxplot: a set of labeled boxplots. Each box spans the interquartile range, the line inside the box marks the median, and the whiskers show the minimum and maximum shown
    object_description_violin: a set of labeled violin plots. Each violin shows the shape of one value distribution along the vertical axis, and the most prominent peaks indicate the modal values
    evidence_hint_modal_bin_count: set "evidence" to an array containing the label of the unique highest-count bin
    evidence_hint_interval_mass: set "evidence" to an array containing the labels of all bins included in the queried interval
    evidence_hint_cumulative_count_to_bin: set "evidence" to an array containing the labels of all bins from the first bin through the queried bin
    json_example_modal_bin_count: '{"evidence":["6-8"],"answer":9}'
    json_example_interval_mass: '{"evidence":["6-8","9-11"],"answer":15}'
    json_example_cumulative_count_to_bin: '{"evidence":["0-2","3-5","6-8"],"answer":18}'
    json_example_answer_only_modal_bin_count: '{"answer":9}'
    json_example_answer_only_interval_mass: '{"answer":15}'
    json_example_answer_only_cumulative_count_to_bin: '{"answer":18}'
  task_overrides:
    task_charts_distribution_boxplot_label:
      task_key: boxplot_label_query
      answer_hint: set "answer" to the single uppercase label of the requested boxplot
      evidence_hint_median_above_reference_q3: set "evidence" to the winning margin above the reference label's upper quartile as an integer
      evidence_hint_largest_iqr: set "evidence" to the largest interquartile range as an integer
      evidence_hint_smallest_iqr: set "evidence" to the smallest interquartile range as an integer
      json_example_median_above_reference_q3: '{"evidence":2,"answer":"M"}'
      json_example_largest_iqr: '{"evidence":6,"answer":"Q"}'
      json_example_smallest_iqr: '{"evidence":2,"answer":"B"}'
      json_example_answer_only_median_above_reference_q3: '{"answer":"M"}'
      json_example_answer_only_largest_iqr: '{"answer":"Q"}'
      json_example_answer_only_smallest_iqr: '{"answer":"B"}'
    task_charts_distribution_density_label:
      task_key: density_label_query
      answer_hint: set "answer" to the single uppercase label of the requested violin plot
      evidence_hint_highest_mode: set "evidence" to an array containing the winning modal value as one integer
      evidence_hint_lowest_mode: set "evidence" to an array containing the winning modal value as one integer
      evidence_hint_bimodal_label: set "evidence" to an array containing the two modal values of the bimodal violin in ascending order
      json_example_highest_mode: '{"evidence":[14],"answer":"Q"}'
      json_example_lowest_mode: '{"evidence":[5],"answer":"B"}'
      json_example_bimodal_label: '{"evidence":[6,12],"answer":"M"}'
      json_example_answer_only_highest_mode: '{"answer":"Q"}'
      json_example_answer_only_lowest_mode: '{"answer":"B"}'
      json_example_answer_only_bimodal_label: '{"answer":"M"}'
