prompt:
  shared:
    bundle_id: charts_error_interval_v0
    scene_key: error_interval_scene
    task_key: error_interval_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_horizontal_forest: a horizontal interval chart with labeled categories, point estimates, and lower-to-upper interval whiskers
    object_description_vertical_dot_whisker: a vertical dot-and-whisker interval chart with labeled categories and printed interval endpoints
    object_description_bar_with_error: a bar chart with error bars, labeled categories, and printed interval endpoints
    evidence_hint: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] around the interval mark or marks used for the answer
    answer_hint_count: set "answer" to the requested integer count
    answer_hint_label: set "answer" to the requested category label as a string
    json_example_reference_count: '{"evidence":[[220,260,520,292],[220,430,540,462]],"answer":2}'
    json_example_relation_label: '{"evidence":[[320,250,590,286]],"answer":"Cedar"}'
    json_example_answer_only_reference_count: '{"answer":2}'
    json_example_answer_only_relation_label: '{"answer":"Cedar"}'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.36
      reasoning_load: 0.44
      scene_variant_load: 0.20
