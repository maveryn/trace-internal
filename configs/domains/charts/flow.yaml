    middle_count_max: 3
    target_count_min: 2
    target_count_max: 3
    path_count_min: 3
    path_count_max: 4
    max_paths_per_node_side: 3
    radial_source_count_min: 4
    radial_source_count_max: 5
    radial_target_count_min: 4
    radial_target_count_max: 5
    radial_link_count_min: 7
    radial_link_count_max: 9
    radial_max_links_per_node_side: 4
    source_target_route_count_min: 2
    source_target_route_count_max: 2
    link_value_min: 5
    link_value_max: 35
    radial_link_value_min: 8
    radial_link_value_max: 35
    source_target_answer_min: 10
    source_target_answer_max: 90
    path_difference_min: 2
    path_difference_max: 25
    node_side_total_answer_min: 10
    node_side_total_answer_max: 90
    node_side_total_connected_min: 2
    node_side_total_connected_max: 3
    radial_transfer_answer_min: 16
    radial_transfer_answer_max: 100
    radial_group_size_min: 2
    radial_group_size_max: 3
    query_variant_weights:
      source_to_target_total_flow: 1.0
      path_bottleneck_value: 1.0
      path_flow_difference: 1.0
      source_outgoing_total_flow: 1.0
      target_incoming_total_flow: 1.0
      source_to_targets_total: 1.0
      sources_to_target_total: 1.0
      largest_target_for_source: 1.0
      largest_source_for_target: 1.0
      second_largest_target_for_source: 1.0
    scene_variant_weights:
      three_column_sankey: 1.0
      radial_chord_sankey: 1.0
    balanced_query_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 1440
    canvas_height: 1040
    outer_margin_px: 36
    panel_padding_px: 28
    title_band_height_px: 62
    node_width_px: 116
    node_height_px: 60
    radial_ring_radius_px: 360
    radial_chord_radius_inset_px: 54
    radial_node_width_px: 78
    radial_node_height_px: 50
    node_border_width_px: 2
    port_separation_px: 34
    shared_pair_lane_gap_px: 72
    min_flow_width_px: 6
    max_flow_width_px: 18
    radial_min_flow_width_px: 10
    radial_max_flow_width_px: 30
    value_label_font_size_px: 25
    value_label_gap_px: 16
    source_middle_label_t: 0.34
    middle_target_label_t: 0.66
    node_label_font_size_px: 30
    title_font_size_px: 31
    node_fill_rgb: [54, 63, 74]
    radial_color_scheme_options:
      - lagoon_coral
      - forest_plum
      - ink_gold
      - berry_teal
      - copper_blue
      - slate_citrus
    node_border_rgb: [30, 38, 46]
    node_text_rgb: [255, 255, 255]
    value_label_text_rgb: [28, 34, 42]
    flow_alpha: 138
    radial_flow_alpha: 172

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.40
      reasoning_load: 0.45
      scene_variant_load: 0.15

prompt:
  shared:
    bundle_id: charts_flow_v0
    scene_key: sankey
    task_key: sankey_path_query
    radial_scene_key: radial_sankey
    radial_task_key: radial_sankey_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_three_column_sankey: a three-column Sankey-style flow diagram. Each node has a visible label, each directed band has a printed integer value, and bands run from a source node through one middle node to a target node
    object_description_radial_chord_sankey: a radial Sankey-style flow diagram. Source nodes and target nodes are labeled around a ring, and each curved band has a printed integer flow value
    answer_hint: set "answer" to the requested integer
    evidence_hint: set "evidence" to an array of [x0,y0,x1,y1] pixel boxes for the printed flow-value labels used in the calculation
    radial_answer_hint_value: set "answer" to the requested integer total
    radial_answer_hint_label: set "answer" to the exact visible source or target label as a string
    radial_evidence_hint: set "evidence" to an array of [x0,y0,x1,y1] pixel boxes for the printed flow-value labels used in the calculation or comparison, plus the selected endpoint label when the answer is a label
    json_example_source_to_target_total_flow: '{"evidence":[[318,184,354,210],[742,190,778,216],[310,294,346,320],[742,284,778,310]],"answer":27}'
