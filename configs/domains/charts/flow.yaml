    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.05, 0.18]
      downsample:
        scale: [0.96, 0.99]
      jpeg:
        quality: [88.0, 96.0]
      noise:
        alpha: [0.005, 0.014]
