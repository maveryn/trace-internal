prompt:
  shared:
    bundle_id: charts_hexbin_density_v0
    scene_key: hexbin_density_scene
    task_key: hexbin_density_threshold_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a hexbin density chart with numeric axes and a discrete density-level legend
    answer_hint_count: set "answer" to the requested count as an integer
    annotation_hint_threshold_bin_count: set "annotation" to an array of [x0,y0,x1,y1] boxes around every visible hex bin matching the density-level threshold
    json_example_threshold_bin_count: '{"annotation":[[216,188,252,220],[306,248,342,280]],"answer":2}'
    json_example_answer_only_threshold_bin_count: '{"answer":2}'
