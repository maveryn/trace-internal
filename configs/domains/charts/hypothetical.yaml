generation:
  shared:
    mark_count_min: 4
    mark_count_max: 10
    value_min: 5
    value_max: 80
    value_window_enabled: false
    removed_count_min: 1
    removed_count_max: 2
    aggregate_count_min: 2
    aggregate_count_max: 3
    share_percent_values: [10, 15, 20, 25, 30, 40, 50, 60]
    baseline_percent_values: [25, 50, 75, 100]
    query_id_weights:
      remaining_mean_after_removal: 1.0
      target_share_after_removal: 1.0
      baseline_from_aggregate_percent_change: 1.0
    scene_variant_weights:
      bar: 1.0
      dot_plot: 1.0
      lollipop: 1.0
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 900
    canvas_height: 640
    plot_margin_left_px: 96
    plot_margin_right_px: 54
    plot_margin_top_px: 46
    plot_margin_bottom_px: 96
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.58
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    guide_line_mode: always

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.25
      reasoning_load: 0.55
      scene_variant_load: 0.20

prompt:
  shared:
    bundle_id: charts_hypothetical_v0
    scene_key: hypothetical_chart_counterfactual
    task_key: counterfactual_value_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested integer value; for percentage questions, omit the percent sign
    object_description_bar: a labeled bar chart where each bar height is read from the vertical axis
    object_description_dot_plot: a labeled dot plot where point labels identify y-values on the vertical axis
    object_description_lollipop: a labeled lollipop chart where point labels identify y-values on the vertical axis
    evidence_hint_remaining_mean_after_removal: set "evidence" to an array of [x,y] pixel points for the chart marks whose values remain in the average after the stated removals
    evidence_hint_target_share_after_removal: set "evidence" to an array of [x,y] pixel points for the chart marks whose values remain in the total after the stated removals
    evidence_hint_baseline_from_aggregate_percent_change: set "evidence" to an array of [x,y] pixel points for the chart marks whose values are combined before solving for the baseline
    json_example_remaining_mean_after_removal: '{"evidence":[[180,360],[320,240],[460,300]],"answer":18}'
    json_example_target_share_after_removal: '{"evidence":[[180,260],[320,340],[460,220]],"answer":25}'
    json_example_baseline_from_aggregate_percent_change: '{"evidence":[[220,340],[360,280],[500,220]],"answer":40}'
    json_example_answer_only_remaining_mean_after_removal: '{"answer":18}'
    json_example_answer_only_target_share_after_removal: '{"answer":25}'
    json_example_answer_only_baseline_from_aggregate_percent_change: '{"answer":40}'
