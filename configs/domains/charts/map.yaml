prompt:
  shared:
    bundle_id: charts_map_v0
    scene_key: region_map
    task_key: map_region_count_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_synthetic_region_map: a synthetic map with colored regions and a legend
    object_description_geographic_region_map: a geographic map with selected regions colored by value and a legend
    object_description_geographic_categorical_map: a geographic map with selected regions colored by category and a category legend
    object_description_region_value_map: a map with colored regions, visible region labels, visible integer values, and a legend
    object_description_geographic_group_value_map: a world map with selected countries colored by value, visible integer values, and a legend
    object_description_marker_map: a map with marker bubbles over selected regions
    answer_hint_count: set "answer" to the requested number of regions as an integer
    answer_hint_label: set "answer" to the exact visible region label as a string
    answer_hint_value: set "answer" to the requested total as an integer
    annotation_hint_region_count: set "annotation" to an array of [x0,y0,x1,y1] pixel boxes for the counted regions
    annotation_hint_region_value: set "annotation" to an array of [x0,y0,x1,y1] pixel boxes for the regions included in the total
    annotation_hint_marker: set "annotation" to an array of [x0,y0,x1,y1] pixel boxes, one around each answer marker bubble
