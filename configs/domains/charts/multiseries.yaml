generation:
  shared:
    category_count_min: 5
    category_count_max: 10
    series_count_min: 2
    series_count_max: 3
    value_min: 1
    value_max: 20
    target_answer_min: 0
    target_answer_max: 8
    task_variant_weights:
      series_a_gt_b_count: 1.0
      series_a_lt_b_count: 1.0
    scene_variant_weights:
      grouped_bar: 1.0
      multi_line: 1.0
      grouped_dot_plot: 1.0
      grouped_lollipop: 1.0
    balanced_task_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 860
    canvas_height: 620
    plot_margin_left_px: 92
    plot_margin_right_px: 40
    plot_margin_top_px: 44
    plot_margin_bottom_px: 92
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.72
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    axis_color_rgb: [74, 78, 86]
    grid_color_rgb: [224, 227, 232]
    text_color_rgb: [38, 41, 48]
    text_stroke_rgb: [255, 255, 255]
    plot_fill_rgb: [255, 255, 255]

prompt:
  shared:
    bundle_id: charts_multiseries_v1
    task_family_key: multiseries_chart_comparison
    task_key: pairwise_comparison_count_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    answer_hint: set "answer" to the number of category labels satisfying the requested series comparison as an integer
    object_description_grouped_bar: a grouped bar chart with labeled category groups on the horizontal axis and a legend on the right. Each colored bar height gives that series value for its category
    object_description_multi_line: a multi-line chart with labeled categories on the horizontal axis and a legend on the right. Each colored series has one point per category, and the relevant values are the points' y-values on the vertical axis
    object_description_grouped_dot_plot: a grouped dot plot with labeled categories on the horizontal axis and a legend on the right. Each colored point gives that series value for its category on the vertical axis
    object_description_grouped_lollipop: a grouped lollipop chart with labeled categories on the horizontal axis and a legend on the right. Each colored point gives that series value for its category on the vertical axis
    evidence_hint_series_a_gt_b_count: set "evidence" to an array containing the category labels where the first queried series is higher than the second queried series
    evidence_hint_series_a_lt_b_count: set "evidence" to an array containing the category labels where the first queried series is lower than the second queried series
    json_example_series_a_gt_b_count: '{"evidence":["B","M","Q"],"answer":3}'
    json_example_series_a_lt_b_count: '{"evidence":["A","T"],"answer":2}'
    json_example_answer_only_series_a_gt_b_count: '{"answer":3}'
    json_example_answer_only_series_a_lt_b_count: '{"answer":2}'
