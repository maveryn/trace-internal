generation:
  shared:
    axis_count_min: 4
    axis_count_max: 6
    profile_count_min: 5
    profile_count_max: 8
    crossing_axis_count_min: 4
    crossing_axis_count_max: 5
    crossing_profile_count_min: 4
    crossing_profile_count_max: 6
    value_min: 1
    value_max: 20
    condition_threshold_min: 8
    condition_threshold_max: 14
    condition_answer_count_min: 1
    condition_answer_count_max: 5
    crossing_answer_count_min: 1
    crossing_answer_count_max: 6
    profile_crossing_answer_count_min: 1
    profile_crossing_answer_count_max: 4
    query_variant_weights:
      above_on_both_axes: 1.0
      below_on_both_axes: 1.0
      above_on_one_below_on_other: 1.0
      largest_increase_between_axes: 1.0
      largest_decrease_between_axes: 1.0
      largest_absolute_change_between_axes: 1.0
      all_crossings_between_adjacent_axes: 1.0
      crossings_involving_profile_between_axes: 1.0
    scene_variant_weights:
      vertical_parallel_coordinates: 1.0
    balanced_query_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 1180
    canvas_height: 760
    plot_margin_left_px: 138
    plot_margin_right_px: 138
    plot_margin_top_px: 116
    plot_margin_bottom_px: 118
    line_width_px: 4
    point_radius_px: 5
    axis_line_width_px: 2
    selected_axis_line_width_px: 4
    grid_line_width_px: 1
    label_font_size_px: 18
    tick_font_size_px: 15
    title_font_size_px: 28
    threshold_font_size_px: 15

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.42
      reasoning_load: 0.43
      scene_variant_load: 0.15

prompt:
  shared:
    bundle_id: charts_parallel_coordinates_v0
    scene_key: parallel_coords_chart
    task_key: parallel_coords_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_parallel_coordinates: a parallel-coordinates chart. Each colored profile line is labeled at the ends and crosses the vertical metric axes; larger metric values are higher on each axis
    answer_hint_label: set "answer" to the exact profile letter as a string
    answer_hint_count: set "answer" to the count as an integer
    evidence_hint_label: set "evidence" to an array containing one [x0,y0,x1,y1] pixel box around the supporting profile segment
    evidence_hint_count: set "evidence" to an array of [x0,y0,x1,y1] pixel boxes around the supporting profile segments
    json_example_label: '{"evidence":[[240,180,430,360]],"answer":"C"}'
    json_example_count: '{"evidence":[[220,170,420,320],[220,380,420,520]],"answer":2}'
    json_example_answer_only_label: '{"answer":"C"}'
    json_example_answer_only_count: '{"answer":2}'
