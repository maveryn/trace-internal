prompt:
  shared:
    bundle_id: charts_pictogram_v0
    scene_key: pictogram_scene
    task_key: pictogram_quantity_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_waffle_grid_blocks: a repeated-mark quantity chart where each colored block represents the unit scale shown in the legend
    object_description_pictogram_rows: a repeated-mark pictogram where each icon represents the unit scale shown in the legend
    evidence_hint_category_total_value: set "evidence" to an object mapping the requested category label to an [x0, y0, x1, y1] pixel box around that category row
    evidence_hint_group_difference_value: set "evidence" to an object mapping each compared category label to an [x0, y0, x1, y1] pixel box around that category row
    evidence_hint_threshold_count: set "evidence" to an array of [x0, y0, x1, y1] pixel boxes around every category row matching the threshold
    answer_hint: set "answer" to the requested integer value
    json_example_category_total_value: '{"evidence":{"M4":[92,180,1160,248]},"answer":42}'
    json_example_group_difference_value: '{"evidence":{"M4":[92,270,1160,338],"Q8":[92,430,1160,498]},"answer":18}'
    json_example_threshold_count: '{"evidence":[[92,180,1160,248],[92,350,1160,418],[92,520,1160,588]],"answer":3}'
    json_example_answer_only_category_total_value: '{"answer":42}'
    json_example_answer_only_group_difference_value: '{"answer":18}'
    json_example_answer_only_threshold_count: '{"answer":3}'

