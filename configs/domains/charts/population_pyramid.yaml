generation:
  shared:
    row_count_min: 8
    row_count_max: 14
    value_min: 8
    value_max: 96
    gap_min: 4
    gap_max: 58
    side_threshold_min: 28
    side_threshold_max: 78
    side_threshold_step: 5
    combined_threshold_min: 70
    combined_threshold_max: 150
    combined_threshold_step: 10
    threshold_count_min: 2
    threshold_count_max: 9
    age_band_width_options: [5, 10]
    age_start_options: [0, 5, 10]
    series_label_pairs:
      - [Female, Male]
      - [Group A, Group B]
      - [Urban, Rural]
      - [North, South]
      - [Baseline, Scenario]
      - [Left cohort, Right cohort]
    balanced_query_id_sampling: true
    query_id_weights:
      largest_side_gap_label: 1.0
      smallest_nonzero_side_gap_label: 1.0
      left_side_threshold_count: 1.0
      right_side_threshold_count: 1.0
      combined_total_threshold_count: 1.0

