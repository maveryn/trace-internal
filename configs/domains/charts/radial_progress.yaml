    item_count_min: 6
    item_count_max: 10
    value_min: 10
    value_max: 95
    value_step: 5
    answer_count_min: 1
    answer_count_max: 5
    threshold_values: [30, 40, 50, 60, 70]
    range_pairs:
      - [20, 50]
      - [25, 55]
      - [30, 60]
      - [35, 65]
      - [40, 70]
      - [45, 75]
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    query_id_weights:
      at_least_threshold_count: 1.0
      below_threshold_count: 1.0
      within_range_count: 1.0
      remaining_at_least_threshold_count: 1.0
    scene_variant_weights:
      full_progress_rings: 1.0
      semicircle_gauges: 1.0
      segmented_radial_bars: 1.0

