    cluster_count_min: 4
    cluster_count_max: 7
    points_per_cluster_min: 8
    points_per_cluster_max: 12
    trend_target_abs_slope_min: 1.2
    trend_target_abs_slope_max: 1.7
    trend_slope_margin_min: 0.35
    trend_slope_margin_max: 0.85
    trend_same_direction_abs_slope_floor: 0.18
    trend_opposite_abs_slope_min: 0.25
    trend_opposite_abs_slope_max: 1.05
    trend_answer_x_jitter: 0.4
    trend_answer_y_jitter: 0.48
    trend_answer_y_jitter_scale: 0.14
    trend_distractor_x_jitter: 0.58
    trend_distractor_y_jitter: 0.66
    trend_distractor_y_jitter_scale: 0.18
    x_value_min: 0
    x_value_max: 100
    y_value_min: 0
    y_value_max: 100
    query_id_weights:
      cluster_trend_direction_label: 1.0
      cluster_separation_extremum_label: 1.0
      cluster_spread_extremum_label: 1.0
    trend_direction_weights:
      upward: 1.0
      downward: 1.0
    separation_extremum_weights:
      closest: 1.0
      farthest: 1.0
    spread_axis_weights:
      horizontal: 1.0
      vertical: 1.0
      overall: 1.0
    spread_extremum_weights:
      largest: 1.0
      smallest: 1.0
    balanced_query_id_sampling: true
    balanced_trend_direction_sampling: true
    balanced_separation_extremum_sampling: true
    balanced_spread_axis_sampling: true
    balanced_spread_extremum_sampling: true
  task_overrides:
    charts_scatter_series_readout_base:
      readout_series_count_min: 5
      readout_series_count_max: 5
      readout_x_count_min: 9
      readout_x_count_max: 10
      readout_y_value_min: 10
      readout_y_value_max: 90
      readout_min_series_gap_at_x: 4
      query_id_weights:
        series_highest_x_label: 1.0
        series_lowest_x_label: 1.0
        series_pair_value_gap_at_x: 1.0
        series_y_anchor_other_series_value: 1.0
      balanced_query_id_sampling: true

