prompt:
  shared:
    bundle_id: charts_scatter_v0
    scene_key: scatter_cluster
    task_key: scatter_cluster_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested cluster label as a string
    answer_hint_option_letter: set "answer" to the selected option letter as a capital letter
    annotation_hint: set "annotation" to an object mapping "answer_cluster" to the [x0,y0,x1,y1] box around the answer cluster hull; for closest/farthest-from questions, also include "reference_cluster"
    annotation_hint_centroid_option_selection_label: set "annotation" to an object mapping "target_cluster" to the [x0,y0,x1,y1] box around the named cluster hull and "selected_option_marker" to the [x0,y0,x1,y1] box around the selected option marker
    annotation_hint_cluster_area_rank_label: set "annotation" to an object mapping "answer_cluster" to the [x0,y0,x1,y1] box around the answer cluster's shaded footprint
    json_example: '{"annotation":{"reference_cluster":[120,260,245,350],"answer_cluster":[220,360,340,455]},"answer":"Cobalt"}'
    json_example_centroid_option_selection_label: '{"annotation":{"target_cluster":[145,255,276,344],"selected_option_marker":[312,276,342,306]},"answer":"D"}'
    json_example_cluster_area_rank_label: '{"annotation":{"answer_cluster":[145,255,276,344]},"answer":"Cobalt"}'
    json_example_answer_only: '{"answer":"Cobalt"}'
    json_example_answer_only_option_letter: '{"answer":"D"}'
    object_description_single_scatter: a scatter plot with several colored point clusters and a matching legend
    object_description_area_envelope_scatter: a scatter plot with several colored point clusters, shaded cluster footprints, and a matching legend
  task_overrides:
    charts_scatter_points_query_base:
      bundle_id: charts_scatter_v0
      scene_key: scatter_points
      task_key: scatter_points_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
      answer_hint_count: set "answer" to the requested count as an integer
      answer_hint_category_label: set "answer" to the exact visible category label as a string
      annotation_hint_point_set: set "annotation" to an array of [x,y] pixel points at the centers of the supporting data points
      json_example_count: '{"annotation":[[230,410],[512,288]],"answer":2}'
      json_example_category_label: '{"annotation":[[230,410],[512,288],[640,320]],"answer":"Orchid"}'
      json_example_answer_only_count: '{"answer":2}'
      json_example_answer_only_category_label: '{"answer":"Orchid"}'
      object_description_scatter_points_plain: a scatter plot of individual data points with numeric x- and y-axes
      object_description_scatter_points_categories: a categorized scatter plot with individual data points, numeric x- and y-axes, and a legend
    charts_scatter_facet_grid_query_base:
      bundle_id: charts_scatter_v0
      scene_key: scatter_facet_grid
      task_key: scatter_facet_grid_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
      answer_hint_panel_label: set "answer" to the exact visible panel label as a string
      annotation_hint_density_extremum_label: set "annotation" to an object mapping "answer_density_region" to the [x0,y0,x1,y1] box around the densest supporting point region inside the answer panel
      json_example_density_extremum_label: '{"annotation":{"answer_density_region":[440,210,505,275]},"answer":"Orchid"}'
      json_example_answer_only_panel_label: '{"answer":"Orchid"}'
      object_description_scatter_facet_grid: a grid of small scatter panels with shared x- and y-axes and a highlighted target region in each panel
    charts_scatter_series_readout_base:
      bundle_id: charts_scatter_v0
      scene_key: scatter_series_readout
      task_key: scatter_series_readout_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
      answer_hint_x_label: set "answer" to the requested x-axis label as a string
      answer_hint_y_value: set "answer" to the requested integer value
      unanswerable_instruction: If the requested series is not shown in the legend, answer exactly "unanswerable".
      annotation_hint: set "annotation" to an object mapping each annotation role to an [x0,y0,x1,y1] bounding box around the supporting point/value readout or shared x-axis label; if the answer is "unanswerable", use an empty object
      json_example_x_label: '{"annotation":{"target_point_readout":[420,250,458,284],"x_axis_label":[398,692,444,713]},"answer":"2016"}'
      json_example_y_value: '{"annotation":{"target_point_readout":[420,250,458,284],"comparison_point_readout":[520,310,558,344],"x_axis_label":[498,692,544,713]},"answer":63}'
      json_example_answer_only_x_label: '{"answer":"2016"}'
      json_example_answer_only_y_value: '{"answer":63}'
      object_description_scatter_series_readout: a multi-series scatter plot with labeled points and a legend
