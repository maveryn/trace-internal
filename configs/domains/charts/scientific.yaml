prompt:
  shared:
    bundle_id: charts_scientific_v0
    scene_key: curve_panels_subplot
    task_key: multipanel_subplot_query
    scene_key_style_legend: style_legend_single_axis
    task_key_style_legend: style_legend_query
    scene_key_axis_frame: scientific_axis_frame
    task_key_axis_frame: axis_frame_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_multipanel_line_grid: a scientific multi-panel line figure with labeled subplots, a shared method legend, numeric axes, and visible point markers
    object_description_style_legend: a scientific line chart where each legend series is identified by line style and marker shape, with x-axis labels and visible point markers
    object_description_axis_frame: a scientific plot frame with numeric x-axis and y-axis tick labels
    answer_hint_label: set "answer" to the exact visible method or subplot label as a string
    answer_hint_count: set "answer" to the requested count as an integer
    answer_hint_value: set "answer" to the requested value as an integer
    annotation_hint_style_legend_point_set: set "annotation" to an array of [x,y] pixel points on the plotted marker or markers used to answer
    annotation_hint_curve_at_x_extremum_label: set "annotation" to an array of [x,y] pixel points on the compared method markers at the queried x-value
    annotation_hint_threshold_series_count: set "annotation" to an array of [x,y] pixel points on the markers above the threshold at the queried x-value
    annotation_hint_panel_point_threshold_count: set "annotation" to an array of [x,y] pixel points on all counted markers in the queried subplot
    annotation_hint_panel_curve_threshold_crossing_count: set "annotation" to an array of [x,y] pixel points on the requested threshold crossing, one point for each counted curve
    annotation_hint_cross_panel_delta_extremum_label: set "annotation" to an object mapping each compared panel's "{panel}_start" and "{panel}_end" keys to [x,y] pixel points on that method's start and end markers
    annotation_hint_cross_panel_threshold_earliest_label: set "annotation" to an array of [x,y] pixel points on the queried method's requested threshold crossing in every compared subplot
    annotation_hint_curve_intersection_count: set "annotation" to an array of [x,y] pixel points on each intersection; use an empty array if there are no intersections
    annotation_hint_earliest_maximum_panel_label: set "annotation" to an array of [x,y] pixel points on each compared subplot's maximum marker for the queried method
    annotation_hint_axis_frame_tick_pair: set "annotation" to an object mapping "first_tick" and "next_tick" to [x0,y0,x1,y1] pixel bounding boxes around the lower-value highlighted tick label and the next higher highlighted tick label
    annotation_hint_axis_frame_axis_span: set "annotation" to an object mapping "min_tick" and "max_tick" to [x0,y0,x1,y1] pixel bounding boxes around the smallest and largest visible tick labels on the requested axis
