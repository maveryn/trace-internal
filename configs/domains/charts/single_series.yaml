prompt:
  shared:
    bundle_id: charts_trend_v1
    scene_key: ordered_chart_trend
    task_key: trend_value_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    answer_hint: set "answer" to the requested trend value as an integer
    object_description_area: an ordered labeled area chart where point labels identify
      y-values from left to right
    object_description_bar: an ordered labeled bar chart where each bar height is
      read from the vertical axis from left to right
    object_description_horizontal_bar: an ordered labeled horizontal bar chart where
      each bar length is read from the horizontal axis from top to bottom
    object_description_line: an ordered labeled line chart where point labels identify
      y-values from left to right
    object_description_scatter: a labeled scatter plot where point labels identify
      y-values on the vertical axis
    object_description_dot_plot: an ordered labeled dot plot where point labels identify
      y-values from left to right
    object_description_lollipop: an ordered labeled lollipop chart where point labels
      identify y-values from left to right
    annotation_hint_threshold_count: set "annotation" to an array of [x, y] pixel
      points at the centers of all marks with values matching the strict threshold
      comparison
    annotation_hint_in_interval: set "annotation" to an array of [x, y] pixel points
      at the centers of all marks with values in the inclusive interval
    json_example_threshold_count: '{"annotation":[[180,260],[390,180],[610,320]],"answer":3}'
    json_example_in_interval: '{"annotation":[[165,310],[380,250],[590,285]],"answer":3}'
    json_example_answer_only_threshold_count: '{"answer":3}'
    json_example_answer_only_in_interval: '{"answer":3}'
    annotation_hint_remaining_mean_after_removal: set "annotation" to an array of
      [x,y] pixel points for the chart marks whose values remain in the average after
      the stated removals
    annotation_hint_target_share_after_removal: set "annotation" to an array of [x,y]
      pixel points for the chart marks whose values remain in the total after the
      stated removals
    annotation_hint_baseline_from_aggregate_percent_change: set "annotation" to an
      array of [x,y] pixel points for the chart marks whose values are combined before
      solving for the baseline
    json_example_remaining_mean_after_removal: '{"annotation":[[180,360],[320,240],[460,300]],"answer":18}'
    json_example_target_share_after_removal: '{"annotation":[[180,260],[320,340],[460,220]],"answer":25}'
    json_example_baseline_from_aggregate_percent_change: '{"annotation":[[220,340],[360,280],[500,220]],"answer":40}'
    json_example_answer_only_remaining_mean_after_removal: '{"answer":18}'
    json_example_answer_only_target_share_after_removal: '{"answer":25}'
    json_example_answer_only_baseline_from_aggregate_percent_change: '{"answer":40}'
    annotation_hint_median: set "annotation" to an array of [x, y] pixel points at
      the center of the median mark
    annotation_hint_nth_highest: set "annotation" to an array of [x, y] pixel points
      at the center of the requested ranked mark
    annotation_hint_nth_lowest: set "annotation" to an array of [x, y] pixel points
      at the center of the requested ranked mark
    json_example_median: '{"annotation":[[300,240]],"answer":6}'
    json_example_nth_highest: '{"annotation":[[420,180]],"answer":7}'
    json_example_nth_lowest: '{"annotation":[[260,360]],"answer":4}'
    json_example_answer_only_median: '{"answer":6}'
    json_example_answer_only_nth_highest: '{"answer":7}'
    json_example_answer_only_nth_lowest: '{"answer":4}'
    threshold_task_key: threshold_crossing_label_query
    answer_hint_crossing_label: set "answer" to the requested crossing label as a
      string
    unanswerable_instruction: If no visible or projected label satisfies the threshold
      rule, answer exactly "unanswerable".
    annotation_hint_turning_point_count: set "annotation" to an array of [x,y] pixel
      points for all local turning points matching the requested type
    annotation_hint_longest_monotone_streak: set "annotation" to an array of [x,y]
      pixel points for all marks in the unique longest strictly monotone streak matching
      the requested direction
    annotation_hint_endpoint_change_value: set "annotation" to an object mapping "start_mark"
      and "end_mark" to [x,y] pixel points at the centers of the two endpoint marks
    annotation_hint_interval_rate_value: set "annotation" to an object mapping "start_mark"
      and "end_mark" to [x,y] pixel points at the centers of the two endpoint marks
    annotation_hint_first_crosses_above_threshold: set "annotation" to an array of
      [x,y] pixel points for marks up to and including the first threshold-crossing
      mark; if the answer is "unanswerable", use an empty array
    annotation_hint_first_crosses_below_threshold: set "annotation" to an array of
      [x,y] pixel points for marks up to and including the first threshold-crossing
      mark; if the answer is "unanswerable", use an empty array
    annotation_hint_linear_projection_crosses_above: set "annotation" to an array
      of [x,y] pixel points for the last two plotted marks from the linear series
      and future label slots up to and including the first threshold-crossing label;
      if the answer is "unanswerable", use an empty array
    annotation_hint_linear_projection_crosses_below: set "annotation" to an array
      of [x,y] pixel points for the last two plotted marks from the linear series
      and future label slots up to and including the first threshold-crossing label;
      if the answer is "unanswerable", use an empty array
    json_example_turning_point_count: '{"annotation":[[220,180],[520,210]],"answer":2}'
    json_example_longest_monotone_streak: '{"annotation":[[180,420],[300,350],[420,260],[540,170]],"answer":4}'
    json_example_endpoint_change_value: '{"annotation":{"start_mark":[160,420],"end_mark":[460,220]},"answer":20}'
    json_example_interval_rate_value: '{"annotation":{"start_mark":[200,420],"end_mark":[500,240]},"answer":6}'
    json_example_first_crosses_above_threshold: '{"annotation":[[160,420],[260,360],[360,240]],"answer":"C4A7"}'
    json_example_first_crosses_below_threshold: '{"annotation":[[180,180],[280,260],[380,390]],"answer":"F8Q2"}'
    json_example_linear_projection_crosses_above: '{"annotation":[[300,320],[420,260],[540,180]],"answer":"M6P4"}'
    json_example_linear_projection_crosses_below: '{"annotation":[[300,180],[420,260],[540,340]],"answer":"Q9R2"}'
    json_example_answer_only_turning_point_count: '{"answer":2}'
    json_example_answer_only_longest_monotone_streak: '{"answer":4}'
    json_example_answer_only_endpoint_change_value: '{"answer":20}'
    json_example_answer_only_interval_rate_value: '{"answer":6}'
    json_example_answer_only_first_crosses_above_threshold: '{"answer":"C4A7"}'
    json_example_answer_only_first_crosses_below_threshold: '{"answer":"F8Q2"}'
    json_example_answer_only_linear_projection_crosses_above: '{"answer":"M6P4"}'
    json_example_answer_only_linear_projection_crosses_below: '{"answer":"Q9R2"}'
  task_overrides:
    charts_counting_value_count_base:
      bundle_id: charts_counting_v1
      scene_key: labeled_chart_counting
      task_key: value_count_query
      answer_hint: set "answer" to the requested count as an integer
    charts_statistics_summary_query_base:
      bundle_id: charts_statistics_v1
      scene_key: labeled_chart_statistics
      task_key_value: summary_value_query
      task_key_label: summary_label_query
      answer_hint_value: set "answer" to the requested statistic as an integer
      answer_hint_label: set "answer" to the single uppercase label of the requested
        mark
      annotation_hint_label_median: set "annotation" to an array of [x, y] pixel points
        at the center of the median mark
      annotation_hint_label_nth_highest: set "annotation" to an array of [x, y] pixel
        points at the center of the requested ranked mark
      annotation_hint_label_nth_lowest: set "annotation" to an array of [x, y] pixel
        points at the center of the requested ranked mark
      json_example_label_median: '{"annotation":[[300,240]],"answer":"M4K8"}'
      json_example_label_nth_highest: '{"annotation":[[420,180]],"answer":"K7P2"}'
      json_example_label_nth_lowest: '{"annotation":[[260,360]],"answer":"R6T4"}'
      json_example_answer_only_label_median: '{"answer":"M4K8"}'
      json_example_answer_only_label_nth_highest: '{"answer":"K7P2"}'
      json_example_answer_only_label_nth_lowest: '{"answer":"R6T4"}'
