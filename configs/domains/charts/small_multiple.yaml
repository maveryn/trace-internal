    panel_count_min: 4
    panel_count_max: 9
    segment_count_min: 5
    segment_count_max: 7
    total_values:
    - 1000
    - 1200
    - 1400
    - 1600
    - 1800
    - 2000
    - 2400
    - 3000
    top_k_values:
    - 2
    - 3
    condition_threshold_values:
    - 32
    - 35
    - 38
    panel_label_variant_weights:
      temporal_sequence: 0.6
      named_compact: 1.0
      report_topics: 0.75
      technical_topics: 1.0
      condition_labels: 0.5
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    scene_variant_weights:
      small_multiple_pie: 1.0
      small_multiple_donut: 1.0
  task_overrides:
    task_charts__small_multiple__average_top_k_minus_average_bottom_k:
      panel_count_min: 4
      panel_count_max: 7
      segment_count_min: 5
      segment_count_max: 5
    task_charts__small_multiple__composition_shift_l1_distance:
      panel_count_min: 4
      panel_count_max: 7
