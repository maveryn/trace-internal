rendering:
  shared:
    canvas_width: 800
    canvas_height: 600
    plot_margin_left_px: 92
    plot_margin_right_px: 46
    plot_margin_top_px: 44
    plot_margin_bottom_px: 92
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.58
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
  task_overrides:
    charts_statistics_summary_query_base:
      canvas_width: 1000
      canvas_height: 640
      label_font_size_px: 20
      tick_font_size_px: 17
      guide_line_mode: always

complexity:
  task_overrides:
    charts_statistics_summary_query_base:
      criteria_weights:
        visual_scan: 0.35
        reasoning_load: 0.35
        scene_variant_load: 0.30

prompt:
  shared:
    bundle_id: charts_statistics_v0
    scene_key: labeled_chart_statistics
    task_key: summary_value_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested statistic as an integer
    object_description_area: a labeled area chart where point labels identify y-values on the vertical axis
    object_description_bar: a labeled bar chart where each bar height is read from the vertical axis
    object_description_horizontal_bar: a labeled horizontal bar chart where each bar length is read from the horizontal axis
    object_description_line: a labeled line chart where point labels identify y-values on the vertical axis
    object_description_scatter: a labeled scatter plot where point labels identify y-values on the vertical axis
    object_description_dot_plot: a labeled dot plot where point labels identify y-values on the vertical axis
    object_description_lollipop: a labeled lollipop chart where point labels identify y-values on the vertical axis
    annotation_hint_median: set "annotation" to an array of [x, y] pixel points at the center of the median mark
    annotation_hint_nth_highest: set "annotation" to an array of [x, y] pixel points at the center of the requested ranked mark
    annotation_hint_nth_lowest: set "annotation" to an array of [x, y] pixel points at the center of the requested ranked mark
    json_example_median: '{"annotation":[[300,240]],"answer":6}'
    json_example_nth_highest: '{"annotation":[[420,180]],"answer":7}'
    json_example_nth_lowest: '{"annotation":[[260,360]],"answer":4}'
    json_example_answer_only_median: '{"answer":6}'
    json_example_answer_only_nth_highest: '{"answer":7}'
    json_example_answer_only_nth_lowest: '{"answer":4}'
  task_overrides:
    charts_statistics_summary_query_base:
      task_key_value: summary_value_query
      task_key_label: summary_label_query
      answer_hint_value: set "answer" to the requested statistic as an integer
      answer_hint_label: set "answer" to the single uppercase label of the requested mark
      annotation_hint_label_median: set "annotation" to an array of [x, y] pixel points at the center of the median mark
      annotation_hint_label_nth_highest: set "annotation" to an array of [x, y] pixel points at the center of the requested ranked mark
      annotation_hint_label_nth_lowest: set "annotation" to an array of [x, y] pixel points at the center of the requested ranked mark
      json_example_label_median: '{"annotation":[[300,240]],"answer":"M4K8"}'
      json_example_label_nth_highest: '{"annotation":[[420,180]],"answer":"K7P2"}'
      json_example_label_nth_lowest: '{"annotation":[[260,360]],"answer":"R6T4"}'
      json_example_answer_only_label_median: '{"answer":"M4K8"}'
      json_example_answer_only_label_nth_highest: '{"answer":"K7P2"}'
      json_example_answer_only_label_nth_lowest: '{"answer":"R6T4"}'
