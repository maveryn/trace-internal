      mark_count_min: 15
      mark_count_max: 17
      rank_n_min: 3
      rank_n_max: 3
      scene_variant_weights:
        area: 0.0
        bar: 1.0
        line: 1.0
        scatter: 0.0
        horizontal_bar: 0.0
