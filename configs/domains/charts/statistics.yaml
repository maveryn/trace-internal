      order_statistic_value: 1.0
      order_statistic_label: 1.0
    statistic_kind_weights:
      median: 1.0
      nth_highest: 1.0
      nth_lowest: 1.0
    scene_variant_weights:
      area: 1.0
      bar: 1.0
      line: 1.0
      scatter: 1.0
      horizontal_bar: 1.0
      dot_plot: 1.0
      lollipop: 1.0
    balanced_query_id_sampling: true
    balanced_statistic_kind_sampling: true
    balanced_scene_variant_sampling: true
  task_overrides:
    charts_statistics_summary_query_base:
      mark_count_min: 15
      mark_count_max: 25
      value_max: 99
      value_window_span_min: 24
      value_window_span_max: 25
      rank_n_min: 3
      rank_n_max: 8
      query_id_weights:
        order_statistic_value: 1.0
        order_statistic_label: 1.0
      statistic_kind_weights:
        median: 1.0
        nth_highest: 1.0
        nth_lowest: 1.0
      balanced_statistic_kind_sampling: true
      scene_variant_weights:
        area: 1.0
        bar: 1.0
        line: 1.0
        scatter: 1.0
        horizontal_bar: 1.0
        dot_plot: 1.0
        lollipop: 1.0
    task_charts__single_series__order_statistic_value:
      mark_count_min: 15
      mark_count_max: 17
      rank_n_min: 3
      rank_n_max: 3
      scene_variant_weights:
        area: 0.0
        bar: 1.0
        line: 1.0
        scatter: 0.0
        horizontal_bar: 0.0
        dot_plot: 1.0
        lollipop: 0.0
