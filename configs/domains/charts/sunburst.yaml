prompt:
  shared:
    bundle_id: charts_sunburst_v1
    scene_key: composition_sunburst_hierarchy
    task_key: sunburst_hierarchy_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    object_description_sunburst: a not-to-scale concentric hierarchy chart with parent
      categories in the inner ring, subgroups in the middle ring, and outer leaves
      with printed integer values
    answer_hint_integer: set "answer" to the requested integer
    answer_hint_label: set "answer" to the exact parent category label
    annotation_hint_parent_total_from_leaves_value: set "annotation" to [x0,y0,x1,y1]
      boxes for the outer leaf value labels under the requested parent category
    annotation_hint_parent_total_extremum_label: set "annotation" to [x0,y0,x1,y1]
      boxes for the outer leaf value labels used to compare all parent-category totals
    annotation_hint_conditional_leaf_count: set "annotation" to [x0,y0,x1,y1] boxes
      for the checked outer leaf value labels under the requested parent category
