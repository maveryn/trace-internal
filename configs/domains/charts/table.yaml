prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for
      the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_spreadsheet: a spreadsheet-style table with one Name column, several year columns
      in chronological order, full grid lines, and a shaded header row
    object_description_zebra: a zebra-striped table with one Name column, several year columns in chronological
      order, alternating row shading, and a shaded header row
    object_description_ledger: a ledger-style table with one Name column, several year columns in chronological
      order, strong horizontal rules, and minimal vertical separators
    object_description_card_table: a card-style table with one Name column, several year columns in chronological
      order, a rounded outer frame, and a shaded header row
    bundle_id: charts_table_temporal_v1
    scene_key: styled_table_temporal
    task_key: temporal_value_query
    answer_hint: set "answer" to the exact integer temporal result
    unanswerable_instruction: If the requested column is not visible, answer exactly "unanswerable".
  task_overrides:
    charts_table_value_predicate_count_base:
      bundle_id: charts_table_counting_v1
      scene_key: styled_table_counting
      task_key: value_count_query
      answer_hint: set "answer" to the exact count as an integer
      annotation_hint_threshold_count: set "annotation" to an array of bounding boxes [x0, y0, x1, y1]
        for every matching value cell, or [] if none match
      annotation_hint_in_interval: set "annotation" to an array of bounding boxes [x0, y0, x1, y1] for
        every matching value cell, or [] if none match
      annotation_hint_categorical_value_count: set "annotation" to an array of bounding boxes [x0, y0,
        x1, y1] for every matching category cell, or [] if none match
      json_example_threshold_count: '{"annotation":[[260,180,372,236],[260,236,372,292]],"answer":2}'
      json_example_in_interval: '{"annotation":[[260,180,372,236],[260,236,372,292],[260,292,372,348]],"answer":3}'
      json_example_categorical_value_count: '{"annotation":[[260,180,372,236],[260,292,372,348]],"answer":2}'
      json_example_answer_only_threshold_count: '{"answer":2}'
      json_example_answer_only_in_interval: '{"answer":3}'
      json_example_answer_only_categorical_value_count: '{"answer":2}'
    task_charts__table__column_rank_label:
      bundle_id: charts_table_ranking_v1
      scene_key: styled_table_ranking
      task_key: kth_label_query
      answer_hint: set "answer" to the exact row label as a string, or "unanswerable" when instructed
      annotation_hint_kth_rank_in_column: set "annotation" to an array containing exactly one bounding
        box [x0, y0, x1, y1] for the supporting queried-column region
      json_example_kth_rank_in_column: '{"annotation":[[260,180,372,520]],"answer":"Ava"}'
      json_example_answer_only_kth_rank_in_column: '{"answer":"Ava"}'
    charts_table_column_summary_base:
      bundle_id: charts_table_statistics_v1
      scene_key: styled_table_statistics
      task_key: summary_value_query
      answer_hint: set "answer" to the exact integer summary value
      annotation_hint_column_sum: set "annotation" to an array containing exactly one bounding box [x0,
        y0, x1, y1] for the supporting queried-column region
      annotation_hint_column_mean: set "annotation" to an array containing exactly one bounding box [x0,
        y0, x1, y1] for the supporting queried-column region
      annotation_hint_column_median: set "annotation" to an array containing exactly one bounding box
        [x0, y0, x1, y1] for the supporting queried-column region
      json_example_column_sum: '{"annotation":[[260,180,372,520]],"answer":84}'
      json_example_column_mean: '{"annotation":[[260,180,372,520]],"answer":14}'
      json_example_column_median: '{"annotation":[[260,180,372,520]],"answer":13}'
      json_example_answer_only_column_sum: '{"answer":84}'
      json_example_answer_only_column_mean: '{"answer":14}'
      json_example_answer_only_column_median: '{"answer":13}'
    charts_table_filtered_column_summary_base:
      bundle_id: charts_table_statistics_v1
      scene_key: styled_table_statistics
      task_key: filtered_subset_value_query
      answer_hint: set "answer" to the exact integer filtered summary value
      annotation_hint_filtered_column_sum: set "annotation" to an array containing [x0, y0, x1, y1] boxes
        for the filter and target cells used from every selected row
      annotation_hint_filtered_column_mean: set "annotation" to an array containing [x0, y0, x1, y1] boxes
        for the filter and target cells used from every selected row
      json_example_filtered_column_sum: '{"annotation":[[260,180,372,236],[374,180,486,236],[260,236,372,292],[374,236,486,292]],"answer":27}'
      json_example_filtered_column_mean: '{"annotation":[[260,180,372,236],[374,180,486,236],[260,236,372,292],[374,236,486,292]],"answer":14}'
      json_example_answer_only_filtered_column_sum: '{"answer":27}'
      json_example_answer_only_filtered_column_mean: '{"answer":14}'
    charts_table_temporal_value_base:
      bundle_id: charts_table_temporal_v1
      scene_key: styled_table_temporal
      task_key: temporal_value_query
      answer_hint: set "answer" to the exact integer temporal result
      annotation_hint_absolute_difference_between_rows_over_year_interval: set "annotation" to [x0, y0,
        x1, y1] boxes for the queried year cells from both named rows across the interval
      annotation_hint_sum_absolute_differences_between_rows_over_year_interval: set "annotation" to [x0,
        y0, x1, y1] boxes for the queried year cells from both named rows across the interval
      json_example_absolute_difference_between_rows_over_year_interval: '{"annotation":[[260,180,320,220],[322,180,382,220],[384,180,444,220],[260,236,320,276],[322,236,382,276],[384,236,444,276]],"answer":7}'
      json_example_sum_absolute_differences_between_rows_over_year_interval: '{"annotation":[[260,180,320,220],[322,180,382,220],[384,180,444,220],[260,236,320,276],[322,236,382,276],[384,236,444,276]],"answer":17}'
      json_example_answer_only_absolute_difference_between_rows_over_year_interval: '{"answer":7}'
      json_example_answer_only_sum_absolute_differences_between_rows_over_year_interval: '{"answer":17}'
