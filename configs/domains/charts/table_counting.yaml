prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_spreadsheet: a spreadsheet-style table with one Name column, several numeric columns, full grid lines,
      and a shaded header row
    object_description_zebra: a zebra-striped table with one Name column, several numeric columns, alternating row shading,
      and a shaded header row
    object_description_ledger: a ledger-style table with one Name column, several numeric columns, strong horizontal rules,
      and minimal vertical separators
    object_description_card_table: a card-style table with one Name column, several numeric columns, a rounded outer frame,
      and a shaded header row
    bundle_id: charts_table_counting_v0
    scene_key: styled_table_counting
    task_key: value_count_query
    answer_hint: set "answer" to the exact integer count of matching rows
  task_overrides:
    task_charts__table__value_predicate_count:
      evidence_hint_threshold_count: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for every matching value
        cell, or [] if none match
      evidence_hint_in_interval: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for every matching value cell,
        or [] if none match
      evidence_hint_categorical_value_count: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for every matching
        category cell, or [] if none match
      json_example_threshold_count: '{"evidence":[[260,180,372,236],[260,236,372,292]],"answer":2}'
      json_example_in_interval: '{"evidence":[[260,180,372,236],[260,236,372,292],[260,292,372,348]],"answer":3}'
      json_example_categorical_value_count: '{"evidence":[[260,180,372,236],[260,292,372,348]],"answer":2}'
      json_example_answer_only_threshold_count: '{"answer":2}'
      json_example_answer_only_in_interval: '{"answer":3}'
      json_example_answer_only_categorical_value_count: '{"answer":2}'
