prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_spreadsheet: a spreadsheet-style table with one Name column, several year columns in chronological
      order, full grid lines, and a shaded header row
    object_description_zebra: a zebra-striped table with one Name column, several year columns in chronological order, alternating
      row shading, and a shaded header row
    object_description_ledger: a ledger-style table with one Name column, several year columns in chronological order, strong
      horizontal rules, and minimal vertical separators
    object_description_card_table: a card-style table with one Name column, several year columns in chronological order, a
      rounded outer frame, and a shaded header row
    bundle_id: charts_table_temporal_v0
    scene_key: styled_table_temporal
    task_key: temporal_value_query
    answer_hint: set "answer" to the exact integer temporal result
  task_overrides:
    charts_table_temporal_value_base:
      annotation_hint_absolute_difference_between_rows_over_year_interval: set "annotation" to [x0, y0, x1, y1] boxes for the
        queried year cells from both named rows across the interval
      annotation_hint_sum_absolute_differences_between_rows_over_year_interval: set "annotation" to [x0, y0, x1, y1] boxes for
        the queried year cells from both named rows across the interval
      json_example_absolute_difference_between_rows_over_year_interval: '{"annotation":[[260,180,320,220],[322,180,382,220],[384,180,444,220],[260,236,320,276],[322,236,382,276],[384,236,444,276]],"answer":7}'
      json_example_sum_absolute_differences_between_rows_over_year_interval: '{"annotation":[[260,180,320,220],[322,180,382,220],[384,180,444,220],[260,236,320,276],[322,236,382,276],[384,236,444,276]],"answer":17}'
      json_example_answer_only_absolute_difference_between_rows_over_year_interval: '{"answer":7}'
      json_example_answer_only_sum_absolute_differences_between_rows_over_year_interval: '{"answer":17}'
