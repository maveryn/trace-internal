generation:
  shared:
    category_count_min: 5
    category_count_max: 8
    surface_x_count_min: 5
    surface_x_count_max: 7
    surface_y_count_min: 4
    surface_y_count_max: 6
    series_count_min: 4
    series_count_max: 6
    time_count_min: 5
    time_count_max: 7
    panel_count_min: 4
    panel_count_max: 6
    query_id_weights:
      reference_nearest_label: 1.0
      surface_extremum_label: 1.0
      series_trend_label: 1.0
      panel_variation_label: 1.0
    extremum_direction_weights:
      highest: 1.0
      lowest: 1.0
    trend_direction_weights:
      increase: 1.0
      decrease: 1.0
    balanced_query_id_sampling: true
    balanced_extremum_direction_sampling: true
    balanced_trend_direction_sampling: true

