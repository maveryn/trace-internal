      criteria_weights:
        visual_scan: 0.40
        reasoning_load: 0.40
        annotation_count: 0.20

prompt:
  shared:
    bundle_id: charts_three_d_bar_v0
    scene_key: bar_3d
    task_key: three_d_bar_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint_integer: set "answer" to the requested integer value
    object_description: one perspective 3D bar chart with category labels on the front axis, colored series labels in the legend, and integer value labels on the bars
    annotation_hint_axis_total_value: set "annotation" to an array of [x,y] pixel points for every bar included in the requested total
    annotation_hint_axis_gap_value: set "annotation" to an array of [x,y] pixel points for every bar used to compute the compared totals or extrema
    annotation_hint_condition_count: set "annotation" to an array of [x,y] pixel points for every bar checked by the stated condition
    json_example_axis_total_value: '{"annotation":[[210,360],[320,330],[430,300]],"answer":72}'
    json_example_axis_gap_value: '{"annotation":[[210,360],[320,330],[430,300],[210,260],[320,240],[430,220]],"answer":18}'
    json_example_condition_count: '{"annotation":[[210,360],[320,330],[430,300],[540,270]],"answer":3}'
    json_example_answer_only_axis_total_value: '{"answer":72}'
    json_example_answer_only_axis_gap_value: '{"answer":18}'
    json_example_answer_only_condition_count: '{"answer":3}'
