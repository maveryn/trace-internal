prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
  task_overrides:
    charts_composition_treemap_base:
      bundle_id: charts_treemap_v1
      scene_key: composition_treemap
      task_key: treemap_composition_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
        in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer"
        for the final answer.
      object_description_treemap: a treemap composition chart with parent category
        rectangles and child rectangles labeled with printed integer values
      answer_hint_integer: set "answer" to the requested integer
      annotation_hint_treemap_group_total_value: set "annotation" to [x0,y0,x1,y1]
        boxes for the child value labels inside the requested parent rectangle
      annotation_hint_treemap_repeated_leaf_aggregate_value: set "annotation" to [x0,y0,x1,y1]
        boxes for the matching child value labels across parent rectangles
      json_example_treemap_group_total_value: '{"annotation":[[150,160,190,184],[210,240,250,264],[310,320,350,344]],"answer":168}'
      json_example_treemap_repeated_leaf_aggregate_value: '{"annotation":[[150,160,190,184],[410,160,450,184],[680,160,720,184]],"answer":54}'
      json_example_answer_only_treemap_group_total_value: '{"answer":168}'
      json_example_answer_only_treemap_repeated_leaf_aggregate_value: '{"answer":54}'
