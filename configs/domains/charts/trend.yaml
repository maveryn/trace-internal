generation:
  shared:
    mark_count_min: 6
    mark_count_max: 10
    value_min: 1
    value_max: 20
    task_variant_weights:
      peak_count: 1.0
      trough_count: 1.0
      longest_increasing_streak: 1.0
      longest_decreasing_streak: 1.0
    scene_variant_weights:
      area: 1.0
      bar: 1.0
      horizontal_bar: 1.0
      line: 1.0
      dot_plot: 1.0
      lollipop: 1.0
    balanced_task_variant_sampling: true
    balanced_scene_variant_sampling: true

rendering:
  shared:
    canvas_width: 800
    canvas_height: 600
    plot_margin_left_px: 92
    plot_margin_right_px: 46
    plot_margin_top_px: 44
    plot_margin_bottom_px: 92
    axis_line_width_px: 2
    grid_line_width_px: 1
    tick_length_px: 8
    label_font_size_px: 22
    tick_font_size_px: 18
    label_stroke_width_px: 2
    mark_outline_width_px: 2
    line_width_px: 4
    point_radius_px: 8
    bar_width_fraction: 0.58
    mark_color_channel_min: 0
    mark_color_channel_max: 220
    mark_color_min_distance: 40.0
    mark_color_distance_space: lab
    axis_color_rgb: [74, 78, 86]
    grid_color_rgb: [224, 227, 232]
    text_color_rgb: [38, 41, 48]
    text_stroke_rgb: [255, 255, 255]
    plot_fill_rgb: [255, 255, 255]

complexity:
  task_overrides:
    task_charts_trend_structure_value:
      criteria_weights:
        visual_scan: 0.35
        reasoning_load: 0.45
        scene_variant_load: 0.20

prompt:
  shared:
    bundle_id: charts_trend_v1
    task_family_key: ordered_chart_trend
    task_key: structure_value_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    answer_hint: set "answer" to the requested count or streak length as an integer
    object_description_area: an ordered labeled area chart with visible point markers from left to right. Each label marks one plotted point, and the relevant values are the points' y-values on the vertical axis
    object_description_bar: an ordered labeled bar chart with bars arranged from left to right. Each bar's numeric height can be read from the vertical axis
    object_description_horizontal_bar: an ordered labeled horizontal bar chart with bars arranged from top to bottom. Each bar's numeric length can be read from the horizontal axis
    object_description_line: an ordered labeled line chart with visible point markers from left to right. Each label marks one plotted point, and the relevant values are the points' y-values on the vertical axis
    object_description_dot_plot: an ordered labeled dot plot with points arranged from left to right. Each label marks one plotted point, and the relevant values are the points' y-values on the vertical axis
    object_description_lollipop: an ordered labeled lollipop chart with points arranged from left to right. Each label marks one plotted point, and the relevant values are the points' y-values on the vertical axis
    evidence_hint_peak_count: set "evidence" to an array containing the labels of all local peaks
    evidence_hint_trough_count: set "evidence" to an array containing the labels of all local troughs
    evidence_hint_longest_increasing_streak: set "evidence" to an array containing all labels in the unique longest strictly increasing streak
    evidence_hint_longest_decreasing_streak: set "evidence" to an array containing all labels in the unique longest strictly decreasing streak
    json_example_peak_count: '{"evidence":["C","Q"],"answer":2}'
    json_example_trough_count: '{"evidence":["F","M"],"answer":2}'
    json_example_longest_increasing_streak: '{"evidence":["B","M","Q","T"],"answer":4}'
    json_example_longest_decreasing_streak: '{"evidence":["A","C","F"],"answer":3}'
    json_example_answer_only_peak_count: '{"answer":2}'
    json_example_answer_only_trough_count: '{"answer":2}'
    json_example_answer_only_longest_increasing_streak: '{"answer":4}'
    json_example_answer_only_longest_decreasing_streak: '{"answer":3}'
