generation:
  task_overrides:
    task_diagrams_set_diagram_region_sum_value:
      balanced_task_variant_sampling: true
      balanced_scene_variant_sampling: true
      task_variant_weights:
        sum_only_in_named_set: 1.0
        sum_in_named_set: 1.0
        sum_in_named_union: 1.0
        sum_in_named_intersection: 1.0
        sum_in_exactly_two_sets: 1.0
      scene_variant_weights:
        set_diagram: 1.0

rendering:
  task_overrides:
    task_diagrams_set_diagram_region_sum_value:
      canvas_width: 1200
      canvas_height: 860
      outer_margin_px: 52
      panel_padding_px: 28
      panel_corner_radius_px: 30
      title_font_size_px: 32
      title_band_height_px: 78
      region_outline_width_px: 4
      number_slot_width_px: 76
      number_slot_height_px: 76
      number_font_size_px: 58
      set_label_width_px: 58
      set_label_height_px: 38
      set_label_font_size_px: 24
      set_fill_alpha: 96
      set_fill_channel_min: 70
      set_fill_channel_max: 224
      min_set_color_distance: 50.0
      color_distance_space: lab
      color_sampling_attempts: 256
      panel_fill_rgb: [252, 252, 255]
      panel_border_rgb: [88, 98, 112]
      title_color_rgb: [34, 40, 48]
      region_outline_rgb: [93, 104, 118]
      set_label_fill_rgb: [248, 249, 252]
      set_label_border_rgb: [182, 190, 202]
      set_label_text_rgb: [55, 64, 76]
      number_text_rgb: [29, 36, 44]
      number_text_stroke_rgb: [255, 255, 255]

prompt:
  shared:
    bundle_id: diagrams_set_diagram_v1
    answer_hint: set "answer" to the integer sum of the contributing digits
  task_overrides:
    task_diagrams_set_diagram_region_sum_value:
      task_family_key: numeric_set_overlap_diagram
      task_key: region_sum_query
      object_description_set_diagram: a 3-set overlap diagram with one single-digit number placed in each visible region
      evidence_hint: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every digit used in the sum, ordered from top to bottom and then left to right

complexity:
  task_overrides:
    task_diagrams_set_diagram_region_sum_value:
      criteria_weights:
        visual_scan: 0.32
        reasoning_load: 0.50
        scene_variant_load: 0.18
