prompt:
  shared:
    bundle_id: games_2048_v0
    scene_key: visible_2048_board
    task_key: twenty_forty_eight_query
    object_description_standard_board: a 4 x 4 2048 board with numbered tiles and move arrows
    move_rule_text: In 2048, a move slides all tiles toward the arrow; equal adjacent tiles in that direction merge once.
    score_rule_text: The move score is the sum of the newly created merged tile values.
    goal_rule_text: The outlined cell is the goal cell for comparing candidate moves.
    evidence_hint_merge_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the original tile cells that participate in the merges; use an empty list if no merge occurs
    answer_hint_merge_count: set "answer" to the number of merges made by the shown move
    evidence_hint_score_value: set "evidence" to bounding boxes [x0, y0, x1, y1] around the original tile cells that participate in the merges used for the score; use an empty list if the score is zero
    answer_hint_score_value: set "answer" to the move score
    evidence_hint_max_tile_value: set "evidence" to bounding boxes [x0, y0, x1, y1] around the original tile cell or cells that form the largest tile after the shown move
    answer_hint_max_tile_value: set "answer" to the largest tile value after the shown move
    evidence_hint_best_move_label: set "evidence" to bounding boxes [x0, y0, x1, y1] around the original tile cell or cells that form the chosen move's tile in the outlined goal cell
    answer_hint_best_move_label: set "answer" to the single option letter of the move that leaves the highest tile value in the outlined goal cell
