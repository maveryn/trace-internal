prompt:
  shared:
    bundle_id: games_backgammon_v0
    scene_key: visible_backgammon_board
    task_key: backgammon_query
    object_description_standard_board: a numbered backgammon board with black and white checker stacks and two dice
    backgammon_rule_text: Black moves from higher-numbered points toward lower-numbered points. For each occupied black point, subtract either shown die to get a candidate destination number. Count each distinct destination number once, even if more than one checker or die reaches it. A destination point with two or more white checkers is blocked.
    evidence_hint_legal_move_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct destination points where black can legally move
    answer_hint_legal_move_count: set "answer" to the number of distinct legal destination points
    evidence_hint_hit_move_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct destination points where black would hit exactly one white checker
    answer_hint_hit_move_count: set "answer" to the number of distinct hit destination points
    evidence_hint_blocked_destination_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct possible destination points blocked by two or more white checkers
    answer_hint_blocked_destination_count: set "answer" to the number of distinct blocked destination points
