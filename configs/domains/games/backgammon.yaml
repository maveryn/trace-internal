prompt:
  shared:
    bundle_id: games_backgammon_v0
    scene_key: visible_backgammon_board
    task_key: backgammon_query
    object_description_standard_board: a numbered backgammon board with black and white checker stacks and two dice
    backgammon_rule_text: The board header shows which player moves and whether that player moves 24 to 1 or 1 to 24. For each occupied active-player point, use either shown die in that direction to get a candidate destination number. Count each distinct destination number once, even if more than one checker or die reaches it. A destination point with two or more opposing checkers is blocked.
    evidence_hint_legal_move_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct destination points where the active player can legally move
    answer_hint_legal_move_count: set "answer" to the number of distinct legal destination points
    evidence_hint_hit_move_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct destination points where the active player would hit exactly one opposing checker
    answer_hint_hit_move_count: set "answer" to the number of distinct hit destination points
    evidence_hint_blocked_destination_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the distinct possible destination points blocked by two or more opposing checkers
    answer_hint_blocked_destination_count: set "answer" to the number of distinct blocked destination points
