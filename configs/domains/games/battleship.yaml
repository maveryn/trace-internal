generation:
  shared:
    scene_variant_weights:
      standard_fleet: 1.0
    query_id_weights:
      sunk_ship_count: 1.0
      partial_ship_count: 1.0
    style_variant_weights:
      classic: 1.0
      soft: 1.0
      outlined: 1.0
      navy: 1.0
      radar: 1.0
      paper: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_board_size_sampling: true
    balanced_target_answer_sampling: true
    board_size_support:
    - 8
    - 9
    - 10
    sunk_ship_count_support:
    - 1
    - 2
    - 3
    - 4
    partial_ship_count_support:
    - 1
    - 2
    - 3
    - 4
    min_partial_ship_count: 2
    max_partial_ship_count: 4
    min_miss_count: 7
    max_miss_count: 16
rendering:
  shared:
    canvas_width: 1100
    canvas_height: 820
    panel_margin_px: 48
    max_board_size_px: 650
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
    board_border_width_px: 5
    grid_line_width_px: 2
    cell_padding_px: 7
    fleet_panel_width_px: 310
    board_panel_gap_px: 34
    fleet_icon_cell_px: 18
    label_font_size_px: 22
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.32
      state_reasoning: 0.40
      ambiguity: 0.14
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_battleship_v0
    scene_key: visible_battleship_grid
    task_key: battleship_grid_query
    object_description_standard_fleet: a Battleship board with the full fleet placed
      on the grid, red hit markers on ship cells, miss markers on water, and a fleet-shape
      panel beside the grid
    battleship_rule_text: Each fleet ship is placed exactly once on the board. A ship
      is sunk only when every cell of that ship has a red hit marker. Ships with
      only some red hit markers are not sunk.
    evidence_hint_sunk_ship_count: set "evidence" to bounding boxes [x0, y0, x1,
      y1] for every cell belonging to a sunk ship
    answer_hint_sunk_ship_count: set "answer" to the number of ships whose every
      cell has a red hit marker
    evidence_hint_partial_ship_count: set "evidence" to bounding boxes [x0, y0,
      x1, y1] for every cell belonging to a partially hit ship
    answer_hint_partial_ship_count: set "answer" to the number of ships that have
      at least one red hit marker but are not sunk
