prompt:
  shared:
    bundle_id: games_bingo_v0
    scene_key: visible_bingo_card
    task_key: bingo_completed_line_query
    object_description_single_card: one face-up 5 x 5 bingo card with some cells marked
    completed_axis_rule_text: A completed {line_axis} is a {line_axis} with all five
      cells marked.
    line_sum_extremum_rule_text: A completed {line_axis} is a {line_axis} with all
      five cells marked. Sum the printed numbers in each completed {line_axis}, then
      use the {extremum} sum.
    near_complete_line_rule_text: A near-complete {line_axis} is a {line_axis} with
      exactly one unmarked cell.
    called_marked_number_rule_text: The called list shows numbers that appear on the
      card.
    annotation_hint_completed_axis_line_count: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for every marked cell that belongs to one of the completed
      {line_axis}s
    annotation_hint_line_sum_extremum_value: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for the five cells in the completed {line_axis} with
      the unique {extremum} sum
    annotation_hint_near_complete_row_count: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for the single unmarked gap cell in each near-complete
      row
    annotation_hint_near_complete_column_count: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for the single unmarked gap cell in each near-complete
      column
    annotation_hint_called_marked_number_count: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for each card cell whose number is in the CALLED list
      and is marked
    answer_hint_completed_axis_line_count: set "answer" to the number of completed
      {line_axis}s
    answer_hint_line_sum_extremum_value: set "answer" to the unique {extremum} sum
      among completed {line_axis}s
    answer_hint_near_complete_row_count: set "answer" to the number of near-complete
      rows
    answer_hint_near_complete_column_count: set "answer" to the number of near-complete
      columns
    answer_hint_called_marked_number_count: set "answer" to the number of called
      numbers that are marked on the card
