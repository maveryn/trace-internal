      visual_scan: 0.28
      state_reasoning: 0.42
      ambiguity: 0.16
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_bingo_v0
    scene_key: visible_bingo_card
    task_key: bingo_completed_line_query
    object_description_single_card: one face-up 5 x 5 bingo card with some cells marked
    completed_axis_rule_text: A completed {line_axis} is a {line_axis} with all five
      cells marked.
    line_sum_extremum_rule_text: A completed {line_axis} is a {line_axis} with all
      five cells marked. Sum the printed numbers in each completed {line_axis}, then
      use the {extremum} sum.
    evidence_hint_completed_axis_line_count: set "evidence" to an array of bounding
      boxes [x0, y0, x1, y1] for every marked cell that belongs to one of the completed
      {line_axis}s
    evidence_hint_line_sum_extremum_value: set "evidence" to an array of bounding
      boxes [x0, y0, x1, y1] for the five cells in the completed {line_axis} with
      the unique {extremum} sum
    answer_hint_completed_axis_line_count: set "answer" to the number of completed
      {line_axis}s
    answer_hint_line_sum_extremum_value: set "answer" to the unique {extremum} sum
      among completed {line_axis}s
