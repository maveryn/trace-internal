prompt:
  shared:
    bundle_id: games_checkers_v0
    scene_key: visible_checkers_board
    task_key: checkers_move_query
    object_description_midgame_board: an 8 by 8 checkers board with red and black
      pieces
    object_description_crowded_board: a crowded 8 by 8 checkers board with many red
      and black pieces
    capture_rule_text: A jump captures one adjacent opponent piece and lands on the
      empty dark square beyond.
    single_jump_rule_text: Count only one jump per move; ignore follow-up jumps.
    legal_move_rule_text: Include simple diagonal steps and capture jumps.
    king_chain_rule_text: The blue outlined checker is a king; it may capture diagonally
      in any direction, remove the jumped piece, and continue jumping from each landing
      square while another capture is available.
    evidence_hint_legal_move_count: set "evidence" to a JSON array of bounding boxes
      [x0, y0, x1, y1] for every legal landing square
    evidence_hint_capture_move_count: set "evidence" to a JSON array of bounding boxes
      [x0, y0, x1, y1] for every capture landing square
    evidence_hint_max_capture_chain_length: set "evidence" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for the opponent pieces captured along the longest chain
    answer_hint_legal_move_count: set "answer" to the count of legal moves
    answer_hint_capture_move_count: set "answer" to the count of capture moves
    answer_hint_max_capture_chain_length: set "answer" to the maximum number of opponent
      pieces the marked king can capture in one continuous jump chain
