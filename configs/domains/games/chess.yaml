prompt:
  shared:
    bundle_id: games_chess_v0
    scene_key: visible_chess_board
    task_key: chess_board_query
    object_description_sparse_board: a partial chess board with a small set of white
      and black pieces
    object_description_crowded_board: a partial chess board with many white and black
      pieces
    standard_rule_text: Use normal chess piece movement. Do not use castling, en
      passant, or promotion.
    marked_piece_rule_text: The red outlined square contains the marked piece.
    player_rule_text: Count captures available to the named side in one move.
    target_square_rule_text: The red outlined square marks the target square.
    king_square_attacker_rule_text: The red outlined square contains the marked king.
    blocker_rule_text: The red outlined square contains the source piece. The blue outlined square is the target square. Count only pieces strictly between them.
    king_escape_rule_text: The red outlined square contains the marked king. Count
      only one-step king destinations that are empty or capturable and are not attacked
      by an opponent piece after the king moves there. Friendly pieces block movement
      but do not make a square unsafe.
    coordinate_rule_text: Board coordinates are shown on the margins, with files
      A-H left to right and ranks 1-8 bottom to top.
    checkmate_rule_text: A move checkmates when it attacks the opposing king and
      that side has no legal move to escape.
    object_description_checkmate_board: a partial chess board with coordinate labels,
      white and black pieces, and a visible panel of labeled candidate moves
    annotation_hint_marked_piece_move_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every destination square the marked piece can move
      to
    answer_hint_marked_piece_move_count: set "answer" to the count of destination
      squares for the marked piece
    annotation_hint_marked_piece_capture_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every destination square occupied by an opponent
      piece that the marked piece can capture
    answer_hint_marked_piece_capture_count: set "answer" to the count of capture
      destination squares for the marked piece
    annotation_hint_player_capture_piece_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every opponent piece that can be captured by a {player_color_name}
      piece in one move
    answer_hint_player_capture_piece_count: set "answer" to the count of {opponent_color_name}
      pieces that can be captured by {player_color_name} in one move
    annotation_hint_king_square_attacker_count: set "annotation" to a JSON array of
      bounding boxes [x0, y0, x1, y1] for every opponent piece attacking the marked
      king
    answer_hint_king_square_attacker_count: set "answer" to the count of opponent
      pieces attacking the marked king
    annotation_hint_white_piece_attacks_target_square_count: set "annotation" to a JSON
      array of bounding boxes [x0, y0, x1, y1] for every white piece attacking the
      marked target square
    answer_hint_white_piece_attacks_target_square_count: set "answer" to the count
      of white pieces attacking the marked target square
    annotation_hint_black_piece_attacks_target_square_count: set "annotation" to a JSON
      array of bounding boxes [x0, y0, x1, y1] for every black piece attacking the
      marked target square
    answer_hint_black_piece_attacks_target_square_count: set "answer" to the count
      of black pieces attacking the marked target square
    annotation_hint_rook_line_blocker_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every piece strictly between the marked rook and
      the blue target square
    answer_hint_rook_line_blocker_count: set "answer" to the count of pieces strictly
      between the marked rook and the blue target square
    annotation_hint_bishop_diagonal_blocker_count: set "annotation" to a JSON array
      of bounding boxes [x0, y0, x1, y1] for every piece strictly between the marked
      bishop and the blue target square
    answer_hint_bishop_diagonal_blocker_count: set "answer" to the count of pieces
      strictly between the marked bishop and the blue target square
    annotation_hint_queen_line_blocker_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every piece strictly between the marked queen and
      the blue target square
    answer_hint_queen_line_blocker_count: set "answer" to the count of pieces strictly
      between the marked queen and the blue target square
    annotation_hint_king_escape_square_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every safe destination square the marked king can
      move to
    answer_hint_king_escape_square_count: set "answer" to the count of safe one-step
      destination squares for the marked king
    annotation_hint_piece_kind_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every visible {target_piece_kind}; use an empty
      array if none are shown
    answer_hint_piece_kind_count: set "answer" to the count of visible {target_piece_kind_plural}
    annotation_hint_colored_piece_kind_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every visible {target_color_name} {target_piece_kind};
      use an empty array if none are shown
    answer_hint_colored_piece_kind_count: set "answer" to the count of visible
      {target_color_name} {target_piece_kind_plural}
    annotation_hint_checkmate_move_label: set "annotation" to a JSON object with keys
      "from", "to", and "king", each mapped to a bounding box [x0, y0, x1, y1]
      for the selected move's source square, destination square, and opposing king
      square
    answer_hint_checkmate_move_label: set "answer" to the single selected option
      label, one of {option_labels}
