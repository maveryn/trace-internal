prompt:
  shared:
    bundle_id: games_chess_v0
    scene_key: visible_chess_board
    task_key: chess_board_query
    object_description_sparse_board: a partial chess board with a small set of white
      and black pieces
    object_description_crowded_board: a partial chess board with many white and black
      pieces
    standard_rule_text: Use normal chess piece movement. Do not use castling, en
      passant, or promotion.
    marked_piece_rule_text: The blue outlined square contains the marked piece.
    player_rule_text: Count captures available to the named side in one move.
    check_rule_text: The blue outlined square contains the marked king.
    king_escape_rule_text: The blue outlined square contains the marked king. Count
      only one-step king destinations that are empty or capturable and are not attacked
      after the king moves there.
    evidence_hint_marked_piece_move_count: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for every destination square the marked piece can move to
    answer_hint_marked_piece_move_count: set "answer" to the count of destination
      squares for the marked piece
    evidence_hint_marked_piece_capture_count: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for every destination square occupied by an opponent piece that
      the marked piece can capture
    answer_hint_marked_piece_capture_count: set "answer" to the count of capture
      destination squares for the marked piece
    evidence_hint_player_capture_piece_count: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for every opponent piece that can be captured by a {player_color_name}
      piece in one move
    answer_hint_player_capture_piece_count: set "answer" to the count of {opponent_color_name}
      pieces that can be captured by {player_color_name} in one move
    evidence_hint_check_attacker_count: set "evidence" to bounding boxes [x0, y0,
      x1, y1] for every opponent piece attacking the marked king
    answer_hint_check_attacker_count: set "answer" to the count of opponent pieces
      attacking the marked king
    evidence_hint_king_escape_square_count: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for every safe destination square the marked king can move to
    answer_hint_king_escape_square_count: set "answer" to the count of safe one-step
      destination squares for the marked king
