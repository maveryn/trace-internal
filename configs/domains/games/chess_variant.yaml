complexity:
  shared:
    criteria_weights:
      visual_scan: 0.32
      state_reasoning: 0.44
      ambiguity: 0.14
      output_burden: 0.10
prompt:
  shared:
    bundle_id: games_chess_variant_v0
    scene_key: chess_variant_board
    task_key: chess_variant_query
    object_description_sparse_board: a chess-like 8 by 8 board with a small set of white and black tokens and a visible movement rule card
    object_description_crowded_board: a chess-like 8 by 8 board with many white and black tokens and a visible movement rule card
    marked_piece_rule_text: Tokens labeled W are one side and tokens labeled B are the other side. The blue outlined square contains the marked token.
    landing_rule_text: The marked token may land on an empty square or an opponent token, but not on a friendly token.
    slider_block_rule_text: For range rules, movement stops at the first occupied square in each direction and cannot pass through it.
    leaper_block_rule_text: For jump rules, the marked token may jump over occupied squares.
    rule_text_straight_range: The rule card says the marked token moves horizontally or vertically up to {range_k} squares.
    rule_text_diagonal_range: The rule card says the marked token moves diagonally up to {range_k} squares.
    rule_text_straight_or_diagonal_range: The rule card says the marked token moves horizontally, vertically, or diagonally up to {range_k} squares.
    rule_text_leaper_2_1: The rule card says the marked token jumps exactly 2 rows and 1 column, or 1 row and 2 columns.
    rule_text_leaper_3_1: The rule card says the marked token jumps exactly 3 rows and 1 column, or 1 row and 3 columns.
    rule_badge_straight_range: STRAIGHT <= {range_k}
    rule_badge_diagonal_range: DIAGONAL <= {range_k}
    rule_badge_straight_or_diagonal_range: ANY LINE <= {range_k}
    rule_badge_leaper_2_1: JUMP 2+1
    rule_badge_leaper_3_1: JUMP 3+1
    evidence_hint_marked_piece_move_count: set "evidence" to a JSON array of bounding boxes [x0, y0, x1, y1] for every legal destination square of the marked token
    answer_hint_marked_piece_move_count: set "answer" to the count of legal destination squares for the marked token
    evidence_hint_marked_piece_capture_count: set "evidence" to a JSON array of bounding boxes [x0, y0, x1, y1] for every destination square occupied by an opponent token that the marked token can capture
    answer_hint_marked_piece_capture_count: set "answer" to the count of capture destination squares for the marked token
