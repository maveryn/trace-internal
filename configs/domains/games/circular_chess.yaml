prompt:
  shared:
    bundle_id: games_circular_chess_v0
    scene_key: circular_chess_board
    task_key: circular_chess_query
    object_description_sparse_board: a circular chess board with four rings, sixteen sectors per ring, and a small set of white and black chess pieces
    object_description_crowded_board: a circular chess board with four rings, sixteen sectors per ring, and many white and black chess pieces
    circular_board_rule_text: Sectors wrap around each ring; rings do not wrap inward or outward.
    piece_rule_text_marked: Use the marked piece's standard chess movement on this circular board.
    piece_rule_text_mixed: Use standard chess movement on this circular board. Rooks move around rings or across rings, bishops move diagonally between rings and sectors, queens combine rook and bishop movement, knights jump, and kings move one step.
    landing_rule_text: A piece may land on an empty cell or an opponent piece, but not on a friendly piece. Sliding pieces stop at the first occupied cell in a direction.
    annotation_hint_marked_piece_move_count: set "annotation" to a JSON array of pixel-space points [x, y] at the centers of every legal destination cell for the marked piece
    answer_hint_marked_piece_move_count: set "answer" to the number of legal destination cells for the marked piece
    annotation_hint_marked_piece_capture_count: set "annotation" to a JSON array of pixel-space points [x, y] at the centers of every opponent-occupied destination cell the marked piece can capture
    answer_hint_marked_piece_capture_count: set "answer" to the number of opponent pieces the marked piece can capture
    annotation_hint_white_piece_reaches_target_count: set "annotation" to a JSON array of pixel-space points [x, y] at the centers of every White piece that can move to the blue marked target cell
    answer_hint_white_piece_reaches_target_count: set "answer" to the number of White pieces that can move to the blue marked target cell
    annotation_hint_black_piece_reaches_target_count: set "annotation" to a JSON array of pixel-space points [x, y] at the centers of every Black piece that can move to the blue marked target cell
    answer_hint_black_piece_reaches_target_count: set "answer" to the number of Black pieces that can move to the blue marked target cell
