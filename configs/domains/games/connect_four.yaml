prompt:
  shared:
    bundle_id: games_connect_four_v0
    scene_key: visible_connect_four_board
    task_key: connect_four_move_query
    object_description_midgame_board: a Connect Four board in a midgame position with
      red and yellow discs
    object_description_crowded_board: a Connect Four board in a crowded late-game
      position with red and yellow discs
    legal_drop_rule_text: A legal drop chooses one non-full column and lands in its
      lowest empty square.
    winning_rule_text: A horizontal, vertical, or diagonal line of four matching discs
      wins.
    safety_rule_text: For each non-full column, imagine dropping the current player's
      disc into its lowest empty square. A safe drop is one where the opponent then
      has no immediate winning drop on their next single move.
    evidence_hint_winning_move_count: set "evidence" to [x0, y0, x1, y1] boxes for
      every immediate-winning landing square
    evidence_hint_safe_move_count: set "evidence" to [x0, y0, x1, y1] boxes for every
      safe legal landing square
    answer_hint_winning_move_count: set "answer" to the number of legal drop columns
      that win immediately
    answer_hint_safe_move_count: set "answer" to the number of legal drop columns
      that are safe
