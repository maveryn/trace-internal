prompt:
  shared:
    bundle_id: games_crossing_v0
    scene_key: visible_crossing_lane
    task_key: crossing_query
    object_description_traffic_crossing: a lane-crossing game board with moving objects, direction arrows, start pads, and one marked route line
    object_description_traffic_crossing_no_route: a lane-crossing game board with moving objects, direction arrows, start pads, and a goal band
    crossing_motion_rule_text: At tick 1, the runner enters the bottom traffic row; at each next tick, the runner moves one row upward. Each moving object shifts one lane cell per tick in its arrow direction. Objects that reach an edge leave the board.
    annotation_hint_moving_object_count: set "annotation" to a JSON array of bounding boxes [x0, y0, x1, y1] for the moving objects that intersect the marked route
    annotation_hint_left_moving_object_count: set "annotation" to a JSON array of bounding boxes [x0, y0, x1, y1] for every moving object whose arrow points left
    annotation_hint_right_moving_object_count: set "annotation" to a JSON array of bounding boxes [x0, y0, x1, y1] for every moving object whose arrow points right
    answer_hint_moving_object_count: set "answer" to the number of moving objects that intersect the marked route; the value is between 1 and 5
    answer_hint_left_moving_object_count: set "answer" to the number of moving objects whose arrow points left; the value is between 1 and 6
    answer_hint_right_moving_object_count: set "answer" to the number of moving objects whose arrow points right; the value is between 1 and 6
