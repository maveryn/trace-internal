prompt:
  shared:
    bundle_id: games_crossing_v0
    scene_key: visible_crossing_lane
    task_key: crossing_query
    object_description_traffic_crossing: a lane-crossing game board with moving objects, direction arrows, start pads, and optional route lines
    crossing_motion_rule_text: At tick 1, the runner enters the bottom traffic row; at each next tick, the runner moves one row upward. Each moving object shifts one lane cell per tick in its arrow direction. Objects that reach an edge leave the board.
    evidence_hint_safe_start_label: set "evidence" to one bounding box [x0, y0, x1, y1] around the selected start pad
    answer_hint_safe_start_label: set "answer" to the selected start-pad label as a string
    evidence_hint_collision_time_value: set "evidence" to bounding boxes [x0, y0, x1, y1] for the first colliding moving object and the matching numbered route cell
    answer_hint_collision_time_value: set "answer" to the smallest tick number where a moving object reaches the matching numbered route cell
    evidence_hint_moving_object_count: set "evidence" to bounding boxes [x0, y0, x1, y1] for the moving objects that intersect the marked route
    answer_hint_moving_object_count: set "answer" to the number of moving objects that intersect the marked route; the value is between 1 and 5
    evidence_hint_goal_reachable_label: set "evidence" to one bounding box [x0, y0, x1, y1] around the selected route option
    answer_hint_goal_reachable_label: set "answer" to the selected route label as a string
