prompt:
  shared:
    bundle_id: games_darts_v0
    scene_key: visible_dartboard
    task_key: darts_score_query
    object_description_single_board: a labeled dartboard with visible dart markers
    scoring_rule_text: A dart in a numbered single area scores that number; a dart
      in the double ring scores twice the number; a dart in the triple ring scores
      three times the number; the outer bull scores 25 and the inner bull scores 50.
    ring_rule_text: The yellow highlight marks the requested scoring area. The double
      ring is the outer scoring band near the board edge. The triple ring is the
      inner scoring band between the bull and the outer edge. The bull is the center
      area. Single areas are the numbered wedge areas outside the bull that are not
      in the double or triple ring.
    annotation_hint_total_score: set "annotation" to a JSON array with one pixel point
      [x, y] at the center of the marked dart
    annotation_hint_ring_count: set "annotation" to a JSON array of pixel points [x,
      y] at the center of every marked dart in the requested ring or area
    annotation_hint_threshold_score_count: set "annotation" to a JSON array of pixel
      points [x, y] at the center of every marked dart whose score is at least the
      requested threshold
    answer_hint_total_score: set "answer" to the option letter shown in the image
      for the total score
    answer_hint_ring_count: set "answer" to the number of marked darts in the requested
      ring or area; use 0 if none are in that area
    answer_hint_threshold_score_count: set "answer" to the number of marked darts
      whose score is at least the requested threshold
