generation:
  shared:
    scene_variant_weights:
      single_board: 1.0
    style_variant_weights:
      classic: 1.0
      soft: 1.0
      outlined: 1.0
      league_blue: 1.0
      parchment: 1.0
      neon: 1.0
    balanced_scene_variant_sampling: true
    balanced_style_variant_sampling: true
  task_overrides:
    task_games__darts__ring_count:
      balanced_dart_count_sampling: true
      balanced_target_answer_sampling: true
      balanced_target_ring_sampling: true
      count_query_dart_count_support: [5, 6, 7, 8]
      count_target_answer_support: [0, 1, 2, 3, 4, 5]
      target_ring_weights:
        single: 1.0
        double: 1.0
        triple: 1.0
        bull: 1.0
    task_games__darts__threshold_score_count:
      balanced_dart_count_sampling: true
      balanced_target_answer_sampling: true
      balanced_target_threshold_sampling: true
      count_query_dart_count_support: [5, 6, 7, 8]
      count_target_answer_support: [0, 1, 2, 3, 4, 5]
      target_threshold_support: [20, 25, 30, 40, 50]
    task_games__darts__total_score_option_label:
      balanced_dart_count_sampling: true
      balanced_score_option_count_sampling: true
      total_score_dart_count_support: [1]
      score_option_count_support: [4, 6]
