generation:
  shared: {}
  task_overrides:
    task_games_dominoes_chain_count:
      scene_variant_weights:
        single_row: 1.0
        two_row: 1.0
      query_variant_weights:
        matching_end_count: 1.0
        higher_sum_than_reference_count: 1.0
        sum_to_target_count: 1.0
        double_count: 1.0
      style_variant_weights:
        classic: 1.0
        soft: 1.0
        outlined: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true
      balanced_style_variant_sampling: true
      balanced_target_answer_sampling: true
      balanced_candidate_count_sampling: true
      matching_end_target_answer_support: [0, 1, 2, 3, 4, 5]
      higher_sum_target_answer_support: [0, 1, 2, 3, 4, 5]
      sum_to_target_answer_support: [0, 1, 2, 3, 4]
      double_target_answer_support: [0, 1, 2, 3, 4, 5]
      single_row_candidate_count_support: [7, 8, 9]
      two_row_candidate_count_support: [10, 11, 12]
      sum_target_total_support: [2, 3, 4, 5, 6, 7, 8, 9, 10]

rendering:
  shared:
    canvas_width: 1180
    canvas_height: 760
    panel_margin_px: 56
    chain_top_px: 104
    tile_width_px: 138
    tile_height_px: 76
    chain_gap_px: 18
    candidate_gap_px: 18
    row_gap_px: 34
    tile_corner_radius_px: 12
    pip_radius_px: 5
    divider_width_px: 4
    reference_tag_font_size_px: 16
    reference_tag_gap_px: 14

complexity:
  shared: {}
  task_overrides:
    task_games_dominoes_chain_count:
      criteria_weights:
        visual_scan: 0.28
        card_reasoning: 0.44
        ambiguity: 0.16
        output_burden: 0.12

prompt:
  shared:
    bundle_id: games_dominoes_v1
  task_overrides:
    task_games_dominoes_chain_count:
      task_family_key: visible_domino_chain
      task_key: domino_chain_query
      object_description_single_row: one short face-up domino chain across the top and one row of loose face-up dominoes below on a green table
      object_description_two_row: one short face-up domino chain across the top and two rows of loose face-up dominoes below on a green table
      connection_rule_text: A loose domino can connect to the open right end if either half has the same number of pips as that open end.
      pip_sum_rule_text: The pip sum of a domino is the total number of pips across its two halves.
      double_rule_text: A double has the same number of pips on both halves.
      evidence_hint_matching_end_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every loose domino below that can connect to the open right end of the `REF` tile
      evidence_hint_higher_sum_than_reference_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every loose domino below whose pip sum is larger than the `REF` tile's pip sum
      evidence_hint_sum_to_target_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every loose domino below whose pip sum equals the target total
      evidence_hint_double_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every loose domino below that is a double
      answer_hint_matching_end_count: set "answer" to the number of loose dominoes below that can connect to the open right end of the `REF` tile
      answer_hint_higher_sum_than_reference_count: set "answer" to the number of loose dominoes below whose pip sum is larger than the `REF` tile's pip sum
      answer_hint_sum_to_target_count: set "answer" to the number of loose dominoes below whose pip sum equals the target total
      answer_hint_double_count: set "answer" to the number of loose dominoes below that are doubles
