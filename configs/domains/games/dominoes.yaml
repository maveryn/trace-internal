prompt:
  shared:
    bundle_id: games_dominoes_v0
    scene_key: visible_domino_chain
    task_key: domino_chain_query
    object_description_single_row: a short face-up domino chain across the top with
      one row of loose face-up dominoes below
    object_description_two_row: a short face-up domino chain across the top with
      two rows of loose face-up dominoes below
    connection_rule_text: A loose domino can connect to the open right end if either
      half has the same number of pips as that open end.
    pip_sum_rule_text: The pip sum of a domino is the total number of pips across
      its two halves.
    double_rule_text: A double has the same number of pips on both halves.
    second_play_rule_text: Exactly one loose domino can connect directly to `REF`;
      after playing it, count the remaining loose dominoes that could connect to the
      new open end.
    extendable_first_play_rule_text: Count loose dominoes that can connect directly
      to `REF` and would leave a new open end that at least one remaining loose
      domino could connect to.
    annotation_hint_matching_end_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every loose domino that matches the `REF` tile's
      open right end
    annotation_hint_higher_sum_than_reference_count: set "annotation" to a JSON array
      of bounding boxes [x0, y0, x1, y1] for every loose domino with a larger pip
      sum than `REF`
    annotation_hint_sum_to_target_count: set "annotation" to a JSON array of bounding
      boxes [x0, y0, x1, y1] for every loose domino with the target pip sum
    annotation_hint_double_count: set "annotation" to a JSON array of bounding boxes
      [x0, y0, x1, y1] for every loose domino that is a double
    annotation_hint_second_play_candidate_count: set "annotation" to a JSON array of
      bounding boxes [x0, y0, x1, y1] for every remaining loose domino that could
      be played second on the new open end
    annotation_hint_extendable_first_play_count: set "annotation" to a JSON array of
      bounding boxes [x0, y0, x1, y1] for every loose domino that can be played on
      `REF` and would allow a second play afterward
    answer_hint_matching_end_count: set "answer" to the count of loose dominoes that
      match the `REF` tile's open right end
    answer_hint_higher_sum_than_reference_count: set "answer" to the count of loose
      dominoes with a larger pip sum than `REF`
    answer_hint_sum_to_target_count: set "answer" to the count of loose dominoes with
      the target pip sum
    answer_hint_double_count: set "answer" to the count of loose doubles
    answer_hint_second_play_candidate_count: set "answer" to the count of remaining
      loose dominoes that could be played second
    answer_hint_extendable_first_play_count: set "answer" to the count of loose
      dominoes that can be played first and would allow a second play afterward
