generation:
  shared:
    box_rows_support:
    - 3
    - 4
    box_cols_support:
    - 3
    - 4
    scene_variant_weights:
      single_board: 1.0
    query_id_weights:
      three_sided_box_count: 1.0
      capture_move_count: 1.0
      highlighted_candidate_capture_count: 1.0
    capture_move_query_id_weights:
      capture_move_count: 1.0
      highlighted_candidate_capture_count: 1.0
    style_variant_weights:
      classic: 1.0
      soft: 1.0
      outlined: 1.0
      notebook: 1.0
      slate: 1.0
      wood_panel: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_capture_move_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_answer_sampling: true
    balanced_board_shape_sampling: true
    balanced_candidate_edge_count_sampling: true
    three_sided_box_count_support:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    capture_move_count_support:
    - 0
    - 1
    - 2
