    - 5
    candidate_edge_count_support:
    - 5
    - 6
    - 7
    - 8
rendering:
  shared:
    canvas_width: 1180
    canvas_height: 820
    board_width_px: 880
    board_height_px: 640
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
    board_corner_radius_px: 24
    panel_margin_px: 56
    title_font_size_px: 34
    title_band_height_px: 62
    board_padding_px: 62
    dot_radius_px: 7
    dash_length_px: 30
    dash_gap_px: 18
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.24
      state_reasoning: 0.46
      ambiguity: 0.12
      output_burden: 0.18
prompt:
  shared:
    bundle_id: games_dots_and_boxes_v0
    scene_key: visible_dots_and_boxes_board
    task_key: dots_and_boxes_capture_query
    object_description_single_board: a dots-and-boxes grid with some edges already
      drawn
    evidence_hint_three_sided_box_count: set "evidence" to bounding boxes
      [x0, y0, x1, y1] for every box with exactly three drawn sides
    answer_hint_three_sided_box_count: set "answer" to the number of boxes with exactly
      three drawn sides
    evidence_hint_capture_move_count: set "evidence" to bounding boxes
      [x0, y0, x1, y1] for every missing edge that would complete at least one box
      if drawn
    answer_hint_capture_move_count: set "answer" to the number of missing edges that
      would complete at least one box if drawn
    evidence_hint_highlighted_candidate_capture_count: set "evidence" to bounding
      boxes [x0, y0, x1, y1] for every highlighted missing edge that would
      complete at least one box if drawn
    answer_hint_highlighted_candidate_capture_count: set "answer" to the number of
      highlighted missing edges that would complete at least one box if drawn
