generation:
  shared: {}
  task_overrides:
    task_games_go_group_liberty_count:
      scene_variant_weights:
        open_board: 1.0
        crowded_board: 1.0
      query_variant_weights:
        marked_black_group_liberty_count: 1.0
        marked_white_group_liberty_count: 1.0
      style_variant_weights:
        classic: 1.0
        soft: 1.0
        outlined: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true
      balanced_style_variant_sampling: true
      balanced_target_answer_sampling: true
      liberty_count_support: [1, 2, 3, 4, 5, 6, 7, 8]
      board_size: 7

rendering:
  shared:
    canvas_width: 920
    canvas_height: 920
    panel_margin_px: 48
    max_board_size_px: 760
    board_padding_px: 78
    board_corner_radius_px: 24
    board_frame_width_px: 12
    line_width_px: 4
    point_radius_px: 4
    stone_radius_fraction: 0.34
    highlight_outline_width_px: 6
    liberty_bbox_fraction: 0.72

complexity:
  shared: {}
  task_overrides:
    task_games_go_group_liberty_count:
      criteria_weights:
        visual_scan: 0.30
        state_reasoning: 0.42
        ambiguity: 0.14
        output_burden: 0.14

prompt:
  shared:
    bundle_id: games_go_v1
  task_overrides:
    task_games_go_group_liberty_count:
      task_family_key: visible_go_board
      task_key: go_group_liberty_query
      object_description_open_board: one visible 7 by 7 Go board with a highlighted connected stone group and many open intersections
      object_description_crowded_board: one visible 7 by 7 Go board with a highlighted connected stone group and many surrounding black and white stones
      group_rule_text: Stones of the same color that touch edge to edge form one group.
      liberty_rule_text: A liberty is an empty intersection directly above, below, left, or right of any stone in the group, and diagonal intersections do not count.
      marked_group_rule_text_marked_black_group_liberty_count: The blue outlined black stones are the marked group.
      marked_group_rule_text_marked_white_group_liberty_count: The blue outlined white stones are the marked group.
      evidence_hint_marked_black_group_liberty_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every empty intersection that is a liberty of the marked black group
      evidence_hint_marked_white_group_liberty_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every empty intersection that is a liberty of the marked white group
      answer_hint_marked_black_group_liberty_count: set "answer" to the number of liberties of the marked black group
      answer_hint_marked_white_group_liberty_count: set "answer" to the number of liberties of the marked white group
