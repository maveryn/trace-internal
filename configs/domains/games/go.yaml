prompt:
  shared:
    bundle_id: games_go_v0
    scene_key: visible_go_board
    task_key: go_group_property_query
    object_description_open_board: a Go board with a highlighted connected stone group
      and many open intersections
    object_description_crowded_board: a Go board with a highlighted connected stone
      group and many surrounding black and white stones
    group_rule_text: Same-color stones connected edge to edge form one group.
    liberty_rule_text: A liberty is an empty orthogonal neighbor of the group; diagonals
      do not count.
    adjacent_enemy_rule_text: Count only opponent stones touching the marked group
      edge to edge; diagonals do not count.
    shared_liberty_rule_text: A shared liberty also touches at least one opponent
      stone edge to edge.
    marked_group_rule_text: The blue outlined {player_color} stones are the marked
      group.
    evidence_hint_marked_group_liberty_count: set "evidence" to a JSON array of
      pixel-space points [x, y] at every liberty of the marked {player_color}
      group
    answer_hint_marked_group_liberty_count: set "answer" to the number of liberties
      of the marked {player_color} group
    evidence_hint_marked_group_adjacent_enemy_count: set "evidence" to a JSON array
      of pixel-space points [x, y] at every opponent stone directly adjacent to
      the marked {player_color} group
    answer_hint_marked_group_adjacent_enemy_count: set "answer" to the number of opponent
      stones directly adjacent to the marked {player_color} group
    evidence_hint_marked_group_shared_liberty_count: set "evidence" to a JSON
      array of pixel-space points [x, y] at every shared liberty of the marked
      {player_color} group
    answer_hint_marked_group_shared_liberty_count: set "answer" to the number of shared
      liberties of the marked {player_color} group
