prompt:
  shared:
    bundle_id: games_hex_v0
    scene_key: visible_hex_board
    task_key: hex_connection_query
    object_description_open_board: a Hex board with red and blue stones, colored goal sides, and open cells
    object_description_crowded_board: a Hex board with red and blue stones, colored goal sides, and a crowded mix of open cells and stones
    hex_rule_text: In Hex, adjacent cells are the six cells sharing an edge.
    red_goal_text: Red connects the left and right red sides.
    blue_goal_text: Blue connects the top and bottom blue sides.
    evidence_hint_winning_move_cell_label: set "evidence" to a JSON array containing one pixel-space point [x, y] at the center of the chosen winning cell
    answer_hint_winning_move_cell_label: set "answer" to the single candidate letter of the empty cell that lets {query_player} win immediately
    evidence_hint_connection_gap_count: set "evidence" to a JSON array of pixel-space points [x, y] at the centers of the empty cells in the unique minimum connection gap for {query_player}
    answer_hint_connection_gap_count: set "answer" to the minimum number of empty cells {query_player} must fill to connect the required sides
