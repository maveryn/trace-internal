prompt:
  shared:
    bundle_id: games_mancala_v1
  task_overrides:
    task_games_mancala_move_count:
      task_family_key: visible_mancala_board
      task_key: mancala_move_query
      object_description_midgame_board: a Mancala board with six pits per side and two side stores
      object_description_crowded_board: a crowded Mancala board with six pits per side and two side stores
      turn_rule_text: Blue controls the bottom row and the right store. On a move, choose one non-empty pit on Blue's row, pick up all stones from that pit, and place them one by one into the following pits moving counterclockwise, including Blue's store but skipping Orange's store.
      extra_turn_rule_text: A move gives Blue another turn if the last stone lands in Blue's store.
      capture_rule_text: A move causes a capture if the last stone lands in an empty pit on Blue's row and the opposite Orange pit contains one or more stones; then Blue moves both that last stone and all stones from the opposite pit into Blue's store.
      evidence_hint_extra_turn_move_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every bottom-row pit that would give Blue another turn
      evidence_hint_capture_move_count: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every bottom-row pit that would cause a capture
      answer_hint_extra_turn_move_count: set "answer" to the number of bottom-row pits that would give Blue another turn
      answer_hint_capture_move_count: set "answer" to the number of bottom-row pits that would cause a capture
