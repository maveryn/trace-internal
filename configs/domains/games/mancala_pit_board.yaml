generation:
  shared:
    scene_variant_weights:
      low_seed: 1.0
      mixed_seed: 1.0
      busy_seed: 1.0
    style_variant_weights:
      wood_tray: 1.0
      sand_stone: 1.0
      slate_bowls: 1.0
      cloth_pits: 1.0
      arcade_pits: 1.0
    target_landing_label_support: [A, B, C, D, E, F, G, H, I, J, K, L]
    target_count_support: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    balanced_scene_variant_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_landing_label_sampling: true
    balanced_target_count_sampling: true
    min_seed_count_per_pit: 0
    max_seed_count_per_pit: 8
    min_source_seed_count: 1
    max_source_seed_count: 8
rendering:
  shared:
    canvas_width: 980
    canvas_height: 440
    canvas_min_width_px: 760
    canvas_min_height_px: 340
    canvas_side_padding_px: 168
    canvas_vertical_padding_px: 132
    pit_width_px: 108
    pit_height_px: 68
    pit_gap_px: 20
    row_gap_px: 74
    board_padding_px: 48
    seed_diameter_min_px: 16
    seed_diameter_max_px: 20
    pit_outline_width_px: 4
    marker_width_px: 5
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.38
      movement_reasoning: 0.36
      ambiguity: 0.12
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_mancala_pit_board_v0
    scene_key: mancala_pit_board
    task_key: mancala_pit_board_query
    object_description_low_seed: a two-row pit board with labeled pits, visible seeds, and an arrow direction
    object_description_mixed_seed: a two-row pit board with labeled pits, visible seeds, and an arrow direction
    object_description_busy_seed: a two-row pit board with labeled pits, visible seeds, and an arrow direction
    sowing_rule_text: Pick up all seeds from the X-marked pit and sow one seed at a time in the arrow direction.
    annotation_hint_sowing_landing_pit_label: set "annotation" to a JSON array containing the selected landing pit bounding box as [x0,y0,x1,y1] in pixels
    answer_hint_sowing_landing_pit_label: set "answer" to the single selected pit label as a capital letter A through L
    annotation_hint_post_sow_pit_count_value: set "annotation" to an object with keys "source_pit" and "target_pit", each mapped to that pit bounding box as [x0,y0,x1,y1] in pixels
    answer_hint_post_sow_pit_count_value: set "answer" to the integer number of seeds in the target-marked pit after the move
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
