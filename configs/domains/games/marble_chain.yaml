prompt:
  shared:
    bundle_id: games_marble_chain_v0
    scene_key: marble_chain_board
    task_key: marble_chain_query
    object_description_marble_chain_board: a Zuma-like marble-chain board with a central shooter, a colored shooter marble, arrow shot options, and colored marbles on a gray track
    marble_chain_rule_text: Fire the shooter marble straight along the chosen arrow. It inserts at the chain gap indicated by that arrow. If the inserted marble's same-color contiguous run has at least three marbles, the existing marbles in that run are removed and the chain closes once. Do not apply any later cascade.
    evidence_hint_max_pop_direction_label: set "evidence" to an array containing the selected shot-arrow box and the boxes for the existing marbles that would pop
    answer_hint_max_pop_direction_label: set "answer" to only the selected shot-arrow letter
    evidence_hint_target_pop_direction_label: set "evidence" to an array containing the selected shot-arrow box and the boxes for the existing marbles that would pop; if the target is 0, include the selected arrow and its neighboring chain marbles
    answer_hint_target_pop_direction_label: set "answer" to only the selected shot-arrow letter
    evidence_hint_pop_count_after_marked_shot: set "evidence" to an array containing the marked shot-arrow box and the boxes for the existing marbles that would pop; if none pop, include the marked arrow and its neighboring chain marbles
    answer_hint_pop_count_after_marked_shot: set "answer" to the number of existing chain marbles removed by the marked shot, excluding the shooter marble
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
