complexity:
  shared:
    criteria_weights:
      visual_scan: 0.30
      state_reasoning: 0.42
      ambiguity: 0.16
      output_burden: 0.12
prompt:
  shared:
    bundle_id: games_match3_v0
    scene_key: match3_grid
    task_key: match3_query
    object_description_match3_grid: a match-3 jewel grid with row and column numbers, colored gems, and marked or labeled adjacent-swap arrows
    match3_rule_text: Swap only the two adjacent gems connected by the arrow. After the swap, immediately clear every horizontal or vertical run of three or more matching gems. Count only this immediate clear; do not apply falling, refill, special effects, or cascades.
    evidence_hint_cleared_count_after_marked_swap: set "evidence" to a JSON array of [x,y] pixel points, one at the center of each gem cleared by the marked swap; use [] if no gems are cleared
    answer_hint_cleared_count_after_marked_swap: set "answer" to the number of gems cleared by the marked swap
    evidence_hint_created_run_count_after_marked_swap: set "evidence" to a JSON array of [x,y] pixel points, one near the center of each horizontal or vertical run created by the marked swap; use [] if no run is created
    answer_hint_created_run_count_after_marked_swap: set "answer" to the number of horizontal or vertical matching runs created by the marked swap
    evidence_hint_max_clear_swap_label: set "evidence" to a JSON array containing one [x,y] pixel point on the selected swap arrow
    answer_hint_max_clear_swap_label: set "answer" to only the selected swap-arrow letter
    evidence_hint_target_clear_swap_label: set "evidence" to a JSON array containing one [x,y] pixel point on the selected swap arrow
    answer_hint_target_clear_swap_label: set "answer" to only the selected swap-arrow letter
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
