prompt:
  shared:
    bundle_id: games_minecraft_v0
    scene_key: visible_block_world
    task_key: minecraft_query
    object_description_block_world: a Minecraft-like isometric block world with cube terrain, visible cube stacks, resource blocks, and any marked paths or mining routes needed for the question
    object_description_reachable_stack_line: a Minecraft-like isometric block world with one highlighted line of cube stacks arranged from left to right
    minecraft_route_cost_rule_text: For the named labeled route only, each raised stone or dirt block sitting on that route costs 1, and empty route cells cost 0. Ignore all other routes.
    annotation_hint_top_ore_stack_count: set "annotation" to [x, y] pixel points at the centers of the top cubes of every visible stack whose top cube is the named ore
    answer_hint_top_ore_stack_count: set "answer" to the integer number of stacks whose top cube is the named ore
    annotation_hint_reachable_ore_stack_count: set "annotation" to [x, y] pixel points at the centers of the top cubes of every reachable stack whose top cube is the named ore; use an empty array if none qualify
    answer_hint_reachable_ore_stack_count: set "answer" to the integer number of reachable stacks whose top cube is the named ore
    annotation_hint_resource_route_cost: set "annotation" to [x, y] pixel points at the centers of the raised stone or dirt blocks on the named route only; use an empty array if the cost is 0
    answer_hint_resource_route_cost: set "answer" to the integer cost of the named route
    annotation_hint_exact_height_count: set "annotation" to [x, y] pixel points at the centers of the top cubes of every visible stack that is exactly the named height
    answer_hint_exact_height_count: set "answer" to the integer number of stacks that are exactly the named height
    annotation_hint_at_least_height_count: set "annotation" to [x, y] pixel points at the centers of the top cubes of every visible stack that is at least the named height
    answer_hint_at_least_height_count: set "answer" to the integer number of stacks that are at least the named height
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
