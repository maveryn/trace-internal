      output_burden: 0.18
prompt:
  shared:
    bundle_id: games_minecraft_v0
    scene_key: visible_block_world
    task_key: minecraft_query
    object_description_block_world: a Minecraft-like isometric block world with cube terrain, visible resource blocks, and any marked paths or mining routes needed for the question
    minecraft_tunnel_rule_text: Only solid blocks sitting on the marked tunnel path must be mined; empty marked path cells and off-path blocks do not count.
    minecraft_route_cost_rule_text: For the named labeled route only, each raised stone or dirt block sitting on that route costs 1, and empty route cells cost 0. Ignore all other routes.
    evidence_hint_ore_block_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around every counted ore block
    answer_hint_ore_block_count: set "answer" to the integer number of counted ore blocks
    evidence_hint_tunnel_clearance_count: set "evidence" to bounding boxes [x0, y0, x1, y1] around the solid blocks sitting on the marked tunnel path
    answer_hint_tunnel_clearance_count: set "answer" to the integer number of solid blocks that must be mined from the marked tunnel path
    evidence_hint_resource_route_cost: set "evidence" to bounding boxes [x0, y0, x1, y1] around the raised stone or dirt blocks on the named route only
    answer_hint_resource_route_cost: set "answer" to the integer cost of the named route
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
