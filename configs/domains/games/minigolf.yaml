prompt:
  shared:
    bundle_id: games_minigolf_v0
    scene_key: visible_minigolf_course
    task_key: minigolf_course_query
    object_description_putting_course: a mini-golf putting course with a ball, a hole, visible obstacles, and any shown shot cues
    minigolf_cue_rule_text: The dashed cue shows the starting direction of the putt; extend it as a straight line.
    minigolf_bank_rule_text: A shot travels straight and bounces off course walls like a mirror before continuing.
    evidence_hint_first_obstacle_label: set "evidence" to one [x, y] pixel point at the center of the first labeled obstacle hit by the extended cue
    answer_hint_first_obstacle_label: set "answer" to the selected obstacle label as a string
    evidence_hint_shot_path_label: set "evidence" to one path point-pair of [x, y] pixel points as [[[x0, y0], [x1, y1]]], using the two endpoints of the selected visible dashed cue from the ball outward
    answer_hint_shot_path_label: set "answer" to the selected numbered shot label as a string
