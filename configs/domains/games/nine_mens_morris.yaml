generation:
  shared:
    scene_variant_weights:
      single_board: 1.0
    query_id_weights:
      all_pieces_in_mill_count: 1.0
      white_mill_completion_point_count: 1.0
      black_mill_completion_point_count: 1.0
    style_variant_weights:
      classic: 1.0
      soft: 1.0
      outlined: 1.0
      wood_panel: 1.0
      slate: 1.0
      parchment: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_answer_sampling: true
    all_pieces_in_mill_count_support:
    - 0
    - 3
    - 5
    - 6
    - 7
    - 8
    - 9
    white_mill_completion_point_count_support:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    black_mill_completion_point_count_support:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
rendering:
  shared:
    canvas_width: 1180
    canvas_height: 820
    board_width_px: 860
    board_height_px: 660
    board_corner_radius_px: 24
    panel_margin_px: 56
    title_font_size_px: 34
    title_band_height_px: 62
    board_padding_px: 72
    piece_radius_px: 22
    node_radius_px: 5
    unit_size_scale_min: 0.55
    unit_size_scale_max: 1.10
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.05
      state_reasoning: 0.05
      ambiguity: 0.65
      output_burden: 0.25
prompt:
  shared:
    bundle_id: games_nine_mens_morris_v0
    scene_key: visible_nine_mens_morris_board
    task_key: pieces_in_mill_query
    object_description_single_board: a Nine Men's Morris board with light and dark
      pieces placed on intersections
    mill_rule_text: A mill is three same-color pieces on one straight line. Count
      each piece only once even if it belongs to more than one mill.
    annotation_hint_all_pieces_in_mill_count: set "annotation" to [x, y] pixel points
      at the centers of every piece that belongs to at least one mill
    annotation_hint_white_mill_completion_point_count: set "annotation" to [x, y]
      pixel points at the centers of every empty point where placing one white piece
      would complete a mill
    annotation_hint_black_mill_completion_point_count: set "annotation" to [x, y]
      pixel points at the centers of every empty point where placing one black piece
      would complete a mill
    answer_hint_all_pieces_in_mill_count: set "answer" to the total number of pieces
      that belong to at least one mill
    answer_hint_white_mill_completion_point_count: set "answer" to the number of
      empty points where placing one white piece would complete a mill
    answer_hint_black_mill_completion_point_count: set "answer" to the number of
      empty points where placing one black piece would complete a mill
