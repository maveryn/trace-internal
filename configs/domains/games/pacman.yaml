complexity:
  shared:
    criteria_weights:
      visual_scan: 0.34
      route_reasoning: 0.38
      ambiguity: 0.12
      output_burden: 0.16
prompt:
  shared:
    bundle_id: games_pacman_v0
    scene_key: visible_pacman_maze
    task_key: pacman_maze_query
    object_description_compact_maze: a Pac-Man style maze with a visible Pac-Man marker, ghosts, normal pellets, and a highlighted route
    object_description_wide_maze: a wider Pac-Man style maze with a visible Pac-Man marker, ghosts, normal pellets, and a highlighted route
    evidence_hint_path_pellet_count: set "evidence" to [x, y] pixel points at the centers of the normal pellets that lie on the highlighted route
    answer_hint_path_pellet_count: set "answer" to the number of normal pellets on the highlighted route
    evidence_hint_next_item_label: set "evidence" to one [x, y] pixel point at the center of the first labeled bonus item reached along the highlighted route
    answer_hint_next_item_label: set "answer" to the single option letter of the first labeled bonus item reached along the highlighted route
    evidence_hint_pellet_count_before_ghost: set "evidence" to [x, y] pixel points at the centers of the counted normal pellets before the first ghost on the highlighted route, plus the center of that first route ghost
    answer_hint_pellet_count_before_ghost: set "answer" to the number of normal pellets reached before the first ghost on the highlighted route
