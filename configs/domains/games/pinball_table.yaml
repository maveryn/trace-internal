    scene_variant_weights:
      schematic_table: 1.0
    query_id_weights:
      first_hit_object_label: 1.0
      path_score_value: 1.0
    style_variant_weights:
      classic: 1.0
      blueprint: 1.0
      neon: 1.0
      carnival: 1.0
      paper: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_object_count_sampling: true
    balanced_target_object_label_sampling: true
    balanced_path_shape_sampling: true
    balanced_path_hit_count_sampling: true
    object_count_support:
      - 5
