rendering:
  shared:
    canvas_width: 900
    canvas_height: 760
    panel_margin_px: 28
    table_width_px: 700
    table_height_px: 680
    table_border_width_px: 7
    ball_radius_px: 17
    bumper_radius_px: 32
    target_width_px: 72
    target_height_px: 34
    cue_width_px: 6
    label_font_size_px: 26
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.30
      motion_reasoning: 0.38
      ambiguity: 0.18
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_pinball_table_v0
    scene_key: visible_pinball_table
    task_key: pinball_table_query
    object_description_schematic_table: a tilted pinball playfield with a ball, a straight launch cue, flippers, bumpers, lanes, and labeled targets
    object_description_score_path: a tilted pinball playfield with a ball, a full drawn ball path, flippers, bumpers, lanes, and scored targets
    pinball_motion_rule_text: The arrow shows the ball's straight path; extend it in the same direction.
    pinball_score_rule_text: Follow the full drawn ball path to the bottom edge. Add the score values for each scored-target hit; if the same target is hit twice, add it twice.
    annotation_hint_first_hit_object_label: set "annotation" to one [x, y] pixel point at the center of the first labeled object hit by the path
    answer_hint_first_hit_object_label: set "answer" to the selected object label as a string
    annotation_hint_path_score_value: set "annotation" to an ordered JSON array of [x, y] pixel points at the centers of scored targets hit along the path, repeating a point for repeated hits
    answer_hint_path_score_value: set "answer" to the integer total score
