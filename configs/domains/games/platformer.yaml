generation:
  shared:
    scene_variant_weights:
      side_scroller: 1.0
    query_id_weights:
      jump_landing_label: 1.0
      collectible_count: 1.0
    style_variant_weights:
      day: 1.0
      cave: 1.0
      neon: 1.0
      snow: 1.0
      sunset: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_platform_count_sampling: true
    balanced_hazard_count_sampling: true
    balanced_distractor_collectible_count_sampling: true
    balanced_target_platform_label_sampling: true
    balanced_target_collectible_count_sampling: true
    platform_count_support:
      - 4
      - 5
      - 6
      - 7
    hazard_count_support:
