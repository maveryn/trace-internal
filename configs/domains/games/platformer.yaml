prompt:
  shared:
    bundle_id: games_platformer_v0
    scene_key: visible_platformer_level
    task_key: platformer_level_query
    object_description_side_scroller: a side-scroller platformer level with a player character, platforms, hazards, coins, bonus items, and a dashed jump arc
    platformer_short_arc_rule_text: The dashed arc shows the first part of the jump; extend the same smooth arc forward.
    platformer_full_arc_rule_text: The dashed arc shows the jump path to follow.
    platformer_score_rule_text: Coins score 1; bonus items score their printed value.
    annotation_hint_jump_landing_label: set "annotation" to one bounding box [x0, y0, x1, y1] around the labeled platform where the jump lands
    answer_hint_jump_landing_label: set "answer" to the selected platform label as a string
    annotation_hint_collectible_count: set "annotation" to one pixel point [x,y] at the center of each coin lying on the dashed jump arc
    answer_hint_collectible_count: set "answer" to the number of coins lying on the dashed jump arc as an integer
    annotation_hint_jump_collectible_score_value: set "annotation" to one pixel point [x,y] at the center of every coin and printed-value bonus item included in the dashed-arc score
    answer_hint_jump_collectible_score_value: set "answer" to the integer total score from collectibles on the dashed jump arc
