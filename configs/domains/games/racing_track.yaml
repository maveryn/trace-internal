complexity:
  shared:
    criteria_weights:
      visual_scan: 0.35
      circular_order: 0.40
      ambiguity: 0.12
      output_burden: 0.13
prompt:
  shared:
    bundle_id: games_racing_track_v0
    scene_key: racing_track_loop
    task_key: racing_track_query
    object_description_oval_loop: a top-down loop racing track with a checkered finish line, a direction arrow, and labeled cars
    object_description_rounded_loop: a rounded loop racing track with a checkered finish line, a direction arrow, and labeled cars
    object_description_kidney_loop: a curved loop racing track with a checkered finish line, a direction arrow, and labeled cars
    object_description_oval_loop_ahead_count: a top-down loop racing track with a checkered finish line, a direction arrow, a marked car, and other labeled cars
    object_description_rounded_loop_ahead_count: a rounded loop racing track with a checkered finish line, a direction arrow, a marked car, and other labeled cars
    object_description_kidney_loop_ahead_count: a curved loop racing track with a checkered finish line, a direction arrow, a marked car, and other labeled cars
    distance_rule_text: Measure distance along the track in the arrow direction.
    ahead_rule_text: Follow the arrow direction from the marked car to the finish line. Do not count the marked car.
    annotation_hint_closest_to_finish_label: set "annotation" to one [x, y] pixel point at the center of the selected car
    answer_hint_closest_to_finish_label: set "answer" to the selected car label as a capital letter
    annotation_hint_farthest_from_finish_label: set "annotation" to one [x, y] pixel point at the center of the selected car
    answer_hint_farthest_from_finish_label: set "answer" to the selected car label as a capital letter
    annotation_hint_car_ahead_count: set "annotation" to [x, y] pixel points at the centers of every counted car; use an empty array when none qualify
    answer_hint_car_ahead_count: set "answer" to the integer count of other cars ahead of the marked car before the finish line
