rendering:
  shared:
    canvas_width: 900
    canvas_height: 900
    panel_margin_px: 48
    player_badge_height_px: 52
    player_badge_width_px: 190
    header_gap_px: 18
    max_board_size_px: 720
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
    board_corner_radius_px: 24
    board_frame_width_px: 14
    cell_line_width_px: 3
    marked_square_outline_width_px: 6
    disc_inset_fraction: 0.14
    player_badge_font_size_px: 22
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.3
      card_reasoning: 0.42
      ambiguity: 0.16
      output_burden: 0.12
prompt:
  shared:
    bundle_id: games_reversi_v0
    scene_key: visible_reversi_board
    task_key: reversi_move_query
    object_description_compact_board: a 6 by 6 Reversi board with black and white
      discs
    object_description_classic_board: an 8 by 8 Reversi board with black and white
      discs
    legal_move_rule_text: A legal move brackets one or more opponent discs in at
      least one straight line.
    corner_rule_text: The corner squares are the four outermost corners.
    marked_move_rule_text: The red outlined empty square is the marked move.
    flip_rule_text: The marked move flips every bracketed opponent disc.
    evidence_hint_legal_move_count: set "evidence" to bounding boxes [x0, y0, x1,
      y1] for every legal move square
    evidence_hint_corner_move_count: set "evidence" to bounding boxes [x0, y0, x1,
      y1] for every legal corner square
    evidence_hint_flip_count_for_marked_move: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for every disc flipped by the marked move
    answer_hint_legal_move_count: set "answer" to the count of legal moves
    answer_hint_corner_move_count: set "answer" to the count of legal corner moves
    answer_hint_flip_count_for_marked_move: set "answer" to the count of discs flipped
      by the marked move
