prompt:
  shared:
    bundle_id: games_reversi_v0
    scene_key: visible_reversi_board
    task_key: reversi_move_query
    object_description_compact_board: a 6 by 6 Reversi board with black and white
      discs
    object_description_classic_board: an 8 by 8 Reversi board with black and white
      discs
    legal_move_rule_text: A legal move is an empty square that brackets one or
      more opponent discs in at least one straight line.
    corner_rule_text: The corner squares are the four outermost corners.
    marked_move_rule_text: The red marked empty square is the marked move.
    flip_rule_text: The marked move flips every bracketed opponent disc.
    frontier_rule_text: A frontier disc touches at least one empty square horizontally,
      vertically, or diagonally.
    annotation_hint_legal_move_count: set "annotation" to bounding boxes [x0, y0, x1,
      y1] for every legal move square
    annotation_hint_corner_move_count: set "annotation" to bounding boxes [x0, y0, x1,
      y1] for every legal corner square
    annotation_hint_flip_count_for_marked_move: set "annotation" to one pixel point
      [x,y] at the center of every disc flipped by the marked move
    annotation_hint_black_frontier_disc_count: set "annotation" to one pixel point
      [x,y] at the center of every counted black frontier disc
    annotation_hint_white_frontier_disc_count: set "annotation" to one pixel point
      [x,y] at the center of every counted white frontier disc
    answer_hint_legal_move_count: set "answer" to the count of legal moves
    answer_hint_corner_move_count: set "answer" to the count of legal corner moves
    answer_hint_flip_count_for_marked_move: set "answer" to the count of discs flipped
      by the marked move
    answer_hint_black_frontier_disc_count: set "answer" to the count of black frontier
      discs
    answer_hint_white_frontier_disc_count: set "answer" to the count of white frontier
      discs
