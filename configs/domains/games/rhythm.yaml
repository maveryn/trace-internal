generation:
  shared:
    scene_variant_weights:
      falling_notes: 1.0
    query_id_weights:
      lane_hit_count: 1.0
      lane_color_hit_count: 1.0
      most_hits_lane_label: 1.0
      earliest_hit_lane_label: 1.0
    style_variant_weights:
      arcade: 1.0
      neon: 1.0
      paper: 1.0
      dark: 1.0
      pastel: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_lane_count_sampling: true
    balanced_row_count_sampling: true
    balanced_beat_window_sampling: true
    balanced_hit_count_sampling: true
    lane_count_support:
      - 5
      - 6
      - 7
      - 8
    row_count_support:
      - 10
      - 11
      - 12
      - 13
      - 14
    beat_window_support:
      - 5
      - 6
      - 7
    hit_count_support:
      - 1
      - 2
      - 3
      - 4
      - 5
rendering:
  shared:
    canvas_width: 760
    canvas_height: 900
    panel_margin_px: 42
    grid_width_px: 650
    grid_height_px: 790
    grid_border_width_px: 5
    row_gap_px: 4
    lane_gap_px: 9
    note_radius_px: 13
    label_font_size_px: 25
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.32
      timing_reasoning: 0.36
      ambiguity: 0.16
      output_burden: 0.16
prompt:
  shared:
    bundle_id: games_rhythm_v0
    scene_key: visible_rhythm_lanes
    task_key: rhythm_query
    object_description_falling_notes: a rhythm-game lane grid with colored falling notes, lane numbers, and a bottom hit line
    rhythm_motion_rule_text: Notes fall one row per beat. The bottom line is the hit line. A long vertical note counts as one note.
    annotation_hint_lane_hit_count: set "annotation" to bounding boxes [x0, y0, x1, y1] around all notes in the specified lane that reach the hit line within the stated number of beats
    answer_hint_lane_hit_count: set "answer" to the integer count
    annotation_hint_lane_color_hit_count: set "annotation" to bounding boxes [x0, y0, x1, y1] around all notes in the specified lane with the specified color that reach the hit line within the stated number of beats
    answer_hint_lane_color_hit_count: set "answer" to the integer count
    annotation_hint_most_hits_lane_label: set "annotation" to bounding boxes [x0, y0, x1, y1] around the notes in the winning lane that reach the hit line within the stated number of beats
    answer_hint_most_hits_lane_label: set "answer" to the winning lane number as an integer
    annotation_hint_earliest_hit_lane_label: set "annotation" to one bounding box [x0, y0, x1, y1] around the note that reaches the hit line earliest
    answer_hint_earliest_hit_lane_label: set "answer" to the winning lane number as an integer
