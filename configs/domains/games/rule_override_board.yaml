generation:
  shared:
    query_id_weights:
      line_override_win_count: 1.0
      line_override_loss_count: 1.0
      piece_override_win_count: 1.0
      piece_override_loss_count: 1.0
    board_style_weights:
      classic: 1.0
      paper: 1.0
      chalkboard: 1.0
      arcade: 1.0
      wood: 1.0
    line_target_player_weights:
      X: 1.0
      O: 1.0
    piece_target_player_weights:
      Black: 1.0
      White: 1.0
    balanced_query_id_sampling: true
    balanced_board_style_sampling: true
    balanced_target_player_sampling: true
    balanced_board_count_sampling: true
    balanced_board_size_sampling: true
    balanced_target_answer_sampling: true
    board_count_support: [4, 5, 6]
    target_answer_support: [0, 1, 2, 3, 4, 5, 6]
    line_board_size_support: [3, 4]
    piece_board_size_support: [4, 5]
rendering:
  shared:
    canvas_width: 1040
    canvas_height: 760
    cell_size_px: 56
    board_gap_px: 22
    board_padding_px: 14
    board_label_height_px: 38
    content_margin_px: 56
    panel_radius_px: 18
    panel_border_width_px: 2
    board_border_width_px: 3
    grid_width_px: 3
    board_label_font_size_px: 20
    mark_font_size_px: 34
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.34
      rule_override_reasoning: 0.46
      output_burden: 0.20
prompt:
  shared:
    bundle_id: games_rule_override_board_v0
    scene_key: rule_override_board
    task_key: rule_override_query
    object_description_rule_override_board: several small labeled game boards
    line_rule_text: For the target player, making a full row, column, or diagonal loses; otherwise that player wins.
    piece_rule_text: For the target player, having fewer pieces than the other player wins; having more pieces loses.
    evidence_hint_line_override_win_count: set "evidence" to bounding boxes [x0,y0,x1,y1] around every counted mini-board where the target player wins under the stated rule; use [] if none
    answer_hint_line_override_win_count: set "answer" to the integer number of target-player wins
    evidence_hint_line_override_loss_count: set "evidence" to bounding boxes [x0,y0,x1,y1] around every counted mini-board where the target player loses under the stated rule; use [] if none
    answer_hint_line_override_loss_count: set "answer" to the integer number of target-player losses
    evidence_hint_piece_override_win_count: set "evidence" to bounding boxes [x0,y0,x1,y1] around every counted mini-board where the target player wins under the stated rule; use [] if none
    answer_hint_piece_override_win_count: set "answer" to the integer number of target-player wins
    evidence_hint_piece_override_loss_count: set "evidence" to bounding boxes [x0,y0,x1,y1] around every counted mini-board where the target player loses under the stated rule; use [] if none
    answer_hint_piece_override_loss_count: set "answer" to the integer number of target-player losses
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
