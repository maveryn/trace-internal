    task_key: sixteen_soldiers_query
    object_description_balanced_midgame: a Sixteen Soldiers board with red and blue pieces on points connected by drawn movement lines
    object_description_center_crossroads_midgame: a Sixteen Soldiers board with red and blue pieces on points connected by drawn movement lines
    object_description_triangle_wing_midgame: a Sixteen Soldiers board with red and blue pieces on points connected by drawn movement lines
    move_rule_text: A piece can move along one drawn line to an adjacent empty point.
    capture_rule_text: A capture is possible when the piece marked with an X can jump along one drawn straight line over an adjacent opponent piece and land on the empty point immediately beyond it.
    annotation_hint_marked_piece_destination_count: set "annotation" to [x, y] pixel points at the centers of every legal empty destination for the piece marked with an X; use an empty array if there are none
    answer_hint_marked_piece_destination_count: set "answer" to the number of legal adjacent destinations for the piece marked with an X
    annotation_hint_marked_piece_capture_count: set "annotation" to [x, y] pixel points at the centers of every opponent piece that the X-marked piece can capture immediately; use an empty array if there are none
    answer_hint_marked_piece_capture_count: set "answer" to the number of immediate captures available to the piece marked with an X
