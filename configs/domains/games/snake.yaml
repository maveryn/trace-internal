prompt:
  shared:
    bundle_id: games_snake_v0
    scene_key: visible_snake_grid
    task_key: snake_grid_query
    object_description_square_grid: a Snake game board with a yellow snake head, connected body cells, red food, and gray wall cells
    snake_rule_text: A move is safe when the head stays inside the board and does not enter the snake body or a gray wall cell. Moving onto red food counts as safe.
    shortest_food_path_rule_text: Treat the current body cells and gray wall cells as blocked while finding the shortest path to the food.
    planned_move_wall_annotation_rule_text: For a game-over result, use boxes around the visible in-board head path cells up to the hit cell or board edge.
    annotation_hint_safe_direction_count: set "annotation" to bounding boxes [x0, y0, x1, y1] around each destination cell that is safe for the next move; include the food cell if it is safely reachable
    answer_hint_safe_direction_count: set "answer" to the number of safe next-move directions as an integer
    annotation_hint_shortest_food_path_length: set "annotation" to bounding boxes [x0, y0, x1, y1] around the traversed cells after the head through the food cell on one shortest safe path
    answer_hint_shortest_food_path_length: set "answer" to the fewest number of moves needed to reach the food as an integer
    annotation_hint_path_result_option_label: set "annotation" to bounding boxes [x0, y0, x1, y1] around the in-board cells the head traverses until the result; for an off-board hit, use the visible path cells up to the board edge
    answer_hint_path_result_option_label: set "answer" to the option letter shown in the image, one of "A", "B", "C", or "D"
