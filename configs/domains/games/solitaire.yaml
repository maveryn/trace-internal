generation:
  shared:
    scene_variant_weights:
      klondike_tableau: 1.0
      freecell_tableau: 1.0
    style_variant_weights:
      panel_scene: 1.0
    balanced_scene_variant_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_answer_sampling: true
    balanced_option_count_sampling: true
    move_option_count_support:
    - 4
    - 5
    foundation_ready_target_answer_support:
    - 0
    - 1
    - 2
    - 3
    - 4
    tableau_sequence_target_answer_support:
    - 0
    - 1
    - 2
    - 3
    - 4
rendering:
  shared:
    canvas_width: 1060
    canvas_height: 820
    card_width_px: 74
    card_height_px: 104
    card_gap_px: 16
    column_gap_px: 18
    column_step_y_px: 32
    panel_margin_px: 44
    foundation_gap_px: 14
    card_corner_radius_px: 9
    rank_font_size_px: 18
    card_center_font_size_px: 31
    badge_font_size_px: 14
    label_font_size_px: 15
    option_font_size_px: 22
    option_height_px: 46
    option_gap_px: 10
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.28
      rule_reasoning: 0.42
      choice_or_count_load: 0.18
      output_burden: 0.12
prompt:
  shared:
    bundle_id: games_solitaire_v0
    scene_key: solitaire_tableau
    task_key: solitaire_tableau_query
    object_description_solitaire_tableau: a solitaire tableau with visible columns, foundation piles, and labeled exposed cards
    tableau_rule_text: In tableau moves, a card can be placed on another tableau card only if the target is exactly one rank higher and the opposite color.
    foundation_rule_text: A card can move to a foundation only if it matches that foundation suit and is exactly one rank above the foundation's current top card; an Ace can move to an empty foundation.
    evidence_hint_move_legality_label: set "evidence" to an array containing the selected move option box, the source card box, and the target card or foundation box
    evidence_hint_foundation_ready_count: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for the counted exposed cards and the foundation piles used to decide the count
    evidence_hint_tableau_sequence_count: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for the cards that belong to counted adjacent tableau pairs; use an empty array when the count is 0
    answer_hint_move_legality_label: set "answer" to only the visible move option letter, for example "C"
    answer_hint_foundation_ready_count: set "answer" to the number of exposed tableau cards that can move to a foundation pile now
    answer_hint_tableau_sequence_count: set "answer" to the number of adjacent visible card pairs in the same column where the lower card is exactly one rank lower than the card directly above it and has the opposite color
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
