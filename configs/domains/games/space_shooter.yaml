prompt:
  shared:
    bundle_id: games_space_shooter_v0
    scene_key: visible_space_shooter_playfield
    task_key: space_shooter_query
    object_description_defense_wave: a retro space-shooter playfield with labeled enemy ships, enemy shots, shields or asteroids, a player ship, and bottom lane pads
    space_shooter_lane_rule_text: Bottom lane pads define the vertical lanes. Enemy ships and enemy shots stay in their own lane.
    evidence_hint_clear_shot_count: set "evidence" to bounding boxes [x0, y0, x1, y1] for the enemy ships counted as clear shots
    answer_hint_clear_shot_count: set "answer" to the number of enemy ships that have no enemy ship, shield, or asteroid below them in the same lane
    evidence_hint_projectile_intercept_count: set "evidence" to bounding boxes [x0, y0, x1, y1] for enemy shots aligned with the player ship
    answer_hint_projectile_intercept_count: set "answer" to the number of enemy shots in the same lane as the player ship
    evidence_hint_highest_threat_label: set "evidence" to one bounding box [x0, y0, x1, y1] around the selected enemy ship
    answer_hint_highest_threat_label: set "answer" to the selected enemy label as a string
    evidence_hint_safe_lane_count: set "evidence" to bounding boxes [x0, y0, x1, y1] for the safe bottom lane pads
    answer_hint_safe_lane_count: set "answer" to the number of bottom lane pads with no enemy shot in that lane and no asteroid on that pad
