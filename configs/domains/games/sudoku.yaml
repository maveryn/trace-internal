generation:
  shared:
    scene_variant_weights:
      sparse_grid: 1.0
      filled_grid: 1.0
    query_variant_weights:
      marked_cell_value: 1.0
      marked_cell_candidate_count: 1.0
      unit_missing_digits_count: 1.0
      repeated_digit_count: 1.0
    unit_type_weights:
      row: 1.0
      column: 1.0
      box: 1.0
    style_variant_weights:
      classic: 1.0
      soft: 1.0
      outlined: 1.0
      notebook: 1.0
      slate: 1.0
      warm_paper: 1.0
    balanced_scene_variant_sampling: true
    balanced_query_variant_sampling: true
    balanced_unit_type_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_answer_sampling: true
    marked_cell_value_support:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 9
    marked_cell_candidate_count_support:
    - 1
    - 2
    - 3
    - 4
    - 5
    unit_missing_digits_count_support:
    - 2
    - 3
    - 4
    - 5
    - 6
    repeated_digit_count_support:
    - 1
    - 2
    - 3
    - 4
rendering:
  shared:
    canvas_width: 900
    canvas_height: 900
    panel_margin_px: 48
    max_board_size_px: 760
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
    board_border_width_px: 5
    grid_line_width_px: 2
    box_line_width_px: 5
    cell_padding_px: 5
    digit_font_size_px: 48
    marked_cell_outline_width_px: 7
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.28
      state_reasoning: 0.44
      ambiguity: 0.14
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_sudoku_v0
    scene_key: visible_sudoku_grid
    task_key: sudoku_grid_query
    object_description_sparse_grid: a partially filled Sudoku grid
    object_description_filled_grid: a more filled Sudoku grid
    sudoku_rule_text: Standard Sudoku rules require each row, column, and 3 by 3
      box to contain each digit 1 through 9 at most once.
    marked_cell_rule_text: The red outlined empty cell is the marked cell.
    highlighted_unit_rule_text: The blue highlighted cells mark the unit to inspect.
    unit_scope_text_row: the highlighted row
    unit_scope_text_column: the highlighted column
    unit_scope_text_box: the highlighted 3 by 3 box
    evidence_hint_marked_cell_value: set "evidence" to bounding boxes [x0, y0,
      x1, y1] for the marked cell and the visible filled cells in its row, column,
      and 3 by 3 box
    answer_hint_marked_cell_value: set "answer" to the digit that must go in the
      marked cell
    evidence_hint_marked_cell_candidate_count: set "evidence" to bounding boxes
      [x0, y0, x1, y1] for the marked cell and the visible filled cells in its
      row, column, and 3 by 3 box
    answer_hint_marked_cell_candidate_count: set "answer" to the number of digits
      from 1 through 9 that could legally go in the marked cell
    evidence_hint_unit_missing_digits_count: set "evidence" to bounding boxes [x0,
      y0, x1, y1] for the visible filled cells in the highlighted unit
    answer_hint_unit_missing_digits_count: set "answer" to the count of different
      digits missing from the highlighted unit
    evidence_hint_repeated_digit_count: set "evidence" to bounding boxes [x0, y0,
      x1, y1] for every cell in the highlighted unit whose digit appears more than
      once
    answer_hint_repeated_digit_count: set "answer" to the count of different digits
      that appear more than once in the highlighted unit
