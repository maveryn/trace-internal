complexity:
  shared:
    criteria_weights:
      visual_scan: 0.34
      movement_reasoning: 0.40
      ambiguity: 0.12
      output_burden: 0.14
prompt:
  shared:
    bundle_id: games_tower_draughts_board_v0
    scene_key: tower_draughts_board
    task_key: tower_draughts_board_query
    object_description: a tower-draughts-style board with stacks of red and black disks on alternating playable squares
    ownership_rule_text: A stack is controlled by the color of its top disk.
    movement_rule_text: Regular top disks move forward diagonally; crowned top disks move diagonally either direction.
    capture_rule_text: A stack captures by jumping diagonally over an adjacent opponent-controlled stack into the empty playable square immediately beyond it.
    annotation_hint_controlled_stack_count: set "annotation" to [x, y] pixel points at the centers of every stack controlled by the named color; use an empty array if there are none
    answer_hint_controlled_stack_count: set "answer" to the number of stacks controlled by the named color
    annotation_hint_marked_stack_destination_count: set "annotation" to [x, y] pixel points at the centers of every empty playable square the X-marked stack can move to; use an empty array if there are none
    answer_hint_marked_stack_destination_count: set "answer" to the number of legal destinations for the X-marked stack
    annotation_hint_marked_stack_capture_count: set "annotation" to [x, y] pixel points at the centers of every opponent-controlled stack the X-marked stack can capture; use an empty array if there are none
    answer_hint_marked_stack_capture_count: set "answer" to the number of immediate captures for the X-marked stack
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
