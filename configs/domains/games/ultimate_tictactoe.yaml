  shared:
    criteria_weights:
      visual_scan: 0.32
      game_reasoning: 0.42
      ambiguity: 0.14
      output_burden: 0.12
prompt:
  shared:
    bundle_id: games_ultimate_tictactoe_v0
    scene_key: ultimate_tictactoe_board
    task_key: ultimate_tictactoe_query
    object_description_ultimate_tictactoe_board: an Ultimate Tic-Tac-Toe board made of nine small Tic-Tac-Toe boards
    ultimate_tictactoe_status_rule_text: A small board is won by X or O when that player has three marks in a row inside that small board. A drawn small board is full and has no winner.
    ultimate_tictactoe_tactic_rule_text: Use only the highlighted small board. A winning move places the requested mark to make three in a row; a blocking move places a mark on the only cell that stops the opponent's immediate three-in-a-row threat.
    ultimate_tictactoe_macro_threat_rule_text: Count only open small boards where the requested player can win in one move. Already won or drawn small boards do not count.
    annotation_hint_x_won_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of all small boards won by X
    answer_hint_x_won_board_count: set "answer" to the number of small boards won by X
    annotation_hint_o_won_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of all small boards won by O
    answer_hint_o_won_board_count: set "answer" to the number of small boards won by O
    annotation_hint_neither_won_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of all small boards that neither player has won
    answer_hint_neither_won_board_count: set "answer" to the number of small boards that neither player has won
    annotation_hint_drawn_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of all drawn small boards
    answer_hint_drawn_board_count: set "answer" to the number of drawn small boards
    annotation_hint_x_winning_move_label: set "annotation" to an array containing [x0, y0, x1, y1] boxes for the selected empty-cell option and the two X cells that support the winning line
    answer_hint_x_winning_move_label: set "answer" to only the selected option letter
    annotation_hint_o_winning_move_label: set "annotation" to an array containing [x0, y0, x1, y1] boxes for the selected empty-cell option and the two O cells that support the winning line
    answer_hint_o_winning_move_label: set "answer" to only the selected option letter
    annotation_hint_x_blocking_move_label: set "annotation" to an array containing [x0, y0, x1, y1] boxes for the selected empty-cell option and the two O threat cells being blocked
    answer_hint_x_blocking_move_label: set "answer" to only the selected option letter
    annotation_hint_o_blocking_move_label: set "annotation" to an array containing [x0, y0, x1, y1] boxes for the selected empty-cell option and the two X threat cells being blocked
    answer_hint_o_blocking_move_label: set "answer" to only the selected option letter
    annotation_hint_x_immediate_win_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of every open small board where X can win in one move
    answer_hint_x_immediate_win_board_count: set "answer" to the number of open small boards where X can win in one move
    annotation_hint_o_immediate_win_board_count: set "annotation" to an array containing the [x0, y0, x1, y1] boxes of every open small board where O can win in one move
    answer_hint_o_immediate_win_board_count: set "answer" to the number of open small boards where O can win in one move
visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.9, 0.97]
      jpeg:
        quality: [78.0, 94.0]
      noise:
        alpha: [0.015, 0.045]
