    status_count_query_id_weights:
      x_won_board_count: 1.0
      o_won_board_count: 1.0
      neither_won_board_count: 1.0
      drawn_board_count: 1.0
    local_tactic_query_id_weights:
      x_winning_move_label: 1.0
      o_winning_move_label: 1.0
      x_blocking_move_label: 1.0
      o_blocking_move_label: 1.0
    macro_threat_query_id_weights:
      x_immediate_win_board_count: 1.0
      o_immediate_win_board_count: 1.0
    style_variant_weights:
      classic_grid: 1.0
      soft_marker: 1.0
      paper_grid: 1.0
      neon_board: 1.0
      tournament_board: 1.0
    balanced_query_id_sampling: true
    balanced_style_variant_sampling: true
    balanced_target_answer_sampling: true
    balanced_answer_option_sampling: true
    won_board_count_support: [1, 2, 3, 4]
    drawn_board_count_support: [1, 2, 3, 4]
    neither_won_board_count_support: [2, 3, 4, 5, 6]
    macro_threat_board_count_support: [0, 1, 2, 3, 4, 5]
    option_count_support: [4, 5, 6]
