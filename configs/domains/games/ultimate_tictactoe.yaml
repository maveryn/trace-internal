  shared:
    canvas_width: 820
    canvas_height: 820
    panel_margin_px: 42
    board_inner_margin_px: 48
    local_cell_size_px: 58
    local_gap_px: 3
    macro_gap_px: 10
    symbol_font_size_px: 33
    option_font_size_px: 18
    label_font_size_px: 18
