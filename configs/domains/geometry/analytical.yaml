prompt:
  shared:
    bundle_id: geometry_analytical_function_property_v0
  task_overrides:
    geometry_analytical_function_property_label_base:
      bundle_id: geometry_analytical_function_property_v0
      scene_key: analytical_function_property_grid
      task_key: analytical_function_property_query
      object_description: labeled coordinate-plane panels, each showing one relation
      annotation_hint_selected_panel_bbox: set "annotation" to a JSON array containing the selected panel bounding box as [x0,y0,x1,y1]
        in pixels
      answer_hint_option_letter: set "answer" to the single selected panel label as a capital letter shown in the image
      json_example: '{"annotation":[[40,40,310,320]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    geometry_analytical_intersection_property_label_base:
      bundle_id: geometry_analytical_intersection_property_v0
      scene_key: analytical_intersection_property_grid
      task_key: analytical_intersection_property_query
      object_description: labeled coordinate-plane panels, each showing two plotted objects
      annotation_hint_selected_panel_and_intersections: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] covering
        the selected panel and the visible intersection point box or boxes
      answer_hint_option_letter: set "answer" to the single selected panel label as a capital letter shown in the image
      json_example: '{"annotation":[[40,40,310,320],[156,168,170,182]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.2
      analytical_reasoning: 0.55
      ambiguity: 0.2
      output_burden: 0.05
