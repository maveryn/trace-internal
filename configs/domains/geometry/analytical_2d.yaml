prompt:
  shared:
    bundle_id: geometry_analytical_area_v1
    task_family_key: analytical_single_shape
    task_key: analytical_area_query
    object_description: a geometric shape with measurement annotations
    evidence_hint_measurement_map: set "evidence" to a JSON array of strings, each formatted as ANNOTATION=VALUE, covering the required annotations
    answer_hint_integer: set "answer" to the area value as an integer
    answer_hint_pi: set "answer" to the area value in the form kπ (for example 12π)
    json_example_integer: '{"evidence":["AB=8","CD=6"],"answer":24}'
    json_example_pi: '{"evidence":["AB=6","CD=4"],"answer":"24π"}'
    json_example_answer_only_integer: '{"answer":24}'
    json_example_answer_only_pi: '{"answer":"24π"}'
  task_overrides:
    task_geometry_analytical_2d_area:
      question_text_rectangle_explicit: The rectangle has two annotated side lengths. What is its area in square units?
      question_text_rectangle_derived: One side length and the diagonal of the rectangle are annotated. What is its area in square units?
      question_text_triangle_explicit: The right triangle has an annotated base and height. What is its area in square units?
      question_text_triangle_derived: A leg length and the hypotenuse of the right triangle are annotated. What is its area in square units?
      question_text_parallelogram_explicit: The parallelogram has an annotated base and height. What is its area in square units?
      question_text_parallelogram_derived: The parallelogram shows a base, one side length, and the horizontal offset. What is its area in square units?
      question_text_trapezoid_explicit: The trapezoid has annotated base lengths and height. What is its area in square units?
      question_text_trapezoid_derived: The isosceles trapezoid shows both bases and one leg length. What is its area in square units?
      question_text_rhombus_explicit: The rhombus has both diagonals annotated. What is its area in square units?
      question_text_rhombus_derived: One side length and one diagonal of the rhombus are annotated. What is its area in square units?
      question_text_circle_explicit: The circle has an annotated radius. What is its area? Express the result in kπ form.
      question_text_circle_derived: The circle has an annotated diameter. What is its area? Express the result in kπ form.
      question_text_ellipse_explicit: The ellipse has annotated semimajor and semiminor axes. What is its area? Express the result in kπ form.
      question_text_ellipse_derived: The ellipse shows the semimajor axis and focal distance. What is its area? Express the result in kπ form.
      json_example_rectangle_explicit: '{"evidence":{"AB":6,"CD":4},"answer":24}'
      json_example_rectangle_derived: '{"evidence":{"AB":3,"CD":5},"answer":12}'
      json_example_triangle_explicit: '{"evidence":{"AB":4,"CD":6},"answer":12}'
      json_example_triangle_derived: '{"evidence":{"AB":6,"CD":10},"answer":24}'
      json_example_parallelogram_explicit: '{"evidence":{"AB":6,"CD":5},"answer":30}'
      json_example_parallelogram_derived: '{"evidence":{"AB":8,"CD":5,"EF":3},"answer":32}'
      json_example_trapezoid_explicit: '{"evidence":{"AB":10,"CD":6,"EF":4},"answer":32}'
      json_example_trapezoid_derived: '{"evidence":{"AB":9,"CD":3,"EF":5},"answer":30}'
      json_example_rhombus_explicit: '{"evidence":{"AB":10,"CD":6},"answer":30}'
      json_example_rhombus_derived: '{"evidence":{"AB":5,"CD":8},"answer":24}'
      json_example_circle_explicit: '{"evidence":{"AB":4},"answer":"16π"}'
      json_example_circle_derived: '{"evidence":{"AB":8},"answer":"16π"}'
      json_example_ellipse_explicit: '{"evidence":{"AB":6,"CD":4},"answer":"24π"}'
      json_example_ellipse_derived: '{"evidence":{"AB":5,"CD":3},"answer":"20π"}'
    task_geometry_analytical_2d_length:
      bundle_id: geometry_analytical_length_v1
      task_family_key: analytical_length_scene
      task_key: analytical_length_query
      object_description: a geometric scene with measurement annotations
      answer_hint_number: set "answer" to the length value rounded to one decimal place
      question_text_triangle_altitude_side: The triangle includes an altitude to the base. What is the length of segment {target_annotation}?
      question_text_rectangle_diagonal_side: The rectangle shows one side and its diagonal. What is the length of segment {target_annotation}?
      question_text_rhombus_diagonal_side: The rhombus shows both diagonals. What is the length of segment {target_annotation}?
      question_text_isosceles_trapezoid_leg: The isosceles trapezoid shows both bases and a height. What is the length of segment {target_annotation}?
      question_text_inscribed_square_side: The square is inscribed in the circle, and a diameter is annotated. What is the length of segment {target_annotation}?
      question_text_circle_chord_length: The circle shows a chord and the perpendicular distance from the center to that chord. What is the length of segment {target_annotation}?
    task_geometry_analytical_2d_perimeter:
      bundle_id: geometry_analytical_perimeter_v1
      task_family_key: analytical_perimeter_scene
      task_key: analytical_perimeter_query
      object_description: a geometric scene with measurement annotations
      answer_hint_number: set "answer" to the perimeter value rounded to one decimal place
      question_text_right_triangle_leg_hypotenuse: The right triangle shows one leg and the hypotenuse. What is the perimeter of the triangle?
      question_text_rectangle_side_diagonal: The rectangle shows one side and its diagonal. What is the perimeter of the rectangle?
      question_text_rhombus_diagonals: The rhombus shows both diagonals. What is the perimeter of the rhombus?
      question_text_isosceles_trapezoid_bases_height: The isosceles trapezoid shows both bases and a height. What is the perimeter of the trapezoid?
      question_text_inscribed_square_diameter: The square is inscribed in the circle, and a diameter is annotated. What is the perimeter of the square?
    task_geometry_analytical_2d_composite_area:
      bundle_id: geometry_analytical_composite_area_v1
      task_family_key: analytical_composite_area_scene
      task_key: analytical_composite_area_query
      object_description: a shaded composite geometric region with measurement annotations
      question_text_rectangle_inner_cutout: The shaded region is an outer rectangle with one inner rectangular cutout. What is the area of the shaded region in square units?
      question_text_rectangle_triangle_cutout: The shaded region is a rectangle with one triangular corner cut out. What is the area of the shaded region in square units?
      question_text_rectangle_triangle_union: The shaded figure is a rectangle with a triangular roof attached. What is the area of the shaded region in square units?
      question_text_l_shape_cutout: The shaded figure is an L-shaped region formed from a rectangle with one corner removed. What is the area of the shaded region in square units?
      question_text_step_rectangles_union: The shaded figure is a step-shaped union of two rectangles. What is the area of the shaded region in square units?

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.20
      analytical_reasoning: 0.55
      ambiguity: 0.20
      output_burden: 0.05
