generation:
  shared:
    answer_min: 8
    answer_max: 200000
    dimension_min: 5
    dimension_max: 50
    radius_min: 5
    radius_max: 50
    sphere_radius_min: 5
    sphere_radius_max: 50
  task_overrides:
    task_geometry_analytical_3d_value:
      query_variant_weights:
        volume: 1.0
        surface_area: 1.0
      scene_variant_weights:
        rectangular_prism: 1.0
        triangular_prism: 1.0
        square_pyramid: 1.0
        cylinder: 1.0
        cone: 1.0
        sphere: 1.0
      balanced_query_variant_sampling: true
      balanced_scene_variant_sampling: true
    task_geometry_analytical_3d_volume:
      variant_weights:
        rectangular_prism_given_lwh: 1.0
        triangular_prism_given_b_h_l: 1.0
        square_pyramid_given_base_height: 1.0
        cylinder_given_r_h: 1.0
        cone_given_r_h: 1.0
        sphere_given_r: 1.0
      balanced_variant_sampling: true
    task_geometry_analytical_3d_surface_area:
      variant_weights:
        rectangular_prism_given_lwh: 1.0
        triangular_prism_given_a_b_c_l: 1.0
        square_pyramid_given_base_side_slant_height: 1.0
        cylinder_given_r_h: 1.0
        cone_given_r_slant_height: 1.0
        sphere_given_r: 1.0
      balanced_variant_sampling: true

rendering:
  shared:
    graph_cells_min: 6
    graph_cells_max: 12
    line_width: 4
    line_width_min: 2
    line_width_max: 6
    helper_line_width: 2
    helper_line_width_min: 1
    helper_line_width_max: 4
    label_offset_px: 14
    label_font_size_min: 14
    label_font_size_max: 30
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 2

visual:
  background:
    enabled: true
    styles:
      solid_offwhite:
        kind: solid
        color: [252, 252, 252]
      solid_cool:
        kind: solid
        color: [246, 248, 252]
      solid_warm:
        kind: solid
        color: [252, 249, 245]
    weights:
      graph_paper: 0.0
      solid_offwhite: 0.5
      solid_cool: 0.25
      solid_warm: 0.25

prompt:
  shared:
    object_description: an annotated 3D solid
    task_family_key: analytical_single_solid
    evidence_hint_measurement_map: set "evidence" to a JSON array of strings, each formatted as ANNOTATION=VALUE, covering the required annotations
    answer_hint_integer: set "answer" to the value as an integer
    answer_hint_pi: set "answer" to the value in the form kπ (for example 12π)
    json_example_integer: '{"evidence":["AB=4","CD=3"],"answer":12}'
    json_example_pi: '{"evidence":["AB=3","CD=4"],"answer":"12π"}'
    json_example_answer_only_integer: '{"answer":24}'
    json_example_answer_only_pi: '{"answer":"24π"}'
  task_overrides:
    task_geometry_analytical_3d_volume:
      bundle_id: geometry_analytical_volume_v1
      task_key: analytical_volume_query
      question_text_rectangular_prism_given_lwh: The rectangular prism has annotated length, width, and height. What is its volume in cubic units?
      question_text_triangular_prism_given_b_h_l: The triangular prism has an annotated triangle base, triangle height, and prism length. What is its volume in cubic units?
      question_text_square_pyramid_given_base_height: The square pyramid has an annotated base side and vertical height. What is its volume in cubic units?
      question_text_cylinder_given_r_h: The cylinder has an annotated radius and height. What is its volume? Express the result in kπ form.
      question_text_cone_given_r_h: The cone has an annotated radius and height. What is its volume? Express the result in kπ form.
      question_text_sphere_given_r: The sphere has an annotated radius. What is its volume? Express the result in kπ form.
    task_geometry_analytical_3d_surface_area:
      bundle_id: geometry_analytical_surface_area_v1
      task_key: analytical_surface_area_query
      question_text_rectangular_prism_given_lwh: The rectangular prism has annotated length, width, and height. What is its total surface area in square units?
      question_text_triangular_prism_given_a_b_c_l: The triangular prism has annotated side lengths for the triangular base and an annotated prism length. What is its total surface area in square units?
      question_text_square_pyramid_given_base_side_slant_height: The square pyramid has an annotated base side and slant height. What is its total surface area in square units?
      question_text_cylinder_given_r_h: The cylinder has an annotated radius and height. What is its total surface area? Express the result in kπ form.
      question_text_cone_given_r_slant_height: The cone has an annotated radius and slant height. What is its total surface area? Express the result in kπ form.
      question_text_sphere_given_r: The sphere has an annotated radius. What is its total surface area? Express the result in kπ form.

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.20
      analytical_reasoning: 0.55
      ambiguity: 0.20
      output_burden: 0.05
