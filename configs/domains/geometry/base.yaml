rendering:
  shared:
    canvas_size_min: 512
    canvas_size_max: 768
    graph_cells_min: 12
    graph_cells_max: 24
    shape_color_mode: rgb_constrained
    shape_include_white_anchor: true
    shape_include_black_anchor: false
    shape_line_channel_min: 12
    shape_line_channel_max: 172
    shape_label_stroke_min_distance: 36.0
    shape_line_gray_min: 10
    shape_line_gray_max: 28
    shape_label_gray_min: 14
    shape_label_gray_max: 36
    shape_label_stroke_gray_min: 248
    shape_label_stroke_gray_max: 255

visual:
  background:
    enabled: true
    styles:
      graph_paper:
        kind: grid
        base_color: [255, 255, 255]
        line_color: [224, 229, 236]
        spacing: 24
        outer_margin_px: 16
        line_width: 1
        major_every: 0
        major_line_color: [202, 209, 220]
        major_line_width: 1
        axis_enabled: true
        axis_color: [118, 128, 146]
        axis_line_width: 2
        axis_arrows_enabled: true
        axis_arrow_size: 10
        center_point_enabled: true
        center_point_color: [102, 112, 130]
        center_point_radius: 2
        color_variation_enabled: true
        base_color_jitter: [0, 0]
        line_color_jitter: [-5, 5]
        major_line_darken_range: [6, 14]
        axis_darken_range: [32, 48]
        center_point_darken_extra_range: [8, 14]
        origin_label_darken_extra_range: [6, 12]
        axis_scale_labels_enabled: true
        axis_scale_label_max_abs: 0
        origin_label_enabled: false
        origin_label_text: "0"
        origin_label_color: [88, 98, 116]
        supersample_scale: 1
        scene_supersample_scale: 3
    weights:
      graph_paper: 1.0
  noise:
    apply_prob: 0.5
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.15, 0.4]
      downsample:
        scale: [0.92, 0.97]
      jpeg:
        quality: [82, 94]
      noise:
        alpha: [0.01, 0.04]

prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.40
      ambiguity: 0.35
      output_burden: 0.25
