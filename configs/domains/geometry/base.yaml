rendering:
  shared:
    canvas_size_min: 512
    canvas_size_max: 1024
    graph_cells_min: 12
    graph_cells_max: 24

visual:
  background:
    enabled: true
    styles:
      graph_paper:
        kind: grid
        base_color: [255, 255, 255]
        line_color: [232, 236, 242]
        spacing: 24
        line_width: 1
        major_every: 0
        major_line_color: [214, 220, 230]
        major_line_width: 1
        axis_enabled: true
        axis_color: [176, 184, 198]
        axis_line_width: 2
        center_point_enabled: true
        center_point_color: [126, 134, 148]
        center_point_radius: 2
        supersample_scale: 1
        scene_supersample_scale: 3
    weights:
      graph_paper: 1.0
  noise:
    apply_prob: 0.5
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
