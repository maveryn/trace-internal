rendering:
  shared:
    canvas_size_min: 720
    canvas_size_max: 820
    scene_supersample_scale: 1
    outer_margin_px: 78
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    circle_line_width: 4
    point_radius_px: 5
    label_font_size_min: 19
    label_font_size_max: 25
    measurement_font_size_min: 17
    measurement_font_size_max: 23
    measurement_label_offset_px: 38
    point_label_offset_px: 36

visual:
  background:
    enabled: true
    styles:
      solid_offwhite:
        kind: solid
        color: [252, 252, 252]
      solid_cool:
        kind: solid
        color: [245, 248, 252]
      solid_warm:
        kind: solid
        color: [252, 248, 243]
      solid_mist:
        kind: solid
        color: [248, 252, 249]
      solid_lavender:
        kind: solid
        color: [250, 248, 253]
    weights:
      graph_paper: 0.0
      solid_offwhite: 0.35
      solid_cool: 0.2
      solid_warm: 0.2
      solid_mist: 0.15
      solid_lavender: 0.1

prompt:
  shared:
    bundle_id: geometry_circle_theorem_v0
    scene_key: circle_theorem_scene
    task_key: circle_theorem_query
    object_description: labeled points and measurement annotations
    answer_hint_integer: set "answer" to the requested value as an integer
    evidence_hint_measurement_tokens: set "evidence" to a JSON array of bounding boxes [x0,y0,x1,y1] around only the visible measurement labels needed to compute the answer; do not include unrelated measurements, point labels, or the unknown target label

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.20
      theorem_reasoning: 0.45
      ambiguity: 0.20
      output_burden: 0.15
