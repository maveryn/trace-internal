prompt:
  shared:
    bundle_id: geometry_circle_theorem_v0
    scene_key: circle_theorem_scene
    task_key: circle_theorem_query
    object_description: labeled points and measurement readouts
    object_description_chord_length: labeled points, a radius label, a chord, and an angle mark
    object_description_tangent_radius: labeled center, tangent point, exterior point, a right-angle marker, and measurement readouts
    answer_hint_integer: set "answer" to the requested value as an integer
    answer_hint_number: set "answer" to the requested chord length as a number rounded to one decimal place
    answer_hint_tangent_radius_number: set "answer" to the requested length as a number rounded to one decimal place
    annotation_hint_circle_points: 'set "annotation" to a JSON object with exactly these visible point-label keys: {annotation_point_keys};
      each value must be that label''s pixel point [x,y]'
    annotation_hint_chord_length_points: 'set "annotation" to a JSON object with exactly these role keys: {annotation_keys};
      each value must be the role''s pixel point [x,y]'
    annotation_hint_tangent_radius_points: 'set "annotation" to a JSON object with exactly these role keys: {annotation_keys};
      each value must be the role''s pixel point [x,y]'
