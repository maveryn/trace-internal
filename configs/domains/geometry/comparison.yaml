generation:
  shared:
    object_count_min: 4
    object_count_max: 9
    balanced_sampling: true
    min_normalized_gap: 0.2
  task_overrides:
    geometry_comparison_value_base:
      query_id_weights:
        angle_extremum: 1.0
        length_extremum: 1.0
        area_extremum: 1.0
        perimeter_extremum: 1.0
      extremum_direction_weights:
        largest: 1.0
        smallest: 1.0
      scene_variant_weights:
        angle: 1.0
        segment: 1.0
        rectangle: 1.0
        triangle: 1.0
      balanced_query_id_sampling: true
      balanced_extremum_direction_sampling: true
      balanced_scene_variant_sampling: true
    source_geometry_comparison_angle:
      min_angle: 30
      max_angle: 150
      angle_step: 1
      max_catalog_quantization_error_degrees: 2.0
      max_abs_vector_component: 8
      min_ray_length_units: 2.0
      min_absolute_gap_degrees: 10.0
      query_type_weights:
        largest: 1.0
        smallest: 1.0
      object_count_weights:
        '4': 1.0
        '6': 1.0
        '9': 1.0
    source_geometry_comparison_area:
      min_rectangle_width: 2
      max_rectangle_width: 6
      min_rectangle_height: 2
      max_rectangle_height: 6
      min_triangle_base: 2
      max_triangle_base: 6
      min_triangle_height: 2
      max_triangle_height: 6
      min_absolute_gap_square_units: 6.0
      min_absolute_triangle_area_gap_square_units: 4.0
      query_type_weights:
        largest: 1.0
        smallest: 1.0
      object_count_weights:
        '4': 1.0
        '6': 1.0
        '9': 1.0
    source_geometry_comparison_perimeter:
      min_rectangle_width: 2
      max_rectangle_width: 6
      min_rectangle_height: 2
      max_rectangle_height: 6
      min_triangle_base: 2
      max_triangle_base: 6
      min_triangle_height: 2
      max_triangle_height: 6
      min_absolute_gap_units: 4.0
      min_absolute_triangle_perimeter_gap_units: 3.0
      query_type_weights:
        largest: 1.0
        smallest: 1.0
      object_count_weights:
        '4': 1.0
        '6': 1.0
        '9': 1.0
    source_geometry_comparison_length:
      min_segment_length: 2
      max_segment_length: 10
      max_abs_vector_component: 10
      min_absolute_gap_units: 2.0
      query_type_weights:
        largest: 1.0
        smallest: 1.0
      object_count_weights:
        '4': 1.0
        '6': 1.0
        '9': 1.0
rendering:
  shared:
    graph_cells_min: 24
    graph_cells_max: 30
    line_width: 4
    line_width_min: 2
    line_width_max: 5
    label_offset_px: 14
    object_label_offset_px: 14
    label_font_size_min: 14
    label_font_size_max: 30
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 1
prompt:
  shared:
    bundle_id: geometry_comparison_v0
    scene_key: comparison_graph_scene
    task_key: comparison_query
  task_overrides:
    source_geometry_comparison_angle:
      object_description: several labeled angles
      question_text_largest: Which labeled angle has the greatest measure?
      question_text_smallest: Which labeled angle has the smallest measure?
      annotation_hint: 'set "annotation" to an array of exactly three pixel points [x,y] for the winning angle: the vertex and
        the two ray endpoints'
      answer_hint: set "answer" to the single-letter label of the correct angle
    source_geometry_comparison_area:
      object_description: several labeled rectangles
      object_description_triangle: several labeled triangles
      question_text_largest: Which labeled rectangle has the greatest area?
      question_text_smallest: Which labeled rectangle has the smallest area?
      question_text_largest_triangle: Which labeled triangle has the greatest area?
      question_text_smallest_triangle: Which labeled triangle has the smallest area?
      annotation_hint: set "annotation" to an array of exactly four pixel points [x,y] for the winning rectangle vertices
      annotation_hint_triangle: set "annotation" to an array of exactly three pixel points [x,y] for the winning triangle vertices
      answer_hint: set "answer" to the single-letter label of the correct rectangle
      answer_hint_triangle: set "answer" to the single-letter label of the correct triangle
    source_geometry_comparison_perimeter:
      object_description: several labeled rectangles
      object_description_triangle: several labeled triangles
      question_text_largest: Which labeled rectangle has the greatest perimeter?
      question_text_smallest: Which labeled rectangle has the smallest perimeter?
      question_text_largest_triangle: Which labeled triangle has the greatest perimeter?
      question_text_smallest_triangle: Which labeled triangle has the smallest perimeter?
      annotation_hint: set "annotation" to an array of exactly four pixel points [x,y] for the winning rectangle vertices
      annotation_hint_triangle: set "annotation" to an array of exactly three pixel points [x,y] for the winning triangle vertices
      answer_hint: set "answer" to the single-letter label of the correct rectangle
      answer_hint_triangle: set "answer" to the single-letter label of the correct triangle
    source_geometry_comparison_length:
      object_description: several labeled line segments
      question_text_largest: Which labeled segment is the longest?
      question_text_smallest: Which labeled segment is the shortest?
      annotation_hint: set "annotation" to an array of exactly two pixel points [x,y] for the winning segment endpoints
      answer_hint: set "answer" to the single-letter label of the correct segment
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.25
      comparison_reasoning: 0.35
      ambiguity: 0.35
      output_burden: 0.05
