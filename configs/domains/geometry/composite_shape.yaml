prompt:
  shared:
    bundle_id: geometry_measurement_v0
    scene_key: measurement_single_object
    task_key: measurement_query
    object_description_segment: a labeled line segment
    object_description_polygon: a polygon
    object_description_ellipse: an ellipse
    object_description_circle: a circle
    annotation_hint_point_map: set "annotation" to a JSON object mapping each required
      label to one pixel point [x,y]
    annotation_hint_segment: provide exactly two labels for the measured segment endpoints
    annotation_hint_polygon_side: provide exactly two labels for the measured polygon
      side endpoints
    annotation_hint_circle_center: provide exactly one label for the circle center
      point
    annotation_hint_ellipse_axis: provide exactly two labels for the measured ellipse-axis
      endpoints
    answer_hint_integer: set "answer" to the measurement value as an integer
    answer_hint_pi: set "answer" to the measurement value in the form kπ (for example
      12π)
    json_example_integer: '{"annotation":{"A":[120,180],"B":[260,180]},"answer":4}'
    json_example_pi: '{"annotation":{"A":[160,220],"B":[280,220]},"answer":"6π"}'
    json_example_answer_only_integer: '{"answer":8}'
    json_example_answer_only_pi: '{"answer":"12π"}'
  task_overrides:
    task_geometry__composite_shape__l_profile_area:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: rectilinear_composite_scene
      task_key: analytical_measurement_value_query
      object_description: a labeled straight-edged composite shape with measurement
        labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__composite_shape__rectangle_triangle_cutout_area:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: rectilinear_composite_scene
      task_key: analytical_measurement_value_query
      object_description: a labeled straight-edged composite shape with measurement
        labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__composite_shape__house_outline_perimeter:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: rectilinear_composite_scene
      task_key: analytical_measurement_value_query
      object_description: a labeled straight-edged composite shape with measurement
        labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__composite_shape__tabbed_rectilinear_perimeter:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: rectilinear_composite_scene
      task_key: analytical_measurement_value_query
      object_description: a labeled straight-edged composite shape with measurement
        labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__composite_shape__rectangle_quarter_sector_cutout_area:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
      object_description: a labeled shaded composite shape with straight and curved
        boundaries plus measurement labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the requested value rounded to one decimal
        place
      json_example: '{"annotation":{"A":[120,180],"B":[260,180],"C":[260,300],"D":[120,300],"E":[210,180],"F":[260,230]},"answer":42.5}'
      json_example_answer_only: '{"answer":42.5}'
    task_geometry__composite_shape__rectangle_semicircle_area:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
      object_description: a labeled shaded composite shape with straight and curved
        boundaries plus measurement labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the requested value rounded to one decimal
        place
      json_example: '{"annotation":{"A":[120,180],"B":[260,180],"C":[260,300],"D":[120,300],"O":[260,240]},"answer":42.5}'
      json_example_answer_only: '{"answer":42.5}'
    task_geometry__composite_shape__rectangle_quarter_sector_cutout_perimeter:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
      object_description: a labeled shaded composite shape with straight sides, a
        highlighted circular boundary, and measurement labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the requested value rounded to one decimal
        place
      json_example: '{"annotation":{"A":[120,180],"B":[260,180],"C":[260,300],"D":[120,300],"E":[210,180],"F":[260,230]},"answer":31.4}'
      json_example_answer_only: '{"answer":31.4}'
    task_geometry__composite_shape__rectangle_semicircle_perimeter:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
      object_description: a labeled shaded composite shape with straight sides, a
        highlighted circular boundary, and measurement labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the requested value rounded to one decimal
        place
      json_example: '{"annotation":{"A":[120,180],"B":[260,180],"C":[260,300],"D":[120,300],"O":[260,240]},"answer":31.4}'
      json_example_answer_only: '{"answer":31.4}'
    task_geometry__composite_shape__missing_width_from_semicircle_area:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
      object_description: a labeled shaded composite shape with one side marked by
        a question mark and enough labels to compute it
      annotation_hint: 'set "annotation" to a JSON object with exactly these visible
        point-label keys: {annotation_keys}; each value must be that labeled point''s
        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the missing side length rounded to one decimal
        place
      json_example: '{"annotation":{"A":[120,180],"B":[260,180],"C":[260,300],"D":[120,300],"O":[260,240]},"answer":12.0}'
      json_example_answer_only: '{"answer":12.0}'
    task_geometry__composite_shape__sector_angle_value:
      bundle_id: geometry_curvilinear_composite_v0
      scene_key: curvilinear_composite_scene
      task_key: curvilinear_value_query
