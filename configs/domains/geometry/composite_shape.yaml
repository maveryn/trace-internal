        pixel coordinate [x,y]'
      answer_hint_number: set "answer" to the angle measure in degrees rounded to
        one decimal place
      json_example: '{"annotation":{"O":[190,220],"A":[90,320],"B":[310,320]},"answer":90.0}'
      json_example_answer_only: '{"answer":90.0}'
