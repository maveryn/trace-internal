generation:
  shared:
    segment_candidate_count: 6
    segment_endpoint_abs_max: 8
    segment_half_vectors:
      - [3, 0]
      - [0, 3]
      - [3, 1]
      - [1, 3]
      - [3, -1]
      - [1, -3]
      - [2, 2]
      - [2, -2]
    segment_target_support: [0, 1, 2, 3, 4, 5, 6]
    collinear_candidate_count: 8
    collinear_point_abs_max: 8
    collinear_direction_vectors:
      - [1, 0]
      - [0, 1]
      - [1, 1]
      - [1, -1]
      - [2, 1]
      - [1, 2]
      - [2, -1]
      - [1, -2]
    collinear_target_support: [0, 1, 2, 3, 4, 5, 6]
    quadrant_reference_label: "A"
    quadrant_candidate_labels: ["B", "C", "D", "E", "F", "G", "H", "I"]
    same_quadrant_target_support: [0, 1, 2, 3, 4, 5, 6]
    point_in_shape_target_support: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  task_overrides:
    task_geometry_coordinate_relation:
      scene_variant_weights:
        segment_set: 1.0
        line_points: 1.0
        quadrant_points: 1.0
        polygon_lattice: 1.0
      query_variant_weights:
        parallel_count: 1.0
        perpendicular_count: 1.0
        collinear_count: 1.0
        same_quadrant_count: 1.0
        point_in_shape_count: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true

rendering:
  shared:
    canvas_size_min: 640
    canvas_size_max: 720
    graph_cells_min: 18
    graph_cells_max: 20
    segment_canvas_size_min: 640
    segment_canvas_size_max: 720
    segment_graph_cells_min: 20
    segment_graph_cells_max: 20
    segment_graph_origin_fraction_x: 0.50
    segment_graph_origin_fraction_y: 0.50
    collinear_canvas_size_min: 640
    collinear_canvas_size_max: 700
    collinear_graph_cells_min: 20
    collinear_graph_cells_max: 20
    collinear_point_radius_scale: 1.4
    quadrant_canvas_size_min: 640
    quadrant_canvas_size_max: 700
    quadrant_graph_cells_min: 20
    quadrant_graph_cells_max: 20
    quadrant_point_radius_scale: 1.5
    quadrant_reference_cross_scale: 2.6
    polygon_canvas_size_min: 640
    polygon_canvas_size_max: 700
    polygon_graph_cells_min: 20
    polygon_graph_cells_max: 20
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    point_radius_px: 4
    point_radius_px_min: 3
    point_radius_px_max: 5
    label_font_size_min: 16
    label_font_size_max: 28
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 2
    label_offset_px: 14

prompt:
  shared:
    bundle_id: geometry_coordinate_v1
    task_family_key: coordinate_graph_scene
    task_key: coordinate_query
    object_description_segment_set: target segment AB and six other unlabeled segments
    object_description_line_points: labeled points A and B plus unlabeled dot points
    object_description_quadrant_points: one X-marked reference point and unlabeled dot points
    object_description_polygon_lattice: one polygon drawn on graph paper
    evidence_hint_segment_endpoints: 'set "evidence" to an array of every graph-paper point coordinate [x, y] that is an endpoint of a segment satisfying the question'
    evidence_hint_collinear_graph_point_set: 'set "evidence" to an array of every graph-paper point coordinate [x, y] for the dot points that lie on the same line as A and B'
    evidence_hint_quadrant_graph_point_set: 'set "evidence" to an array of every graph-paper point coordinate [x, y] that lies in the same quadrant as the marked point'
    evidence_hint_graph_point_set: 'set "evidence" to an array of every integer graph-paper point [x, y] that lies strictly inside the polygon'
    answer_hint_integer: 'set "answer" to the integer count requested by the question'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.25
      coordinate_reasoning: 0.35
      ambiguity: 0.25
      output_burden: 0.15
