prompt:
  shared:
    bundle_id: geometry_coordinate_v0
    scene_key: coordinate_graph_scene
    task_key: coordinate_query
    object_description_segment_set: reference segment AB and six other unlabeled segments
    object_description_line_points: labeled points A and B plus unlabeled dot points
    object_description_quadrant_points: one X-marked reference point and unlabeled dot points
    object_description_polygon_lattice: one polygon drawn on graph paper
    annotation_hint_segment_endpoints: set "annotation" to an array containing both endpoint pixel points [x,y] for each non-AB
      segment satisfying the question
    annotation_hint_collinear_pixel_point_set: set "annotation" to an array of every pixel point [x,y] for the dot points that
      lie on the same line as A and B
    annotation_hint_quadrant_pixel_point_set: set "annotation" to an array of every pixel point [x,y] that lies in the same quadrant
      as the marked point
    annotation_hint_pixel_point_set: set "annotation" to an array containing every pixel point [x,y] for each integer lattice
      point that lies strictly inside the polygon
    answer_hint_integer: set "answer" to the integer count requested by the question
    json_example_segment_count: '{"annotation":[[120,120],[180,120],[240,180],[300,180]],"answer":2}'
    json_example_segment_count_answer_only: '{"answer":2}'
  task_overrides:
    task_geometry__coordinate_plane__quadrilateral_completion_label:
      bundle_id: geometry_coordinate_quadrilateral_v0
      scene_key: coordinate_quadrilateral_candidate_scene
      task_key: coordinate_quadrilateral_query
      object_description: a coordinate grid with three unlabeled points and lettered candidate points
      annotation_hint_candidate_point: set "annotation" to an array containing exactly one pixel point [x,y] at the center of
        the selected candidate point
      answer_hint_option_letter: set "answer" to the selected candidate letter as a capital letter
      json_example: '{"annotation":[[420,344]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_geometry__coordinate_panels__quadrilateral_shape_match_label:
      bundle_id: geometry_coordinate_quadrilateral_v0
      scene_key: coordinate_panels_scene
      task_key: coordinate_quadrilateral_query
      object_description: labeled coordinate panels, each containing four unlabeled points
      annotation_hint_selected_panel_bbox: set "annotation" to an array containing exactly one bounding box [x0,y0,x1,y1] around
        the selected panel
      answer_hint_option_letter: set "answer" to the selected panel label as a capital letter
      json_example: '{"annotation":[[361,32,661,344]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_geometry__coordinate_plane__missing_endpoint_label:
      bundle_id: geometry_coordinate_algebra_v0
      scene_key: coordinate_algebra_midpoint_scene
      task_key: coordinate_algebra_query
      object_description: a coordinate grid with a labeled endpoint, labeled midpoint, and lettered candidate points
      annotation_hint_candidate_point: set "annotation" to an array containing exactly one pixel point [x,y] at the center of
        the selected candidate point
      answer_hint_option_letter: set "answer" to the selected candidate letter as a capital letter
      json_example: '{"annotation":[[420,344]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_geometry__coordinate_plane__section_point_label:
      bundle_id: geometry_coordinate_algebra_v0
      scene_key: coordinate_algebra_section_scene
      task_key: coordinate_algebra_query
      object_description: a coordinate grid with segment PQ and lettered candidate section points
      annotation_hint_candidate_point: set "annotation" to an array containing exactly one pixel point [x,y] at the center of
        the selected candidate point
      answer_hint_option_letter: set "answer" to the selected candidate letter as a capital letter
      json_example: '{"annotation":[[420,344]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_geometry__coordinate_plane__locus_point_label:
      bundle_id: geometry_coordinate_locus_v0
      scene_key: coordinate_locus_candidate_scene
      task_key: coordinate_locus_query
      object_description: a coordinate grid with one shaded locus region and lettered candidate points
      annotation_hint_candidate_point: set "annotation" to an array containing exactly one pixel point [x,y] at the center of
        the selected candidate point
      answer_hint_option_letter: set "answer" to the selected candidate letter as a capital letter
