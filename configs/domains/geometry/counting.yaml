prompt:
  shared:
    bundle_id: geometry_counting_v0
    scene_key: counting_scene
    task_key: counting_query
  task_overrides:
    source_geometry_counting_angle:
      object_description: several angles
      question_text_acute_angle: How many angles are acute angles?
      question_text_right_angle: How many angles are right angles?
      question_text_obtuse_angle: How many angles are obtuse angles?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] around all angles that match the requested
        type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[120,180,210,260],[320,220,410,300]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    source_geometry_counting_triangle:
      object_description: several triangles
      question_text_equilateral_triangle: How many triangles are equilateral triangles?
      question_text_isosceles_triangle: How many triangles are isosceles triangles but not equilateral triangles?
      question_text_scalene_triangle: How many triangles are scalene triangles?
      question_text_right_triangle: How many triangles are right triangles?
      question_text_acute_triangle: How many triangles are acute triangles?
      question_text_obtuse_triangle: How many triangles are obtuse triangles?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] around all triangles that match the requested
        type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    source_geometry_counting_quadrilateral:
      object_description: several quadrilaterals
      question_text_square: How many quadrilaterals are squares?
      question_text_rectangle_non_square: How many quadrilaterals are rectangles but not squares?
      question_text_rhombus_non_square: How many quadrilaterals are rhombuses but not squares?
      question_text_parallelogram_only: How many quadrilaterals are parallelograms that are neither rectangles nor rhombuses?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] around all quadrilaterals that match the
        requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[120,180,220,280],[320,180,420,280]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    source_geometry_counting_shape_type:
      object_description: several shapes
      question_text_triangle: How many shapes are triangles?
      question_text_quadrilateral: How many shapes are quadrilaterals?
      question_text_pentagon: How many shapes are pentagons?
      question_text_hexagon: How many shapes are hexagons?
      question_text_circle: How many shapes are circles?
      question_text_ellipse: How many shapes are ellipses?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] around all shapes that match the requested
        type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    source_geometry_counting_convexity:
      object_description: several polygons
      question_text_convex_polygon: How many polygons are convex polygons?
      question_text_concave_polygon: How many polygons are concave polygons?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1] around all polygons that match the requested
        type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
