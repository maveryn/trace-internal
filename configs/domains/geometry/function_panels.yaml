  shared:
    bundle_id: geometry_analytical_function_property_v0
    scene_key: analytical_function_property_grid
    task_key: analytical_function_property_query
    object_description: labeled coordinate-plane panels, each showing one relation
    json_output_contract: Return one JSON object with keys "answer" and "annotation".
    json_output_contract_answer_only: Return one JSON object with key "answer".
    annotation_hint_selected_panel_bbox: set "annotation" to a JSON array containing
      the selected panel bounding box as [x0,y0,x1,y1] in pixels
    answer_hint_option_letter: set "answer" to the single selected panel label as
      a capital letter shown in the image
    json_example: '{"annotation":[[40,40,310,320]],"answer":"B"}'
    json_example_answer_only: '{"answer":"B"}'
