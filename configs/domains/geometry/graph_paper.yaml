prompt:
  shared:
    bundle_id: geometry_measurement_v0
    scene_key: measurement_single_object
    task_key: measurement_query
    object_description_segment: a labeled line segment
    object_description_polygon: a polygon
    object_description_ellipse: an ellipse
    object_description_circle: a circle
    annotation_hint_point_map: set "annotation" to a JSON object mapping each required
      label to one pixel point [x,y]
    annotation_hint_segment: provide exactly two labels for the measured segment endpoints
    annotation_hint_polygon_side: provide exactly two labels for the measured polygon
      side endpoints
    annotation_hint_circle_center: provide exactly one label for the circle center
      point
    annotation_hint_ellipse_axis: provide exactly two labels for the measured ellipse-axis
      endpoints
    answer_hint_integer: set "answer" to the measurement value as an integer
    answer_hint_pi: set "answer" to the measurement value in the form kπ (for example
      12π)
    json_example_integer: '{"annotation":{"A":[120,180],"B":[260,180]},"answer":4}'
    json_example_pi: '{"annotation":{"A":[160,220],"B":[280,220]},"answer":"6π"}'
    json_example_answer_only_integer: '{"answer":8}'
    json_example_answer_only_pi: '{"answer":"12π"}'
  task_overrides:
    source_geometry_comparison_angle:
      object_description: several labeled angles
      question_text_largest: Which labeled angle has the greatest measure?
      question_text_smallest: Which labeled angle has the smallest measure?
      annotation_hint: 'set "annotation" to an array of exactly three pixel points
        [x,y] for the winning angle: the vertex and the two ray endpoints'
      answer_hint: set "answer" to the single-letter label of the correct angle
    source_geometry_comparison_area:
      object_description: several labeled rectangles
      object_description_triangle: several labeled triangles
      question_text_largest: Which labeled rectangle has the greatest area?
      question_text_smallest: Which labeled rectangle has the smallest area?
      question_text_largest_triangle: Which labeled triangle has the greatest area?
      question_text_smallest_triangle: Which labeled triangle has the smallest area?
      annotation_hint: set "annotation" to an array of exactly four pixel points [x,y]
        for the winning rectangle vertices
      annotation_hint_triangle: set "annotation" to an array of exactly three pixel
        points [x,y] for the winning triangle vertices
      answer_hint: set "answer" to the single-letter label of the correct rectangle
      answer_hint_triangle: set "answer" to the single-letter label of the correct
        triangle
    source_geometry_comparison_perimeter:
      object_description: several labeled rectangles
      object_description_triangle: several labeled triangles
      question_text_largest: Which labeled rectangle has the greatest perimeter?
      question_text_smallest: Which labeled rectangle has the smallest perimeter?
      question_text_largest_triangle: Which labeled triangle has the greatest perimeter?
      question_text_smallest_triangle: Which labeled triangle has the smallest perimeter?
      annotation_hint: set "annotation" to an array of exactly four pixel points [x,y]
        for the winning rectangle vertices
      annotation_hint_triangle: set "annotation" to an array of exactly three pixel
        points [x,y] for the winning triangle vertices
      answer_hint: set "answer" to the single-letter label of the correct rectangle
      answer_hint_triangle: set "answer" to the single-letter label of the correct
        triangle
    source_geometry_comparison_length:
      object_description: several labeled line segments
      question_text_largest: Which labeled segment is the longest?
      question_text_smallest: Which labeled segment is the shortest?
      annotation_hint: set "annotation" to an array of exactly two pixel points [x,y]
        for the winning segment endpoints
      answer_hint: set "answer" to the single-letter label of the correct segment
    source_geometry_counting_angle:
      object_description: several angles
      question_text_acute_angle: How many angles are acute angles?
      question_text_right_angle: How many angles are right angles?
      question_text_obtuse_angle: How many angles are obtuse angles?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1]
        around all angles that match the requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[120,180,210,260],[320,220,410,300]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    source_geometry_counting_triangle:
      object_description: several triangles
      question_text_equilateral_triangle: How many triangles are equilateral triangles?
      question_text_isosceles_triangle: How many triangles are isosceles triangles
        but not equilateral triangles?
      question_text_scalene_triangle: How many triangles are scalene triangles?
      question_text_right_triangle: How many triangles are right triangles?
      question_text_acute_triangle: How many triangles are acute triangles?
      question_text_obtuse_triangle: How many triangles are obtuse triangles?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1]
        around all triangles that match the requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    source_geometry_counting_quadrilateral:
      object_description: several quadrilaterals
      question_text_square: How many quadrilaterals are squares?
      question_text_rectangle_non_square: How many quadrilaterals are rectangles but
        not squares?
      question_text_rhombus_non_square: How many quadrilaterals are rhombuses but
        not squares?
      question_text_parallelogram_only: How many quadrilaterals are parallelograms
        that are neither rectangles nor rhombuses?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1]
        around all quadrilaterals that match the requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[120,180,220,280],[320,180,420,280]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    source_geometry_counting_shape_type:
      object_description: several shapes
      question_text_triangle: How many shapes are triangles?
      question_text_quadrilateral: How many shapes are quadrilaterals?
      question_text_pentagon: How many shapes are pentagons?
      question_text_hexagon: How many shapes are hexagons?
      question_text_circle: How many shapes are circles?
      question_text_ellipse: How many shapes are ellipses?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1]
        around all shapes that match the requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    source_geometry_counting_convexity:
      object_description: several polygons
      question_text_convex_polygon: How many polygons are convex polygons?
      question_text_concave_polygon: How many polygons are concave polygons?
      annotation_hint: set "annotation" to a JSON array of pixel boxes [x0,y0,x1,y1]
        around all polygons that match the requested type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[80,180,180,280],[260,180,360,280],[440,180,540,280]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    source_geometry_measurement_angle:
      bundle_id: geometry_angle_measure_v0
      task_key: measurement_angle_value
      annotation_hint: 'set "annotation" to an array of exactly three pixel points
        [x,y] for the queried angle: the vertex and the two ray endpoints'
      answer_hint: set "answer" to the angle value rounded to the nearest integer
      json_example: '{"annotation":[[180,120],[180,240],[300,240]],"answer":90}'
      json_example_answer_only: '{"answer":45}'
    source_geometry_measurement_area:
      question_text_polygon: What is the area of the polygon in square units?
      question_text_ellipse: What is the area of the ellipse in square units? Express
        the answer in the form kπ.
      annotation_hint_polygon: set "annotation" to an array of pixel points [x,y]
        for all polygon vertices
      annotation_hint_ellipse: set "annotation" to an array containing one pixel point
        [x,y] for the ellipse center
      json_example_triangle: '{"annotation":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_quadrilateral: '{"annotation":[[120,180],[280,180],[280,260],[120,260]],"answer":8}'
      json_example_ellipse: '{"annotation":[[220,220]],"answer":"6π"}'
      json_example_integer: '{"annotation":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_pi: '{"annotation":[[220,220]],"answer":"6π"}'
    source_geometry_measurement_perimeter:
      question_text_polygon: What is the perimeter of the polygon in graph units?
      question_text_circle: What is the circumference of the circle in graph units?
        Express the answer in the form kπ.
      annotation_hint_polygon: set "annotation" to an array of pixel points [x,y]
        for all polygon vertices
      annotation_hint_circle: set "annotation" to an array containing one pixel point
        [x,y] for the circle center
      json_example_triangle: '{"annotation":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_quadrilateral: '{"annotation":[[120,180],[280,180],[280,260],[120,260]],"answer":12}'
      json_example_circle: '{"annotation":[[220,220]],"answer":"8π"}'
      json_example_integer: '{"annotation":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_pi: '{"annotation":[[220,220]],"answer":"8π"}'
    source_geometry_measurement_length:
      question_template_segment: What is the length of segment {label_a}{label_b}
        in graph units?
      question_template_polygon_side: What is the length of side {label_a}{label_b}
        in graph units?
      question_text_circle_radius: What is the radius of the circle in graph units?
      question_text_circle_diameter: What is the diameter of the circle in graph units?
      question_text_ellipse_major_axis: What is the length of the major axis of the
        ellipse in graph units?
      question_text_ellipse_minor_axis: What is the length of the minor axis of the
        ellipse in graph units?
      annotation_hint_segment: set "annotation" to an array of exactly two pixel points
        [x,y] for the measured segment endpoints
      annotation_hint_polygon_side: set "annotation" to an array of exactly two pixel
        points [x,y] for the measured polygon-side endpoints
      annotation_hint_circle_center: set "annotation" to an array containing exactly
        one pixel point [x,y] for the circle center
      annotation_hint_ellipse_axis: set "annotation" to an array of exactly two pixel
        points [x,y] for the measured ellipse-axis endpoints
      json_example_segment_integer: '{"annotation":[[120,180],[280,180]],"answer":5}'
      json_example_polygon_side_integer: '{"annotation":[[140,180],[260,300]],"answer":5}'
      json_example_circle_radius_integer: '{"annotation":[[220,220]],"answer":4}'
      json_example_circle_diameter_integer: '{"annotation":[[220,220]],"answer":8}'
      json_example_ellipse_major_axis_integer: '{"annotation":[[140,220],[300,220]],"answer":8}'
      json_example_ellipse_minor_axis_integer: '{"annotation":[[220,160],[220,280]],"answer":6}'
      json_example_integer: '{"annotation":[[120,180],[280,180]],"answer":5}'
    source_geometry_measurement_slope:
      object_description: a straight line
      question_text: What is the slope of the line?
      annotation_hint: set "annotation" to an array containing one pixel point [x,y]
        where the line crosses the x-axis
      answer_hint: set "answer" to the slope value rounded to one decimal place
      json_example: '{"annotation":[[220,300]],"answer":-1.5}'
      json_example_answer_only: '{"answer":-1.5}'
