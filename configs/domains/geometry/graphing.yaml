rendering:
  shared:
    canvas_size_min: 640
    canvas_size_max: 720
    graph_cells_min: 20
    graph_cells_max: 20
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    guide_line_width: 3
    guide_line_width_min: 2
    guide_line_width_max: 4
    marker_radius: 7
    label_font_size_min: 16
    label_font_size_max: 24
prompt:
  shared:
    bundle_id: geometry_graphing_v0
    scene_key: graphing_scene
    task_key: graphing_query
    object_description_quadratic: a plotted function graph on graph paper
    object_description_quadratic_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_absolute_value: a plotted function graph on graph paper
    object_description_absolute_value_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide
      line
    object_description_cubic: a plotted function graph on graph paper
    object_description_cubic_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_sinusoid: a plotted function graph on graph paper
    object_description_sinusoid_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_piecewise_linear: a plotted function graph on graph paper
    object_description_piecewise_linear_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide
      line
    answer_hint_integer: set "answer" to the requested count as an integer
    annotation_hint_pixel_point_set: set "annotation" to an array of every pixel point [x,y] that satisfies the question; use
      [] when there are none
    annotation_hint_reference_line_crossing_count: set "annotation" to an array containing every pixel point [x,y] where the plotted
      graph passes through {reference_line_description}; use [] when there are none
    annotation_hint_turning_point_count: set "annotation" to an array containing every visible turning-point pixel point [x,y]
      where the graph changes from increasing to decreasing or decreasing to increasing; use [] when there are none
    annotation_hint_local_extremum_count: set "annotation" to an array containing every visible local {extremum_kind_adjective}
      pixel point [x,y]; use [] when there are none
    json_example_reference_line_crossing_count: '{"annotation":[[180,320],[360,320]],"answer":2}'
    json_example_turning_point_count: '{"annotation":[[160,260],[320,380],[480,260]],"answer":3}'
    json_example_local_extremum_count: '{"annotation":[[220,380],[460,380]],"answer":2}'
    json_example_answer_only_reference_line_crossing_count: '{"answer":2}'
    json_example_answer_only_turning_point_count: '{"answer":3}'
    json_example_answer_only_local_extremum_count: '{"answer":2}'
    reference_line_description_x_axis: the x-axis
    reference_line_description_horizontal_line: the dashed line {query_line_equation}
    extremum_kind_adjective_minimum: minimum
    extremum_kind_adjective_maximum: maximum
    extremum_visual_description_minimum: valleys
    extremum_visual_description_maximum: peaks
  task_overrides:
    task_geometry__function_graph__average_rate_value:
      bundle_id: geometry_graphing_v0
      scene_key: graphing_scene
      task_key: graphing_query
      object_description_average_rate: a plotted function graph on graph paper with marked points A and B
      answer_hint_number_one_decimal: set "answer" to the average rate of change as a number rounded to one decimal place
      annotation_hint_average_rate_points: set "annotation" to an array containing the pixel points [x,y] for the marked points
        A and B
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.05
      graphing_reasoning: 0.25
      ambiguity: 0.2
      output_burden: 0.5
