generation:
  shared:
    quadratic_x_intercept_support: [0, 1, 2]
    quadratic_horizontal_support: [0, 1, 2]
    absolute_value_x_intercept_support: [0, 1, 2]
    absolute_value_horizontal_support: [0, 1, 2]
    cubic_x_intercept_support: [1, 2, 3]
    cubic_horizontal_support: [1, 2, 3]
    sinusoid_x_intercept_support: [0, 1, 2, 3, 4]
    sinusoid_horizontal_support: [0, 1, 2, 3, 4]
    sinusoid_turning_support: [3, 4]
    sinusoid_local_minima_support: [1, 2]
    sinusoid_local_maxima_support: [1, 2]
    piecewise_x_intercept_support: [0, 1, 2, 3, 4]
    piecewise_horizontal_support: [0, 1, 2, 3, 4]
    piecewise_turning_support: [0, 1, 2, 3, 4]
    piecewise_local_minima_support: [0, 1, 2, 3, 4]
    piecewise_local_maxima_support: [0, 1, 2, 3, 4]
    horizontal_line_support: [-4, -3, -2, -1, 1, 2, 3, 4]
    piecewise_intersection_x_positions: [-8, -6, -4, -2, 0, 2, 4, 6, 8]
    piecewise_turning_x_positions: [-9, -7, -5, -3, -1, 1, 3, 5, 7, 9]
  task_overrides:
    task_geometry_graphing_count:
      scene_variant_weights:
        quadratic: 1.0
        absolute_value: 1.0
        cubic: 1.0
        sinusoid: 1.0
        piecewise_linear: 1.0
      query_variant_weights:
        x_intercept_count: 1.0
        horizontal_line_intersection_count: 1.0
        turning_point_count: 1.0
        local_minima_count: 1.0
        local_maxima_count: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true

rendering:
  shared:
    canvas_size_min: 640
    canvas_size_max: 720
    graph_cells_min: 20
    graph_cells_max: 20
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    guide_line_width: 3
    guide_line_width_min: 2
    guide_line_width_max: 4
    label_font_size_min: 16
    label_font_size_max: 24

prompt:
  shared:
    bundle_id: geometry_graphing_v1
    task_family_key: graphing_scene
    task_key: graphing_query
    object_description_quadratic: a plotted function graph on graph paper
    object_description_quadratic_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_absolute_value: a plotted function graph on graph paper
    object_description_absolute_value_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_cubic: a plotted function graph on graph paper
    object_description_cubic_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_sinusoid: a plotted function graph on graph paper
    object_description_sinusoid_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    object_description_piecewise_linear: a plotted function graph on graph paper
    object_description_piecewise_linear_with_guide_line: a plotted function graph on graph paper and a dashed horizontal guide line
    answer_hint_integer: 'set "answer" to the requested count as an integer'
    evidence_hint_graph_point_set: 'set "evidence" to an array of every graph-paper coordinate [x, y] that satisfies the question; use [] when there are none'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.24
      graphing_reasoning: 0.40
      ambiguity: 0.22
      output_burden: 0.14
