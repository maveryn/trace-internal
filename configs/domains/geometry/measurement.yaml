prompt:
  shared:
    bundle_id: geometry_measurement_v0
    scene_key: measurement_single_object
    task_key: measurement_query
    object_description_segment: a labeled line segment
    object_description_polygon: a polygon
    object_description_ellipse: an ellipse
    object_description_circle: a circle
    annotation_hint_point_map: set "annotation" to a JSON object mapping each required label to one pixel point [x,y]
    annotation_hint_segment: provide exactly two labels for the measured segment endpoints
    annotation_hint_polygon_side: provide exactly two labels for the measured polygon side endpoints
    annotation_hint_circle_center: provide exactly one label for the circle center point
    annotation_hint_ellipse_axis: provide exactly two labels for the measured ellipse-axis endpoints
    answer_hint_integer: set "answer" to the measurement value as an integer
    answer_hint_pi: "set \"answer\" to the measurement value in the form k\u03C0 (for example 12\u03C0)"
    json_example_integer: '{"annotation":{"A":[120,180],"B":[260,180]},"answer":4}'
    json_example_pi: "{\"annotation\":{\"A\":[160,220],\"B\":[280,220]},\"answer\":\"6\u03C0\"}"
    json_example_answer_only_integer: '{"answer":8}'
    json_example_answer_only_pi: "{\"answer\":\"12\u03C0\"}"
  task_overrides:
    source_geometry_measurement_angle:
      bundle_id: geometry_angle_measure_v0
      task_key: measurement_angle_value
      annotation_hint: 'set "annotation" to an array of exactly three pixel points [x,y] for the queried angle: the vertex and
        the two ray endpoints'
      answer_hint: set "answer" to the angle value rounded to the nearest integer
      json_example: '{"annotation":[[180,120],[180,240],[300,240]],"answer":90}'
      json_example_answer_only: '{"answer":45}'
    source_geometry_measurement_area:
      question_text_polygon: What is the area of the polygon in square units?
      question_text_ellipse: "What is the area of the ellipse in square units? Express the answer in the form k\u03C0."
      annotation_hint_polygon: set "annotation" to an array of pixel points [x,y] for all polygon vertices
      annotation_hint_ellipse: set "annotation" to an array containing one pixel point [x,y] for the ellipse center
      json_example_triangle: '{"annotation":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_quadrilateral: '{"annotation":[[120,180],[280,180],[280,260],[120,260]],"answer":8}'
      json_example_ellipse: "{\"annotation\":[[220,220]],\"answer\":\"6\u03C0\"}"
      json_example_integer: '{"annotation":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_pi: "{\"annotation\":[[220,220]],\"answer\":\"6\u03C0\"}"
    source_geometry_measurement_perimeter:
      question_text_polygon: What is the perimeter of the polygon in graph units?
      question_text_circle: "What is the circumference of the circle in graph units? Express the answer in the form k\u03C0\
        ."
      annotation_hint_polygon: set "annotation" to an array of pixel points [x,y] for all polygon vertices
      annotation_hint_circle: set "annotation" to an array containing one pixel point [x,y] for the circle center
      json_example_triangle: '{"annotation":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_quadrilateral: '{"annotation":[[120,180],[280,180],[280,260],[120,260]],"answer":12}'
      json_example_circle: "{\"annotation\":[[220,220]],\"answer\":\"8\u03C0\"}"
      json_example_integer: '{"annotation":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_pi: "{\"annotation\":[[220,220]],\"answer\":\"8\u03C0\"}"
    source_geometry_measurement_length:
      question_template_segment: What is the length of segment {label_a}{label_b} in graph units?
      question_template_polygon_side: What is the length of side {label_a}{label_b} in graph units?
      question_text_circle_radius: What is the radius of the circle in graph units?
      question_text_circle_diameter: What is the diameter of the circle in graph units?
      question_text_ellipse_major_axis: What is the length of the major axis of the ellipse in graph units?
      question_text_ellipse_minor_axis: What is the length of the minor axis of the ellipse in graph units?
      annotation_hint_segment: set "annotation" to an array of exactly two pixel points [x,y] for the measured segment endpoints
      annotation_hint_polygon_side: set "annotation" to an array of exactly two pixel points [x,y] for the measured polygon-side
        endpoints
      annotation_hint_circle_center: set "annotation" to an array containing exactly one pixel point [x,y] for the circle center
      annotation_hint_ellipse_axis: set "annotation" to an array of exactly two pixel points [x,y] for the measured ellipse-axis
        endpoints
      json_example_segment_integer: '{"annotation":[[120,180],[280,180]],"answer":5}'
      json_example_polygon_side_integer: '{"annotation":[[140,180],[260,300]],"answer":5}'
      json_example_circle_radius_integer: '{"annotation":[[220,220]],"answer":4}'
      json_example_circle_diameter_integer: '{"annotation":[[220,220]],"answer":8}'
      json_example_ellipse_major_axis_integer: '{"annotation":[[140,220],[300,220]],"answer":8}'
      json_example_ellipse_minor_axis_integer: '{"annotation":[[220,160],[220,280]],"answer":6}'
      json_example_integer: '{"annotation":[[120,180],[280,180]],"answer":5}'
    source_geometry_measurement_slope:
      object_description: a straight line
      question_text: What is the slope of the line?
      annotation_hint: set "annotation" to an array containing one pixel point [x,y] where the line crosses the x-axis
      answer_hint: set "answer" to the slope value rounded to one decimal place
      json_example: '{"annotation":[[220,300]],"answer":-1.5}'
      json_example_answer_only: '{"answer":-1.5}'
    task_geometry__area_partition__total_area_value:
      bundle_id: geometry_area_partition_v0
      scene_key: area_partition_scene
      task_key: area_partition_value_query
      object_description: a triangle or parallelogram partitioned into equal-area regions, with one shaded region and its
        area labeled
      annotation_hint: set "annotation" to a JSON object with keys "outer_shape" and "shaded_region", where each value is a pixel
        bounding box [x0,y0,x1,y1]
      answer_hint_number: set "answer" to the total area as an integer
      json_example: '{"annotation":{"outer_shape":[110,140,650,435],"shaded_region":[120,160,360,420]},"answer":186}'
      json_example_answer_only: '{"answer":186}'
    task_geometry__composite_shape__composite_area_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: rectilinear_composite_scene
      task_key: analytical_measurement_value_query
      object_description: a straight-edged composite shape with measurement labels
      annotation_hint: 'set "annotation" to a JSON object with exactly these region keys: {annotation_keys}; "outer_region" is the
        full enclosing shape before the unshaded cutout is removed, and the other key marks the visible missing or removed
        cutout; each value must be that visible region''s pixel bounding box [x0,y0,x1,y1]'
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__paper_fold__paper_fold_angle_value:
