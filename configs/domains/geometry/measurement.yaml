prompt:
  shared:
    bundle_id: geometry_measurement_v0
    scene_key: measurement_single_object
    task_key: measurement_query
    object_description_segment: a labeled line segment
    object_description_polygon: a polygon
    object_description_ellipse: an ellipse
    object_description_circle: a circle
    evidence_hint_point_map: set "evidence" to a JSON object mapping each required label to one pixel point [x,y]
    evidence_hint_segment: provide exactly two labels for the measured segment endpoints
    evidence_hint_polygon_side: provide exactly two labels for the measured polygon side endpoints
    evidence_hint_circle_center: provide exactly one label for the circle center point
    evidence_hint_ellipse_axis: provide exactly two labels for the measured ellipse-axis endpoints
    answer_hint_integer: set "answer" to the measurement value as an integer
    answer_hint_pi: set "answer" to the measurement value in the form kπ (for example 12π)
    json_example_integer: '{"evidence":{"A":[120,180],"B":[260,180]},"answer":4}'
    json_example_pi: '{"evidence":{"A":[160,220],"B":[280,220]},"answer":"6π"}'
    json_example_answer_only_integer: '{"answer":8}'
    json_example_answer_only_pi: '{"answer":"12π"}'
  task_overrides:
    source_geometry_measurement_angle:
      bundle_id: geometry_angle_measure_v0
      task_key: measurement_angle_value
      evidence_hint: 'set "evidence" to an array of exactly three pixel points [x,y] for the queried angle: the vertex and the two ray endpoints'
      answer_hint: set "answer" to the angle value rounded to the nearest integer
      json_example: '{"evidence":[[180,120],[180,240],[300,240]],"answer":90}'
      json_example_answer_only: '{"answer":45}'
    source_geometry_measurement_area:
      question_text_polygon: What is the area of the polygon in square units?
      question_text_ellipse: What is the area of the ellipse in square units? Express the answer in the form kπ.
      evidence_hint_polygon: set "evidence" to an array of pixel points [x,y] for all polygon vertices
      evidence_hint_ellipse: set "evidence" to an array containing one pixel point [x,y] for the ellipse center
      json_example_triangle: '{"evidence":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_quadrilateral: '{"evidence":[[120,180],[280,180],[280,260],[120,260]],"answer":8}'
      json_example_ellipse: '{"evidence":[[220,220]],"answer":"6π"}'
      json_example_integer: '{"evidence":[[120,220],[260,220],[120,340]],"answer":6}'
      json_example_pi: '{"evidence":[[220,220]],"answer":"6π"}'
    source_geometry_measurement_perimeter:
      question_text_polygon: What is the perimeter of the polygon in graph units?
      question_text_circle: What is the circumference of the circle in graph units? Express the answer in the form kπ.
      evidence_hint_polygon: set "evidence" to an array of pixel points [x,y] for all polygon vertices
      evidence_hint_circle: set "evidence" to an array containing one pixel point [x,y] for the circle center
      json_example_triangle: '{"evidence":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_quadrilateral: '{"evidence":[[120,180],[280,180],[280,260],[120,260]],"answer":12}'
      json_example_circle: '{"evidence":[[220,220]],"answer":"8π"}'
      json_example_integer: '{"evidence":[[120,220],[260,220],[120,340]],"answer":12}'
      json_example_pi: '{"evidence":[[220,220]],"answer":"8π"}'
    source_geometry_measurement_length:
      question_template_segment: What is the length of segment {label_a}{label_b} in graph units?
      question_template_polygon_side: What is the length of side {label_a}{label_b} in graph units?
      question_text_circle_radius: What is the radius of the circle in graph units?
      question_text_circle_diameter: What is the diameter of the circle in graph units?
      question_text_ellipse_major_axis: What is the length of the major axis of the ellipse in graph units?
      question_text_ellipse_minor_axis: What is the length of the minor axis of the ellipse in graph units?
      evidence_hint_segment: set "evidence" to an array of exactly two pixel points [x,y] for the measured segment endpoints
      evidence_hint_polygon_side: set "evidence" to an array of exactly two pixel points [x,y] for the measured polygon-side endpoints
      evidence_hint_circle_center: set "evidence" to an array containing exactly one pixel point [x,y] for the circle center
      evidence_hint_ellipse_axis: set "evidence" to an array of exactly two pixel points [x,y] for the measured ellipse-axis endpoints
      json_example_segment_integer: '{"evidence":[[120,180],[280,180]],"answer":5}'
      json_example_polygon_side_integer: '{"evidence":[[140,180],[260,300]],"answer":5}'
      json_example_circle_radius_integer: '{"evidence":[[220,220]],"answer":4}'
      json_example_circle_diameter_integer: '{"evidence":[[220,220]],"answer":8}'
      json_example_ellipse_major_axis_integer: '{"evidence":[[140,220],[300,220]],"answer":8}'
      json_example_ellipse_minor_axis_integer: '{"evidence":[[220,160],[220,280]],"answer":6}'
      json_example_integer: '{"evidence":[[120,180],[280,180]],"answer":5}'
    source_geometry_measurement_slope:
      object_description: a straight line
      question_text: What is the slope of the line?
      evidence_hint: set "evidence" to an array containing one pixel point [x,y] where the line crosses the x-axis
      answer_hint: set "answer" to the slope value rounded to one decimal place
      json_example: '{"evidence":[[220,300]],"answer":-1.5}'
      json_example_answer_only: '{"answer":-1.5}'
    task_geometry__angle_relations__angle_chain_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: angle_relation_scene
      task_key: analytical_measurement_value_query
      object_description: labeled angle relations
      evidence_hint: set "evidence" to a JSON object whose keys name the relevant angles and whose values are pixel points [x,y] at the angle vertex
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__angle_relations__algebraic_angle_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: angle_relation_scene
      task_key: analytical_measurement_value_query
      object_description: labeled angle relations with algebraic expressions
      evidence_hint: set "evidence" to a JSON object whose keys name the relevant angles and whose values are pixel points [x,y] at the angle vertex
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__triangle_relations__parallel_section_length_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: parallel_section_scene
      task_key: analytical_measurement_value_query
      object_description: a triangle with a segment parallel to one side
      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target cue followed by the supporting visible labels or constraint marks needed for the computation
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__triangle_relations__pythagorean_length_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: pythagorean_length_scene
      task_key: analytical_measurement_value_query
      object_description: labeled right-triangle length relationships
      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target cue followed by the supporting visible labels or constraint marks needed for the computation
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__triangle_relations__angle_bisector_segment_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: triangle_special_segment_scene
      task_key: analytical_measurement_value_query
      object_description: a triangle with a marked special segment
      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target cue followed by the supporting visible labels or constraint marks needed for the computation
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__triangle_relations__centroid_median_segment_value:
      bundle_id: geometry_analytical_measurement_v0
      scene_key: triangle_special_segment_scene
      task_key: analytical_measurement_value_query
      object_description: a triangle with a marked special segment
      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target cue followed by the supporting visible labels or constraint marks needed for the computation
      answer_hint_integer: set "answer" to the requested value as an integer
    task_geometry__area_partition__total_area_value:
      bundle_id: geometry_area_partition_v0
      scene_key: area_partition_scene
      task_key: area_partition_value_query
      object_description: a triangle or parallelogram partitioned into equal-area regions, with one shaded region and its area labeled
      evidence_hint: set "evidence" to a JSON object with keys "outer_shape" and "shaded_region", where each value is a pixel bounding box [x0,y0,x1,y1]
      answer_hint_number: set "answer" to the total area as an integer
      json_example: '{"evidence":{"outer_shape":[110,140,650,435],"shaded_region":[120,160,360,420]},"answer":186}'
      json_example_answer_only: '{"answer":186}'
    task_geometry__trapezoid_extension__trapezoid_extension_length_value:
      bundle_id: geometry_trapezoid_extension_v0
      scene_key: trapezoid_extension_scene
      task_key: trapezoid_extension_value_query
      object_description: a solid trapezoid completed into a parallelogram by a dashed extension
      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target length cue, the original trapezoid, the dashed parallelogram completion, and the supporting visible labels needed for the computation
      answer_hint_number: set "answer" to the requested length as an integer
      json_example: '{"evidence":[[500,188,552,216],[85,160,655,430],[345,160,695,430],[210,70,640,210]],"answer":8}'
      json_example_answer_only: '{"answer":8}'
    task_geometry__trapezoid_extension__trapezoid_extension_area_value:
      bundle_id: geometry_trapezoid_extension_v0
      scene_key: trapezoid_extension_scene
      task_key: trapezoid_extension_value_query
