generation:
  shared:
    answer_min: 8
    polygon_allowed_sides: [3, 4, 5]
    circle_radius_min: 2
    circle_radius_max: 10
    ellipse_axis_min: 2
    ellipse_axis_max: 10
    ellipse_allow_circle: false
  task_overrides:
    task_geometry_measurement_angle:
      min_angle: 30
      max_angle: 150
      angle_step: 1
      quantization_tolerance_degrees: 0.05
      max_abs_vector_component: 20
      min_ray_length_units: 2
      balanced_sampling: true
      source_kind_weights:
        primitive_angle: 1.0
        intersection_lines: 1.0
    task_geometry_measurement_area:
      answer_min: 8
      answer_max: 96
      balanced_variant_sampling: true
      variant_weights:
        triangle: 1.0
        quadrilateral: 1.0
        ellipse: 1.0
      ellipse_allow_circle: true
    task_geometry_measurement_perimeter:
      answer_min: 8
      answer_max: 64
      balanced_variant_sampling: true
      variant_weights:
        triangle: 1.0
        quadrilateral: 1.0
        circle: 1.0
    task_geometry_measurement_length:
      answer_min: 2
      answer_max: 20
      balanced_variant_sampling: true
      variant_weights:
        segment: 1.0
        triangle: 1.0
        quadrilateral: 1.0
        pentagon: 1.0
        circle_radius: 0.25
        circle_diameter: 0.25
        ellipse_major_axis: 0.25
        ellipse_minor_axis: 0.25
      segment_length_min: 2
      segment_length_max: 20
      segment_vector_max_abs_component: 20
    task_geometry_measurement_slope:
      slope_tenths_min: -40
      slope_tenths_max: 40
      balanced_sampling: true

rendering:
  shared:
    graph_cells_min: 6
    graph_cells_max: 20
    line_width: 4
    line_width_min: 2
    line_width_max: 5
    label_offset_px: 14
    label_font_size_min: 14
    label_font_size_max: 32
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 2

prompt:
  shared:
    bundle_id: geometry_measurement_v1
    task_family_key: measurement_single_object
    task_key: measurement_query
    object_description_segment: a labeled line segment
    object_description_polygon: a polygon
    object_description_ellipse: an ellipse
    object_description_circle: a circle
    evidence_hint_point_map: set "evidence" to a JSON object mapping each required label to one graph-unit coordinate [x, y]
    evidence_hint_segment: provide exactly two labels for the measured segment endpoints
    evidence_hint_polygon_side: provide exactly two labels for the measured polygon side endpoints
    evidence_hint_circle_center: provide exactly one label for the circle center point
    evidence_hint_ellipse_axis: provide exactly two labels for the measured ellipse-axis endpoints
    answer_hint_integer: set "answer" to the measurement value as an integer
    answer_hint_pi: set "answer" to the measurement value in the form kπ (for example 12π)
    json_example_integer: '{"evidence":{"A":[0,0],"B":[4,0]},"answer":4}'
    json_example_pi: '{"evidence":{"A":[0,0],"B":[3,0]},"answer":"6π"}'
    json_example_answer_only_integer: '{"answer":8}'
    json_example_answer_only_pi: '{"answer":"12π"}'
  task_overrides:
    task_geometry_measurement_angle:
      bundle_id: geometry_angle_measure_v1
      task_key: measurement_angle_value
      evidence_hint: 'set "evidence" to an array of exactly three graph-paper points for the queried angle: the vertex and the two ray endpoints'
      answer_hint: set "answer" to the angle value rounded to the nearest integer
      json_example: '{"evidence":[[0,2],[0,0],[3,0]],"answer":90}'
      json_example_answer_only: '{"answer":45}'
    task_geometry_measurement_area:
      question_text_polygon: What is the area of the polygon in square units?
      question_text_ellipse: What is the area of the ellipse in square units? Express the answer in the form kπ.
      evidence_hint_polygon: set "evidence" to an array of graph-paper points for all polygon vertices
      evidence_hint_ellipse: set "evidence" to one graph-paper point [x, y] for the ellipse center
      json_example_triangle: '{"evidence":[[0,0],[4,0],[0,3]],"answer":6}'
      json_example_quadrilateral: '{"evidence":[[0,0],[4,0],[4,2],[0,2]],"answer":8}'
      json_example_ellipse: '{"evidence":[[0,0]],"answer":"6π"}'
      json_example_integer: '{"evidence":[[0,0],[4,0],[0,3]],"answer":6}'
      json_example_pi: '{"evidence":[[0,0]],"answer":"6π"}'
    task_geometry_measurement_perimeter:
      question_text_polygon: What is the perimeter of the polygon in graph units?
      question_text_circle: What is the circumference of the circle in graph units? Express the answer in the form kπ.
      evidence_hint_polygon: set "evidence" to an array of graph-paper points for all polygon vertices
      evidence_hint_circle: set "evidence" to one graph-paper point [x, y] for the circle center
      json_example_triangle: '{"evidence":[[0,0],[4,0],[0,3]],"answer":12}'
      json_example_quadrilateral: '{"evidence":[[0,0],[4,0],[4,2],[0,2]],"answer":12}'
      json_example_circle: '{"evidence":[[0,0]],"answer":"8π"}'
      json_example_integer: '{"evidence":[[0,0],[4,0],[0,3]],"answer":12}'
      json_example_pi: '{"evidence":[[0,0]],"answer":"8π"}'
    task_geometry_measurement_length:
      question_template_segment: What is the length of segment {label_a}{label_b} in graph units?
      question_template_polygon_side: What is the length of side {label_a}{label_b} in graph units?
      question_text_circle_radius: What is the radius of the circle in graph units?
      question_text_circle_diameter: What is the diameter of the circle in graph units?
      question_text_ellipse_major_axis: What is the length of the major axis of the ellipse in graph units?
      question_text_ellipse_minor_axis: What is the length of the minor axis of the ellipse in graph units?
      evidence_hint_segment: set "evidence" to an array of exactly two graph-paper points for the measured segment endpoints
      evidence_hint_polygon_side: set "evidence" to an array of exactly two graph-paper points for the measured polygon-side endpoints
      evidence_hint_circle_center: set "evidence" to an array of exactly one graph-paper point for the circle center
      evidence_hint_ellipse_axis: set "evidence" to an array of exactly two graph-paper points for the measured ellipse-axis endpoints
      json_example_segment_integer: '{"evidence":[[1,2],[6,2]],"answer":5}'
      json_example_polygon_side_integer: '{"evidence":[[0,0],[3,4]],"answer":5}'
      json_example_circle_radius_integer: '{"evidence":[[0,0]],"answer":4}'
      json_example_circle_diameter_integer: '{"evidence":[[0,0]],"answer":8}'
      json_example_ellipse_major_axis_integer: '{"evidence":[[-4,0],[4,0]],"answer":8}'
      json_example_ellipse_minor_axis_integer: '{"evidence":[[0,-3],[0,3]],"answer":6}'
      json_example_integer: '{"evidence":[[1,2],[6,2]],"answer":5}'
    task_geometry_measurement_slope:
      object_description: a straight line
      question_text: What is the slope of the line?
      evidence_hint: set "evidence" to one graph-paper point [x, y] where the line crosses the x-axis
      answer_hint: set "answer" to the slope value rounded to one decimal place
      json_example: '{"evidence":[2,0],"answer":-1.5}'
      json_example_answer_only: '{"answer":-1.5}'
