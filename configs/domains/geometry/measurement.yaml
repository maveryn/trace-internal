      evidence_hint: set "evidence" to a JSON array of pixel bounding boxes [x0,y0,x1,y1] for the target area cue, the original trapezoid, the dashed parallelogram completion, and the supporting visible labels needed for the computation
      answer_hint_number: set "answer" to the trapezoid area as an integer
      json_example: '{"evidence":[[450,492,650,526],[85,160,655,430],[345,160,695,430],[210,70,640,210]],"answer":84}'
      json_example_answer_only: '{"answer":84}'
