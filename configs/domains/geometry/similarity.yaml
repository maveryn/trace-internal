generation:
  shared:
    candidate_label_pool: ["A", "B", "C", "D", "E"]
    candidate_slots:
      - [4, 7]
      - [10, 7]
      - [16, 7]
      - [7, -3]
      - [13, -3]
    reference_center: [-11, 1]
    target_count_support: [0, 1, 2, 3, 4, 5]
    similar_scale_support: [1, 2]
    distractor_non_uniform_pairs:
      - [2, 1]
      - [1, 2]
  task_overrides:
    geometry_similarity_count_base:
      scene_variant_weights:
        triangle: 1.0
        quadrilateral: 1.0
      query_variant_weights:
        congruent_count: 1.0
        similar_count: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true

rendering:
  shared:
    canvas_size_min: 680
    canvas_size_max: 760
    graph_cells_min: 40
    graph_cells_max: 44
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    label_font_size_min: 16
    label_font_size_max: 28
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 2
    object_label_offset_px: 14
    reference_label_gap_px: 20
    cue_line_padding_px: 18

prompt:
  shared:
    bundle_id: geometry_similarity_v0
    scene_key: similarity_graph_scene
    task_key: similarity_count_query
    object_description: a Reference polygon and five labeled candidate polygons A through E
    evidence_hint_template: 'set "evidence" to an array of pixel boxes [x0,y0,x1,y1] around every candidate polygon that matches the Reference among A through E'
    answer_hint: 'set "answer" to the integer count of the matching labeled polygons'
    json_example: '{"evidence":[[110,120,180,190],[250,120,320,190]],"answer":2}'
    json_example_answer_only: '{"answer":2}'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.25
      similarity_reasoning: 0.35
      ambiguity: 0.25
      output_burden: 0.15
