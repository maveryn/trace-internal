generation:
  shared:
    footprint_width_min: 2
    footprint_width_max: 4
    footprint_depth_min: 2
    footprint_depth_max: 4
    total_cubes_min: 4
    total_cubes_max: 9
    max_height: 3
    target_count_support: [2, 3, 4, 5, 6, 7]
    min_distinct_view_counts: 2
    allow_full_query_projection: false
  task_overrides:
    task_geometry_solid_view_count:
      scene_variant_weights:
        cube_stack: 1.0
      query_variant_weights:
        top_view_visible_count: 1.0
        front_view_visible_count: 1.0
        right_view_visible_count: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true

rendering:
  shared:
    canvas_size_min: 720
    canvas_size_max: 800
    scene_supersample_scale: 2
    line_width: 3
    line_width_min: 2
    line_width_max: 4
    outer_margin_px: 28
    panel_gap_px: 22
    stack_panel_ratio: 0.58
    panel_title_font_size_min: 18
    panel_title_font_size_max: 24

visual:
  background:
    enabled: true
    styles:
      solid_offwhite:
        kind: solid
        color: [252, 252, 252]
      solid_cool:
        kind: solid
        color: [245, 248, 252]
      solid_warm:
        kind: solid
        color: [252, 248, 243]
    weights:
      graph_paper: 0.0
      solid_offwhite: 0.5
      solid_cool: 0.25
      solid_warm: 0.25

prompt:
  shared:
    bundle_id: geometry_solid_v1
    task_family_key: solid_view_scene
    task_key: solid_view_query
    object_description: a cube stack on the left and one empty orthographic query grid on the right
    answer_hint_integer: set "answer" to the count as an integer
    evidence_hint_bbox_set: set "evidence" to a JSON array of the bounding boxes of all query-grid cells that should be filled

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.24
      projection_reasoning: 0.46
      ambiguity: 0.20
      output_burden: 0.10
