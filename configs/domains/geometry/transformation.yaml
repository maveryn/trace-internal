generation:
  shared:
    candidate_label_pool: ["A", "B", "C", "D", "E", "F"]
    candidate_slots:
      - [6, 6]
      - [13, 6]
      - [6, 0]
      - [13, 0]
      - [6, -6]
      - [13, -6]
    translation_vectors:
      - [10, 0]
      - [10, 4]
      - [10, -4]
      - [15, 0]
      - [15, 4]
      - [15, -4]
    translation_cue_gap_graph: 4
    candidate_min_gap_graph: 0.75
    reflection_axis_x: 0
    reflection_line_y_min: -9
    reflection_line_y_max: 9
  task_overrides:
    geometry_transformation_match_base:
      scene_variant_weights:
        triangle: 1.0
        quadrilateral: 1.0
      query_variant_weights:
        translation_match: 1.0
        reflection_match: 1.0
        rotation_match: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true

rendering:
  shared:
    canvas_size_min: 720
    canvas_size_max: 800
    graph_cells_min: 34
    graph_cells_max: 38
    line_width: 4
    line_width_min: 3
    line_width_max: 5
    label_font_size_min: 16
    label_font_size_max: 28
    label_stroke_width: 1
    label_stroke_width_min: 1
    label_stroke_width_max: 2
    object_label_offset_px: 14
    reference_label_gap_px: 20
    cue_label_gap_px: 18
    cue_dash_px: 10
    cue_gap_px: 8
    cue_arrow_head_length_px: 18
    cue_arrow_head_width_px: 14
    cue_point_radius_px: 4
    cue_line_padding_px: 18

prompt:
  shared:
    bundle_id: geometry_transformation_v0
    scene_key: transformation_graph_scene
    task_key: transformation_query
    object_description: a Reference polygon, one transformation cue, and six labeled candidate polygons A through F
    evidence_hint_template: 'set "evidence" to an array of exactly {vertex_count} pixel points [x,y] for the winning polygon vertices'
    answer_hint: 'set "answer" to the single-letter label of the correct polygon'

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.25
      transformation_reasoning: 0.40
      ambiguity: 0.25
      output_burden: 0.10
