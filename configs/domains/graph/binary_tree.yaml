generation:
  shared:
    node_count_min: 7
    node_count_max: 13
    max_depth: 4
    label_max_chars: 5
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
      named: 2.0
    scene_variant_weights:
      classic_tree: 1.0
      paper_tree: 1.0
      boxed_tree: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_label_variant_sampling: true
    balanced_scene_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_node_color_name_sampling: true
  task_overrides:
    task_graph__binary_tree__bst_path_operation_label:
      key_min: 10
      key_max: 99
    task_graph__binary_tree__child_structure_node_count:
      internal_count_min: 3
      internal_count_max: 7
    task_graph__binary_tree__depth_level_node_count:
      depth_min: 1
      depth_max: 4
    task_graph__binary_tree__heap_property_violation_label:
      key_min: 10
      key_max: 99
    task_graph__binary_tree__local_relative_node_label: {}
    task_graph__binary_tree__lowest_common_ancestor_label: {}
    task_graph__binary_tree__traversal_kth_label:
      traversal_position_min: 2
      traversal_position_max: 10

rendering:
  shared:
    canvas_width: 900
    canvas_height: 660
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 20
    node_radius_max_px: 26
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20
    context_text_probability: 0.25
    context_text_max_elements: 1
    context_block_probability: 0.1
    context_block_max_elements: 1
    context_block_position_weights:
      bottom: 1.0
      left: 0.5
      right: 0.5
    context_block_clutter_level_weights:
      low: 1.0
      medium: 0.5
      high: 0.0
  task_overrides: {}

prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
  task_overrides:
    task_graph__binary_tree__bst_path_operation_label:
      bundle_id: graph_relation_v0
      scene_key: search_tree_operation
      task_key: search_tree_operation_label_query
      object_description: a numeric-key binary search tree
      object_description_bst: a numeric-key binary search tree
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      annotation_hint_bst_search_terminal_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the visited binary-search path from the root through the answer node
      annotation_hint_bst_insert_parent_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the visited insertion path from the root through the parent node where the new key would attach
      json_example: '{"annotation":[[156,124,204,172],[250,250,298,298]],"answer":"42"}'
      json_example_answer_only: '{"answer":"42"}'
    task_graph__binary_tree__child_structure_node_count:
      bundle_id: graph_counting_v0
      scene_key: binary_tree_counting
      task_key: binary_tree_node_count_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      answer_hint: set "answer" to the count of matching nodes as an integer
      annotation_hint_leaf_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every leaf node
      annotation_hint_internal_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every internal node, meaning every non-leaf node
      annotation_hint_single_child_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node with exactly one child
      annotation_hint_two_child_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node with both left and right children
      json_example: '{"annotation":[[156,124,204,172],[470,430,520,480]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__binary_tree__depth_level_node_count:
      bundle_id: graph_counting_v0
      scene_key: binary_tree_counting
      task_key: binary_tree_node_count_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      answer_hint: set "answer" to the count of matching nodes as an integer
      annotation_hint_depth_level_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node at depth {target_depth}
      json_example: '{"annotation":[[156,124,204,172],[470,430,520,480]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__binary_tree__heap_property_violation_label:
      bundle_id: graph_relation_v0
      scene_key: search_tree_operation
      task_key: search_tree_operation_label_query
      object_description: a numeric-key binary tree intended to be a min-heap
      object_description_heap: a numeric-key binary tree intended to be a min-heap
      answer_hint: set "answer" to the violating child node label as a string exactly as shown
      annotation_hint: set "annotation" to a JSON object with keys "parent" and "child"; each value is a [x0,y0,x1,y1] pixel box around that node
      json_example: '{"annotation":{"parent":[156,124,204,172],"child":[250,250,298,298]},"answer":"42"}'
      json_example_answer_only: '{"answer":"42"}'
    task_graph__binary_tree__local_relative_node_label:
      bundle_id: graph_relation_v0
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      annotation_hint_parent_label: set "annotation" to a JSON object with keys "child" and "parent"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_left_child_label: set "annotation" to a JSON object with keys "parent" and "left_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_right_child_label: set "annotation" to a JSON object with keys "parent" and "right_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_sibling_label: set "annotation" to a JSON object with keys "node" and "sibling"; each value is a [x0,y0,x1,y1] pixel box around that node
      json_example: '{"annotation":{"child":[156,124,204,172],"parent":[470,430,520,480]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__lowest_common_ancestor_label:
      bundle_id: graph_relation_v0
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      annotation_hint_lowest_common_ancestor_label: set "annotation" to a JSON object with keys "node_a", "node_b", and "lowest_common_ancestor"; each value is a [x0,y0,x1,y1] pixel box around that node
      json_example: '{"annotation":{"node_a":[156,124,204,172],"node_b":[470,430,520,480],"lowest_common_ancestor":[250,250,298,298]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__traversal_kth_label:
      bundle_id: graph_order_v0
      scene_key: binary_tree_order
      task_key: binary_tree_traversal_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      answer_hint: set "answer" to the node label at the requested traversal position as a string
      annotation_hint_preorder_kth_node_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the preorder traversal nodes from the first visited node through the answer node
      annotation_hint_inorder_kth_node_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the inorder traversal nodes from the first visited node through the answer node
      annotation_hint_postorder_kth_node_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the postorder traversal nodes from the first visited node through the answer node
      annotation_hint_level_order_kth_node_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the level-order traversal nodes from the first visited node through the answer node
      json_example: '{"annotation":[[156,124,204,172],[250,250,298,298],[470,430,520,480]],"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
