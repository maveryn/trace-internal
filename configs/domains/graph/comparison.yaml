        letters: 1.0
        numbers: 1.0
        named: 2.0
      edge_routing_variant_weights:
        straight: 1.0
        mixed_arc: 1.0
      balanced_graph_directionality_sampling: true
      balanced_degree_mode_sampling: true
      balanced_extremum_mode_sampling: true
      balanced_label_variant_sampling: true
      balanced_edge_routing_variant_sampling: true

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.45
      visual_scan: 0.20
      ambiguity: 0.25
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_comparison_v0
    scene_key: single_graph_comparison
    task_key: largest_component_size_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled undirected graph
    question_text_largest_component_size: How many nodes are in the largest connected component?
    evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes in the unique largest connected component
    answer_hint: set "answer" to the size of that connected component as an integer
    json_example: '{"evidence":[[180,220],[310,180],[430,260],[520,340]],"answer":4}'
    json_example_answer_only: '{"answer":4}'
  task_overrides:
    task_graph__node_link__degree_extremum_value:
      task_key: extreme_degree_value_query
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes attaining the queried extreme degree value
      answer_hint: set "answer" to the queried extreme degree value as an integer
      json_example: '{"evidence":[[180,220],[310,180]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
