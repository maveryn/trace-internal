    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true
  task_overrides:
    graph_node_link_largest_component_size_internal:
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
        named: 2.0
      edge_routing_variant_weights:
        straight: 1.0
        mixed_arc: 1.0
      balanced_label_variant_sampling: true
      balanced_edge_routing_variant_sampling: true
    task_graph__node_link__degree_extremum_value:
      graph_directionality_weights:
        undirected: 1.0
        directed: 1.0
      degree_mode_weights:
        in_degree: 1.0
        out_degree: 1.0
        total_degree: 1.0
