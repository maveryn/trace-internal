generation:
  shared:
    task_variant_weights:
      degree_count: 1.0
      in_degree_count: 1.0
      out_degree_count: 1.0
    balanced_task_variant_sampling: true
    node_count_min: 5
    node_count_max: 10
    directed_node_count_max: 9
    query_degree_min: 0
    query_degree_max: 4
    target_count_min: 0
    target_count_max: 5
    degree_sequence_max_degree: 5
    directed_degree_sequence_max_degree: 4
    graph_search_attempts: 600
    topology_profile_weights:
      balanced: 1.0
      low_degree: 1.0
      hub_heavy: 1.0
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
    layout_variant_weights:
      circular: 1.0
      shell: 1.0
      spring: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    layout_transform_variant_weights:
      identity: 1.0
      rotate_90: 1.0
      rotate_180: 1.0
      rotate_270: 1.0
      mirror_left_right: 1.0
      mirror_up_down: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_topology_profile_sampling: true
    balanced_label_variant_sampling: true
    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true
  task_overrides:
    task_graph_counting_articulation_point_count:
      task_variant_weights:
        articulation_point_count: 1.0
      node_count_min: 5
      node_count_max: 10
      target_count_min: 0
      target_count_max: 8

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.40
      visual_scan: 0.30
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_counting_v1
    task_family_key: single_graph_counting
    task_key: degree_count_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    object_description_undirected: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_degree_count: How many nodes have degree {query_degree}?
    question_text_in_degree_count: How many nodes have in-degree {query_degree}?
    question_text_out_degree_count: How many nodes have out-degree {query_degree}?
    evidence_hint: set "evidence" to an array containing the labels of all nodes whose asked degree equals the queried value
    answer_hint: set "answer" to the count of matching nodes as an integer
    json_example: '{"evidence":["B","F"],"answer":2}'
    json_example_answer_only: '{"answer":2}'
  task_overrides:
    task_graph_counting_articulation_point_count:
      task_key: articulation_point_count_query
      object_description_undirected: a labeled undirected graph
      question_text_articulation_point_count: How many nodes are articulation points?
      evidence_hint: set "evidence" to an array containing the labels of all articulation-point nodes
      answer_hint: set "answer" to the count of articulation-point nodes as an integer
      json_example: '{"evidence":["B","D","G"],"answer":3}'
      json_example_answer_only: '{"answer":3}'
