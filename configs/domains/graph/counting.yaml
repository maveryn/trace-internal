    criteria_weights:
      topology_reasoning: 0.40
      visual_scan: 0.30
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_counting_v0
    scene_key: single_graph_counting
    task_key: degree_count_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description_undirected: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_degree_count: How many nodes have degree {query_degree}?
    question_text_in_degree: How many nodes have in-degree {query_degree}?
    question_text_out_degree: How many nodes have out-degree {query_degree}?
    evidence_hint_degree_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes with degree {query_degree}; use an empty array when the answer is zero
    evidence_hint_in_degree_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes with in-degree {query_degree}; use an empty array when the answer is zero
    evidence_hint_out_degree_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes with out-degree {query_degree}; use an empty array when the answer is zero
    answer_hint: set "answer" to the count of matching nodes as an integer
    json_example: '{"evidence":[[180,220],[310,180]],"answer":2}'
    json_example_answer_only: '{"answer":2}'
  task_overrides:
    task_graph__adjacency__component_count:
      scene_key: adjacency_representation_counting
      task_key: adjacency_component_count_query
      object_description_undirected_list: an undirected graph shown as an adjacency list
      object_description_directed_list: a directed graph shown as an adjacency list
      object_description_undirected_matrix: an undirected graph shown as an adjacency matrix
      object_description_directed_matrix: a directed graph shown as an adjacency matrix
      evidence_hint_undirected_component_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around one row label from each connected component
      evidence_hint_directed_strong_component_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around one row label from each strongly connected component
      answer_hint: set "answer" to the number of components as an integer
      json_example: '{"evidence":[[70,126,158,158],[70,318,158,350]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__binary_tree__node_property_count:
      scene_key: binary_tree_counting
      task_key: binary_tree_node_count_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      evidence_hint_leaf_node_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every leaf node
      evidence_hint_internal_node_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every internal node, meaning every non-leaf node
      evidence_hint_single_child_node_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node with exactly one child
      evidence_hint_two_child_node_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node with both left and right children
      evidence_hint_depth_level_node_count: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around every node at depth {target_depth}
      answer_hint: set "answer" to the count of matching nodes as an integer
      json_example: '{"evidence":[[156,124,204,172],[470,430,520,480]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__articulation_point_count:
      task_key: articulation_point_count_query
      object_description_undirected: a labeled undirected graph
      question_text_articulation_point_count: How many nodes are articulation points?
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all articulation-point nodes
      answer_hint: set "answer" to the count of articulation-point nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__node_link__named_node_degree_value:
      task_key: named_node_degree_value_query
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint_named_node_degree_value: set "evidence" to an array of point-pair arrays, where each pair contains [x,y] pixel points at the centers of the two endpoint nodes of one edge touching node {query_label}; use an empty array when the answer is zero
      evidence_hint_named_node_in_degree_value: set "evidence" to an array of point-pair arrays for every arrow pointing into node {query_label}; each pair is two [x,y] pixel points in source-to-target order, [[source_x,source_y],[target_x,target_y]]; use an empty array when the answer is zero
      evidence_hint_named_node_out_degree_value: set "evidence" to an array of point-pair arrays for every arrow leaving node {query_label}; each pair is two [x,y] pixel points in source-to-target order, [[source_x,source_y],[target_x,target_y]]; use an empty array when the answer is zero
      evidence_hint_named_node_total_degree_value: set "evidence" to an array of point-pair arrays for every arrow touching node {query_label}; each pair is two [x,y] pixel points in image pixel coordinates, kept in source-to-target order; use an empty array when the answer is zero
      answer_hint: set "answer" to the queried node degree as an integer
      json_example: '{"evidence":[[[180,220],[310,180]],[[180,220],[430,260]]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    graph_node_link_source_sink_count_internal:
      task_key: source_sink_count_query
      object_description_directed: a labeled directed graph
      evidence_hint_source_count: set "evidence" to an array of [x,y] pixel points at the centers of all source nodes, meaning nodes with no incoming arrows; use an empty array when the answer is zero
      evidence_hint_sink_count: set "evidence" to an array of [x,y] pixel points at the centers of all sink nodes, meaning nodes with no outgoing arrows; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of matching nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__node_color_count:
      task_key: node_color_count_query
      object_description_undirected: a labeled undirected graph with colored nodes
      object_description_directed: a labeled directed graph with colored nodes
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes colored {target_color_label}
      answer_hint: set "answer" to the count of matching nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__node_link__edge_color_count:
      task_key: edge_color_count_query
      object_description_undirected: a labeled undirected graph with colored edges
      object_description_directed: a labeled directed graph with colored edges
      evidence_hint: set "evidence" to an array of point-pair arrays, where each pair contains [x,y] pixel points at the centers of the two endpoint nodes of one edge colored {target_color_label}; for directed graphs, keep each pair in source-to-target order; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of matching edges as an integer
      json_example: '{"evidence":[[[180,220],[310,180]],[[180,220],[430,260]]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__edge_text_count:
      task_key: edge_text_label_count_query
      object_description_undirected: a labeled undirected graph with visible boxed text labels on its edges
      object_description_directed: a labeled directed graph with visible boxed text labels on its arrows
      evidence_hint: set "evidence" to an array of [x0,y0,x1,y1] boxes around every visible edge-label text box that reads "{target_edge_label}"
      answer_hint: set "answer" to the count of matching edge-label boxes as an integer
      json_example: '{"evidence":[[240,190,308,214],[412,238,480,262]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__cross_color_edge_count:
      task_key: cross_color_edge_count_query
      object_description_undirected: a labeled undirected graph with colored nodes
      object_description_directed: a labeled directed graph with colored nodes
      evidence_hint_cross_color_edge_count: set "evidence" to an array of point-pair arrays, where each pair contains [x,y] pixel points at the centers of the two endpoint nodes of one edge connecting a {source_color_label} node and a {target_color_label} node; use an empty array when the answer is zero
      evidence_hint_directed_cross_color_edge_count: set "evidence" to an array of point-pair arrays for every arrow from a {source_color_label} node to a {target_color_label} node; each pair is two [x,y] pixel points in source-to-target order, [[source_x,source_y],[target_x,target_y]]; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of matching edges as an integer
      json_example: '{"evidence":[[[180,220],[310,180]],[[180,220],[430,260]]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__isolated_after_removal_count:
      task_key: isolated_node_count_after_node_removal_query
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all remaining nodes that would be isolated after removing {query_label}; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of those remaining isolated nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    graph_node_link_degree_filter_count_internal:
      task_key: node_count_after_degree_filter_query
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint_undirected_degree_one_filter_remaining_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes that would remain after removing every node with degree 1; use an empty array when the answer is zero
      evidence_hint_directed_in_degree_one_filter_remaining_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes that would remain after removing every node with in-degree 1; use an empty array when the answer is zero
      evidence_hint_directed_out_degree_one_filter_remaining_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes that would remain after removing every node with out-degree 1; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of remaining nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__node_link__bridge_count:
      task_key: bridge_count_query
      object_description_undirected: a labeled undirected graph
      question_text_bridge_count: How many edges are bridges?
      evidence_hint: set "evidence" to an array of point-pair arrays, where each pair contains [x,y] pixel points at the centers of the two endpoint nodes of one bridge edge
      answer_hint: set "answer" to the count of bridge edges as an integer
      json_example: '{"evidence":[[[180,220],[310,180]],[[310,180],[430,260]]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__pipe_network__bridge_count:
      task_key: bridge_count_query
