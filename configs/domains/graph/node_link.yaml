prompt:
  task_overrides:
    graph_binary_tree_node_property_count_source:
      bundle_id: graph_counting_v0
      scene_key: binary_tree_counting
      task_key: binary_tree_node_count_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
        in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer"
        for the final answer.
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      question_text_degree_count: How many nodes have degree {query_degree}?
      question_text_in_degree: How many nodes have in-degree {query_degree}?
      question_text_out_degree: How many nodes have out-degree {query_degree}?
      annotation_hint_degree_count: set "annotation" to an array of [x,y] pixel points
        at the centers of all nodes with degree {query_degree}; use an empty array
        when the answer is zero
      annotation_hint_in_degree_count: set "annotation" to an array of [x,y] pixel
        points at the centers of all nodes with in-degree {query_degree}; use an empty
        array when the answer is zero
      annotation_hint_out_degree_count: set "annotation" to an array of [x,y] pixel
        points at the centers of all nodes with out-degree {query_degree}; use an
        empty array when the answer is zero
      answer_hint: set "answer" to the count of matching nodes as an integer
      json_example: '{"annotation":[[156,124,204,172],[470,430,520,480]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
      object_description: a labeled binary tree with the root at the top and left/right
        children shown by position
      annotation_hint_leaf_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1]
        boxes in image pixel coordinates around every leaf node
      annotation_hint_internal_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1]
        boxes in image pixel coordinates around every internal node, meaning every
        non-leaf node
      annotation_hint_single_child_node_count: set "annotation" to a JSON array of
        [x0,y0,x1,y1] boxes in image pixel coordinates around every node with exactly
        one child
      annotation_hint_two_child_node_count: set "annotation" to a JSON array of [x0,y0,x1,y1]
        boxes in image pixel coordinates around every node with both left and right
        children
      annotation_hint_depth_level_node_count: set "annotation" to a JSON array of
        [x0,y0,x1,y1] boxes in image pixel coordinates around every node at depth
        {target_depth}
    graph_binary_tree_node_relation_label_source:
      bundle_id: graph_relation_v0
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
        in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer"
        for the final answer.
      object_description: a labeled binary tree with the root at the top and left/right
        children shown by position
      object_description_directed: a labeled directed graph
      question_text_same_component_count: How many nodes, including node {query_label}
        itself, are in the same connected component as {query_label}?
      annotation_hint: set "annotation" to an array of [x,y] pixel points at the centers
        of all nodes in the connected component containing the asked node, including
        the asked node itself
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"annotation":{"child":[156,124,204,172],"parent":[470,430,520,480]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
      annotation_hint_parent_label: set "annotation" to a JSON object with keys "child"
        and "parent"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_left_child_label: set "annotation" to a JSON object with keys
        "parent" and "left_child"; each value is a [x0,y0,x1,y1] pixel box around
        that node
      annotation_hint_right_child_label: set "annotation" to a JSON object with keys
        "parent" and "right_child"; each value is a [x0,y0,x1,y1] pixel box around
        that node
      annotation_hint_sibling_label: set "annotation" to a JSON object with keys "node"
        and "sibling"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_lowest_common_ancestor_label: set "annotation" to a JSON object
        with keys "node_a", "node_b", and "lowest_common_ancestor"; each value is
        a [x0,y0,x1,y1] pixel box around that node
    graph_metro_single_route_station_count_internal:
      bundle_id: graph_counting_v0
      scene_key: metro_route_counting
      task_key: metro_single_route_station_count_query
      json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
        in that order for the final answer.
      json_output_contract_answer_only: Use a valid JSON object with key "answer"
        for the final answer.
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      question_text_degree_count: How many nodes have degree {query_degree}?
