generation:
  shared:
    task_variant_weights:
      topological_position: 1.0
    balanced_task_variant_sampling: true
    node_count_min: 5
    node_count_max: 7
    target_position_min: 1
    target_position_max: 7
    topology_profile_weights:
      balanced: 1.0
      low_degree: 1.0
      hub_heavy: 1.0
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
    layout_variant_weights:
      circular: 1.0
      shell: 1.0
      spring: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    layout_transform_variant_weights:
      identity: 1.0
      rotate_90: 1.0
      rotate_180: 1.0
      rotate_270: 1.0
      mirror_left_right: 1.0
      mirror_up_down: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_topology_profile_sampling: true
    balanced_label_variant_sampling: true
    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.50
      visual_scan: 0.20
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_order_v1
    task_family_key: single_graph_order
    task_key: topological_position_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled directed acyclic graph with a unique topological order
    question_text_topological_position: What is the position of node {query_label} in the unique topological order, counting from 1?
    evidence_hint: set "evidence" to an ordered array containing all node labels in the unique topological order from first to last
    answer_hint: set "answer" to the 1-based position of node {query_label} in that order as an integer
    json_example: '{"evidence":["A","B","C","D","E"],"answer":3}'
    json_example_answer_only: '{"answer":3}'
