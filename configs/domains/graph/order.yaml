complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.50
      visual_scan: 0.20
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_order_v0
    scene_key: single_graph_order
    task_key: topological_position_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled directed acyclic graph
    question_text_topological_position: What is the position of node {query_label} in the unique topological order, counting from 1?
    evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at node centers in the unique topological order from first to last
    answer_hint: set "answer" to the 1-based position of node {query_label} in that order as an integer
    json_example: '{"evidence":[[140,220],[260,180],[380,240],[500,300],[620,260]],"answer":3}'
    json_example_answer_only: '{"answer":3}'
  task_overrides:
    task_graph__adjacency__traversal_kth_label:
      scene_key: adjacency_representation_order
      task_key: adjacency_traversal_label_query
      object_description: a directed graph shown as an adjacency list
      evidence_hint: set "evidence" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around the row labels visited from the source row through the answer row
      answer_hint: set "answer" to the node label at the requested visit position as a string
      json_example: '{"evidence":[[70,126,158,158],[70,174,158,206],[70,222,158,254]],"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__traversal_kth_label:
      scene_key: binary_tree_order
      task_key: binary_tree_traversal_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      evidence_hint: set "evidence" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the traversal nodes from the first visited node through the answer node
      answer_hint: set "answer" to the node label at the requested traversal position as a string
      json_example: '{"evidence":[[156,124,204,172],[250,250,298,298],[470,430,520,480]],"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
