    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20
  task_overrides:
    task_graph__adjacency__traversal_kth_label:
      canvas_width: 900
      canvas_height: 640
      label_font_size_px: 20
    task_graph__binary_tree__traversal_kth_label:
      canvas_width: 900
      canvas_height: 660
