generation:
  shared:
    task_variant_weights:
      shortest_path_length: 1.0
      directed_shortest_path_length: 1.0
    balanced_task_variant_sampling: true
    node_count_min: 5
    node_count_max: 10
    directed_node_count_max: 9
    target_shortest_path_length_min: 1
    target_shortest_path_length_max: 5
    topology_profile_weights:
      balanced: 1.0
      low_degree: 1.0
      hub_heavy: 1.0
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
    layout_variant_weights:
      circular: 1.0
      shell: 1.0
      spring: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    layout_transform_variant_weights:
      identity: 1.0
      rotate_90: 1.0
      rotate_180: 1.0
      rotate_270: 1.0
      mirror_left_right: 1.0
      mirror_up_down: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_topology_profile_sampling: true
    balanced_label_variant_sampling: true
    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.50
      visual_scan: 0.20
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_path_v1
    task_family_key: single_graph_path
    task_key: shortest_path_length_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    object_description: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_shortest_path_length: The graph has a unique shortest path from node {source_label} to node {goal_label}. How many edges are in that path?
    question_text_directed_shortest_path_length: The directed graph has a unique shortest path from node {source_label} to node {goal_label}, following the direction of the arrows. How many edges are in that path?
    evidence_hint: set "evidence" to an array of the node labels along that unique shortest path in order from node {source_label} to node {goal_label}, including both endpoints
    answer_hint: set "answer" to the number of edges in that path as an integer
    json_example: '{"evidence":["B","D","H"],"answer":2}'
    json_example_answer_only: '{"answer":2}'
