generation:
  shared:
    node_count_min: 5
    node_count_max: 15
    directed_node_count_max: 15
    target_shortest_path_length_min: 3
    target_shortest_path_length_max: 7
    topology_profile_weights:
      balanced: 1.0
      low_degree: 1.0
      hub_heavy: 1.0
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
      named: 2.0
    layout_variant_weights:
      circular: 1.0
      shell: 1.0
      spring: 1.0
      grid_jitter: 1.0
      layered: 1.0
      component_clustered: 1.0
      path_spine: 1.0
      radial_tree: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    layout_transform_variant_weights:
      identity: 1.0
      rotate_90: 1.0
      rotate_180: 1.0
      rotate_270: 1.0
      mirror_left_right: 1.0
      mirror_up_down: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_topology_profile_sampling: true
    balanced_label_variant_sampling: true
    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true
  task_overrides:
    task_graph__node_link__shortest_path_length:
      query_id_weights:
        shortest_path_length: 1.0
        directed_shortest_path_length: 1.0
      layout_variant_weights:
        circular: 1.0
        shell: 1.0
        spring: 1.0
        grid_jitter: 1.0
        layered: 1.0
        component_clustered: 1.0
        path_spine: 1.0
        radial_tree: 1.0
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
        named: 2.0
      edge_routing_variant_weights:
        straight: 1.0
        mixed_arc: 1.0
      balanced_query_id_sampling: true
      balanced_label_variant_sampling: true
      balanced_edge_routing_variant_sampling: true
    task_graph__node_link__longest_path_length:
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
        named: 2.0
      edge_routing_variant_weights:
        straight: 1.0
        mixed_arc: 1.0
      balanced_target_longest_path_length_sampling: true
      balanced_label_variant_sampling: true
      balanced_edge_routing_variant_sampling: true
      node_count_min: 5
      directed_node_count_max: 10
      target_longest_path_length_min: 2
      target_longest_path_length_max: 6
    task_graph__pipe_network__shortest_path_length:
      node_count_min: 6
      node_count_max: 13
      target_shortest_path_length_min: 2
      target_shortest_path_length_max: 6
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
      grid_shape_variant_weights:
        3x4: 1.0
        3x5: 1.0
        4x4: 1.0
        4x5: 1.0
      balanced_label_variant_sampling: true
      balanced_grid_shape_variant_sampling: true
    task_graph__metro__shortest_path_length:
      route_count_min: 3
      route_count_max: 5
      target_shortest_path_length_min: 2
      target_shortest_path_length_max: 6
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
        named: 2.0
      balanced_label_variant_sampling: true
    task_graph__metro__transfer_count:
      route_count_min: 3
      route_count_max: 5
      target_count_min: 0
      target_count_max: 4
      label_variant_weights:
        letters: 1.0
        numbers: 1.0
        named: 1.0
      balanced_label_variant_sampling: true

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.50
      visual_scan: 0.20
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_path_v0
    scene_key: single_graph_path
    task_key: shortest_path_length_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_shortest_path_length: The graph has a unique shortest path from node {source_label} to node {goal_label}. How many edges are in that path?
    question_text_directed_shortest_path_length: There is a unique shortest path from node {source_label} to node {goal_label} when following the direction of the arrows. How many edges are in that path?
    evidence_hint_shortest_path_length: set "evidence" to an ordered array of [x,y] pixel points at node centers along the unique shortest path from node {source_label} to node {goal_label}, including both endpoints
    evidence_hint_directed_shortest_path_length: set "evidence" to an ordered array of [x,y] pixel points at node centers along the unique shortest path from node {source_label} to node {goal_label} while following arrow directions, including both endpoints
    answer_hint: set "answer" to the number of edges in that path as an integer
    json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":2}'
    json_example_answer_only: '{"answer":2}'
  task_overrides:
    task_graph__node_link__longest_path_length:
      task_key: longest_path_length_query
      object_description_directed: a labeled directed acyclic graph
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at node centers along the unique longest directed path, from its start node to its end node
      answer_hint: set "answer" to the number of directed edges in that path as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__pipe_network__shortest_path_length:
      task_key: shortest_path_length_query
      object_description: a labeled pipe-junction network with open pipes and blocked pipes
      question_text_shortest_path_length: The pipe network has a unique shortest open route from junction {source_label} to junction {goal_label}. Ignoring blocked pipes, how many open pipe segments are in that route?
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at junction centers along the unique shortest open route from {source_label} to {goal_label}, including both endpoints
      answer_hint: set "answer" to the number of open pipe segments in that route as an integer
      json_example: '{"evidence":[[180,220],[310,220],[430,300]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__metro__shortest_path_length:
      scene_key: metro_route_path
      task_key: shortest_path_length_query
      object_description: a labeled metro route map with colored routes and stations
      question_text_shortest_path_length: The metro map has a unique shortest station path from station {source_label} to station {goal_label}. How many route segments are in that path?
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at station centers along the unique shortest path from station {source_label} to station {goal_label}, including both endpoints
      answer_hint: set "answer" to the number of route segments in that path as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__metro__transfer_count:
      scene_key: metro_route_path
      task_key: metro_transfer_count_query
      object_description: a labeled metro route map with colored routes and stations
      question_text_metro_transfer_count: Travel from station {source_label} to station {goal_label}, stopping at station {via_label}. What is the fewest number of colored-route changes needed?
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at station centers along the selected minimum-transfer path in travel order; the first point is station {source_label}, the sequence includes station {via_label}, and the last point is station {goal_label}
      answer_hint: set "answer" to the fewest route-change count as an integer; travel only along drawn route segments, and one route change means switching from one colored route to another at a station
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
