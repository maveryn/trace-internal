generation:
  shared:
    task_variant_weights:
      same_component_count: 1.0
    balanced_task_variant_sampling: true
    node_count_min: 5
    node_count_max: 10
    component_count_min: 2
    component_count_max: 4
    target_component_size_min: 1
    target_component_size_max: 6
    topology_profile_weights:
      balanced: 1.0
      low_degree: 1.0
      hub_heavy: 1.0
    label_variant_weights:
      letters: 1.0
      numbers: 1.0
    layout_variant_weights:
      circular: 1.0
      shell: 1.0
      spring: 1.0
    node_shape_variant_weights:
      circle: 1.0
      rounded_square: 1.0
      hexagon: 1.0
    layout_transform_variant_weights:
      identity: 1.0
      rotate_90: 1.0
      rotate_180: 1.0
      rotate_270: 1.0
      mirror_left_right: 1.0
      mirror_up_down: 1.0
    node_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_topology_profile_sampling: true
    balanced_label_variant_sampling: true
    balanced_layout_variant_sampling: true
    balanced_node_shape_variant_sampling: true
    balanced_layout_transform_variant_sampling: true
    balanced_node_color_name_sampling: true
  task_overrides:
    task_graph_relation_unique_cycle_size:
      task_variant_weights:
        unique_cycle_size: 1.0
      node_count_min: 5
      node_count_max: 10
      target_cycle_size_min: 3
      target_cycle_size_max: 10

rendering:
  shared:
    canvas_width: 864
    canvas_height: 640
    outer_margin_px: 28
    panel_padding_px: 24
    panel_corner_radius_px: 20
    panel_title_font_size_px: 24
    node_radius_min_px: 18
    node_radius_max_px: 24
    edge_width_px: 4
    arrow_length_px: 12
    arrow_width_px: 7
    node_border_width_px: 2
    label_font_size_px: 20

complexity:
  shared:
    criteria_weights:
      topology_reasoning: 0.45
      visual_scan: 0.25
      ambiguity: 0.20
      clutter: 0.10

prompt:
  shared:
    bundle_id: graph_relation_v1
    task_family_key: single_graph_relation
    task_key: same_component_count_query
    json_output_contract: Return a valid JSON object with keys "evidence" and "answer" in that order.
    json_output_contract_answer_only: Return a valid JSON object with key "answer".
    object_description: a labeled undirected graph
    question_text_same_component_count: How many nodes, including node {query_label} itself, are in the same connected component as {query_label}?
    evidence_hint: set "evidence" to an array containing the labels of all nodes in the connected component containing the asked node, including the asked node itself
    answer_hint: set "answer" to the count of those nodes as an integer
    json_example: '{"evidence":["B","F","H"],"answer":3}'
    json_example_answer_only: '{"answer":3}'
  task_overrides:
    task_graph_relation_unique_cycle_size:
      task_key: unique_cycle_size_query
      object_description: a labeled undirected graph that contains exactly one cycle
      question_text_unique_cycle_size: The graph contains exactly one cycle. How many nodes are in that cycle?
      evidence_hint: set "evidence" to an array containing the labels of all nodes in the unique cycle
      answer_hint: set "answer" to the number of nodes in the unique cycle as an integer
      json_example: '{"evidence":["B","D","H","J"],"answer":4}'
      json_example_answer_only: '{"answer":4}'
