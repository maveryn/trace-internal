prompt:
  shared:
    bundle_id: graph_relation_v0
    scene_key: single_graph_relation
    task_key: same_component_count_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_same_component_count: How many nodes, including node {query_label} itself, are in the same connected component as {query_label}?
    annotation_hint: set "annotation" to an array of [x,y] pixel points at the centers of all nodes in the connected component containing the asked node, including the asked node itself
    answer_hint: set "answer" to the count of those nodes as an integer
    json_example: '{"annotation":[[180,220],[310,180],[430,260]],"answer":3}'
    json_example_answer_only: '{"answer":3}'
  task_overrides:
    graph_binary_tree_node_relation_label_source:
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      annotation_hint_parent_label: set "annotation" to a JSON object with keys "child" and "parent"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_left_child_label: set "annotation" to a JSON object with keys "parent" and "left_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_right_child_label: set "annotation" to a JSON object with keys "parent" and "right_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_sibling_label: set "annotation" to a JSON object with keys "node" and "sibling"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_lowest_common_ancestor_label: set "annotation" to a JSON object with keys "node_a", "node_b", and "lowest_common_ancestor"; each value is a [x0,y0,x1,y1] pixel box around that node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"annotation":{"child":[156,124,204,172],"parent":[470,430,520,480]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__local_relative_node_label:
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      annotation_hint_parent_label: set "annotation" to a JSON object with keys "child" and "parent"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_left_child_label: set "annotation" to a JSON object with keys "parent" and "left_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_right_child_label: set "annotation" to a JSON object with keys "parent" and "right_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_sibling_label: set "annotation" to a JSON object with keys "node" and "sibling"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_lowest_common_ancestor_label: set "annotation" to a JSON object with keys "node_a", "node_b", and "lowest_common_ancestor"; each value is a [x0,y0,x1,y1] pixel box around that node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"annotation":{"child":[156,124,204,172],"parent":[470,430,520,480]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__lowest_common_ancestor_label:
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      annotation_hint_parent_label: set "annotation" to a JSON object with keys "child" and "parent"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_left_child_label: set "annotation" to a JSON object with keys "parent" and "left_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_right_child_label: set "annotation" to a JSON object with keys "parent" and "right_child"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_sibling_label: set "annotation" to a JSON object with keys "node" and "sibling"; each value is a [x0,y0,x1,y1] pixel box around that node
      annotation_hint_lowest_common_ancestor_label: set "annotation" to a JSON object with keys "node_a", "node_b", and "lowest_common_ancestor"; each value is a [x0,y0,x1,y1] pixel box around that node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"annotation":{"node_a":[156,124,204,172],"node_b":[470,430,520,480],"lowest_common_ancestor":[250,250,298,298]},"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__phylogeny_tree__sister_leaf_label:
      scene_key: phylogeny_tree_relation
      task_key: phylogeny_tree_relation_query
      object_description: a rooted phylogeny cladogram with labeled taxa
      annotation_hint: set "annotation" to a JSON object with keys "target_leaf", "sister_leaf", and "shared_parent"; each value is a [x0,y0,x1,y1] pixel box around that visual witness
      answer_hint: set "answer" to the sister taxon label as a string exactly as shown
      json_example: '{"annotation":{"target_leaf":[720,180,746,204],"sister_leaf":[720,248,746,272],"shared_parent":[510,208,528,226]},"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_graph__phylogeny_tree__mrca_clade_membership_count:
      scene_key: phylogeny_tree_relation
      task_key: phylogeny_tree_relation_query
      object_description: a rooted phylogeny cladogram with labeled taxa
      annotation_hint: set "annotation" to a JSON object with keys "query_leaf_1", "query_leaf_2", and "mrca"; each value is a [x0,y0,x1,y1] pixel box around that visual witness
      answer_hint: set "answer" to the number of taxa descending from the most recent common ancestor as an integer
      json_example: '{"annotation":{"query_leaf_1":[720,180,746,204],"query_leaf_2":[720,360,746,384],"mrca":[440,250,458,268]},"answer":4}'
      json_example_answer_only: '{"answer":4}'
    task_graph__phylogeny_tree__topology_outlier_label:
      scene_key: phylogeny_tree_options
      task_key: phylogeny_tree_topology_outlier_query
      object_description: six labeled rooted phylogeny cladograms with the same taxon labels
      annotation_hint: set "annotation" to an array containing exactly one [x0,y0,x1,y1] pixel box around the selected option panel
      answer_hint: set "answer" to the exact option letter of the topology outlier
      json_example: '{"annotation":[[472,520,828,742]],"answer":"D"}'
      json_example_answer_only: '{"answer":"D"}'
    task_graph__pedigree_chart__relationship_label:
      scene_key: pedigree_chart_relation
      task_key: pedigree_chart_relationship_query
      object_description: a pedigree chart with generation labels, person labels, sex symbols, partner links, parent-child links, and six relationship options
      annotation_hint: set "annotation" to a JSON object with role keys such as "person_a", "person_b", "shared_parent_1", or "middle_parent"; each value is a [x0,y0,x1,y1] pixel box around that pedigree person symbol
      answer_hint: set "answer" to the exact option letter for the correct relationship
      json_example: '{"annotation":{"person_a":[220,210,260,250],"person_b":[410,340,450,380]},"answer":"A"}'
      json_example_answer_only: '{"answer":"A"}'
    task_graph__pedigree_chart__relatedness_coefficient_label:
      scene_key: pedigree_chart_relation
      task_key: pedigree_chart_relatedness_coefficient_query
      object_description: a pedigree chart with generation labels, person labels, sex symbols, partner links, parent-child links, and six fraction options
      annotation_hint: set "annotation" to a JSON object with role keys such as "person_a", "person_b", "shared_ancestor_1", or "path_1_a_1"; each value is a [x0,y0,x1,y1] pixel box around that pedigree person symbol
      answer_hint: set "answer" to the exact option letter for the correct relatedness coefficient
      json_example: '{"annotation":{"person_a":[220,210,260,250],"person_b":[410,340,450,380]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_graph__binary_tree__bst_path_operation_label:
      scene_key: search_tree_operation
      task_key: search_tree_operation_label_query
      object_description: a numeric-key binary search tree
      object_description_bst: a numeric-key binary search tree
      annotation_hint_bst_search_terminal_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the visited binary-search path from the root through the answer node
      annotation_hint_bst_insert_parent_label: set "annotation" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the visited insertion path from the root through the parent node where the new key would attach
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"annotation":[[156,124,204,172],[250,250,298,298]],"answer":"42"}'
      json_example_answer_only: '{"answer":"42"}'
    task_graph__binary_tree__heap_property_violation_label:
      scene_key: search_tree_operation
      task_key: search_tree_operation_label_query
      object_description: a numeric-key binary tree intended to be a min-heap
      object_description_heap: a numeric-key binary tree intended to be a min-heap
      annotation_hint: set "annotation" to a JSON object with keys "parent" and "child"; each value is a [x0,y0,x1,y1] pixel box around that node
      answer_hint: set "answer" to the violating child node label as a string exactly as shown
      json_example: '{"annotation":{"parent":[156,124,204,172],"child":[250,250,298,298]},"answer":"42"}'
      json_example_answer_only: '{"answer":"42"}'
    graph_node_link_reachable_node_count_source:
      task_key: reachable_count_query
      question_text_reachable_count: How many nodes, including node {query_label} itself, are reachable from {query_label} by following the direction of the arrows?
