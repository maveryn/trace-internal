prompt:
  shared:
    bundle_id: graph_relation_v0
    scene_key: single_graph_relation
    task_key: same_component_count_query
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    object_description: a labeled undirected graph
    object_description_directed: a labeled directed graph
    question_text_same_component_count: How many nodes, including node {query_label} itself, are in the same connected component as {query_label}?
    evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes in the connected component containing the asked node, including the asked node itself
    answer_hint: set "answer" to the count of those nodes as an integer
    json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
    json_example_answer_only: '{"answer":3}'
  task_overrides:
    task_graph__binary_tree__node_relation_label:
      scene_key: binary_tree_relation
      task_key: binary_tree_node_label_query
      object_description: a labeled binary tree with the root at the top and left/right children shown by position
      evidence_hint: set "evidence" to a JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates around the node or nodes named in the question and the answer node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"evidence":[[156,124,204,172],[470,430,520,480]],"answer":"M"}'
      json_example_answer_only: '{"answer":"M"}'
    task_graph__binary_tree__tree_operation_label:
      scene_key: search_tree_operation
      task_key: search_tree_operation_label_query
      object_description: a numeric-key binary tree for a binary-search-tree or min-heap operation
      object_description_bst: a numeric-key binary search tree
      object_description_heap: a numeric-key binary tree intended to be a min-heap
      evidence_hint: set "evidence" to an ordered JSON array of [x0,y0,x1,y1] boxes in image pixel coordinates for the visited path or checked parent-child pair, ending at the answer node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"evidence":[[156,124,204,172],[250,250,298,298]],"answer":"42"}'
      json_example_answer_only: '{"answer":"42"}'
    task_graph__node_link__reachable_node_count:
      task_key: reachable_count_query
      question_text_reachable_count: How many nodes, including node {query_label} itself, are reachable from {query_label} by following the direction of the arrows?
      evidence_hint_reachable_count: set "evidence" to an array of [x,y] pixel points at the centers of all nodes reachable from {query_label}, including {query_label} itself
      answer_hint: set "answer" to the count of those nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    graph_node_link_reachable_count_after_edge_edit_internal:
      task_key: reachable_count_after_edge_edit_query
      object_description_directed: a labeled directed graph
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes that would be reachable from {query_label} after the hypothetical arrow edit, including {query_label}
      answer_hint: set "answer" to the count of those nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__node_link__common_neighbor_count:
      task_key: common_neighbor_count_query
      object_description: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of every node that matches the requested common-neighbor, common-successor, or common-predecessor condition for {query_label_a} and {query_label_b}; use an empty array when the answer is zero
      answer_hint: set "answer" to the count of those nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_graph__node_link__edge_attribute_label:
      task_key: edge_attribute_label_query
      object_description_undirected: a graph with text labels on its edges
      object_description_directed: a directed graph with text labels on its arrows
      evidence_hint: set "evidence" to an array containing one [x0,y0,x1,y1] box around the visible text label on the queried edge or arrow
      answer_hint: set "answer" to that edge label as a lowercase string
      json_example: '{"evidence":[[240,190,308,214]],"answer":"feeds"}'
      json_example_answer_only: '{"answer":"feeds"}'
    task_graph__graph_options__structure_match_label:
      scene_key: graph_options
      task_key: structure_match_label_query
      object_description_undirected: a reference or target labeled graph above six labeled graph options
      object_description_directed: a reference or target labeled directed graph above six labeled directed-graph options; arrow directions matter
      evidence_hint: set "evidence" to an array containing exactly one [x0,y0,x1,y1] pixel box around the selected option panel
      answer_hint: set "answer" to the exact option letter of the correct graph
      json_example: '{"evidence":[[472,520,828,742]],"answer":"D"}'
      json_example_answer_only: '{"answer":"D"}'
    task_graph__node_link__unique_node_label:
      task_key: unique_node_label_query
      object_description_undirected: a labeled undirected graph
      object_description_directed: a labeled directed graph
      evidence_hint: set "evidence" to an array containing one [x0,y0,x1,y1] box around the answer node
      answer_hint: set "answer" to the answer node label as a string exactly as shown
      json_example: '{"evidence":[[280,164,326,210]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_graph__automaton__state_after_input_label:
      scene_key: automaton_state_relation
      task_key: automaton_state_simulation_label_query
      object_description: a deterministic state-transition diagram with a start arrow, double-ring accepting states, and transition labels
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at the centers of the visited states, starting with the start state and ending at the answer state
      answer_hint: set "answer" to the reached state label as a string
      json_example: '{"evidence":[[150,250],[310,190],[480,230]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_graph__automaton__accepted_string_label:
      scene_key: automaton_state_relation
      task_key: automaton_string_acceptance_label_query
      object_description: a state-transition diagram with a start arrow, double-ring accepting states, visible transition labels, and labeled candidate input strings
      evidence_hint: set "evidence" to an ordered array of [x,y] pixel points at the centers of the states on one accepting path for the chosen candidate string, starting with the start state and ending at an accepting state
      answer_hint: set "answer" to the option label of the accepted candidate string as a string
      json_example: '{"evidence":[[150,250],[310,190],[480,230]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    graph_node_link_component_size_after_edge_edit_internal:
      task_key: component_size_after_edge_edit_query
      object_description: a labeled undirected graph
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes that would be in the same connected component as {query_label} after the hypothetical edge edit, including {query_label}
      answer_hint: set "answer" to the count of those nodes as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__pipe_network__junction_path_count:
      task_key: junction_path_count_query
      object_description: a labeled pipe-junction network with open pipes and blocked pipes
      question_text_exact_distance_count: How many junctions are exactly {query_distance} open pipe segments away from junction {query_label}?
      evidence_hint_exact_distance_count: set "evidence" to an array of [x,y] pixel points at the centers of all junctions exactly {query_distance} open pipe segments away from {query_label}
      question_text_reachable_count: How many junctions, including junction {query_label} itself, are reachable from {query_label} using only open pipes?
      evidence_hint_reachable_count: set "evidence" to an array of [x,y] pixel points at the centers of all junctions reachable from {query_label} through open pipes, including {query_label} itself
      answer_hint: set "answer" to the count of those junctions as an integer
      json_example: '{"evidence":[[180,220],[310,220],[430,300]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_graph__node_link__unique_cycle_size:
      task_key: unique_cycle_size_query
      object_description: a labeled undirected graph that contains exactly one cycle
      question_text_unique_cycle_size: The graph contains exactly one cycle. How many nodes are in that cycle?
      evidence_hint: set "evidence" to an array of [x,y] pixel points at the centers of all nodes in the unique cycle
      answer_hint: set "answer" to the number of nodes in the unique cycle as an integer
      json_example: '{"evidence":[[180,220],[310,180],[430,260],[520,340]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
    task_graph__metro__exact_distance_station_count:
      scene_key: metro_route_relation
      task_key: exact_distance_count_query
