prompt:
  shared:
    bundle_id: icons_counting_v0
    scene_key: reference_scene_counting
    task_key: counting_query
  task_overrides:
    task_icons__reference_canvas__attribute_match_count:
      object_description: a Reference icon on the left and a Scene panel on the right
      question_text_by_variant:
        match_type: How many Scene icons have the same type as the Reference?
        match_color: How many Scene icons have the same color as the Reference?
        match_rotation: How many Scene icons have the same rotation as the Reference?
        match_type_color_rotation: How many Scene icons match the Reference in type, color, and rotation?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for all counted Scene icons
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[322,152,377,207],[756,318,820,382]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__icon_field__type_frequency_count:
      scene_key: single_scene_counting
      object_description: one panel labeled Scene with assorted icons
      question_text_by_variant:
        singleton_type_count: How many Scene icons have a type that appears exactly once?
        most_frequent_type_count: How many Scene icons belong to the most frequent type?
      evidence_hint_by_variant:
        singleton_type_count: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted icon
        most_frequent_type_count: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted icon of the unique most frequent type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[116,128,176,188],[634,302,704,372]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__panel_exact_match_count:
      scene_key: paired_canvas_counting
      object_description: two icon panels labeled Left and Right
      question_text: How many Right-panel icons exactly match an icon in the Left panel by type, color, size, and rotation?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted Right-panel icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__panel_difference_count:
      scene_key: paired_canvas_counting
      object_description: two icon panels labeled Left and Right
      question_text_added_in_right_count: How many Right-panel icons are new, meaning they do not exactly match any icon in the Left panel?
      question_text_missing_from_right_count: How many Left-panel icons are missing from the Right panel?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted icon in the relevant panel
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__reference_canvas__size_relation_count:
      object_description: a Reference icon on the left and a Scene panel on the right
      question_text_smaller: How many Scene icons are smaller than the Reference?
      question_text_larger: How many Scene icons are larger than the Reference?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for all counted Scene icons
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[318,148,370,200],[572,322,632,382]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__named_field__shape_count:
      scene_key: single_scene_counting
      object_description: one panel labeled Scene with many simple named shape icons
      question_text: How many {shape_name} icons are in the Scene?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted {shape_name} icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[116,128,168,180],[634,302,686,354]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__named_field__shape_attribute_boolean_count:
      scene_key: single_scene_counting
      object_description: one panel labeled Scene with many simple named shape icons in named colors and fill styles
      question_text_shape_and_color_count: How many Scene icons are {shape_name} icons and have {attribute_phrase}?
      question_text_shape_or_color_count: How many Scene icons are {shape_name} icons, have {attribute_phrase}, or both?
