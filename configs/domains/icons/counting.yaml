prompt:
  shared:
    bundle_id: icons_counting_v0
    scene_key: reference_scene_counting
    task_key: counting_query
  task_overrides:
    task_icons__venn_field__scoped_attribute_count:
      scene_key: single_scene_counting
      object_description: a panel of icons and two overlapping marked circles
      question_text_inside_both_circles_count: How many {target_description} have centers inside both
        marked circles?
      question_text_inside_either_circle_count: How many {target_description} have centers inside at least
        one marked circle?
      question_text_inside_exactly_one_circle_count: How many {target_description} have centers inside
        exactly one marked circle?
      question_text_outside_both_circles_count: How many {target_description} have centers outside both
        marked circles?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates
        for every counted {target_description}
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[116,128,168,180],[634,302,686,354]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
