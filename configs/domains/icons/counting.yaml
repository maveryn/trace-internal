prompt:
  shared:
    bundle_id: icons_counting_v0
    scene_key: reference_scene_counting
    task_key: counting_query
  task_overrides:
    task_icons__named_grid__scoped_attribute_count:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_shape_count: How many "{target_shape_name}" icons are in row
        {line_number}?
      question_text_column_shape_count: How many "{target_shape_name}" icons are in
        column {line_number}?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted "{target_shape_name}" icon in
        {line_kind} {line_number}
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[180,172,232,224],[388,172,440,224],[596,172,648,224]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__named_grid__row_column_shape_extreme_number:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_most_shape_number: Which row has the most "{target_shape_name}"
        icons?
      question_text_row_fewest_shape_number: Which row has the fewest "{target_shape_name}"
        icons?
      question_text_column_most_shape_number: Which column has the most "{target_shape_name}"
        icons?
      question_text_column_fewest_shape_number: Which column has the fewest "{target_shape_name}"
        icons?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for the "{target_shape_name}" icons in the selected
        {line_kind}
      answer_hint: set "answer" to the selected {line_kind} number as an integer
      json_example: '{"annotation":[[180,172,232,224],[388,172,440,224],[596,172,648,224]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__named_grid__group_predicate_count:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_at_least_shape_count: How many rows contain at least {threshold}
        "{target_shape_name}" icons?
      question_text_column_at_least_shape_count: How many columns contain at least
        {threshold} "{target_shape_name}" icons?
      question_text_row_exactly_shape_count: How many rows contain exactly {threshold}
        "{target_shape_name}" icons?
      question_text_column_exactly_shape_count: How many columns contain exactly {threshold}
        "{target_shape_name}" icons?
      question_text_row_no_shape_count: How many rows contain no "{target_shape_name}"
        icons?
      question_text_column_no_shape_count: How many columns contain no "{target_shape_name}"
        icons?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates around every qualifying {line_kind} region
      answer_hint: set "answer" to the number of qualifying {line_kind_plural} as
        an integer
      json_example: '{"annotation":[[150,176,566,260],[150,344,566,428]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__named_ring__scoped_attribute_count:
      scene_key: single_scene_counting
      object_description: a ring of icons with endpoint markers A and B
      question_text_clockwise_arc_shape_count: Starting at marker A and moving clockwise
        to marker B, how many "{target_shape_name}" icons are strictly between A and
        B?
      question_text_counterclockwise_arc_shape_count: Starting at marker A and moving
        counterclockwise to marker B, how many "{target_shape_name}" icons are strictly
        between A and B?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted "{target_shape_name}" icon strictly
        between A and B along the {direction} arc
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[180,172,232,224],[388,302,440,354]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__venn_field__scoped_attribute_count:
      scene_key: single_scene_counting
      object_description: a panel of icons and two overlapping marked circles
      question_text_inside_both_circles_count: How many {target_description} have
        centers inside both marked circles?
      question_text_inside_either_circle_count: How many {target_description} have
        centers inside at least one marked circle?
      question_text_inside_exactly_one_circle_count: How many {target_description}
        have centers inside exactly one marked circle?
      question_text_outside_both_circles_count: How many {target_description} have
        centers outside both marked circles?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted {target_description}
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[116,128,168,180],[634,302,686,354]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
