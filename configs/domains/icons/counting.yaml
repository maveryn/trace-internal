    task_icons__icon_field__type_frequency_count:
      scene_key: single_scene_counting
      object_description: a panel of assorted icons
      question_text_by_variant:
        singleton_type_count: How many Scene icons have a type that appears exactly
          once?
        most_frequent_type_count: How many Scene icons belong to the most frequent
          type?
      annotation_hint_by_variant:
        singleton_type_count: set "annotation" to a JSON array of [x0, y0, x1, y1]
          boxes in image pixel coordinates for every counted icon
        most_frequent_type_count: set "annotation" to a JSON array of [x0, y0, x1,
          y1] boxes in image pixel coordinates for every counted icon of the unique
          most frequent type
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[116,128,176,188],[634,302,704,372]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__named_field__single_attribute_membership_count:
      scene_key: single_scene_counting
      object_description: a panel of icons
      question_text: How many "{shape_name}" icons are in the panel?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted "{shape_name}" icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[116,128,168,180],[634,302,686,354]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
