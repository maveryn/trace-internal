generation:
  shared:
    object_count_min: 1
    object_count_max: 20
    target_count_min: 0
    target_count_max: 10
    distractor_count_min: 1
    distractor_count_max: 10
    balanced_sampling: true
  task_overrides:
    task_icons_counting_color:
      pool_manifest: all_icons.txt
    task_icons_counting_attribute_binding:
      pool_manifest: non_symmetry.txt
      rotation_candidates_degrees: [0, 90, 180, 270]
    task_icons_counting_size_relation:
      object_count_max: 16
      target_count_max: 8
      distractor_count_max: 8
      pool_manifest: all_icons.txt
      rotation_candidates_degrees: [0, 90, 180, 270]
      size_relation_candidates: [smaller, larger]
      size_relation_min_delta_px: 12
    task_icons_counting_type:
      pool_manifest: all_icons.txt
    task_icons_counting_orientation:
      pool_manifest: non_symmetry.txt
      rotation_candidates_degrees: [0, 90, 180, 270]

rendering:
  shared:
    canvas_width: 960
    canvas_height: 544
    reference_panel_width_px: 248
    panel_gap_px: 24
    outer_margin_px: 24
    panel_padding_px: 20
    panel_corner_radius_px: 18
    scene_icon_size_min_px: 40
    scene_icon_size_max_px: 96
    reference_icon_size_px: 136
    scene_max_overlap_fraction: 0.10
    scene_placement_max_attempts: 120
    scene_size_shrink_rounds: 6
    scene_size_shrink_factor: 0.90
    palette_size_min: 8
    palette_size_max: 12
    color_channel_min: 24
    color_channel_max: 220
    min_color_distance: 40.0
    color_distance_space: lab
    panel_title_font_size_px: 24
    background_color_rgb: [247, 248, 251]
    panel_fill_rgb: [255, 255, 255]
    panel_border_rgb: [205, 212, 224]
    header_text_rgb: [70, 78, 96]
    icon_noise_edit_types: [blur, downsample, jpeg, noise]
    icon_noise_edit_count_range: [0, 2]
    icon_noise_value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70, 90]
      noise:
        alpha: [0.03, 0.08]
  task_overrides:
    task_icons_counting_color:
      min_color_distance: 60.0
      palette_size_min: 3
      palette_size_max: 4
    task_icons_counting_attribute_binding:
      min_color_distance: 40.0
      palette_size_min: 3
      palette_size_max: 4
    task_icons_counting_size_relation:
      scene_icon_size_max_px: 120
      reference_icon_size_px: 80
      reference_icon_size_min_px: 64
      reference_icon_size_max_px: 96

prompt:
  shared:
    bundle_id: icons_counting_v1
    task_family_key: reference_scene_counting
    task_key: counting_query
  task_overrides:
    task_icons_counting_color:
      object_description: a Reference icon on the left and a Scene panel of icons on the right
      question_text: How many icons in the Scene panel have the same color as the Reference icon?
      evidence_hint: set "evidence" to a JSON array of [x_min, y_min, x_max, y_max] boxes in image pixel coordinates for all matching icons in the Scene panel, sorted from top to bottom and then left to right
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[322,152,377,207],[756,318,820,382]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons_counting_attribute_binding:
      object_description: a Reference icon on the left and a Scene panel of icons on the right
      question_text: How many icons in the Scene panel match the Reference icon in icon type, color, and orientation all at once? Orientation refers to the icon's rotation.
      evidence_hint: set "evidence" to a JSON array of [x_min, y_min, x_max, y_max] boxes in image pixel coordinates for all icons in the Scene panel that match the Reference icon in icon type, color, and orientation, sorted from top to bottom and then left to right
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[322,150,392,220],[584,320,654,390]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons_counting_size_relation:
      object_description: a Reference icon on the left and a Scene panel of icons on the right
      question_text_smaller: How many icons in the Scene panel are smaller than the Reference icon?
      question_text_larger: How many icons in the Scene panel are larger than the Reference icon?
      evidence_hint: set "evidence" to a JSON array of [x_min, y_min, x_max, y_max] boxes in image pixel coordinates for all matching icons in the Scene panel, sorted from top to bottom and then left to right
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[318,148,370,200],[572,322,632,382]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons_counting_type:
      object_description: a Reference icon on the left and a Scene panel of icons on the right
      question_text: How many icons in the Scene panel have the same icon type as the Reference icon?
      evidence_hint: set "evidence" to a JSON array of [x_min, y_min, x_max, y_max] boxes in image pixel coordinates for all matching icons in the Scene panel, sorted from top to bottom and then left to right
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[318,146,394,222],[575,320,651,396]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons_counting_orientation:
      object_description: a Reference icon on the left and a Scene panel of icons on the right
      question_text: How many icons in the Scene panel have the same orientation as the Reference icon? Orientation refers to the icon's rotation.
      evidence_hint: set "evidence" to a JSON array of [x_min, y_min, x_max, y_max] boxes in image pixel coordinates for all matching icons in the Scene panel, sorted from top to bottom and then left to right
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[334,150,410,226],[588,318,664,394],[756,318,832,394]],"answer":3}'
      json_example_answer_only: '{"answer":3}'

complexity:
  shared:
    criteria_weights:
      semantic_match: 0.35
      visual_scan: 0.30
      ambiguity: 0.20
      clutter: 0.15
