      object_description: a numbered grid with one icon in each cell
      question_text_row_shape_count: How many "{target_shape_name}" icons are in row
        {line_number}?
      question_text_column_shape_count: How many "{target_shape_name}" icons are in
        column {line_number}?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted "{target_shape_name}" icon in
        {line_kind} {line_number}
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[180,172,232,224],[388,172,440,224],[596,172,648,224]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
