prompt:
  shared:
    bundle_id: icons_named_grid_v1
    scene_key: single_scene_counting
    task_key: counting_query
  task_overrides:
    task_icons__named_grid__scoped_attribute_count:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_shape_count: How many "{target_shape_name}" icons are in row {line_number}?
      question_text_column_shape_count: How many "{target_shape_name}" icons are in column {line_number}?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] bounding boxes in image pixel coordinates
        for every counted "{target_shape_name}" icon in {line_kind} {line_number}
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[176,168,236,228],[384,168,444,228],[592,168,652,228]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__named_grid__row_column_shape_extreme_number:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_most_shape_number: Which row has the most "{target_shape_name}" icons?
      question_text_row_fewest_shape_number: Which row has the fewest "{target_shape_name}" icons?
      question_text_column_most_shape_number: Which column has the most "{target_shape_name}" icons?
      question_text_column_fewest_shape_number: Which column has the fewest "{target_shape_name}" icons?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] bounding boxes in image pixel coordinates
        for the "{target_shape_name}" icons in the selected {line_kind}
      answer_hint: set "answer" to the selected {line_kind} number as an integer
      json_example: '{"annotation":[[176,168,236,228],[384,168,444,228],[592,168,652,228]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__named_grid__group_predicate_count:
      scene_key: single_scene_counting
      object_description: a numbered grid with one icon in each cell
      question_text_row_at_least_shape_count: How many rows contain at least {threshold} "{target_shape_name}"
        icons?
      question_text_column_at_least_shape_count: How many columns contain at least {threshold} "{target_shape_name}"
        icons?
      question_text_row_exactly_shape_count: How many rows contain exactly {threshold} "{target_shape_name}"
        icons?
      question_text_column_exactly_shape_count: How many columns contain exactly {threshold} "{target_shape_name}"
        icons?
      question_text_row_no_shape_count: How many rows contain no "{target_shape_name}" icons?
      question_text_column_no_shape_count: How many columns contain no "{target_shape_name}" icons?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] bounding boxes in image pixel coordinates
        for every qualifying {line_kind} region
      answer_hint: set "answer" to the number of qualifying {line_kind_plural} as an integer
      json_example: '{"annotation":[[96,168,620,228],[96,336,620,396]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
