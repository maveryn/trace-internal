prompt:
  shared:
    bundle_id: icons_paired_canvas_v0
    scene_key: paired_canvas_set_relation
    task_key: paired_canvas_query
  task_overrides:
    task_icons__paired_canvas__panel_set_relation_count:
      scene_key: paired_canvas_set_relation
      object_description: two icon panels labeled Left and Right
      question_text_added_in_right_count: How many Right-panel icons are new, meaning
        they do not exactly match any icon in the Left panel?
      question_text_missing_from_right_count: How many Left-panel icons are missing
        from the Right panel?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted icon in the relevant panel
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__panel_attribute_change_count:
      scene_key: paired_canvas_attribute_change
      object_description: two icon panels labeled Left and Right with corresponding
        icons at matching positions
      question_text_color_changed_count: How many Right-panel icons changed color
        compared with the corresponding icon in the Left panel?
      question_text_rotation_changed_count: How many Right-panel icons changed rotation
        compared with the corresponding icon in the Left panel?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted Right-panel icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__panel_movement_direction_count:
      scene_key: paired_canvas_movement_direction
      object_description: two icon panels labeled Left and Right with the same icons
        in changed positions
      question_text_moved_left_count: How many icons moved left from the Left panel
        to the Right panel?
      question_text_moved_right_count: How many icons moved right from the Left panel
        to the Right panel?
      question_text_moved_up_count: How many icons moved up from the Left panel to
        the Right panel?
      question_text_moved_down_count: How many icons moved down from the Left panel
        to the Right panel?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for every counted Right-panel icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__original_attribute_label:
      scene_key: paired_canvas_original_attribute
      object_description: two icon panels labeled Original and Right; the Right panel
        contains six option icons labeled A-F and other icons
      question_text_original_shape_label: Which labeled icon in the Right panel was
        originally a {target_description} icon in the Original panel?
      question_text_original_color_shape_label: Which labeled icon in the Right panel
        was originally a {target_description} icon in the Original panel?
      annotation_hint: set "annotation" to a JSON object with keys "original_icon"
        and "right_icon"; values are [x0, y0, x1, y1] pixel boxes for the matched
        icons
      answer_hint: set "answer" to the selected Right-panel option letter as a string
      json_example: '{"annotation":{"original_icon":[168,210,224,266],"right_icon":[716,214,772,270]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
