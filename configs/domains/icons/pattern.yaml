prompt:
  shared:
    bundle_id: icons_pattern_v0
    scene_key: structured_violation_scene
    task_key: structured_violation_query
  task_overrides:
    task_icons__pattern_grid__attribute_pattern_violation_index:
      object_description: a numbered 3 by 3 grid with one icon per box
      question_text: Which numbered box breaks the visible pattern?
      annotation_hint: set "annotation" to a JSON array containing exactly one [x0,
        y0, x1, y1] box in image pixel coordinates for the violating grid box
      answer_hint: set "answer" to the violating box index as an integer
      json_example: '{"annotation":[[540,126,654,458]],"answer":5}'
      json_example_answer_only: '{"answer":5}'
    task_icons__sequence_strip__rotation_sequence_violation_index:
      object_description: a horizontal row of numbered boxes with one icon per box
      question_text: Which numbered box breaks the rotation sequence?
      annotation_hint: set "annotation" to a JSON array containing exactly one [x0,
        y0, x1, y1] box in image pixel coordinates for the violating numbered box
      answer_hint: set "answer" to the violating box index as an integer
      json_example: '{"annotation":[[540,126,654,458]],"answer":5}'
      json_example_answer_only: '{"answer":5}'
    task_icons__wallpaper_panels__motif_violation_label:
      scene_key: wallpaper_panel_violation_scene
      object_description: six labeled wallpaper panels filled with repeated icon motifs
      question_text: Which labeled wallpaper panel uses a different wallpaper pattern
        from the others?
      annotation_hint: set "annotation" to a JSON array containing exactly one [x0,
        y0, x1, y1] box in image pixel coordinates for the selected wallpaper panel
      answer_hint: set "answer" to the odd panel letter
      json_example: '{"annotation":[[420,220,462,262]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_icons__wallpaper_panels__same_pattern_as_reference_label:
      scene_key: wallpaper_reference_match_scene
      object_description: one Reference wallpaper panel and six labeled wallpaper
        panels filled with repeated icon motifs
      question_text: Which labeled panel has the same wallpaper pattern as the Reference
        panel?
      annotation_hint: set "annotation" to a JSON object with keys "reference_panel"
        and "selected_panel", each mapped to one [x0, y0, x1, y1] box in image pixel
        coordinates
      answer_hint: set "answer" to the matching panel letter
      json_example: '{"annotation":{"reference_panel":[36,36,320,604],"selected_panel":[420,220,620,400]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_icons__wallpaper_panels__reference_pattern_match_count:
      scene_key: wallpaper_reference_match_scene
      object_description: one Reference wallpaper panel and six labeled wallpaper
        panels filled with repeated icon motifs
      question_text: How many labeled panels use the same wallpaper arrangement as
        the Reference panel?
      annotation_hint: set "annotation" to a JSON object with lists of [x0, y0, x1,
        y1] pixel panel boxes under "reference_panel" and "matching_candidate_panels"
      answer_hint: set "answer" to the number of matching labeled panels as an integer
      json_example: '{"annotation":{"reference_panel":[[36,36,320,604]],"matching_candidate_panels":[[420,220,620,400],[650,220,850,400]]},"answer":2}'
      json_example_answer_only: '{"answer":2}'
