prompt:
  shared:
    bundle_id: icons_pattern_v0
    scene_key: structured_violation_scene
    task_key: structured_violation_query
  task_overrides:
    task_icons__pattern_grid__attribute_pattern_violation_index:
      object_description: a numbered 3 by 3 grid with one icon per box
      question_text_grid_row_color_violation: Each row should contain icons of one color.
        Which numbered box breaks the row color pattern?
      question_text_grid_column_color_violation: Each column should contain icons of
        one color. Which numbered box breaks the column color pattern?
      question_text_grid_size_violation: Which numbered box breaks the size pattern?
      annotation_hint: set "annotation" to one [x0, y0, x1, y1] box in image pixel
        coordinates for the violating numbered box
      answer_hint: set "answer" to the violating box index as an integer
      json_example: '{"annotation":[540,126,654,458],"answer":5}'
      json_example_answer_only: '{"answer":5}'
