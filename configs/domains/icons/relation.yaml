prompt:
  shared:
    bundle_id: icons_relation_v0
    scene_key: reference_scene_anchor_relation
    task_key: relation_query
  task_overrides:
    task_icons__mirror_grid__mirror_symmetry_count:
      scene_key: reference_grid_mirror_symmetry_relation
      object_description: a Reference cell beside a labeled Scene grid
      question_text: How many labeled Scene cells have the same mirror symmetry as
        the Reference cell? The symmetry may be vertical, horizontal, either diagonal,
        or both vertical and horizontal.
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates around every matching Scene cell
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[360,120,560,320],[590,120,790,320]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__icon_cutout__partial_match_label:
      scene_key: icon_cutout_relation
      object_description: a partial icon fragment beside six labeled full-icon options
      question_text_partial_icon_match_label: Which labeled full icon does the partial
        fragment come from?
      annotation_hint: set "annotation" to a JSON object with keys "source_fragment"
        and "selected_option", each mapped to a [x0, y0, x1, y1] box in image pixel
        coordinates
      answer_hint: set "answer" to the selected option letter as a string
      json_example: '{"annotation":{"source_fragment":[84,168,248,332],"selected_option":[492,112,662,282]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_icons__two_anchor__between_anchors_count:
      scene_key: scene_two_anchor_relation
      object_description: a panel with two icons marked A and B
      question_text_vertical_strip: How many other icons have centers in the vertical
        strip between A and B?
      question_text_horizontal_strip: How many other icons have centers in the horizontal
        strip between A and B?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates for all counted icons other than A and B
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[312,180,372,240],[540,286,612,358]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__overlap_grid__occlusion_order_count:
      scene_key: reference_grid_occlusion_relation
      object_description: a Reference cell beside a labeled Scene grid
      question_text: How many labeled Scene cells match the Reference front-to-back
        order? Front-to-back order means which icon is on top.
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes
        in image pixel coordinates around all matching Scene cells
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[336,104,506,274],[532,104,702,274],[728,104,898,274]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__named_field__reference_distance_rank_label:
      scene_key: named_reference_distance_relation
      object_description: a panel with one named reference icon, six option icons
        labeled A-F, and other icons
      question_text_closest_to_named_reference_label: Which labeled icon is closest
        to the {reference_description}?
      question_text_second_closest_to_named_reference_label: Which labeled icon is
        second closest to the {reference_description}?
      question_text_farthest_from_named_reference_label: Which labeled icon is farthest
        from the {reference_description}?
      annotation_hint: set "annotation" to a JSON object with keys "reference_icon"
        and "selected_candidate", each mapped to a [x0, y0, x1, y1] box in image pixel
        coordinates
      answer_hint: set "answer" to the selected option letter as a string
      json_example: '{"annotation":{"reference_icon":[172,238,244,310],"selected_candidate":[612,184,676,248]},"answer":"D"}'
      json_example_answer_only: '{"answer":"D"}'
    task_icons__named_path__path_neighbor_label:
      scene_key: named_path_relation
      object_description: a START-to-END icon path with six option icons labeled A-F
        and other icons
      question_text_after_first_shape_label: Which labeled icon comes immediately
        after the first "{target_shape_name}" icon along the path from START to END?
      question_text_before_first_shape_label: Which labeled icon comes immediately
        before the first "{target_shape_name}" icon along the path from START to END?
      question_text_after_last_shape_label: Which labeled icon comes immediately after
        the last "{target_shape_name}" icon along the path from START to END?
      question_text_before_last_shape_label: Which labeled icon comes immediately
        before the last "{target_shape_name}" icon along the path from START to END?
      question_text_after_second_shape_label: Which labeled icon comes immediately
        after the second "{target_shape_name}" icon along the path from START to END?
      question_text_before_second_shape_label: Which labeled icon comes immediately
        before the second "{target_shape_name}" icon along the path from START to
        END?
      annotation_hint: set "annotation" to a JSON object with keys "queried_icon"
        and "selected_neighbor"; values are [x0, y0, x1, y1] pixel boxes for the two
        witnessed icons
      answer_hint: set "answer" to the selected option letter as a string
      json_example: '{"annotation":{"queried_icon":[218,314,274,370],"selected_neighbor":[548,248,604,304]},"answer":"E"}'
      json_example_answer_only: '{"answer":"E"}'
