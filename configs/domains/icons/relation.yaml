generation:
  shared:
    object_count_min: 1
    object_count_max: 15
    target_count_min: 0
    target_count_max: 5
    distractor_count_min: 1
    distractor_count_max: 10
    distractor_margin_over_target: 1
    balanced_sampling: true
    balanced_variant_sampling: true
  task_overrides:
    task_icons__mirror_grid__mirror_symmetry_count:
      object_count_min: 6
      object_count_max: 6
      target_count_max: 4
      distractor_count_min: 2
      distractor_count_max: 6
      distractor_margin_over_target: 0
      pool_manifest: non_symmetry.txt
      mirror_signature_weights:
        mirror_vertical: 1.0
        mirror_horizontal: 1.0
        mirror_diagonal_main: 1.0
        mirror_diagonal_anti: 1.0
        mirror_both_axes: 1.0
    task_icons__mirror_grid__reflection_match_label:
      object_count_min: 5
      object_count_max: 5
      pool_manifest: non_symmetry.txt
      shuffle_scene_labels: true
      reflection_query_weights:
        vertical_reflection_match: 1.0
        horizontal_reflection_match: 1.0
        diagonal_main_reflection_match: 1.0
        diagonal_anti_reflection_match: 1.0
    task_icons__two_anchor__between_anchors_count:
      target_count_max: 5
      distractor_count_max: 10
      distractor_margin_over_target: 0
      pool_manifest: all_icons.txt
      strip_axis_weights:
        vertical: 1.0
        horizontal: 1.0
    task_icons__overlap_grid__occlusion_order_count:
      object_count_min: 2
      object_count_max: 8
      target_count_min: 0
      target_count_max: 4
      distractor_count_min: 1
      distractor_count_max: 5
      distractor_margin_over_target: 0
      pool_manifest: all_icons.txt
    task_icons__reference_canvas__anchor_position_count:
      pool_manifest: all_icons.txt
      direction_weights:
        left: 1.0
        right: 1.0
        above: 1.0
        below: 1.0
    task_icons__named_field__reference_distance_rank_label:
      candidate_count: 6
      distractor_count_min: 4
      distractor_count_max: 8
      distance_rank_query_weights:
        closest_to_named_reference_label: 1.0
        second_closest_to_named_reference_label: 1.0
        farthest_from_named_reference_label: 1.0
      named_color_support: [red, blue, green, yellow, orange, purple, brown, cyan, magenta, maroon]
      named_icon_fill_style_support: [solid, striped, dotted, half_filled]
      named_icon_fill_style_weights:
        solid: 0.55
        striped: 0.15
        dotted: 0.15
        half_filled: 0.15
    task_icons__paired_canvas__original_attribute_label:
      tracked_count: 6
      distractor_count_min: 4
      distractor_count_max: 8
      original_attribute_query_weights:
        original_shape_label: 1.0
        original_color_shape_label: 1.0
        original_fill_shape_label: 1.0
      named_color_support: [red, blue, green, yellow, orange, purple, brown, cyan, magenta, maroon]
      named_icon_fill_style_support: [solid, striped, dotted, half_filled]
      queryable_named_icon_fill_style_support: [striped, dotted, half_filled]
      named_icon_fill_style_weights:
        solid: 0.55
        striped: 0.15
        dotted: 0.15
        half_filled: 0.15
    task_icons__paired_canvas__panel_movement_direction_count:
      pool_manifest: all_icons.txt
      object_count_min: 5
      object_count_max: 10
      target_count_min: 1
      target_count_max: 5
      distractor_count_min: 2
      distractor_count_max: 5
      distractor_margin_over_target: 0
      movement_direction_query_weights:
        moved_left_count: 1.0
        moved_right_count: 1.0
        moved_up_count: 1.0
        moved_down_count: 1.0
      movement_delta_min: 0.22
      movement_delta_max: 0.34
      rotation_candidates_degrees: [0, 90, 180, 270]

