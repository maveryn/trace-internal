prompt:
  shared:
    bundle_id: icons_relation_v0
    scene_key: reference_scene_anchor_relation
    task_key: relation_query
  task_overrides:
    task_icons__mirror_grid__mirror_symmetry_count:
      scene_key: reference_grid_mirror_symmetry_relation
      object_description: a Reference cell on the left and a labeled Scene grid on the right
      question_text: How many labeled Scene cells have the same mirror symmetry as the Reference cell? The symmetry may be vertical, horizontal, either diagonal, or both vertical and horizontal.
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every matching Scene cell
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[360,120,560,320],[590,120,790,320]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__mirror_grid__reflection_match_label:
      scene_key: reference_grid_mirror_symmetry_relation
      object_description: a Reference cell on the left and a labeled Scene grid on the right
      question_text_vertical_reflection_match: Which labeled Scene cell is the left-right mirror reflection of the Reference cell across a vertical axis?
      question_text_horizontal_reflection_match: Which labeled Scene cell is the top-bottom mirror reflection of the Reference cell across a horizontal axis?
      question_text_diagonal_main_reflection_match: Which labeled Scene cell is the mirror reflection of the Reference cell across the diagonal from top left to bottom right?
      question_text_diagonal_anti_reflection_match: Which labeled Scene cell is the mirror reflection of the Reference cell across the diagonal from top right to bottom left?
      evidence_hint: set "evidence" to a JSON array containing one [x0, y0, x1, y1] box in image pixel coordinates around the matching Scene cell
      answer_hint: set "answer" to the matching Scene label as a string
      json_example: '{"evidence":[[360,120,560,320]],"answer":"B"}'
      json_example_answer_only: '{"answer":"B"}'
    task_icons__two_anchor__between_anchors_count:
      scene_key: scene_two_anchor_relation
      object_description: a Scene panel with two icons marked A and B
      question_text_vertical_strip: How many other icons have centers in the vertical strip between A and B?
      question_text_horizontal_strip: How many other icons have centers in the horizontal strip between A and B?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for all counted icons other than A and B
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[312,180,372,240],[540,286,612,358]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__overlap_grid__occlusion_order_count:
      scene_key: reference_grid_occlusion_relation
      object_description: a Reference cell on the left and a labeled Scene grid on the right
      question_text: How many labeled Scene cells match the Reference front-to-back order? Front-to-back order means which icon is on top.
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around all matching Scene cells
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[336,104,506,274],[532,104,702,274],[728,104,898,274]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__reference_canvas__anchor_position_count:
      object_description: a Reference icon on the left and a Scene panel on the right with one icon marked Anchor
      question_text_left: How many Scene icons match the Reference type and are to the left of the Anchor?
      question_text_right: How many Scene icons match the Reference type and are to the right of the Anchor?
      question_text_above: How many Scene icons match the Reference type and are above the Anchor?
      question_text_below: How many Scene icons match the Reference type and are below the Anchor?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for all counted Scene icons
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[438,162,498,222],[602,302,670,370]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__paired_canvas__panel_movement_direction_count:
      scene_key: paired_canvas_relation
      object_description: two icon panels labeled Left and Right with the same icons in changed positions
      question_text_moved_left_count: How many icons moved left from the Left panel to the Right panel?
      question_text_moved_right_count: How many icons moved right from the Left panel to the Right panel?
      question_text_moved_up_count: How many icons moved up from the Left panel to the Right panel?
      question_text_moved_down_count: How many icons moved down from the Left panel to the Right panel?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted Right-panel icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_icons__named_field__reference_distance_rank_label:
      scene_key: named_reference_distance_relation
      object_description: one panel with one uniquely identifiable named reference icon, six letter-labeled candidate icons, and unlabeled distractor icons
      question_text_closest_to_named_reference_label: Which labeled icon is closest to the {reference_description}?
      question_text_second_closest_to_named_reference_label: Which labeled icon is second closest to the {reference_description}?
      question_text_farthest_from_named_reference_label: Which labeled icon is farthest from the {reference_description}?
      evidence_hint: set "evidence" to a JSON array containing one [x0, y0, x1, y1] box around the named reference icon and one box around the selected labeled icon
      answer_hint: set "answer" to the selected option letter as a string
      json_example: '{"evidence":[[172,238,244,310],[612,184,676,248]],"answer":"D"}'
      json_example_answer_only: '{"answer":"D"}'
    task_icons__paired_canvas__original_attribute_label:
      scene_key: paired_named_original_relation
      object_description: two open icon panels labeled Original and Right; the Right panel contains six letter-labeled tracked icons plus unlabeled distractor icons
      question_text_original_shape_label: Which labeled icon in the Right panel was originally a {target_description} in the Original panel?
      question_text_original_color_shape_label: Which labeled icon in the Right panel was originally a {target_description} in the Original panel?
      question_text_original_fill_shape_label: Which labeled icon in the Right panel was originally a {target_description} in the Original panel?
      evidence_hint: set "evidence" to a JSON array containing one [x0, y0, x1, y1] box around the original icon in the Original panel and one box around its corresponding labeled icon in the Right panel
      answer_hint: set "answer" to the selected Right-panel option letter as a string
      json_example: '{"evidence":[[168,210,224,266],[716,214,772,270]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'

complexity:
  shared:
    criteria_weights:
      spatial_reasoning: 0.55
      visual_scan: 0.05
      ambiguity: 0.35
      clutter: 0.05
