generation:
  shared:
    sequence_length_min: 4
    sequence_length_max: 6
    target_count_min: 0
    target_count_max: 10
    step_abs_min: 1
    step_abs_max: 3
    balanced_sampling: true
  task_overrides:
    task_icons_sequence_missing_count:
      pool_manifest: all_icons.txt
      rotation_candidates_degrees: [0, 90, 180, 270]
    task_icons_sequence_rotation_violation:
      sequence_length_min: 5
      sequence_length_max: 7
      answer_index_min: 1
      answer_index_max: 7
      pool_manifest: non_symmetry.txt
      rotation_candidates_degrees: [0, 90, 180, 270]
      step_candidates_degrees: [90, 270]

rendering:
  shared:
    outer_margin_px: 24
    panel_padding_px: 20
    panel_corner_radius_px: 18
    scene_icon_size_min_px: 24
    scene_icon_size_max_px: 40
    cell_box_width_min_px: 112
    cell_box_width_max_px: 160
    cell_box_height_min_px: 96
    cell_box_height_max_px: 144
    scene_max_overlap_fraction: 0.20
    scene_placement_max_attempts: 160
    scene_size_shrink_rounds: 6
    scene_size_shrink_factor: 0.90
    palette_size_min: 1
    palette_size_max: 1
    color_channel_min: 24
    color_channel_max: 220
    min_color_distance: 40.0
    color_distance_space: lab
    panel_title_font_size_px: 24
    background_color_rgb: [247, 248, 251]
    panel_fill_rgb: [255, 255, 255]
    panel_border_rgb: [205, 212, 224]
    header_text_rgb: [70, 78, 96]
    icon_noise_edit_types: [blur, downsample, jpeg, noise]
    icon_noise_edit_count_range: [0, 2]
    icon_noise_value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70, 90]
      noise:
        alpha: [0.03, 0.08]
    cell_padding_px: 10
    cell_icon_padding_px: 8
    cell_corner_radius_px: 12
    cell_border_rgb: [218, 223, 233]
    cell_label_font_size_px: 22
    cell_label_color_rgb: [52, 60, 77]
    missing_mark_font_size_px: 56
    missing_mark_color_rgb: [84, 96, 118]
  task_overrides:
    task_icons_sequence_rotation_violation:
      scene_icon_size_min_px: 48
      scene_icon_size_max_px: 72
      cell_box_width_min_px: 96
      cell_box_width_max_px: 136
      cell_box_height_min_px: 96
      cell_box_height_max_px: 136

prompt:
  shared:
    bundle_id: icons_sequence_v1
    task_family_key: sequence_missing_count
    task_key: missing_count_query
  task_overrides:
    task_icons_sequence_missing_count:
      object_description: a horizontal row of Scene boxes, where one box is missing and marked with a question mark
      question_text: How many icons should be in the missing box to continue the sequence?
      evidence_hint: set "evidence" to a JSON array containing exactly one [x_min, y_min, x_max, y_max] box in image pixel coordinates for the missing Scene box
      answer_hint: set "answer" to the missing count as an integer
      json_example: '{"evidence":[[540,126,654,458]],"answer":5}'
      json_example_answer_only: '{"answer":5}'
    task_icons_sequence_rotation_violation:
      task_family_key: sequence_rotation_violation
      task_key: rotation_violation_query
      object_description: a horizontal row of numbered Scene boxes, each containing one icon
      question_text: Which numbered box breaks the rotation sequence?
      evidence_hint: set "evidence" to a JSON array containing exactly one [x_min, y_min, x_max, y_max] box in image pixel coordinates for the violating Scene box
      answer_hint: set "answer" to the violating box index as an integer
      json_example: '{"evidence":[[540,126,654,458]],"answer":4}'
      json_example_answer_only: '{"answer":4}'

complexity:
  shared:
    criteria_weights:
      rule_inference: 0.45
      visual_scan: 0.25
      ambiguity: 0.20
      clutter: 0.10
