generation:
  shared:
    sequence_length_min: 4
    sequence_length_max: 6
    target_count_min: 0
    target_count_max: 10
    step_abs_min: 1
    step_abs_max: 3
    balanced_sampling: true
  task_overrides:
    task_icons__sequence_strip__missing_count_value:
      pool_manifest: all_icons.txt
      rotation_candidates_degrees: [0, 90, 180, 270]
    task_icons__named_strip__shape_run_length:
      query_id_weights:
        longest_shape_run_length: 1.0
        shortest_shape_run_length: 1.0
      strip_length_min: 12
      strip_length_max: 16
      longest_run_length_min: 2
      longest_run_length_max: 6
      shortest_run_length_min: 1
      shortest_run_length_max: 5
      named_icon_fill_style_support: [solid, striped, dotted, half_filled]
      named_icon_fill_style_weights:
        solid: 0.55
        striped: 0.15
        dotted: 0.15
        half_filled: 0.15

rendering:
  shared:
    outer_margin_px: 24
    panel_padding_px: 20
    panel_corner_radius_px: 18
    scene_icon_size_min_px: 24
    scene_icon_size_max_px: 40
    cell_box_width_min_px: 112
    cell_box_width_max_px: 160
    cell_box_height_min_px: 96
    cell_box_height_max_px: 144
    scene_max_overlap_fraction: 0.20
    scene_placement_max_attempts: 160
    scene_size_shrink_rounds: 6
    scene_size_shrink_factor: 0.90
    palette_size_min: 1
    palette_size_max: 1
    color_channel_min: 24
    color_channel_max: 220
    min_color_distance: 40.0
    color_distance_space: lab
    panel_title_font_size_px: 24
    background_color_rgb: [247, 248, 251]
    background_color_rgb_options:
      - [247, 248, 251]
      - [243, 246, 252]
      - [250, 247, 242]
      - [244, 249, 246]
      - [248, 246, 253]
    panel_fill_rgb: [255, 255, 255]
    panel_fill_rgb_options:
      - [255, 255, 255]
      - [253, 254, 255]
      - [255, 254, 250]
      - [250, 253, 250]
    panel_border_rgb: [205, 212, 224]
    panel_border_rgb_options:
      - [205, 212, 224]
      - [198, 209, 222]
      - [218, 208, 197]
      - [198, 218, 211]
    header_text_rgb: [70, 78, 96]
    header_text_rgb_options:
      - [70, 78, 96]
      - [63, 84, 112]
      - [86, 73, 94]
      - [68, 91, 79]
    icon_noise_edit_types: [blur, downsample, jpeg, noise]
    icon_noise_edit_count_range: [0, 2]
    icon_noise_value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70, 90]
      noise:
        alpha: [0.03, 0.08]
    cell_padding_px: 10
    cell_icon_padding_px: 8
    cell_corner_radius_px: 12
    cell_border_rgb: [218, 223, 233]
    cell_border_rgb_options:
      - [218, 223, 233]
      - [208, 218, 232]
      - [226, 216, 205]
      - [207, 225, 217]
    cell_label_font_size_px: 22
    cell_label_color_rgb: [52, 60, 77]
    cell_label_color_rgb_options:
      - [52, 60, 77]
      - [48, 68, 93]
      - [77, 61, 81]
      - [53, 77, 67]
    missing_mark_font_size_px: 56
    missing_mark_color_rgb: [84, 96, 118]
    missing_mark_color_rgb_options:
      - [84, 96, 118]
      - [69, 103, 134]
      - [112, 84, 98]
      - [72, 106, 89]
  task_overrides:
    task_icons__named_strip__shape_run_length:
      scene_icon_size_min_px: 42
      scene_icon_size_max_px: 58
      cell_box_width_min_px: 58
      cell_box_width_max_px: 72
      cell_box_height_min_px: 88
      cell_box_height_max_px: 108
      cell_padding_px: 4
      cell_icon_padding_px: 8
      cell_corner_radius_px: 10
      scene_max_overlap_fraction: 0.0

prompt:
  shared:
    bundle_id: icons_sequence_v0
    scene_key: sequence_missing_count
    task_key: missing_count_query
  task_overrides:
    task_icons__sequence_strip__missing_count_value:
      object_description: a horizontal row of boxes with one question-mark box
      question_text: How many icons should be in the missing box to continue the sequence?
      annotation_hint: set "annotation" to a JSON array containing exactly one [x0, y0, x1, y1] box in image pixel coordinates for the missing box
      answer_hint: set "answer" to the missing count as an integer
      json_example: '{"annotation":[[540,126,654,458]],"answer":5}'
      json_example_answer_only: '{"answer":5}'
    task_icons__named_strip__shape_run_length:
      scene_key: named_strip_run_length
      task_key: run_length_query
      object_description: a horizontal row of boxed icons
      question_text_longest_shape_run_length: What is the longest consecutive run of "{target_shape_name}" icons in the row?
      question_text_shortest_shape_run_length: What is the shortest consecutive run of "{target_shape_name}" icons in the row?
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for the "{target_shape_name}" icons in the run that determines the answer
      answer_hint: set "answer" to the run length as an integer
      json_example: '{"annotation":[[220,132,270,182],[292,132,342,182],[364,132,414,182]],"answer":3}'
      json_example_answer_only: '{"answer":3}'

complexity:
  shared:
    criteria_weights:
      rule_inference: 0.45
      visual_scan: 0.25
      ambiguity: 0.20
      clutter: 0.10
