generation:
  shared:
    object_count_min: 2
    object_count_max: 12
    target_count_min: 0
    target_count_max: 6
    distractor_count_min: 1
    distractor_count_max: 6
    balanced_sampling: true
  task_overrides:
    task_icons_transformation_pair_count:
      pool_manifest: non_symmetry.txt
      transform_ids: [rot90, rot180, rot270, flip_h, flip_v, flip_diag_main, flip_diag_anti]
      transform_check_size_px: 72

rendering:
  shared:
    canvas_width: 1104
    canvas_height: 640
    reference_panel_width_px: 296
    panel_gap_px: 24
    outer_margin_px: 24
    panel_padding_px: 20
    panel_corner_radius_px: 18
    scene_icon_size_min_px: 36
    scene_icon_size_max_px: 72
    reference_icon_size_px: 110
    panel_title_font_size_px: 24
    background_color_rgb: [247, 248, 251]
    panel_fill_rgb: [255, 255, 255]
    panel_border_rgb: [205, 212, 224]
    header_text_rgb: [70, 78, 96]
    cell_border_rgb: [218, 223, 233]
    cell_label_color_rgb: [52, 60, 77]
    arrow_color_rgb: [84, 96, 118]
    cell_padding_px: 10
    pair_arrow_stroke_px: 4
    cell_label_font_size_px: 22
    palette_size_min: 1
    palette_size_max: 1
    color_channel_min: 24
    color_channel_max: 220
    min_color_distance: 40.0
    color_distance_space: lab
    icon_noise_edit_types: [blur, downsample, jpeg, noise]
    icon_noise_edit_count_range: [0, 2]
    icon_noise_value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70, 90]
      noise:
        alpha: [0.03, 0.08]

prompt:
  shared:
    bundle_id: icons_transformation_v1
    task_family_key: reference_pair_grid_transformation
    task_key: transformation_query
  task_overrides:
    task_icons_transformation_pair_count:
      object_description: a Reference pair on the left and a labeled Scene grid of icon pairs on the right
      question_text: How many labeled Scene cells show the same transformation as the Reference pair?
      evidence_hint: set "evidence" to a sorted JSON array of the matching Scene cell labels
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":["B","E","G"],"answer":3}'
      json_example_answer_only: '{"answer":3}'
