prompt:
  shared:
    bundle_id: icons_transformation_v0
    scene_key: reference_pair_grid_transformation
    task_key: transformation_query
  task_overrides:
    task_icons__pair_grid__pair_relation_count:
      object_description: a Reference pair on the left and a labeled Scene grid on the right
      question_text: How many labeled Scene cells show the same before-to-after relation as the Reference pair?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around all matching Scene cells
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[336,104,506,274],[532,104,702,274],[728,104,898,274]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_icons__paired_canvas__panel_attribute_change_count:
      scene_key: paired_canvas_transformation
      object_description: two icon panels labeled Left and Right with corresponding icons at matching positions
      question_text_color_changed_count: How many Right-panel icons changed color compared with the corresponding icon in the Left panel?
      question_text_size_changed_count: How many Right-panel icons changed size compared with the corresponding icon in the Left panel?
      question_text_rotation_changed_count: How many Right-panel icons changed rotation compared with the corresponding icon in the Left panel?
      evidence_hint: set "evidence" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for every counted Right-panel icon
      answer_hint: set "answer" to the count as an integer
      json_example: '{"evidence":[[620,156,684,220],[834,338,902,406]],"answer":2}'
      json_example_answer_only: '{"answer":2}'

complexity:
  shared:
    criteria_weights:
      rule_inference: 0.45
      visual_scan: 0.20
      ambiguity: 0.20
      clutter: 0.15
