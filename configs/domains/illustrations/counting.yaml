generation:
  shared:
    balanced_sampling: true
  task_overrides:
    task_illustrations__park_playground__activity_person_count:
      query_id_support:
        - sitting_person_count
        - walking_person_count
        - standing_person_count
        - playing_ball_person_count
    task_illustrations__park_playground__area_person_count:
      query_id_support:
        - playground_area_person_count
        - garden_area_person_count
    task_illustrations__park_playground__equipment_use_person_count:
      query_id_support:
        - person_using_slide_count
        - person_using_swing_set_count
        - person_using_seesaw_count
    private_park_person_activity:
      person_count_min: 7
      person_count_max: 12
      target_count_min: 1
      target_count_max: 6
      query_id_support:
        - sitting_person_count
        - walking_person_count
        - standing_person_count
        - playing_ball_person_count
      activity_support:
        - sitting
        - walking
        - standing
        - playing_ball
    task_illustrations__park_playground__playground_equipment_count:
      equipment_count_min: 4
      equipment_count_max: 7
      target_count_min: 1
      target_count_max: 5
      person_count_min: 5
      person_count_max: 9
      query_id_support:
        - slide_count
        - swing_set_count
        - seesaw_count
        - climbing_frame_count
      equipment_type_support:
        - slide
        - swing_set
        - seesaw
        - climbing_frame
    private_park_person_equipment_use:
      equipment_count_min: 4
      equipment_count_max: 7
      person_count_min: 8
      person_count_max: 14
      target_count_min: 1
      target_count_max: 5
      query_id_support:
        - person_using_slide_count
        - person_using_swing_set_count
        - person_using_seesaw_count
      equipment_type_support:
        - slide
        - swing_set
        - seesaw
        - climbing_frame
    private_park_person_zone:
      person_count_min: 7
      person_count_max: 12
      target_count_min: 1
      target_count_max: 6
      query_id_support:
        - playground_area_person_count
        - garden_area_person_count
      zone_support:
        - playground
        - garden
    private_terminal_boarding_area_person:
      person_count_min: 14
      person_count_max: 22
      target_count_min: 2
      target_count_max: 8
      query_id_support:
        - person_in_boarding_area_count
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    private_terminal_boarding_area_luggage:
      luggage_count_min: 10
      luggage_count_max: 18
      person_count_min: 10
      person_count_max: 18
      target_count_min: 2
      target_count_max: 6
      query_id_support:
        - luggage_in_boarding_area_count
      luggage_type_support:
        - suitcase
        - backpack
        - luggage_cart
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    private_terminal_queue_person:
      background_person_count_min: 6
      background_person_count_max: 12
      distractor_queue_count_min: 3
      distractor_queue_count_max: 7
      target_count_min: 2
      target_count_max: 7
      query_id_support:
        - person_in_queue_count
      service_point_support:
        - security_queue
        - ticket_counter
        - gate_queue
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    task_illustrations__transit_terminal__person_in_boarding_area_count:
      query_id_support:
        - person_in_boarding_area_count
    task_illustrations__transit_terminal__luggage_in_boarding_area_count:
      query_id_support:
        - luggage_in_boarding_area_count
    task_illustrations__transit_terminal__person_in_queue_count:
      query_id_support:
        - person_in_queue_count
