generation:
  shared:
    balanced_sampling: true
  task_overrides:
    private_terminal_boarding_area_person:
      person_count_min: 14
      person_count_max: 22
      target_count_min: 2
      target_count_max: 8
      query_id_support:
        - person_in_boarding_area_count
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    private_terminal_boarding_area_luggage:
      luggage_count_min: 10
      luggage_count_max: 18
      person_count_min: 10
      person_count_max: 18
      target_count_min: 2
      target_count_max: 6
      query_id_support:
        - luggage_in_boarding_area_count
      luggage_type_support:
        - suitcase
        - backpack
        - luggage_cart
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    private_terminal_queue_person:
      background_person_count_min: 6
      background_person_count_max: 12
      distractor_queue_count_min: 3
      distractor_queue_count_max: 7
      target_count_min: 2
      target_count_max: 7
      query_id_support:
        - person_in_queue_count
      service_point_support:
        - security_queue
        - ticket_counter
        - gate_queue
      boarding_area_support:
        - area_a
        - area_b
        - area_c
        - area_d
    task_illustrations__transit_terminal__person_in_boarding_area_count:
      query_id_support:
        - person_in_boarding_area_count
    task_illustrations__transit_terminal__luggage_in_boarding_area_count:
      query_id_support:
        - luggage_in_boarding_area_count
    task_illustrations__transit_terminal__person_in_queue_count:
      query_id_support:
        - person_in_queue_count
rendering:
  shared:
    canvas_width: 1280
    canvas_height: 840
    outer_margin_px: 42
    object_size_min_px: 74
    object_size_max_px: 128
    object_min_gap_px: 8
    max_overlap_fraction: 0.02
    placement_max_attempts: 180
    render_scale: 2
    indoor_canvas_width: 1280
    indoor_canvas_height: 840
    indoor_object_size_min_px: 52
    indoor_object_size_max_px: 86
    indoor_render_scale: 2
    transit_canvas_width: 1280
    transit_canvas_height: 900
    transit_render_scale: 2
    transit_setting_weights:
      rail_station: 1.0
      bus_terminal: 1.0
      airport_concourse: 1.0
    construction_canvas_width: 1280
    construction_canvas_height: 900
    construction_render_scale: 2
    construction_setting_weights:
      urban_build: 1.0
      roadwork: 1.0
      foundation_yard: 1.0
      scaffold_site: 1.0
    style_weights:
      flat_vector: 1.0
      outlined_cartoon: 1.0
      paper_cutout: 1.0
      soft_shadow: 1.0
    art_style_support:
      - flat_vector
      - outlined_cartoon
      - paper_cutout
      - soft_shadow
      - watercolor_wash
    art_style_weights:
      flat_vector: 1.0
      outlined_cartoon: 1.0
      paper_cutout: 1.0
      soft_shadow: 1.0
      watercolor_wash: 1.0
    background_weights:
      studio: 1.0
      meadow: 1.0
      sky_ground: 1.0
      tabletop: 1.0
      paper: 1.0
      shelf: 1.0
prompt:
  task_overrides:
    private_terminal_boarding_area_person:
      bundle_id: illustrations_counting_v0
      scene_key: transit_terminal_canvas
      task_key: person_at_boarding_area_count_task
      answer_hint_person_at_boarding_area: set "answer" to the count of people in {area_name} as an integer
      annotation_hint_person_at_boarding_area: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person in {area_name}
      json_example_person_at_boarding_area: '{"annotation":[[188,468,236,560],[344,492,394,586],[512,446,562,540]],"answer":3}'
      json_example_answer_only_person_at_boarding_area: '{"answer":3}'
    private_terminal_boarding_area_luggage:
      bundle_id: illustrations_counting_v0
      scene_key: transit_terminal_canvas
      task_key: luggage_in_boarding_area_count_task
      answer_hint_luggage_in_boarding_area: set "answer" to the count of {luggage_name} in {area_name} as an integer
      annotation_hint_luggage_in_boarding_area: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted {luggage_name} in {area_name}
      json_example_luggage_in_boarding_area: '{"annotation":[[192,584,238,642],[416,602,462,660],[684,568,732,628]],"answer":3}'
      json_example_answer_only_luggage_in_boarding_area: '{"answer":3}'
    private_terminal_queue_person:
      bundle_id: illustrations_counting_v0
      scene_key: transit_terminal_canvas
      task_key: queue_person_count_task
      answer_hint_queue_person: set "answer" to the count of people in the {service_point_name} as an integer
      annotation_hint_queue_person: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person in the {service_point_name}
      json_example_queue_person: '{"annotation":[[184,704,228,776],[238,706,282,778],[292,700,336,774]],"answer":3}'
      json_example_answer_only_queue_person: '{"answer":3}'
