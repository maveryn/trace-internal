prompt:
  task_overrides:
    private_park_person_activity:
      bundle_id: illustrations_counting_v0
      scene_key: park_playground_canvas
      task_key: person_activity_count_task
      answer_hint_person_activity: set "answer" to the count of people shown {activity_phrase} as an integer
      annotation_hint_person_activity: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person shown {activity_phrase}
      json_example_person_activity: '{"annotation":[[178,512,234,610],[486,594,546,692],[824,456,884,554]],"answer":3}'
      json_example_answer_only_person_activity: '{"answer":3}'
    task_illustrations__park_playground__playground_equipment_count:
      bundle_id: illustrations_counting_v0
      scene_key: park_playground_canvas
      task_key: playground_equipment_count_task
