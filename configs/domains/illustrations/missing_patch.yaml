generation:
  shared:
    source_task_id_support:
      - task_illustrations__environment__on_feature_object_count
      - task_illustrations__library__books_in_section_count
      - task_illustrations__park_playground__activity_person_count
      - task_illustrations__transit_terminal__person_in_boarding_area_count
      - task_illustrations__construction_site__worker_attribute_count
  task_overrides:
    task_illustrations__missing_patch__missing_patch_label:
      patch_mode_support:
        - plain_patch_label
        - transformed_patch_label
        - irregular_cutout_patch_label
      option_count: 6
      patch_width_min: 128
      patch_width_max: 176
      patch_height_min: 100
      patch_height_max: 142
      crop_margin_px: 48

rendering:
  shared:
    canvas_width: 640
    canvas_height: 420
    source_width: 640
    source_height: 420
    outer_margin_px: 28
    object_size_min_px: 48
    object_size_max_px: 82
    object_min_gap_px: 7
    max_overlap_fraction: 0.01
    placement_max_attempts: 260
    render_scale: 2
    style_weights:
      flat_vector: 1.0
      outlined_cartoon: 1.0
      paper_cutout: 1.0
      soft_shadow: 1.0
    art_style_support:
      - flat_vector
      - outlined_cartoon
      - paper_cutout
      - soft_shadow
      - ink_sketch
      - watercolor_wash
      - blueprint_line
    art_style_weights:
      flat_vector: 1.0
      outlined_cartoon: 1.0
      paper_cutout: 1.0
      soft_shadow: 1.0
      ink_sketch: 1.0
      watercolor_wash: 1.0
      blueprint_line: 1.0
    background_weights:
      studio: 1.0
      meadow: 1.0
      sky_ground: 1.0
      tabletop: 1.0
      paper: 1.0
      shelf: 1.0

prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
  task_overrides:
    task_illustrations__missing_patch__missing_patch_label:
      bundle_id: illustrations_missing_patch_missing_patch_label_v0
      scene_key: illustration_missing_patch_options
      task_key: missing_patch_label_task
      answer_hint_missing_patch_label: 'set "answer" to one option label from {option_labels}'
      annotation_hint_missing_patch_label: 'set "annotation" to a JSON object with keys "missing_region" and "selected_option"; each value is one [x0, y0, x1, y1] box in final image pixel coordinates around the Source missing region and the selected option image'
      json_example_missing_patch_label: '{"annotation":{"missing_region":[280,156,432,282],"selected_option":[420,548,590,674]},"answer":"C"}'
      json_example_answer_only_missing_patch_label: '{"answer":"C"}'
