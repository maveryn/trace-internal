prompt:
  task_overrides:
    task_illustrations__park_playground__activity_person_count:
      bundle_id: illustrations_park_playground_v0
      scene_key: park_playground_canvas
      task_key: person_activity_count_task
      answer_hint_person_activity: set "answer" to the count of people shown {activity_phrase} as an integer
      annotation_hint_person_activity: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person shown {activity_phrase}
      json_example_person_activity: '{"annotation":[[178,512,234,610],[486,594,546,692],[824,456,884,554]],"answer":3}'
      json_example_answer_only_person_activity: '{"answer":3}'
    task_illustrations__park_playground__area_person_count:
      bundle_id: illustrations_park_playground_v0
      scene_key: park_playground_canvas
      task_key: person_in_park_zone_count_task
      answer_hint_person_in_park_zone: set "answer" to the count of people in the {zone_name} as an integer
      annotation_hint_person_in_park_zone: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person in the {zone_name}
      json_example_person_in_park_zone: '{"annotation":[[192,398,248,496],[376,430,432,530],[528,390,586,490]],"answer":3}'
      json_example_answer_only_person_in_park_zone: '{"answer":3}'
    task_illustrations__park_playground__equipment_use_person_count:
      bundle_id: illustrations_park_playground_v0
      scene_key: park_playground_canvas
      task_key: person_using_equipment_count_task
      answer_hint_person_using_equipment: set "answer" to the count of people using the {equipment_name} as an integer
      annotation_hint_person_using_equipment: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted person using the {equipment_name}
      json_example_person_using_equipment: '{"annotation":[[194,356,246,440],[492,382,542,462],[742,344,792,426]],"answer":3}'
      json_example_answer_only_person_using_equipment: '{"answer":3}'
    task_illustrations__park_playground__playground_equipment_count:
      bundle_id: illustrations_park_playground_v0
      scene_key: park_playground_canvas
      task_key: playground_equipment_count_task
      answer_hint_playground_equipment: set "answer" to the count of {equipment_name} as an integer
      annotation_hint_playground_equipment: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates around every counted {equipment_name}
      json_example_playground_equipment: '{"annotation":[[158,326,286,424],[430,344,558,446],[704,318,832,420]],"answer":3}'
      json_example_answer_only_playground_equipment: '{"answer":3}'
    task_illustrations__park_playground__jigsaw_arrangement_label:
      bundle_id: illustrations_park_playground_v0
      scene_key: park_playground_canvas
      task_key: jigsaw_arrangement_label_task
      answer_hint_jigsaw_arrangement: set "answer" to the selected option letter
      annotation_hint_jigsaw_arrangement: set "annotation" to a JSON array containing the single [x0, y0, x1, y1] box around the selected option image in pixel coordinates
      json_example_jigsaw_arrangement: '{"annotation":[[594,478,1114,844]],"answer":"C"}'
      json_example_answer_only_jigsaw_arrangement: '{"answer":"C"}'
