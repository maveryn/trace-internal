generation:
  shared:
    balanced_sampling: true
  task_overrides:
    task_illustrations__rpg_house__door_state_count:
      query_id_support:
        - open_door_count
        - closed_door_count
      door_state_count_support:
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
        - 8
      room_count_support:
        - 4
        - 5
        - 6
        - 7
        - 8
    task_illustrations__rpg_house__missing_patch_label:
      query_id_support:
        - single
      source_room_count_min: 6
      source_room_count_max: 8
      option_count_support:
        - 4
        - 6
      patch_width_min: 150
      patch_width_max: 230
      patch_height_min: 120
      patch_height_max: 180
      crop_margin_px: 34
    task_illustrations__rpg_house__reachable_room_count:
      query_id_support:
        - single
      reachable_room_count_support:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
        - 6
        - 7
      room_count_support:
        - 4
        - 5
        - 6
        - 7
        - 8
    task_illustrations__rpg_house__rotated_tile_label:
      query_id_support:
        - single
      source_room_count_min: 6
      source_room_count_max: 8
      rotation_degrees_support:
        - 90
        - 270
      min_tile_detail_score: 120.0
      min_rotation_delta: 6.0
    task_illustrations__rpg_house__room_count:
      query_id_support:
        - single
      room_count_support:
        - 4
        - 5
        - 6
        - 7
        - 8
    task_illustrations__rpg_house__swapped_tile_pair_label:
      query_id_support:
        - single
      source_room_count_min: 6
      source_room_count_max: 8
      min_tile_detail_score: 120.0
      min_pair_difference: 7.0

