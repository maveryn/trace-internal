generation:
  shared:
    balanced_query_id_sampling: true
  task_overrides:
    task_illustrations__source_scene_edit__object_count_after_edit:
      edit_count_k_min: 1
      edit_count_k_max: 3
      current_count_min: 3
      current_count_max: 8
      source_query_support:
        - park_people
        - construction_yellow_hard_hats

rendering:
  shared:
    canvas_width: 960
    canvas_height: 720
    render_scale: 2
    annotation_padding_px: 7
    object_scale_min: 0.94
    object_scale_max: 1.10

prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
  task_overrides:
    task_illustrations__source_scene_edit__object_count_after_edit:
      bundle_id: illustrations_source_scene_edit_object_count_after_edit_v0
      scene_key: source_scene_edit
      task_key: object_count_after_edit_task
      answer_hint: set "answer" to the resulting count as an integer after the hypothetical add/remove
      annotation_hint: set "annotation" to a JSON array of [x0, y0, x1, y1] boxes in image pixel coordinates for all currently visible {object_plural} before the hypothetical edit
      json_example: '{"annotation":[[120,220,188,292],[310,204,382,286],[602,336,672,418]],"answer":5}'
      json_example_answer_only: '{"answer":5}'
