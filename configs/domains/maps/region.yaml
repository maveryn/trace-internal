prompt:
  shared:
    bundle_id: maps_region_v1
    answer_hint: set "answer" to the exact labeled region letter
  task_overrides:
    task_maps_region_association_label:
      task_family_key: choropleth_region_map
      task_key: region_association_query
      object_description_map_strip: a labeled thematic map with colored regions on the left and a category legend on the right
      object_description_map_card: a card-style labeled thematic map with colored regions on the left and a category legend on the right
      object_description_map_outline: an outline-style labeled thematic map with colored regions on the left and a category legend on the right
      object_description_region_map: an atlas-style region map with colored administrative areas on the left and a category legend on the right
      evidence_hint_max_category_region: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct labeled region
      evidence_hint_min_category_region: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct labeled region
      evidence_hint_matches_legend_bin: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct labeled region
      json_example_max_category_region: '{"evidence":[[174,129,412,333]],"answer":"C"}'
      json_example_min_category_region: '{"evidence":[[146,360,370,562]],"answer":"A"}'
      json_example_matches_legend_bin: '{"evidence":[[438,180,674,420]],"answer":"F"}'
      json_example_answer_only_max_category_region: '{"answer":"C"}'
      json_example_answer_only_min_category_region: '{"answer":"A"}'
      json_example_answer_only_matches_legend_bin: '{"answer":"F"}'
    task_maps_region_count:
      task_family_key: choropleth_region_map
      task_key: region_count_query
      answer_hint: set "answer" to the integer count
      object_description_map_strip: a labeled thematic map with colored regions on the left and a category legend on the right
      object_description_map_card: a card-style labeled thematic map with colored regions on the left and a category legend on the right
      object_description_map_outline: an outline-style labeled thematic map with colored regions on the left and a category legend on the right
      object_description_region_map: an atlas-style region map with colored administrative areas on the left and a category legend on the right
      evidence_hint_count_regions_in_category: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every counted region, in reading order
      evidence_hint_count_regions_above_category: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every counted region, in reading order
      evidence_hint_count_regions_below_category: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for every counted region, in reading order
      json_example_count_regions_in_category: '{"evidence":[[142,176,316,322],[384,198,561,348]],"answer":2}'
      json_example_count_regions_above_category: '{"evidence":[[138,150,314,304],[356,330,544,492],[566,176,690,340]],"answer":3}'
      json_example_count_regions_below_category: '{"evidence":[[172,350,342,512]],"answer":1}'
      json_example_answer_only_count_regions_in_category: '{"answer":2}'
      json_example_answer_only_count_regions_above_category: '{"answer":3}'
      json_example_answer_only_count_regions_below_category: '{"answer":1}'

