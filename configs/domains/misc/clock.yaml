  task_overrides:
    misc_clock_readout_base:
      query_id_weights:
        offset_time: 1.0
      offset_unit_weights:
        minutes: 1.0
        seconds: 0.0
      offset_direction_weights:
        after: 1.0
        before: 1.0
      balanced_query_id_sampling: true
      balanced_offset_unit_sampling: true
      balanced_offset_direction_sampling: true
      delta_minutes_support:
        min: 5
        max: 600
        step: 5
      delta_seconds_support:
        min: 5
        max: 36000
        step: 5
    task_misc__clock_collection__compare:
      query_id_weights:
        time_extremum_label: 1.0
      extremum_direction_weights:
        earliest: 1.0
        latest: 1.0
      balanced_query_id_sampling: true
      balanced_extremum_direction_sampling: true
      clock_label_support: ["A", "B", "C", "D", "E", "F", "G", "H", "I", "J", "K", "L"]
      clock_count_support: [6, 7, 8, 9, 10, 11, 12]
      min_compare_gap_minutes: 15
    task_misc__clock_match_panel__equivalent_time_label:
      query_id_weights:
        analog_reference_digital_options: 1.0
        digital_reference_analog_options: 1.0
      digital_display_palette_weights:
        charcoal_mint: 1.0
        navy_cyan: 1.0
        graphite_amber: 1.0
        cream_ink: 1.0
        blue_lcd: 1.0
        wine_rose: 1.0
        forest_lime: 1.0
        plum_ice: 1.0
      balanced_query_id_sampling: true
      balanced_digital_display_palette_sampling: true
      option_label_support: ["A", "B", "C", "D", "E", "F"]
      option_count: 6
      min_option_gap_minutes: 10

