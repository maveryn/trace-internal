generation:
  shared:
    scene_variant_weights:
      classic: 1.0
      minimal: 1.0
      outline: 1.0
    style_variant_weights:
      studio: 1.0
      accented: 1.0
      marker: 1.0
    accent_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    balanced_style_variant_sampling: true
    balanced_accent_color_name_sampling: true
    hour_min: 1
    hour_max: 12
    minute_min: 0
    minute_max: 55
    minute_step: 5
    second_min: 0
    second_max: 55
    second_step: 5
