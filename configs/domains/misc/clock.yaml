complexity:
  shared:
    criteria_weights:
      time_reading: 0.70
      visual_scan: 0.05
      ambiguity: 0.20
      clutter: 0.05
      reasoning_load: 0.0
      scene_variant_load: 0.0

prompt:
  shared:
    bundle_id: misc_clock_v0
  task_overrides:
    misc_clock_readout_base:
      scene_key: analog_clock
      task_key: clock_readout_query
      object_description_classic: one analog clock with all hour numerals, minute ticks, and two visible hands
      object_description_minimal: one clean analog clock with hour numerals and two visible hands
      object_description_outline: one outline-style analog clock with hour numerals and two visible hands
      object_description_classic_seconds: one analog clock with all hour numerals, minute ticks, and three visible hands including a thin seconds hand
      object_description_minimal_seconds: one clean analog clock with hour numerals and three visible hands including a thin seconds hand
      object_description_outline_seconds: one outline-style analog clock with hour numerals and three visible hands including a thin seconds hand
      annotation_hint: set "annotation" to an object/dictionary keyed by witness role with pixel points [x,y] for "clock_center", "hour_hand_tip", and "minute_hand_tip"
      annotation_hint_seconds: set "annotation" to an object/dictionary keyed by witness role with pixel points [x,y] for "clock_center", "hour_hand_tip", "minute_hand_tip", and "second_hand_tip"
      answer_hint: set "answer" to the exact time in HH:MM 12-hour format with leading zeros
      answer_hint_seconds: set "answer" to the exact time in HH:MM:SS 12-hour format with leading zeros
    task_misc__clock_collection__compare:
      scene_key: multi_analog_clock
      task_key: clock_compare_query
      object_description_classic: six to twelve labeled analog clocks arranged in a centered grid with at most four clocks per row, each with hour numerals, minute ticks, and two visible hands
      object_description_minimal: six to twelve labeled analog clocks arranged in a clean centered grid with at most four clocks per row, each with hour numerals and two visible hands
      object_description_outline: six to twelve labeled outline-style analog clocks arranged in a centered grid with at most four clocks per row, each with hour numerals and two visible hands
      annotation_hint: set "annotation" to an array containing exactly one bounding box [x0, y0, x1, y1] for the selected clock face
      answer_hint: set "answer" to the single winning clock label as a string
    task_misc__clock_match_panel__equivalent_time_label:
      scene_key: clock_match_panel
      task_key: clock_match_query
      object_description_analog_reference_digital_options: one analog reference clock above six labeled digital-display options
      object_description_digital_reference_analog_options: one digital reference display above six labeled analog-clock options
      annotation_hint: set "annotation" to an object/dictionary with keys "reference" and "correct_option", each containing a visual bounding box [x0,y0,x1,y1]
      answer_hint: set "answer" to the single matching option label as a string
