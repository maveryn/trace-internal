prompt:
  shared:
    bundle_id: pages_calendar_v0
  task_overrides:
    pages_calendar_month_view_base:
      scene_key: month_calendar
      task_key: calendar_month_query
      object_description_date_of_weekday_occurrence: one month-view calendar with weekday headers and date cells
      object_description_count_marked_day_class: one month-view calendar with weekday headers, date cells, and several marked dates
      object_description_workday_after_offset_date: one month-view calendar with weekday headers, date cells, and one marked reference date
      object_description_workday_before_offset_date: one month-view calendar with weekday headers, date cells, and one marked reference date
      answer_hint_date_of_weekday_occurrence: set "answer" to the integer date number
      answer_hint_count_marked_day_class: set "answer" to the integer count of marked dates in the requested day class
      answer_hint_workday_after_offset_date: set "answer" to the integer date number reached after moving the requested number of workdays from the marked date
      answer_hint_workday_before_offset_date: set "answer" to the integer date number reached before moving the requested number of workdays from the marked date
      annotation_hint_date_of_weekday_occurrence: set "annotation" to an array containing exactly one bounding box [x0, y0, x1, y1] for the target date cell
      annotation_hint_count_marked_day_class: set "annotation" to an array of bounding boxes [x0, y0, x1, y1] for all marked date cells in the requested day class
      annotation_hint_workday_after_offset_date: set "annotation" to an object with keys "reference_date" and "target_date", each mapped to the bounding box [x0, y0, x1, y1] of that date cell
      annotation_hint_workday_before_offset_date: set "annotation" to an object with keys "reference_date" and "target_date", each mapped to the bounding box [x0, y0, x1, y1] of that date cell
      json_example_date_of_weekday_occurrence: '{"annotation":[[354,256,456,352]],"answer":18}'
      json_example_answer_only_date_of_weekday_occurrence: '{"answer":18}'
      json_example_count_marked_day_class: '{"annotation":[[148,352,250,448],[560,352,662,448]],"answer":2}'
      json_example_answer_only_count_marked_day_class: '{"answer":2}'
      json_example_workday_after_offset_date: '{"annotation":{"reference_date":[354,256,456,352],"target_date":[560,256,662,352]},"answer":20}'
      json_example_answer_only_workday_after_offset_date: '{"answer":20}'
      json_example_workday_before_offset_date: '{"annotation":{"reference_date":[560,256,662,352],"target_date":[354,256,456,352]},"answer":18}'
      json_example_answer_only_workday_before_offset_date: '{"answer":18}'
    pages_calendar_event_grid_base:
      scene_key: calendar_event_grid
      task_key: calendar_event_grid_query
      object_description_date_slot_category_label: one month calendar where date cells contain short category chips in Top, Mid, and End event slots
      object_description_category_slot_day_count: one month calendar where date cells contain short category chips in Top, Mid, and End event slots
      object_description_date_for_category_slot_label: one month calendar where date cells contain short category chips in Top, Mid, and End event slots
      answer_hint_date_slot_category_label: set "answer" to the visible category label in the requested date and slot
      answer_hint_category_slot_day_count: set "answer" to the integer number of dates whose requested slot has the requested category label
      answer_hint_date_for_category_slot_label: set "answer" to the integer date number whose requested slot has the requested category label
      annotation_hint_date_slot_category_label: set "annotation" to an object with keys "date_cell" and "event_chip", each mapped to a bounding box [x0, y0, x1, y1]
      annotation_hint_category_slot_day_count: set "annotation" to an array of bounding boxes [x0, y0, x1, y1] for the matching event chips
      annotation_hint_date_for_category_slot_label: set "annotation" to an object with keys "date_cell" and "event_chip", each mapped to a bounding box [x0, y0, x1, y1]
      json_example_date_slot_category_label: '{"annotation":{"date_cell":[260,248,384,340],"event_chip":[268,286,376,304]},"answer":"Tech"}'
      json_example_answer_only_date_slot_category_label: '{"answer":"Tech"}'
      json_example_category_slot_day_count: '{"annotation":[[268,286,376,304],[392,382,500,400]],"answer":2}'
      json_example_answer_only_category_slot_day_count: '{"answer":2}'
      json_example_date_for_category_slot_label: '{"annotation":{"date_cell":[260,248,384,340],"event_chip":[268,286,376,304]},"answer":12}'
      json_example_answer_only_date_for_category_slot_label: '{"answer":12}'
