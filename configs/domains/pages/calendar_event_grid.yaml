prompt:
  shared:
    bundle_id: pages_calendar_event_grid_v0
    scene_key: calendar_event_grid
    task_key: calendar_event_grid_query
    object_description_date_slot_category_label: one month calendar where date cells
      contain short category chips in Top, Mid, and End event slots
    object_description_category_slot_day_count: one month calendar where date cells
      contain short category chips in Top, Mid, and End event slots
    object_description_date_for_category_slot_label: one month calendar where date
      cells contain short category chips in Top, Mid, and End event slots
    answer_hint_date_slot_category_label: set "answer" to the visible category label
      in the requested date and slot
    answer_hint_category_slot_day_count: set "answer" to the integer number of dates
      whose requested slot has the requested category label
    answer_hint_date_for_category_slot_label: set "answer" to the integer date number
      whose requested slot has the requested category label
    annotation_hint_date_slot_category_label: set "annotation" to an object with keys
      "date_cell" and "event_chip", each mapped to a bounding box [x0, y0, x1, y1]
    annotation_hint_category_slot_day_count: set "annotation" to an array of bounding
      boxes [x0, y0, x1, y1] for the matching event chips
    annotation_hint_date_for_category_slot_label: set "annotation" to an object with
      keys "date_cell" and "event_chip", each mapped to a bounding box [x0, y0, x1,
      y1]
    json_example_date_slot_category_label: '{"annotation":{"date_cell":[260,248,384,340],"event_chip":[268,286,376,304]},"answer":"Tech"}'
    json_example_answer_only_date_slot_category_label: '{"answer":"Tech"}'
    json_example_category_slot_day_count: '{"annotation":[[268,286,376,304],[392,382,500,400]],"answer":2}'
    json_example_answer_only_category_slot_day_count: '{"answer":2}'
    json_example_date_for_category_slot_label: '{"annotation":{"date_cell":[260,248,384,340],"event_chip":[268,286,376,304]},"answer":12}'
    json_example_answer_only_date_for_category_slot_label: '{"answer":12}'
