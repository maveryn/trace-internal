generation:
  shared:
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    side_count_support:
    - 2
    - 3
    attribute_count_support:
    - 4
    - 5
    - 6
    query_id_weights:
      side_attribute_value_label: 1.0
    scene_variant_weights:
      matrix_sheet: 1.0
      feature_bands: 1.0
rendering:
  shared:
    canvas_width: 1120
    canvas_height: 860
    outer_margin_px: 34
    header_height_px: 88
    gap_px: 14
    corner_radius_px: 14
    outline_width_px: 2
    title_font_size_px: 30
    subtitle_font_size_px: 17
    card_title_font_size_px: 22
    label_font_size_px: 15
    value_font_size_px: 17
prompt:
  shared:
    bundle_id: pages_comparison_panel_v0
    scene_key: comparison_panel
    task_key: comparison_panel_lookup_query
    object_description: a side-by-side comparison panel with option headers, shared
      attribute labels, and visible value cells
    annotation_hint: set "annotation" to an object mapping side_header, attribute_label,
      and value_cell to [x0,y0,x1,y1] pixel bounding boxes for the requested lookup
    answer_hint: set "answer" to the exact visible text requested by the question
visual:
  noise:
    apply_prob: 0.4
    edit_count_range:
    - 1
    - 1
    value_ranges:
      blur:
        radius:
        - 0.05
        - 0.18
      downsample:
        scale:
        - 0.96
        - 0.99
      jpeg:
        quality:
        - 90.0
        - 97.0
      noise:
        alpha:
        - 0.004
        - 0.012
