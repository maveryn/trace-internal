generation:
  shared:
    branch_count_min: 5
    branch_count_max: 7
    child_count_min: 2
    child_count_max: 8
    marked_count_min: 1
    marked_count_max: 5
    balanced_query_sampling: true
    balanced_context_sampling: true
    balanced_layout_sampling: true
    balanced_style_sampling: true
    query_weights:
      branch_child_count: 1.0
      nth_child_label: 1.0
      marked_child_count: 1.0
    context_weights:
      travel_plans: 1.0
      career_options: 1.0
      climate_actions: 1.0
      community_groups: 1.0
      shopping_tips: 1.0
      science_topics: 1.0
    layout_weights:
      radial_mind_map: 1.0
      left_right_map: 1.0
      clustered_map: 1.0
    style_weights:
      bright_notes: 1.0
      ink_outline: 1.0
      soft_cards: 1.0
      technical_pastel: 1.0
  task_overrides:
    task_pages__concept_map__branch_child_count:
      query_weights:
        branch_child_count: 1.0
    task_pages__concept_map__marked_child_count:
      query_weights:
        marked_child_count: 1.0
    task_pages__concept_map__ordered_child_label:
      branch_count_min: 6
      branch_count_max: 8
      child_count_min: 5
      child_count_max: 8
      query_weights:
        nth_child_label: 1.0

rendering:
  shared:
    canvas_width: 1500
    canvas_height: 1050
    outer_margin_px: 46
    panel_padding_px: 26
    panel_corner_radius_px: 24
    title_band_height_px: 64
    central_node_width_px: 190
    central_node_height_px: 88
    central_circle_diameter_px: 170
    branch_node_width_px: 168
    branch_node_height_px: 48
    branch_circle_diameter_px: 96
    child_node_width_px: 142
    child_node_height_px: 38
    node_corner_radius_px: 14
    node_border_width_px: 2
    connector_width_px: 3
    title_font_size_px: 30
    central_font_size_px: 20
    branch_font_size_px: 16
    child_font_size_px: 13
    layout_jitter_enabled: true
    layout_jitter_x_px_min: -20
    layout_jitter_x_px_max: 20
    layout_jitter_y_px_min: -16
    layout_jitter_y_px_max: 16
    layout_jitter_min_margin_px: 18

complexity:
  shared:
    criteria_weights:
      concept_size: 0.36
      visual_search: 0.30
      reasoning_load: 0.34

prompt:
  shared:
    bundle_id: pages_concept_map_v0
    scene_key: concept_map_diagram
    object_description: a concept map with a central topic, labeled branches, and child items
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    integer_answer_hint: set "answer" to the requested integer count
    label_answer_hint: set "answer" to the exact visible child-item label as a string
    annotation_hint_count: set "annotation" to an array of [x0,y0,x1,y1] pixel bounding boxes for the counted child-item nodes
    annotation_hint_label: set "annotation" to an object mapping parent_branch and answer_child to [x0,y0,x1,y1] pixel bounding boxes

visual:
  background:
    enabled: true
    styles:
      paper_light:
        kind: solid
        color: [247, 248, 244]
      paper_cool:
        kind: solid
        color: [238, 244, 248]
      paper_warm:
        kind: solid
        color: [249, 243, 234]
      paper_mint:
        kind: solid
        color: [239, 247, 241]
    weights:
      paper_light: 1.0
      paper_cool: 1.0
      paper_warm: 1.0
      paper_mint: 1.0
  noise:
    apply_prob: 0.30
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.03, 0.14]
      downsample:
        scale: [0.96, 0.99]
      jpeg:
        quality: [90.0, 98.0]
      noise:
        alpha: [0.003, 0.010]
