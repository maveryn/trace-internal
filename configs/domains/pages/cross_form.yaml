prompt:
  shared:
    bundle_id: pages_cross_form_v0
    answer_hint: set "answer" to the computed integer
  task_overrides:
    pages_paired_forms_reconciliation_source:
      scene_key: cross_form_reconciliation
      task_key: reconciliation_value_query
      object_description_purchase_receipt_pair: two side-by-side business forms, a
        purchase order and a receiving slip, with matching item codes and visible
        quantities
      annotation_hint_total_amount_delta: set "annotation" to an array of [x0, y0, x1, y1]
        boxes for the full receiving-slip rows whose received quantity differs
        from the matching purchase-order quantity
      annotation_hint_shortfall_minus_overage_value: set "annotation" to an array
        of [x0, y0, x1, y1] boxes for the full receiving-slip rows whose received
        quantity differs from the matching purchase-order quantity
      annotation_hint_sum_absolute_quantity_differences: set "annotation" to an array
        of [x0, y0, x1, y1] boxes for the full receiving-slip rows whose received
        quantity differs from the matching purchase-order quantity
