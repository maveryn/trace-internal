generation:
  shared:
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
  task_overrides:
    task_pages__profile_card_grid__attribute_lookup_label:
      card_count_support: [6, 9]
      query_id_weights:
        value_for_named_profile_field: 1.0
        profile_for_field_value: 1.0
      scene_variant_weights:
        directory_grid: 1.0
        compact_cards: 1.0
    task_pages__ranked_list__ordinal_entry_label:
      section_count_support: [2, 3]
      item_count_support: [5, 6, 7]
      balanced_ordinal_reference_sampling: true
      balanced_from_end_reference_sampling: true
      query_id_weights:
        nth_entry_label: 1.0
        from_end_entry_label: 1.0
        entry_after_named_entry: 1.0
      scene_variant_weights:
        two_column_lists: 1.0
        stacked_lists: 1.0
      ordinal_reference_weights:
        first: 1.0
        interior: 1.0
        final: 1.0
      from_end_reference_weights:
        last: 1.0
        second_last: 1.0
        third_last: 1.0

rendering:
  shared:
    canvas_width: 1120
    canvas_height: 860
    outer_margin_px: 34
    header_height_px: 88
    gap_px: 14
    corner_radius_px: 14
    outline_width_px: 2
    title_font_size_px: 30
    subtitle_font_size_px: 17
    card_title_font_size_px: 22
    label_font_size_px: 15
    value_font_size_px: 17
  task_overrides:
    task_pages__ranked_list__ordinal_entry_label:
      canvas_width: 1000
      canvas_height: 850

complexity:
  shared:
    criteria_weights:
      lookup_reasoning: 0.45
      visual_scan: 0.35
      layout_load: 0.20

prompt:
  shared:
    bundle_id: pages_document_lookup_v0
    answer_hint: set "answer" to the exact visible text requested by the question
  task_overrides:
    task_pages__profile_card_grid__attribute_lookup_label:
      scene_key: profile_card_grid
      task_key: profile_attribute_lookup_query
      object_description: a grid of profile cards, each with a visible profile name and labeled fields
      evidence_hint: set "evidence" to an object mapping profile_name, field_label, and field_value to [x0,y0,x1,y1] pixel bounding boxes for the matched card row
    task_pages__ranked_list__ordinal_entry_label:
      scene_key: ranked_list
      task_key: ranked_list_entry_query
      object_description: grouped numbered lists with short visible item labels
      evidence_hint: set "evidence" to an object mapping section_title and target_item to [x0,y0,x1,y1] pixel bounding boxes; include source_item for following-entry questions

visual:
  noise:
    apply_prob: 0.4
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.05, 0.18]
      downsample:
        scale: [0.96, 0.99]
      jpeg:
        quality: [90.0, 97.0]
      noise:
        alpha: [0.004, 0.012]
