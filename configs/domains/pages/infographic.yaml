      scene_variant_weights:
        radial_halo: 1.0
        side_rail_poster: 1.0
        diagonal_chain: 1.0
        split_poster: 1.0
        stacked_feature: 1.0
    task_pages__hero_callout_infographic__callout_condition_count:
