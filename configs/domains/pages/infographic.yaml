prompt:
  shared:
    bundle_id: pages_infographic_v0
    scene_key: infographic_metric_arithmetic
    task_key: metric_arithmetic_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    answer_hint: set "answer" to the requested integer
    answer_hint_label: set "answer" to the exact visible text requested by the question
    annotation_hint: set "annotation" to an object mapping each supporting metric
      card's visible label to that card's [x0,y0,x1,y1] pixel bounding box
    annotation_hint_label: set "annotation" to an object mapping each supporting metric
      card's visible label to that card's [x0,y0,x1,y1] pixel bounding box
    annotation_hint_metric_ranked_item: set "annotation" to an object mapping target_metric
      and target_value to [x0,y0,x1,y1] pixel bounding boxes for the selected metric
      label and printed value
    annotation_hint_metric_ranked_item_scoped: set "annotation" to an object mapping
      section_title, target_metric, and target_value to [x0,y0,x1,y1] pixel bounding
      boxes for the selected section title, metric label, and printed value
  task_overrides:
    task_pages__hero_callout_infographic__callout_field_value_label:
      scene_key: hero_callout_infographic
      task_key: hero_callout_infographic_query
      object_description: a poster-style infographic with one large hero visual and
        titled callout cards containing field labels, visible values, badges, and
        connector lines
      answer_hint: set "answer" to the exact visible value requested by the question
      annotation_hint: set "annotation" to an object mapping callout_title, field_label,
        and value_cell to [x0,y0,x1,y1] pixel bounding boxes for the requested lookup
    task_pages__hero_callout_infographic__callout_metric_extremum_label:
      scene_key: hero_callout_infographic
      task_key: hero_callout_infographic_query
      object_description: a poster-style infographic with one large hero visual and
        titled callout cards containing field labels, visible values, badges, and
        connector lines
      answer_hint: set "answer" to the exact visible callout title requested by the
        question
      annotation_hint: set "annotation" to an object mapping winning_callout_title,
        winning_field_label, winning_value, and candidate_N value keys to [x0,y0,x1,y1]
        pixel bounding boxes for the compared values
    task_pages__hero_callout_infographic__callout_condition_count:
      scene_key: hero_callout_infographic
      task_key: hero_callout_infographic_query
      object_description: a poster-style infographic with one large hero visual and
        titled callout cards containing field labels, visible values, badges, and
        connector lines
      answer_hint: set "answer" to the requested integer count
      annotation_hint: set "annotation" to an array of [x0,y0,x1,y1] pixel bounding
        boxes for the matching value cells
    task_pages__sectioned_infographic__section_item_count:
      scene_key_sectioned: sectioned_infographic
      task_key_sectioned: sectioned_infographic_query
      answer_hint_section_item_count: set "answer" to the requested integer count
      annotation_hint_section_item_count: set "annotation" to an array of [x0,y0,x1,y1]
        pixel bounding boxes for the visible item rows in the requested section
    task_pages__sectioned_infographic__section_filtered_item_label:
      scene_key_sectioned: sectioned_infographic
      task_key_sectioned: sectioned_infographic_query
      answer_hint_section_filtered_item: set "answer" to the exact visible item label
        requested by the question
      annotation_hint_section_filtered_item: set "annotation" to an object mapping
        section_title, filter_marker, and target_item to [x0,y0,x1,y1] pixel bounding
        boxes
visual:
  task_overrides:
    task_pages__hero_callout_infographic__callout_field_value_label:
      context_text:
        pages_context_text_enabled: false
    task_pages__hero_callout_infographic__callout_metric_extremum_label:
      context_text:
        pages_context_text_enabled: false
    task_pages__hero_callout_infographic__callout_condition_count:
      context_text:
        pages_context_text_enabled: false
  noise:
    apply_prob: 0.5
    edit_count_range:
    - 1
    - 1
    value_ranges:
      blur:
        radius:
        - 0.05
        - 0.2
      downsample:
        scale:
        - 0.95
        - 0.99
      jpeg:
        quality:
        - 88.0
        - 96.0
      noise:
        alpha:
        - 0.005
        - 0.015
