prompt:
  shared:
    bundle_id: pages_infographic_v0
    scene_key: infographic_metric_arithmetic
    task_key: metric_arithmetic_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    answer_hint: set "answer" to the requested integer
    answer_hint_label: set "answer" to the exact visible text requested by the question
    annotation_hint: set "annotation" to an object mapping each supporting metric card's visible label to that card's [x0,y0,x1,y1] pixel bounding box
    annotation_hint_label: set "annotation" to an object mapping each supporting metric card's visible label to that card's [x0,y0,x1,y1] pixel bounding box
    annotation_hint_metric_ranked_item: set "annotation" to an object mapping target_metric and target_value to [x0,y0,x1,y1] pixel bounding boxes for the selected metric label and printed value
    annotation_hint_metric_ranked_item_scoped: set "annotation" to an object mapping section_title, target_metric, and target_value to [x0,y0,x1,y1] pixel bounding boxes for the selected section title, metric label, and printed value
  task_overrides:
    task_pages__mixed_infographic_page__module_field_value_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible value requested by the question
      annotation_hint: set "annotation" to an object mapping module_title, item_label, field_label, and value_cell to [x0,y0,x1,y1] pixel bounding boxes for the requested lookup
    task_pages__mixed_infographic_page__module_field_extremum_item_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible item label requested by the question
      annotation_hint: set "annotation" to an object mapping module_title, field_label, winning_item, winning_value, and candidate value keys to [x0,y0,x1,y1] pixel bounding boxes for the compared values
    task_pages__mixed_infographic_page__module_field_ranked_item_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible item label requested by the question
      annotation_hint: set "annotation" to an object mapping module_title, field_label, ranked_item, ranked_value, and candidate value keys to [x0,y0,x1,y1] pixel bounding boxes for the compared values
    task_pages__mixed_infographic_page__page_field_extremum_module_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible module title requested by the question
      annotation_hint: set "annotation" to an object mapping winning_module_title, winning_field_label, winning_item, winning_value, and candidate value keys to [x0,y0,x1,y1] pixel bounding boxes for the compared values
    task_pages__mixed_infographic_page__module_two_field_condition_item_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible item label requested by the question
      annotation_hint: set "annotation" to an object mapping module_title, numeric_field_label, category_field_label, matching_item, numeric_value_cell, and category_value_cell to [x0,y0,x1,y1] pixel bounding boxes for the two-condition match
    task_pages__mixed_infographic_page__module_condition_item_count:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the requested integer count
      annotation_hint: set "annotation" to an array of [x0,y0,x1,y1] pixel bounding boxes for the matching value cells
    task_pages__mixed_infographic_page__module_field_total_value:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the requested integer total
      annotation_hint: set "annotation" to an array of [x0,y0,x1,y1] pixel bounding boxes for every value cell used in the sum
    task_pages__mixed_infographic_page__two_module_field_total_comparison_module_label:
      scene_key: mixed_infographic_page
      task_key: mixed_infographic_lookup_query
      object_description: a dense mixed infographic with titled modules, circular callouts, compact item labels, field labels, icons, visible values, and short native callout notes
      answer_hint: set "answer" to the exact visible module title with the larger total
      annotation_hint: set "annotation" to an object mapping module_a_title, module_b_title, field_label_a, field_label_b, and module_a_value_N/module_b_value_N keys to [x0,y0,x1,y1] pixel bounding boxes for the compared totals
    task_pages__hero_callout_infographic__callout_field_value_label:
