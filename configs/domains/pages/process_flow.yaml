generation:
  shared:
    node_count_min: 10
    node_count_max: 12
    lane_count_min: 3
    lane_count_max: 5
    balanced_query_sampling: true
    balanced_context_sampling: true
    balanced_layout_sampling: true
    balanced_style_sampling: true
    query_weights:
      shape_node_count: 1.0
      status_node_count: 1.0
      role_node_count: 1.0
      condition_path_endpoint_label: 1.0
      all_cross_lane_handoff_count: 1.0
      lane_outgoing_handoff_count: 1.0
      lane_involved_handoff_count: 1.0
    context_weights:
      incident_response: 1.0
      editorial_review: 1.0
      order_fulfillment: 1.0
      model_release: 1.0
      lab_sample: 1.0
      support_ticket: 1.0
    layout_weights:
      vertical_swimlane: 1.0
      horizontal_swimlane: 1.0
      staggered_columns: 1.0
      compact_rows: 1.0
    style_weights:
      blueprint: 1.0
      pastel_cards: 1.0
      graphite: 1.0
      warm_memo: 1.0
  task_overrides:
    task_pages__process_flow__filtered_node_count:
      node_count_min: 11
      node_count_max: 14
    task_pages__process_flow__all_cross_lane_handoff_count:
      node_count_min: 11
      node_count_max: 14
    task_pages__process_flow__lane_filtered_handoff_count:
      node_count_min: 11
      node_count_max: 14
rendering:
  shared:
    canvas_width: 1200
    canvas_height: 900
    outer_margin_px: 46
    panel_padding_px: 24
    panel_corner_radius_px: 24
    title_band_height_px: 68
    lane_header_height_px: 42
    node_width_px: 146
    node_height_px: 64
    node_corner_radius_px: 16
    node_border_width_px: 3
    edge_width_px: 4
    arrow_head_length_px: 15
    arrow_head_width_px: 13
    title_font_size_px: 30
    lane_font_size_px: 18
    node_label_font_size_px: 17
    badge_font_size_px: 12
    edge_label_font_size_px: 15
    layout_jitter_enabled: true
    layout_jitter_x_px_min: -24
    layout_jitter_x_px_max: 24
    layout_jitter_y_px_min: -18
    layout_jitter_y_px_max: 18
    layout_jitter_min_margin_px: 18
prompt:
  shared:
    bundle_id: pages_process_flow_v0
    scene_key: process_flow_diagram
    object_description: a labeled process-flow diagram with lanes, step boxes, status
      badges, and arrows
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    integer_answer_hint: set "answer" to the requested integer count
    label_answer_hint: set "answer" to the exact visible step label as a string
    annotation_hint_node_count: set "annotation" to an array of [x0,y0,x1,y1] pixel
      bounding boxes for the counted step boxes
    annotation_hint_path_endpoint: set "annotation" to an object mapping start_step,
      first_decision_label, intermediate_step, second_decision_label, and endpoint_step
      to [x0,y0,x1,y1] pixel bounding boxes for the named path witnesses
    annotation_hint_handoff_count: set "annotation" to a list of segments. Each
      segment is [[x1, y1], [x2, y2]], using the endpoints of one counted handoff
      arrow; use [] when the answer is zero
  task_overrides:
    task_pages__process_flow__filtered_node_count:
      integer_answer_hint: set "answer" to the requested integer count
      annotation_hint_node_count: set "annotation" to an array of [x0,y0,x1,y1] pixel
        bounding boxes for the counted step boxes
    task_pages__process_flow__condition_path_endpoint_label:
      label_answer_hint: set "answer" to the exact visible step label as a string
      annotation_hint_path_endpoint: set "annotation" to an object mapping start_step,
        first_decision_label, intermediate_step, second_decision_label, and endpoint_step
        to [x0,y0,x1,y1] pixel bounding boxes for the named path witnesses
    task_pages__process_flow__all_cross_lane_handoff_count:
      integer_answer_hint: set "answer" to the requested integer count
      annotation_hint_handoff_count: set "annotation" to a list of segments. Each
        segment is [[x1, y1], [x2, y2]], using the endpoints of one counted handoff
        arrow; use [] when the answer is zero
    task_pages__process_flow__lane_filtered_handoff_count:
      integer_answer_hint: set "answer" to the requested integer count
      annotation_hint_handoff_count: set "annotation" to a list of segments. Each
        segment is [[x1, y1], [x2, y2]], using the endpoints of one counted handoff
        arrow; use [] when the answer is zero
visual:
  background:
    enabled: true
    styles:
      paper_light:
        kind: solid
        color:
        - 242
        - 243
        - 239
      paper_cool:
        kind: solid
        color:
        - 235
        - 241
        - 244
      paper_warm:
        kind: solid
        color:
        - 246
        - 240
        - 230
      paper_green:
        kind: solid
        color:
        - 237
        - 244
        - 238
      paper_lavender:
        kind: solid
        color:
        - 241
        - 239
        - 248
    weights:
      paper_light: 1.0
      paper_cool: 1.0
      paper_warm: 1.0
      paper_green: 1.0
      paper_lavender: 1.0
  noise:
    apply_prob: 0.5
    edit_count_range:
    - 1
    - 1
    value_ranges:
      blur:
        radius:
        - 0.05
        - 0.25
      downsample:
        scale:
        - 0.94
        - 0.99
      jpeg:
        quality:
        - 86.0
        - 96.0
      noise:
        alpha:
        - 0.006
        - 0.018
