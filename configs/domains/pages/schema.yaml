prompt:
  shared:
    bundle_id: pages_schema_v0
    scene_key: database_schema_diagram
    object_description: database tables with field rows, key markers, and relationship
      lines
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    integer_answer_hint: set "answer" to the requested integer count
    string_answer_hint: set "answer" to the exact target table label as shown
    cardinality_answer_hint: set "answer" to the normalized cardinality label, one
      of "one_to_one", "one_to_many", or "optional_many"
    annotation_hint_field_count: set "annotation" to an array of [x0,y0,x1,y1] pixel
      bounding boxes for the counted field rows
    annotation_hint_relationship_count: set "annotation" to a list of segments.
      Each segment is [[x1, y1], [x2, y2]], using the endpoints of one counted
      relationship line; use [] when the answer is zero
    annotation_hint_relationship_endpoint: set "annotation" to an object with keys
      "source_table", "relationship_label", and "target_table", each mapped to a [x0,y0,x1,y1]
      pixel bounding box
    annotation_hint_relationship_cardinality: set "annotation" to an object with keys
      "source_table", "target_table", "source_cardinality_marker", and "target_cardinality_marker",
      each mapped to a [x0,y0,x1,y1] pixel bounding box
