generation:
  shared:
    step_count_support:
    - 5
    - 6
    - 7
    - 8
    balanced_scene_variant_sampling: true
    balanced_ordinal_reference_sampling: true
    scene_variant_weights:
      vertical_cards: 1.0
      horizontal_cards: 1.0
      two_column_cards: 1.0
    ordinal_reference_weights:
      first: 1.0
      interior: 1.0
      final: 1.0
rendering:
  shared:
    canvas_width: 1000
    canvas_height: 820
    outer_margin_px: 34
    header_height_px: 86
    card_gap_px: 14
    card_corner_radius_px: 14
    card_outline_width_px: 2
    number_badge_size_px: 38
    title_font_size_px: 30
    subtitle_font_size_px: 17
    step_title_font_size_px: 22
    step_detail_font_size_px: 17
prompt:
  shared:
    bundle_id: pages_step_list_v1
visual:
  noise:
    apply_prob: 0.4
    edit_count_range:
    - 1
    - 1
    value_ranges:
      blur:
        radius:
        - 0.05
        - 0.18
      downsample:
        scale:
        - 0.96
        - 0.99
      jpeg:
        quality:
        - 90.0
        - 97.0
      noise:
        alpha:
        - 0.004
        - 0.012
