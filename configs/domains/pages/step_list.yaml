generation:
  shared:
    step_count_support: [5, 6, 7, 8]
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    balanced_ordinal_reference_sampling: true
    query_id_weights:
      nth_step_title: 1.0
      nth_step_detail: 1.0
      step_after_named_step: 1.0
    scene_variant_weights:
      vertical_cards: 1.0
      horizontal_cards: 1.0
      two_column_cards: 1.0
    ordinal_reference_weights:
      first: 1.0
      interior: 1.0
      final: 1.0

rendering:
  shared:
    canvas_width: 1000
    canvas_height: 820
    outer_margin_px: 34
    header_height_px: 86
    card_gap_px: 14
    card_corner_radius_px: 14
    card_outline_width_px: 2
    number_badge_size_px: 38
    title_font_size_px: 30
    subtitle_font_size_px: 17
    step_title_font_size_px: 22
    step_detail_font_size_px: 17

complexity:
  shared:
    criteria_weights:
      order_lookup: 0.45
      visual_scan: 0.35
      scene_variant_load: 0.20

prompt:
  shared:
    bundle_id: pages_step_list_v0
    scene_key: step_list
    task_key: step_lookup_query
    object_description_vertical_cards: a numbered vertical list of instruction cards with a title and detail on each card
    object_description_horizontal_cards: a numbered two-row list of instruction cards with a title and detail on each card
    object_description_two_column_cards: a numbered two-column list of instruction cards with a title and detail on each card
    answer_hint: set "answer" to the exact visible text requested by the question
    evidence_hint: set "evidence" to an object mapping role names to [x0,y0,x1,y1] pixel bounding boxes for the visible step text used to identify the answer
    evidence_hint_nth_step_title: set "evidence" to an object with key "target_title" mapped to the [x0,y0,x1,y1] pixel bounding box for the requested step title
    evidence_hint_nth_step_detail: set "evidence" to an object with key "target_detail" mapped to the [x0,y0,x1,y1] pixel bounding box for the requested step detail text
    evidence_hint_step_after_named_step: set "evidence" to an object with keys "source_title" and "target_title" mapped to [x0,y0,x1,y1] pixel bounding boxes for the named source step title and the immediately following step title

visual:
  noise:
    apply_prob: 0.4
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.05, 0.18]
      downsample:
        scale: [0.96, 0.99]
      jpeg:
        quality: [90.0, 97.0]
      noise:
        alpha: [0.004, 0.012]
