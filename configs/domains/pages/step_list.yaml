prompt:
  shared:
    bundle_id: pages_step_list_v0
    scene_key: step_list
    task_key: step_lookup_query
    object_description_vertical_cards: a numbered vertical list of instruction cards
      with a title and detail on each card
    object_description_horizontal_cards: a numbered two-row list of instruction cards
      with a title and detail on each card
    object_description_two_column_cards: a numbered two-column list of instruction
      cards with a title and detail on each card
    answer_hint: set "answer" to the exact visible text requested by the question
    annotation_hint: set "annotation" to an object mapping role names to [x0,y0,x1,y1]
      pixel bounding boxes for the visible step text used to identify the answer
    annotation_hint_nth_step_title: set "annotation" to an object with key "target_title"
      mapped to the [x0,y0,x1,y1] pixel bounding box for the requested step title
    annotation_hint_nth_step_detail: set "annotation" to an object with key "target_detail"
      mapped to the [x0,y0,x1,y1] pixel bounding box for the requested step detail
      text
    annotation_hint_step_after_named_step: set "annotation" to an object with keys
      "source_title" and "target_title" mapped to [x0,y0,x1,y1] pixel bounding boxes
      for the named source step title and the immediately following step title
    annotation_hint_step_title_for_detail: set "annotation" to an object with keys
      "source_detail" and "target_title" mapped to [x0,y0,x1,y1] pixel bounding boxes
      for the named detail text and its owning step title
    annotation_hint_step_number_for_detail: set "annotation" to an object with keys
      "source_detail" and "target_number" mapped to [x0,y0,x1,y1] pixel bounding boxes
      for the named detail text and its owning step number
  task_overrides:
    task_pages__instruction_panel__shared_control_for_step_set_label:
      scene_key: instruction_panel
      task_key: instruction_panel_query
      object_description: an instruction panel with numbered steps and visible control
        chips on each step
      answer_hint: set "answer" to the exact visible control label common to the referenced
        steps
      annotation_hint: set "annotation" to an object mapping "step_numbers" to an
        array of [x0,y0,x1,y1] pixel bounding boxes for the referenced step-number
        badges and "shared_control_chips" to an array of [x0,y0,x1,y1] pixel bounding
        boxes for the matching control chips in those steps
    task_pages__instruction_panel__step_for_control_pair_label:
      scene_key: instruction_panel
      task_key: instruction_panel_query
      object_description: an instruction panel with numbered steps and visible control
        chips on each step
      answer_hint: set "answer" to the integer step number containing both referenced
        control labels
      annotation_hint: set "annotation" to an object mapping "first_control", "second_control",
        and "target_step_number" to [x0,y0,x1,y1] pixel bounding boxes for the two
        matching control chips and their step-number badge
visual:
  task_overrides:
    task_pages__instruction_panel__shared_control_for_step_set_label:
      context_text:
        pages_context_text_enabled: false
    task_pages__instruction_panel__step_for_control_pair_label:
      context_text:
        pages_context_text_enabled: false
  noise:
    apply_prob: 0.4
    edit_count_range:
    - 1
    - 1
    value_ranges:
      blur:
        radius:
        - 0.05
        - 0.18
      downsample:
        scale:
        - 0.96
        - 0.99
      jpeg:
        quality:
        - 90.0
        - 97.0
      noise:
        alpha:
        - 0.004
        - 0.012
