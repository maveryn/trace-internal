      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_accent_color_name_sampling: true
  task_overrides:
    task_physics_circuits_equivalent_resistance:
      scene_variant_weights:
        parallel: 1.0
        simple_series_parallel: 1.0
      query_variant_weights:
        total_resistance: 1.0
      balanced_scene_variant_sampling: true
      balanced_query_variant_sampling: true
      balanced_target_answer_sampling: true
