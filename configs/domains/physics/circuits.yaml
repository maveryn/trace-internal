prompt:
  shared:
    bundle_id: physics_circuits_v0
  task_overrides:
    physics_circuits_resistance_family:
      scene_key: resistor_network_diagram
      task_key: equivalent_resistance_query
      object_description_parallel_total_resistance: one resistor network between terminals A and B with several parallel labeled resistor branches
      object_description_simple_series_parallel_total_resistance: one resistor network between terminals A and B made from one to three parallel resistor blocks in series, with optional single series resistors before, between, or after the blocks
      object_description_parallel_missing_resistor_value: two side-by-side resistor networks between labeled terminals A and B; the left circuit has one red `?` resistor inside a parallel branch
      object_description_simple_series_parallel_missing_resistor_value: two side-by-side resistor networks between labeled terminals A and B; the left circuit has one red `?` series resistor
      evidence_hint_total_resistance: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for all resistor boxes that belong to the network between terminals A and B
      evidence_hint_missing_resistor_value: set "evidence" to the single [x0, y0, x1, y1] box of the red `?` resistor in the left circuit
      answer_hint_total_resistance: set "answer" to the total equivalent resistance between terminals A and B as an integer number of ohms
      answer_hint_missing_resistor_value: set "answer" to the integer resistor value that should replace the red `?` resistor
