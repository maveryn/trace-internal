prompt:
  shared:
    bundle_id: physics_circuits_v0
  task_overrides:
    physics_circuits_equivalent_component_family:
      scene_key: equivalent_circuit_diagram
      task_key: equivalent_component_query
      object_description_series_parallel_total_resistance: one resistor circuit between terminals A and B with at least one labeled zigzag resistor in series with one or two labeled parallel resistor blocks
      object_description_series_parallel_total_capacitance: one capacitor circuit between terminals A and B with at least one labeled parallel-plate capacitor in series with one or two labeled parallel capacitor blocks
      annotation_hint_total_resistance: set "annotation" to an object mapping each visible resistor label such as R1 or R2 to one bounding box [x0, y0, x1, y1] around that resistor symbol and its value label
      annotation_hint_total_capacitance: set "annotation" to an object mapping each visible capacitor label such as C1 or C2 to one bounding box [x0, y0, x1, y1] around that capacitor symbol and its value label
      answer_hint_total_resistance: set "answer" to the total equivalent resistance between terminals A and B as an integer number of ohms
      answer_hint_total_capacitance: set "answer" to the total equivalent capacitance between terminals A and B as an integer number of microfarads
    physics_circuits_bulb_brightness_family:
      scene_key: bulb_circuit_diagram
      task_key: bulb_brightness_query
      object_description: a visible ideal-battery circuit with five labeled bulbs and resistance labels
      annotation_hint_brightness_extremum: set "annotation" to an object mapping each visible bulb label such as B1, B2, B3, B4, or B5 to one bounding box [x0, y0, x1, y1] around that bulb symbol and its resistance label
      answer_hint_brightest_bulb_label: set "answer" to the label of the brightest bulb, for example "B2"
      answer_hint_dimmest_bulb_label: set "answer" to the label of the dimmest bulb, for example "B2"
    physics_circuits_switch_circuit_family:
      scene_key: switch_circuit_diagram
      task_key: switch_circuit_query
      object_description: a mixed branch battery circuit with five labeled bulbs and visibly open or closed switches
      annotation_hint_lit_bulb_count: set "annotation" to an array of bounding boxes [x0, y0, x1, y1] around the bulb symbols that will be on; use an empty array [] if no bulbs will be on
      answer_hint_lit_bulb_count: set "answer" to the number of bulbs that will be on
    physics_circuits_state_change_bulb_brightness_family:
      scene_key: circuit_state_change_diagram
      task_key: state_change_brightness_query
      object_description: a visible ideal-battery circuit with five labeled bulbs, resistance labels, and one red-boxed switch action cue
      annotation_hint_state_change_brightness: set "annotation" to an object mapping changed_switch and each visible bulb label B1 through B5 to bounding boxes [x0, y0, x1, y1] around the switch action cue and each bulb symbol with its resistance label
      answer_hint_brightens_after_switch_change: set "answer" to the label of the bulb that becomes brighter after the switch action
      answer_hint_dims_after_switch_change: set "answer" to the label of the bulb that becomes dimmer after the switch action
      answer_hint_turns_on_after_switch_change: set "answer" to the label of the bulb that turns on after the switch action
      answer_hint_turns_off_after_switch_change: set "answer" to the label of the bulb that turns off after the switch action
    physics_circuits_bridge_missing_resistance_family:
      scene_key: bridge_circuit_diagram
      task_key: bridge_missing_resistance_query
      object_description: a balanced resistor bridge circuit with four labeled bridge resistors, one resistor marked with a question mark, and a center meter reading zero
      annotation_hint_missing_bridge_resistance: set "annotation" to an object mapping each known visible resistor label plus "target_resistor" and "zero_meter" to one bounding box [x0, y0, x1, y1] around that visual witness
      answer_hint_missing_bridge_resistance: set "answer" to the missing resistance as an integer number of ohms
    physics_circuits_analog_meter_family:
      scene_key: analog_meter_diagram
      task_key: analog_meter_readout_query
      object_description: one analog meter face with a visible needle, numeric tick scale, and unit label
      annotation_hint_ammeter_readout: set "annotation" to an object mapping needle, scale_region, and unit_label to pixel bounding boxes [x0,y0,x1,y1]
      annotation_hint_voltmeter_readout: set "annotation" to an object mapping needle, scale_region, and unit_label to pixel bounding boxes [x0,y0,x1,y1]
      answer_hint_ammeter_readout: set "answer" to the integer ammeter reading in the displayed unit
      answer_hint_voltmeter_readout: set "answer" to the integer voltmeter reading in the displayed unit
