complexity:
  shared: {}
  task_overrides:
    physics_circuits_equivalent_component_family:
      criteria_weights:
        visual_scan: 0.26
        circuit_reasoning: 0.50
        ambiguity: 0.14
        output_burden: 0.10

prompt:
  shared:
    bundle_id: physics_circuits_v0
  task_overrides:
    physics_circuits_equivalent_component_family:
      scene_key: equivalent_circuit_diagram
      task_key: equivalent_component_query
      object_description_series_parallel_total_resistance: one resistor circuit between terminals A and B with at least one labeled zigzag resistor in series with one or two labeled parallel resistor blocks
      object_description_series_parallel_total_capacitance: one capacitor circuit between terminals A and B with at least one labeled parallel-plate capacitor in series with one or two labeled parallel capacitor blocks
      evidence_hint_total_resistance: set "evidence" to an object mapping each visible resistor label such as R1 or R2 to one bounding box [x0, y0, x1, y1] around that resistor symbol and its value label
      evidence_hint_total_capacitance: set "evidence" to an object mapping each visible capacitor label such as C1 or C2 to one bounding box [x0, y0, x1, y1] around that capacitor symbol and its value label
      answer_hint_total_resistance: set "answer" to the total equivalent resistance between terminals A and B as an integer number of ohms
      answer_hint_total_capacitance: set "answer" to the total equivalent capacitance between terminals A and B as an integer number of microfarads
