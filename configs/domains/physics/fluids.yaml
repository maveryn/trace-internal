prompt:
  shared:
    bundle_id: physics_fluids_v0
  task_overrides:
    task_physics__hydraulic__hydraulic_missing_value:
      scene_key: hydraulic_piston_diagram
      task_key: hydraulic_missing_value_query
      object_description_wide_bench: a connected hydraulic piston diagram with three fluid chambers, piston area labels, downward force arrows, and one red `?` label
      object_description_compact_frame: a compact connected hydraulic piston diagram with three fluid chambers, piston area labels, downward force arrows, and one red `?` label
      object_description_tall_columns: a tall connected hydraulic piston diagram with three fluid chambers, piston area labels, downward force arrows, and one red `?` label
      evidence_hint_force: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for all force and area labels in the connected three-piston system, including the marked red `?` force label
      evidence_hint_area: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for all force and area labels in the connected three-piston system, including the marked red `?` area label
      answer_hint_force: set "answer" to the requested integer force value in newtons
      answer_hint_area: set "answer" to the requested integer piston area in cm^2
