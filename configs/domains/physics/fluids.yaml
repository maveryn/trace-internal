prompt:
  shared:
    bundle_id: physics_fluids_v0
  task_overrides:
    task_physics__hydraulic__hydraulic_missing_value:
      scene_key: hydraulic_piston_diagram
      task_key: hydraulic_missing_value_query
      object_description_wide_bench: a connected hydraulic piston diagram with three
        fluid chambers, piston area labels, downward force arrows, and one red `?`
        label
      object_description_compact_frame: a compact connected hydraulic piston diagram
        with three fluid chambers, piston area labels, downward force arrows, and
        one red `?` label
      object_description_tall_columns: a tall connected hydraulic piston diagram with
        three fluid chambers, piston area labels, downward force arrows, and one red
        `?` label
      annotation_hint_missing_output_force: set "annotation" to an object with keys
        "input_force", "input_area", and "output_area"; each value is a pixel bounding
        box [x0, y0, x1, y1] around the corresponding known label needed to compute
        the missing output force
      annotation_hint_missing_input_force: set "annotation" to an object with keys
        "output_force", "input_area", and "output_area"; each value is a pixel bounding
        box [x0, y0, x1, y1] around the corresponding known label needed to compute
        the missing input force
      annotation_hint_missing_piston_area: set "annotation" to an object with keys
        "input_force", "output_force", and "input_area"; each value is a pixel bounding
        box [x0, y0, x1, y1] around the corresponding known label needed to compute
        the missing output area
      annotation_hint_missing_input_area: set "annotation" to an object with keys
        "input_force", "output_force", and "output_area"; each value is a pixel bounding
        box [x0, y0, x1, y1] around the corresponding known label needed to compute
        the missing input area
      answer_hint_force: set "answer" to the requested integer force value in newtons
      answer_hint_area: set "answer" to the requested integer piston area in cm^2
    physics_fluids_graduated_cylinder_family:
      scene_key: graduated_cylinder_diagram
      task_key: graduated_cylinder_query
      object_description: a graduated-cylinder measurement setup with visible liquid
        meniscus lines, tick marks, numeric scale labels, and mL units
      annotation_hint_single_cylinder_volume_readout: set "annotation" to an object
        mapping meniscus and scale_region to pixel bounding boxes [x0,y0,x1,y1] for
        the liquid level and nearby readable scale
      annotation_hint_before_after_displacement_volume: set "annotation" to an object
        mapping before_meniscus, before_scale_region, after_meniscus, and after_scale_region
        to pixel bounding boxes [x0,y0,x1,y1]
      answer_hint_single_cylinder_volume_readout: set "answer" to the integer cylinder
        volume in mL
      answer_hint_before_after_displacement_volume: set "answer" to the integer displaced
        volume in mL
    physics_fluids_buoyancy_density_family:
      scene_key: buoyancy_density_diagram
      task_key: buoyancy_density_query
      object_description: a buoyancy diagram with a floating object divided into equal
        parts, a visible liquid surface, and a liquid-density label
      annotation_hint_floating_object_density_value: set "annotation" to an object
        mapping floating_object, waterline, fluid_density_label, and submerged_fraction_marker
        to pixel bounding boxes [x0,y0,x1,y1]
      answer_hint_floating_object_density_value: set "answer" to the object density
        in g/cm^3 as a decimal number
    physics_fluids_manometer_family:
      scene_key: manometer_diagram
      task_key: manometer_pressure_difference_query
      object_description: a U-tube manometer with pressure points A and B, two visible
        liquid levels, a height-difference marker, and a rho g conversion label
      annotation_hint_u_tube_pressure_difference: set "annotation" to an object mapping
        left_pressure_point, right_pressure_point, height_difference, and fluid_density_label
        to pixel bounding boxes [x0,y0,x1,y1]
      answer_hint_u_tube_pressure_difference: set "answer" to the integer absolute
        pressure difference in kPa
    physics_fluids_fluid_flow_family:
      scene_key: fluid_flow_diagram
      task_key: fluid_flow_continuity_speed_query
      object_description: a steady-flow pipe diagram with station 1 and station 2,
        visible cross-section area labels, one known speed label, one missing speed
        label, and a flow arrow
      annotation_hint_continuity_missing_speed: set "annotation" to an object mapping
        station_1, station_2, and flow_path to pixel bounding boxes [x0,y0,x1,y1]
      answer_hint_continuity_missing_speed: set "answer" to the missing integer flow
        speed in m/s
