prompt:
  shared:
    bundle_id: physics_magnetism_v0
  task_overrides:
    physics_magnetism_force_field_family:
      scene_key: magnetic_force_field
      task_key: magnetic_force_field_query
      object_description_clean_panel: a magnetic-field panel with repeated into-page or out-of-page field symbols, a charged particle, visible vectors, and a formula or candidate-arrow answer area
      object_description_field_grid: a gridded magnetic-field panel with repeated into-page or out-of-page field symbols, a charged particle, visible vectors, and a formula or candidate-arrow answer area
      object_description_lab_card: a lab-card style magnetic-field panel with repeated into-page or out-of-page field symbols, a charged particle, visible vectors, and a formula or candidate-arrow answer area
      evidence_hint_force_direction_choice: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the correct candidate force arrow
      answer_hint_force_direction_choice: set "answer" to the option letter of the candidate force arrow
