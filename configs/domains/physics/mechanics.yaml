prompt:
  shared:
    bundle_id: physics_mechanics_v1
  task_overrides:
    task_physics_mechanics_force_diagram:
      task_family_key: axis_aligned_force_diagram
      task_key: force_diagram_query
      object_description_free_body_box: one isolated block with labeled horizontal and vertical force arrows
      object_description_textured_block: one textured block with labeled horizontal and vertical force arrows
      evidence_hint_net_force: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for all shown force arrows that contribute along the queried axis
      evidence_hint_balancing_force: set "evidence" to an array containing the bounding box [x1, y1, x2, y2] of the marked `?` force arrow
      answer_hint: set "answer" to the requested force magnitude as a non-negative integer number of newtons
    task_physics_mechanics_lever_balance:
      task_family_key: lever_balance_diagram
      task_key: lever_balance_query
      object_description_center_fulcrum: a horizontal lever beam with a central fulcrum, numbered distance marks, and weight blocks on both sides
      object_description_offset_fulcrum: a horizontal lever beam with an offset fulcrum, numbered distance marks, and weight blocks on both sides
      object_description_textured_beam: a textured lever beam with a fulcrum, numbered distance marks, and weight blocks on both sides
      evidence_hint_torque: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for all weight blocks on the queried side of the fulcrum
      evidence_hint_missing_weight: set "evidence" to an array containing the bounding box [x1, y1, x2, y2] of the marked `?` weight block
      answer_hint: set "answer" to the requested integer torque or missing weight value
    task_physics_mechanics_spring_extension:
      task_family_key: paired_spring_diagram
      task_key: spring_extension_query
      object_description_paired_springs: two identical hanging springs shown in side-by-side cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      object_description_staggered_springs: two identical hanging springs shown in slightly staggered cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      object_description_textured_spring: two identical hanging springs shown in textured cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      evidence_hint_missing_weight: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for the reference weight block, the reference extension marker, the marked red `?` weight block, and the queried extension marker
      evidence_hint_missing_extension: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for the reference weight block, the reference extension marker, the shown query weight block, and the marked red `?` extension tag
      evidence_hint_difference: set "evidence" to an array of bounding boxes [x1, y1, x2, y2] for the two shown extension markers being compared
      answer_hint: set "answer" to the requested integer weight, extension, or extension difference value
