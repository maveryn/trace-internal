prompt:
  shared:
    bundle_id: physics_mechanics_v0
  task_overrides:
    physics_mechanics_lever_balance_family:
      scene_key: lever_balance_diagram
      task_key: lever_balance_query
      object_description_center_fulcrum: a horizontal lever beam with a central fulcrum, numbered distance marks, and weight blocks on both sides
      object_description_offset_fulcrum: a horizontal lever beam with an offset fulcrum, numbered distance marks, and weight blocks on both sides
      object_description_textured_beam: a textured lever beam with a fulcrum, numbered distance marks, and weight blocks on both sides
      evidence_hint_torque: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for all weight blocks on the queried side of the fulcrum
      evidence_hint_missing_weight: set "evidence" to an array containing the bounding box [x0, y0, x1, y1] of the marked `?` weight block
      answer_hint: set "answer" to the requested integer torque or missing weight value
    task_physics__pulley__pulley_mechanical_advantage:
      scene_key: pulley_system_diagram
      task_key: pulley_mechanical_advantage_query
      object_description_open_block: one open block-and-tackle pulley system with upper and lower blocks, vertical supporting strands, optional cut non-supporting strands, a load, and an effort arrow
      object_description_compact_block: one compact block-and-tackle pulley system with upper and lower blocks, vertical supporting strands, optional cut non-supporting strands, a load, and an effort arrow
      object_description_tall_block: one tall block-and-tackle pulley system with upper and lower blocks, vertical supporting strands, optional cut non-supporting strands, a load, and an effort arrow
      evidence_hint_effort_force: set "evidence" to [x0, y0, x1, y1] boxes for the full supporting strands, shown load-force label, and marked `?` effort label; exclude cut strands
      evidence_hint_load_force: set "evidence" to [x0, y0, x1, y1] boxes for the full supporting strands, shown effort-force label, and marked `?` load label; exclude cut strands
      answer_hint: set "answer" to the requested integer force value
    physics_mechanics_spring_extension_family:
      scene_key: paired_spring_diagram
      task_key: spring_extension_query
      object_description_paired_springs: two identical hanging springs shown in side-by-side cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      object_description_staggered_springs: two identical hanging springs shown in slightly staggered cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      object_description_textured_spring: two identical hanging springs shown in textured cards, each next to a ruler marked in extension units, with labeled weight blocks beneath or beside the spring
      evidence_hint_missing_weight: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for the reference weight block, the reference extension marker, the marked red `?` weight block, and the queried extension marker
      evidence_hint_missing_extension: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for the reference weight block, the reference extension marker, the shown query weight block, and the marked red `?` extension tag
      evidence_hint_difference: set "evidence" to an array of bounding boxes [x0, y0, x1, y1] for the two shown extension markers being compared
      answer_hint: set "answer" to the requested integer weight, extension, or extension difference value
    physics_mechanics_sticky_collision_family:
      scene_key: sticky_collision_diagram
      task_key: sticky_collision_query
      object_description_wide_table: a collision table with puck A moving horizontally, puck B moving vertically, visible mass and speed labels, a stuck A+B puck, signed axes, and six candidate direction arrows
      object_description_compact_table: a compact collision table with puck A moving horizontally, puck B moving vertically, visible mass and speed labels, a stuck A+B puck, signed axes, and six candidate direction arrows
      object_description_gridded_table: a gridded collision table with puck A moving horizontally, puck B moving vertically, visible mass and speed labels, a stuck A+B puck, signed axes, and six candidate direction arrows
      evidence_hint_direction_choice: set "evidence" to an array containing the bounding box [x0, y0, x1, y1] of the correct candidate direction arrow
      evidence_hint_velocity_component: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the queried component's momentum witnesses and the combined-mass label
      answer_hint_direction_choice: set "answer" to the option letter of the correct candidate arrow
      answer_hint_component: set "answer" to the requested signed integer velocity component in m/s
