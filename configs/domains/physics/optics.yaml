prompt:
  shared:
    bundle_id: physics_optics_v0
  task_overrides:
    physics_optics_ray_trace_family:
      scene_key: mirror_ray_diagram
      task_key: ray_trace_query
      object_description_single_mirror: a graph-paper ray setup with an initial direction
        and one diagonal mirror
      object_description_double_mirror: a graph-paper ray setup with an initial direction
        and two diagonal mirrors
      object_description_triple_mirror: a graph-paper ray setup with an initial direction
        and three diagonal mirrors
      object_description_quad_mirror: a graph-paper ray setup with an initial direction
        and four diagonal mirrors
      object_description_five_mirror: a graph-paper ray setup with an initial direction
        and five diagonal mirrors
      annotation_hint_bounce_count: set "annotation" to an array of image pixel points
        [x, y] for each mirror-bounce point of the implied ray path
      annotation_hint_target_hit_count: set "annotation" to an array of image pixel
        points [x, y] for each target point touched by the implied ray path
      answer_hint: set "answer" to the requested count as an integer
    physics_optics_refraction_layers_family:
      scene_key: refraction_layers_diagram
      task_key: refraction_speed_order_query
      object_description: a refraction diagram with three labeled media, a light ray
        crossing two interfaces, dashed normals, and speed-order option cards
      annotation_hint_three_medium_speed_order: set "annotation" to an object with
        keys "interface_1_bend" and "interface_2_bend", each mapped to a bounding
        box [x0, y0, x1, y1] around the corresponding ray bend and normal
      answer_hint_three_medium_speed_order: set "answer" to the selected option letter
    physics_optics_shadow_cause_family:
      scene_key: shadow_cause_diagram
      task_key: shadow_cause_query
      object_description: a light-and-shadow diagram with one object, its cast shadow,
        and labeled candidate light sources
      annotation_hint_source_from_shadow_label: set "annotation" to an object with
        keys "object" and "shadow", each mapped to a bounding box [x0, y0, x1, y1]
        around the visible object and cast shadow
      answer_hint_source_from_shadow_label: set "answer" to the selected light-source
        letter
    physics_optics_lens_optics_family:
      scene_key: lens_optics_diagram
      task_key: lens_image_property_query
      object_description: a converging thin-lens diagram with a principal axis, focal
        marks F and 2F, one object arrow, and visible image-property option cards
      annotation_hint_converging_lens_image_property_choice: set "annotation" to an
        object with keys "lens", "object_arrow", and "focal_marks", each mapped to
        [x0, y0, x1, y1] pixel boxes around the visible lens, object arrow, and focal-mark
        witnesses
      answer_hint_converging_lens_image_property_choice: set "answer" to the selected
        option letter
