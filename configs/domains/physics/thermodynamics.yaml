prompt:
  shared:
    bundle_id: physics_thermodynamics_v0
  task_overrides:
    physics_thermodynamics_pv_diagram_family:
      scene_key: thermodynamics_pv_diagram
      task_key: pv_diagram_query
      object_description_clean_grid: a pressure-volume diagram on a clean grid with
        pressure in kPa, volume in liters, visible process arrows, and labeled state
        points or option panels
      object_description_paper_grid: a pressure-volume diagram on a paper-style grid
        with pressure in kPa, volume in liters, visible process arrows, and labeled
        state points or option panels
      object_description_bold_grid: a pressure-volume diagram on a bold grid with
        pressure in kPa, volume in liters, visible process arrows, and labeled state
        points or option panels
      annotation_hint_work_value: set "annotation" to an array containing one bounding
        box [x0, y0, x1, y1] around the highlighted PV process or cycle used to compute
        work
      annotation_hint_process_sign_choice: set "annotation" to an array containing
        one bounding box [x0, y0, x1, y1] around the process arrow in the correct
        labeled candidate mini diagram
      answer_hint_work_value: set "answer" to the signed integer work in joules, using
        work done by the gas as positive
      answer_hint_process_sign_choice: set "answer" to the option letter of the labeled
        process with the requested work sign
    physics_thermodynamics_piston_cylinder_family:
      scene_key: piston_cylinder_apparatus
      task_key: piston_cylinder_boundary_work_query
      object_description: a piston-cylinder apparatus shown in initial and final states,
        with constant pressure in MPa, initial and final volumes in liters, and a
        process arrow
      annotation_hint_constant_pressure_boundary_work: set "annotation" to a keyed
        object with [x0, y0, x1, y1] pixel boxes for "piston_cylinder", "initial_state_label",
        "final_state_label", and "process_arrow"
      answer_hint_constant_pressure_boundary_work: set "answer" to the signed integer
        boundary work in kJ, using work done by the gas as positive
    physics_thermodynamics_thermometer_family:
      scene_key: thermometer_scale
      task_key: temperature_conversion_query
      object_description: a vertical thermometer with a visible liquid level, numeric
        tick scale, and source temperature unit label
      annotation_hint_celsius_to_fahrenheit_value: set "annotation" to a keyed object
        with [x0, y0, x1, y1] pixel boxes for "liquid_level", "scale_region", and
        "source_unit_label"
      annotation_hint_fahrenheit_to_celsius_value: set "annotation" to a keyed object
        with [x0, y0, x1, y1] pixel boxes for "liquid_level", "scale_region", and
        "source_unit_label"
      answer_hint_celsius_to_fahrenheit_value: set "answer" to the integer equivalent
        temperature in degrees Fahrenheit
      answer_hint_fahrenheit_to_celsius_value: set "answer" to the integer equivalent
        temperature in degrees Celsius
    physics_thermodynamics_thermal_mixing_family:
      scene_key: thermal_mixing_setup
      task_key: thermal_mixing_query
      object_description: separate liquid cups with visible Celsius temperature labels
        being poured into one insulated mixing container
      annotation_hint_equal_amount_final_temperature: set "annotation" to an array
        of bounding boxes [x0, y0, x1, y1] around the initial cups and their visible
        temperature labels
      answer_hint_equal_amount_final_temperature: set "answer" to the integer final
        equilibrium temperature in degrees Celsius
