        output_burden: 0.10

prompt:
  shared:
    bundle_id: physics_thermodynamics_v0
  task_overrides:
    physics_thermodynamics_pv_diagram_family:
      scene_key: thermodynamics_pv_diagram
      task_key: pv_diagram_query
      object_description_clean_grid: a pressure-volume diagram on a clean grid with pressure in kPa, volume in liters, visible process arrows, and labeled state points or option panels
      object_description_paper_grid: a pressure-volume diagram on a paper-style grid with pressure in kPa, volume in liters, visible process arrows, and labeled state points or option panels
      object_description_bold_grid: a pressure-volume diagram on a bold grid with pressure in kPa, volume in liters, visible process arrows, and labeled state points or option panels
      evidence_hint_work_value: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the highlighted PV process or cycle used to compute work
      evidence_hint_process_sign_choice: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the correct labeled candidate process
      answer_hint_work_value: set "answer" to the signed integer work in joules, using work done by the gas as positive
      answer_hint_process_sign_choice: set "answer" to the option letter of the labeled process with the requested work sign
