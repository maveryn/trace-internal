prompt:
  shared:
    bundle_id: puzzles_arithmetic_v1
    answer_hint: set "answer" to the exact integer value requested by the puzzle
  task_overrides:
    task_puzzles_arithmetic_equation_value:
      task_family_key: arithmetic_unknown_slot_puzzle
      task_key: equation_value_query
      object_description_equation_strip: a clean arithmetic puzzle with 2 to 5 boxed values on the left, arithmetic operators between them, an equals sign, and one boxed result on the right
      object_description_equation_card: a card-style arithmetic puzzle with 2 to 5 boxed values on the left, arithmetic operators between them, an equals sign, and one boxed result on the right
      object_description_equation_outline: an outline-style arithmetic puzzle with 2 to 5 boxed values on the left, arithmetic operators between them, an equals sign, and one boxed result on the right
      evidence_hint_result_unknown: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the marked result slot
      evidence_hint_operand_unknown: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the marked operand slot
      json_example_result_unknown: '{"evidence":[[680,180,800,276]],"answer":14}'
      json_example_operand_unknown: '{"evidence":[[120,180,240,276]],"answer":5}'
      json_example_answer_only_result_unknown: '{"answer":14}'
      json_example_answer_only_operand_unknown: '{"answer":5}'
    task_puzzles_arithmetic_balance_value:
