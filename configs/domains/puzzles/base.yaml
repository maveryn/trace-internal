complexity:
  shared:
    criteria_weights:
      visual_scan: 0.34
      reasoning_load: 0.33
      scene_variant_load: 0.33

prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.

visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [248, 248, 248]
    weights:
      solid_light: 1.0
  noise:
    apply_prob: 0.0
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
