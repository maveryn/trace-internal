      rows_min: 5
      rows_max: 10
      cols_min: 5
      cols_max: 10
      palette_size_min: 3
      palette_size_max: 6
      target_answer_min: 0
      target_answer_max: 10
    task_puzzles__cell_board__scoped_attribute_count:
      rows_min: 5
      rows_max: 10
      cols_min: 5
      cols_max: 10
      palette_size_min: 3
      palette_size_max: 6
      target_answer_min: 0
      target_answer_max: 10
    cell_board_color_count_internal:
      palette_size_min: 3
      palette_size_max: 6
      target_color_count_min: 4
      target_color_count_max: 15
    cell_board_color_components_internal:
      palette_size_min: 2
