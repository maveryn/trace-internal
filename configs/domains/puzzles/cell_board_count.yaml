rendering:
  shared:
    short_side_px_min: 28
    short_side_px_max: 56
    aspect_ratio_min: 1.0
    aspect_ratio_max: 2.0
    outer_padding_fraction_min: 0.08
    outer_padding_fraction_max: 0.12
    placement_jitter_fraction_min: 0.02
    placement_jitter_fraction_max: 0.06
    balanced_cell_board_tile_style_sampling: true
    cell_board_tile_style_weights:
      classic_grid: 1.0
      rounded_tiles: 1.0
      inset_tiles: 1.0
      thin_line: 1.0
      lab_matrix: 1.0
complexity:
  shared:
    criteria_weights:
      visual_scan: 0.5
      reasoning_load: 0.5
      scene_variant_load: 0.0
  task_overrides:
    task_puzzles__cell_board__single_attribute_membership_count:
      criteria_weights:
        visual_scan: 0.65
        reasoning_load: 0.35
    task_puzzles__cell_board__scoped_attribute_count:
      criteria_weights:
        visual_scan: 0.65
        reasoning_load: 0.35
    cell_board_color_count_internal:
      criteria_weights:
        visual_scan: 0.6
        reasoning_load: 0.4
    cell_board_color_components_internal:
      criteria_weights:
        visual_scan: 0.05
        reasoning_load: 0.95
    cell_board_largest_component_size_internal:
      criteria_weights:
        visual_scan: 0.4
        reasoning_load: 0.6
