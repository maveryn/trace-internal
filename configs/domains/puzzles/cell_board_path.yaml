generation:
  shared:
    rows_min: 3
    rows_max: 7
    cols_min: 3
    cols_max: 7
  task_overrides:
    cell_board_shortest_path_internal:
      board_size_min: 6
      board_size_max: 8
      target_shortest_len_min: 3
      target_shortest_len_max: 7
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
    cell_board_target_reachability_count_internal:
      board_size_min: 6
      board_size_max: 8
      target_reachable_target_count_min: 0
      target_reachable_target_count_max: 5
      target_unreachable_target_count_min: 0
      target_unreachable_target_count_max: 5
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
      reachable_fraction_min: 0.2
      reachable_fraction_max: 0.85
rendering:
  shared:
    short_side_px_min: 28
    short_side_px_max: 56
    aspect_ratio_min: 1.0
    aspect_ratio_max: 2.0
    outer_padding_fraction_min: 0.08
    outer_padding_fraction_max: 0.12
    placement_jitter_fraction_min: 0.02
    placement_jitter_fraction_max: 0.06
    balanced_cell_board_tile_style_sampling: true
    cell_board_tile_style_weights:
      classic_grid: 1.0
      rounded_tiles: 1.0
      inset_tiles: 1.0
      thin_line: 1.0
      lab_matrix: 1.0
  task_overrides:
    cell_board_shortest_path_internal:
      aspect_ratio_min: 1.0
      aspect_ratio_max: 1.0
    cell_board_target_reachability_count_internal:
      aspect_ratio_min: 1.0
      aspect_ratio_max: 1.0
visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color:
        - 246
        - 246
        - 246
      cool_light:
        kind: solid
        color:
        - 243
        - 247
        - 252
      warm_light:
        kind: solid
        color:
        - 251
        - 248
        - 243
      mint_light:
        kind: solid
        color:
        - 244
        - 249
        - 246
      lavender_light:
        kind: solid
        color:
        - 248
        - 246
        - 253
    weights:
      solid_light: 1.0
      cool_light: 1.0
      warm_light: 1.0
      mint_light: 1.0
      lavender_light: 1.0
  noise:
    apply_prob: 0.0
    edit_count_range:
    - 1
    - 2
    value_ranges:
      blur:
        radius:
        - 0.2
        - 0.6
      downsample:
        scale:
        - 0.85
        - 0.95
      jpeg:
        quality:
        - 70.0
        - 90.0
      noise:
        alpha:
        - 0.03
        - 0.08
prompt:
  shared:
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    bundle_id: puzzles_cell_board_path_v0
    scene_key: rectangular_tile_board
  task_overrides:
    cell_board_shortest_path_internal:
      task_key: shortest_path_query
      answer_hint: set "answer" to the shortest path length as an integer
      annotation_hint: set "annotation" to the ordered list of image pixel points
        [x, y] at tile centers along one shortest path from the start tile to the
        goal tile, inclusive
      json_example: '{"annotation":[[120,120],[168,120],[168,168],[216,168]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    cell_board_target_reachability_count_internal:
      task_key: reachable_target_count_query
      answer_hint: set "answer" to the number of reachable target tiles as an integer
      annotation_hint: set "annotation" to an array of image pixel points [x, y] at
        the centers of the reachable target tiles, or [] if no target tiles are reachable
      json_example: '{"annotation":[[216,120],[168,216]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
      unreachable_task_key: unreachable_target_count_query
      unreachable_answer_hint: set "answer" to the number of unreachable target tiles
        as an integer
      unreachable_annotation_hint: set "annotation" to an array of image pixel points
        [x, y] at the centers of the unreachable target tiles, or [] if no target
        tiles are unreachable
      unreachable_json_example: '{"annotation":[[216,120],[168,216]],"answer":2}'
      unreachable_json_example_answer_only: '{"answer":2}'
