prompt:
  shared:
    bundle_id: puzzles_counterfactual_v0
    scene_key: counterfactual_board
    task_key: board_grid_count_query
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
  task_overrides:
    task_puzzles__counterfactual_board__board_dimension_count:
      object_description: a board or puzzle grid
      annotation_hint: set "annotation" to an array of pixel bounding boxes [x0,y0,x1,y1] for every visible row, column, horizontal
        line, or vertical line requested by the question
      answer_hint: set "answer" to the integer count requested in the question
      json_example: '{"annotation":[[160,96,760,170],[160,170,760,244],[160,244,760,318]],"answer":3}'
      json_example_answer_only: '{"answer":8}'
    task_puzzles__counterfactual_board__board_line_count:
      object_description: a board or puzzle grid
      annotation_hint: set "annotation" to an array of pixel bounding boxes [x0,y0,x1,y1] for every visible row, column, horizontal
        line, or vertical line requested by the question
      answer_hint: set "answer" to the integer count requested in the question
      json_example: '{"annotation":[[160,96,760,170],[160,170,760,244],[160,244,760,318]],"answer":3}'
      json_example_answer_only: '{"answer":8}'
visual:
  noise:
