generation:
  shared:
    balanced_query_id_sampling: true
    balanced_scene_variant_sampling: true
    scene_variant_weights:
      engraved_sheet: 1.0
      exam_scan: 1.0
      notebook_staff: 1.0
  task_overrides:
    task_puzzles__music_staff__pitch_interval_label:
      query_id_weights:
        note_name_label: 0.85
        interval_name_label: 0.70
        same_pitch_truth_label: 1.0
        transposed_pitch_truth_label: 1.45
    task_puzzles__music_staff__key_scale_label:
      query_id_weights:
        key_signature_label: 1.0
        scale_validation_truth_label: 1.0
        scale_degree_function_label: 1.0
    task_puzzles__music_staff__chord_harmony_label:
      query_id_weights:
        chord_quality_label: 1.0
        roman_numeral_label: 1.0
        chord_inversion_label: 1.0
    task_puzzles__music_staff__dominant_chord_count:
      query_id_weights:
        dominant_count_value: 1.0
    task_puzzles__music_staff__meter_rhythm_label:
      query_id_weights:
        time_signature_label: 1.30
        meter_type_label: 0.25
        articulation_symbol_label: 1.0
    task_puzzles__music_staff__duration_equivalence_label:
      query_id_weights:
        duration_equivalence_label: 1.0
    task_puzzles__music_staff__bar_count_value:
      query_id_weights:
        bar_count_value: 1.0

rendering:
  shared:
    canvas_width: 1180
    canvas_height: 820
    unit_size_scale_min: 0.5
    unit_size_scale_max: 1.0
    panel_padding_px: 34
    panel_corner_radius_px: 18
    panel_border_width_px: 2
    staff_gap_px: 15
    staff_width_px: 760
    staff_spacing_px: 142
    slot_gap_px: 52
    title_font_size_px: 25
    label_font_size_px: 21
    small_font_size_px: 16
    notehead_width_px: 21
    notehead_height_px: 14
    stem_height_px: 48
    option_card_width_px: 254
    option_card_height_px: 70
    option_gap_px: 12

complexity:
  shared:
    criteria_weights:
      visual_scan: 0.30
      reasoning_load: 0.45
      scene_variant_load: 0.25

prompt:
  shared:
    bundle_id: puzzles_notation_v0
    scene_key: music_staff
    task_key: music_notation_query
    object_description_engraved_sheet: a clean engraved-style sheet-music staff panel with marked notation items
    object_description_exam_scan: an exam-scan-style sheet-music staff panel with marked notation items
    object_description_notebook_staff: a notebook-style sheet-music staff panel with marked notation items
    json_output_contract: Use a valid JSON object with keys "evidence" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
    evidence_hint_note_name_label: set "evidence" to an array containing the bounding box for the marked note
    answer_hint_note_name_label: set "answer" to the note name string, using # for sharp and b for flat when needed
    json_example_note_name_label: '{"evidence":[[270,188,315,252]],"answer":"F#"}'
    json_example_answer_only_note_name_label: '{"answer":"F#"}'
    evidence_hint_interval_name_label: set "evidence" to an array containing the two marked note bounding boxes
    answer_hint_interval_name_label: set "answer" to the interval name string, such as "major 3rd" or "perfect 5th"
    json_example_interval_name_label: '{"evidence":[[242,190,286,253],[338,154,383,224]],"answer":"major 3rd"}'
    json_example_answer_only_interval_name_label: '{"answer":"major 3rd"}'
    evidence_hint_same_pitch_truth_label: set "evidence" to an array containing the two marked note bounding boxes
    answer_hint_same_pitch_truth_label: set "answer" to either "True" or "False"
    json_example_same_pitch_truth_label: '{"evidence":[[242,190,286,253],[338,190,383,253]],"answer":"True"}'
    json_example_answer_only_same_pitch_truth_label: '{"answer":"True"}'
    evidence_hint_transposed_pitch_truth_label: set "evidence" to an array containing the source and transposed note bounding boxes
    answer_hint_transposed_pitch_truth_label: set "answer" to either "True" or "False"
    json_example_transposed_pitch_truth_label: '{"evidence":[[242,190,286,253],[356,148,402,220]],"answer":"False"}'
    json_example_answer_only_transposed_pitch_truth_label: '{"answer":"False"}'
    evidence_hint_key_signature_label: set "evidence" to an array containing the key-signature bounding box
    answer_hint_key_signature_label: set "answer" to the key name string
    json_example_key_signature_label: '{"evidence":[[190,178,250,222]],"answer":"G major"}'
    json_example_answer_only_key_signature_label: '{"answer":"G major"}'
    evidence_hint_scale_validation_truth_label: set "evidence" to an array containing the key-signature bounding box followed by the scale-note bounding boxes
    answer_hint_scale_validation_truth_label: set "answer" to either "True" or "False"
    json_example_scale_validation_truth_label: '{"evidence":[[190,178,250,222],[280,188,324,250]],"answer":"True"}'
    json_example_answer_only_scale_validation_truth_label: '{"answer":"True"}'
    evidence_hint_scale_degree_function_label: set "evidence" to an array containing the key-signature bounding box and the marked note bounding box
    answer_hint_scale_degree_function_label: set "answer" to the scale-degree function string
    json_example_scale_degree_function_label: '{"evidence":[[190,178,250,222],[330,188,374,250]],"answer":"dominant"}'
    json_example_answer_only_scale_degree_function_label: '{"answer":"dominant"}'
    evidence_hint_chord_quality_label: set "evidence" to an array containing the marked chord bounding box
    answer_hint_chord_quality_label: set "answer" to the chord-quality string
    json_example_chord_quality_label: '{"evidence":[[300,145,354,248]],"answer":"minor triad"}'
    json_example_answer_only_chord_quality_label: '{"answer":"minor triad"}'
    evidence_hint_roman_numeral_label: set "evidence" to an array containing the key-signature bounding box and marked chord bounding box
    answer_hint_roman_numeral_label: set "answer" to the roman-numeral string
    json_example_roman_numeral_label: '{"evidence":[[190,178,250,222],[300,145,354,248]],"answer":"V"}'
    json_example_answer_only_roman_numeral_label: '{"answer":"V"}'
    evidence_hint_chord_inversion_label: set "evidence" to an array containing the marked chord bounding box
    answer_hint_chord_inversion_label: set "answer" to the inversion-name string
    json_example_chord_inversion_label: '{"evidence":[[300,145,354,248]],"answer":"first inversion"}'
    json_example_answer_only_chord_inversion_label: '{"answer":"first inversion"}'
    evidence_hint_dominant_count_value: set "evidence" to an array containing the key-signature bounding box followed by every dominant-chord bounding box
    answer_hint_dominant_count_value: set "answer" to the integer count of dominant chords
    json_example_dominant_count_value: '{"evidence":[[190,178,250,222],[300,145,354,248]],"answer":2}'
    json_example_answer_only_dominant_count_value: '{"answer":2}'
    evidence_hint_time_signature_label: set "evidence" to an array containing the target-bar bounding box followed by the visible note bounding boxes in that bar
    answer_hint_time_signature_label: set "answer" to the time-signature string
    json_example_time_signature_label: '{"evidence":[[240,160,520,245],[280,188,324,250]],"answer":"3/4"}'
    json_example_answer_only_time_signature_label: '{"answer":"3/4"}'
    evidence_hint_bar_count_value: set "evidence" to an array containing every visible bar bounding box
    answer_hint_bar_count_value: set "answer" to the integer number of bars
    json_example_bar_count_value: '{"evidence":[[240,160,330,245],[330,160,420,245],[420,160,510,245]],"answer":3}'
    json_example_answer_only_bar_count_value: '{"answer":3}'
    evidence_hint_duration_equivalence_label: set "evidence" to an array containing the target-duration note bounding box and the selected option-card bounding box
    answer_hint_duration_equivalence_label: set "answer" to the single capital-letter option label
    json_example_duration_equivalence_label: '{"evidence":[[280,188,324,250],[890,190,1110,260]],"answer":"C"}'
    json_example_answer_only_duration_equivalence_label: '{"answer":"C"}'
    evidence_hint_meter_type_label: set "evidence" to an array containing the time-signature bounding box
    answer_hint_meter_type_label: set "answer" to either "simple" or "compound"
    json_example_meter_type_label: '{"evidence":[[190,178,250,222]],"answer":"compound"}'
    json_example_answer_only_meter_type_label: '{"answer":"compound"}'
    evidence_hint_articulation_symbol_label: set "evidence" to an array containing the marked note bounding box and the articulation-symbol bounding box
    answer_hint_articulation_symbol_label: set "answer" to the articulation-symbol name string
    json_example_articulation_symbol_label: '{"evidence":[[280,188,324,250],[286,140,318,158]],"answer":"tenuto"}'
    json_example_answer_only_articulation_symbol_label: '{"answer":"tenuto"}'

visual:
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 1]
    value_ranges:
      blur:
        radius: [0.05, 0.22]
      downsample:
        scale: [0.96, 0.99]
      jpeg:
        quality: [88.0, 96.0]
      noise:
        alpha: [0.004, 0.018]
