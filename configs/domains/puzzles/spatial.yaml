generation:
  task_overrides:
    task_puzzles_spatial_fold_hole_label:
      option_count_min: 6
      option_count_max: 6
      grid_size: 6
      balanced_task_variant_sampling: true
      balanced_scene_variant_sampling: true
      task_variant_weights:
        single_fold_single_hole: 1.0
        single_fold_two_holes: 1.0
        double_fold_single_hole: 1.0
      scene_variant_weights:
        fold_strip: 1.0
        fold_card: 1.0
        fold_outline: 1.0

rendering:
  task_overrides:
    task_puzzles_spatial_fold_hole_label:
      canvas_width: 1260
      canvas_height: 860
      scene_margin_left_px: 64
      scene_margin_right_px: 64
      scene_margin_top_px: 56
      scene_margin_bottom_px: 56
      reference_panel_height_px: 316
      reference_panel_padding_px: 28
      step_panel_width_px: 208
      step_panel_height_px: 208
      step_panel_gap_px: 28
      step_arrow_gap_px: 12
      reference_to_options_gap_px: 48
      option_panel_width_px: 148
      option_panel_height_px: 188
      option_gap_px: 18
      option_label_gap_px: 16
      option_content_box_size_px: 102
      option_content_padding_px: 10
      paper_corner_radius_px: 18
      panel_corner_radius_px: 28
      border_width_px: 3
      option_label_font_size_px: 30
      panel_fill_rgb: [248, 249, 252]
      option_panel_fill_rgb: [251, 251, 255]
      option_content_fill_rgb: [252, 252, 255]
      paper_fill_rgb: [255, 252, 245]
      paper_shadow_rgb: [236, 230, 215]
      border_color_rgb: [86, 94, 108]
      text_color_rgb: [30, 34, 40]
      text_stroke_rgb: [255, 255, 255]
      fold_line_rgb: [100, 116, 145]
      hole_fill_rgb: [30, 34, 40]
      arrow_rgb: [54, 102, 180]
      instruction_fill_rgb: [238, 243, 250]

prompt:
  shared:
    bundle_id: puzzles_spatial_v1
    answer_hint: set "answer" to the exact option letter of the correct image option
  task_overrides:
    task_puzzles_spatial_fold_hole_label:
      task_family_key: spatial_fold_hole_puzzle
      task_key: unfold_query
      object_description_fold_strip: a folded-paper hole-punch puzzle with three fold steps above six labeled unfolded-paper options
      object_description_fold_card: a card-style folded-paper hole-punch puzzle with three fold steps above six labeled unfolded-paper options
      object_description_fold_outline: an outline-style folded-paper hole-punch puzzle with three fold steps above six labeled unfolded-paper options
      evidence_hint_single_fold_single_hole: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct option panel
      evidence_hint_single_fold_two_holes: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct option panel
      evidence_hint_double_fold_single_hole: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct option panel
      json_example_single_fold_single_hole: '{"evidence":[[333,616,481,804]],"answer":"B"}'
      json_example_single_fold_two_holes: '{"evidence":[[499,616,647,804]],"answer":"C"}'
      json_example_double_fold_single_hole: '{"evidence":[[665,616,813,804]],"answer":"D"}'
      json_example_answer_only_single_fold_single_hole: '{"answer":"B"}'
      json_example_answer_only_single_fold_two_holes: '{"answer":"C"}'
      json_example_answer_only_double_fold_single_hole: '{"answer":"D"}'

complexity:
  task_overrides:
    task_puzzles_spatial_fold_hole_label:
      criteria_weights:
        visual_scan: 0.4
        reasoning_load: 0.35
        scene_variant_load: 0.25
