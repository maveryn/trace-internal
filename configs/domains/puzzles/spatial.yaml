prompt:
  shared:
    bundle_id: puzzles_spatial_v0
    answer_hint: set "answer" to the exact option letter of the correct image option
  task_overrides:
    puzzles_spatial_polyomino_arrangement_internal:
      scene_key: spatial_polyomino_arrangement_puzzle
      task_key: polyomino_arrangement_label_query
      object_description_polyomino_strip: a polyomino puzzle with shown pieces, a
        target or board area, and labeled options
      object_description_polyomino_card: a card-style polyomino puzzle with shown
        pieces, a target or board area, and labeled options
      object_description_polyomino_outline: an outline-style polyomino puzzle with
        shown pieces, a target or board area, and labeled options
      annotation_hint_marked_region_piece_label: set "annotation" to an array containing
        the correct piece option panel box and black missing-region box as [x0, y0,
        x1, y1] pixel boxes
      annotation_hint_rectangle_complement_piece: set "annotation" to an array containing
        the correct piece option panel box and rectangular target missing-region box
        as [x0, y0, x1, y1] pixel boxes
      json_example_marked_region_piece_label: '{"annotation":[[416,604,592,808],[580,218,618,256]],"answer":"C"}'
      json_example_rectangle_complement_piece: '{"annotation":[[416,604,592,808],[580,218,618,256]],"answer":"C"}'
      json_example_answer_only_marked_region_piece_label: '{"answer":"C"}'
      json_example_answer_only_rectangle_complement_piece: '{"answer":"C"}'
    puzzles_spatial_tangram_assembly_internal:
      scene_key: spatial_tangram_assembly_puzzle
      task_key: tangram_assembly_query
      object_description_missing_piece_label: a tangram-style assembly with one black
        missing region and labeled piece options
      object_description_contact_count: a tangram-style assembly with one or two marked
        pieces
      answer_hint_option_letter: set "answer" to the exact option letter of the matching
        option
      answer_hint_integer: set "answer" to the exact count as an integer
      annotation_hint_missing_piece_label: set "annotation" to an array containing
        the correct option panel box followed by the black missing-region box, each
        as [x0, y0, x1, y1] pixel boxes
      annotation_hint_contact_count: 'set "annotation" to an array of pixel bounding
        boxes [x0, y0, x1, y1] around the counted pieces: marked piece boxes first,
        then boxes for unmarked pieces that share an edge with a marked piece'
      json_example_missing_piece_label: '{"annotation":[[505,612,655,790],[426,196,566,335]],"answer":"C"}'
      json_example_contact_count: '{"annotation":[[426,196,566,335],[288,196,428,335],[565,196,704,335]],"answer":3}'
      json_example_answer_only_missing_piece_label: '{"answer":"C"}'
      json_example_answer_only_contact_count: '{"answer":3}'
    puzzles_spatial_rubiks_cube_internal:
      scene_key: spatial_rubiks_cube_net_puzzle
      task_key: rubiks_cube_query
      object_description_sticker_color_label: a Rubik-style cube net with face labels,
        a (column,row) coordinate reference, and labeled color-swatch options; a prime
        mark in a move sequence means counterclockwise
      object_description_face_color_count_label: a Rubik-style cube net with face
        labels, a (column,row) coordinate reference, a target color swatch, and labeled
        number options; a prime mark in a move sequence means counterclockwise
      object_description_move_result_label: a Rubik-style starting cube net with face
        labels, a (column,row) coordinate reference, and labeled candidate result
        nets; a prime mark in a move sequence means counterclockwise
      answer_hint_option_letter: set "answer" to the single option label as a capital
        letter
      annotation_hint_option_panel: set "annotation" to an array containing exactly
        one bounding box [x0, y0, x1, y1] for the selected option panel
      json_example_option_label: '{"annotation":[[836,312,972,466]],"answer":"D"}'
      json_example_answer_only_option_label: '{"answer":"D"}'
    puzzles_spatial_cube_surface_net_internal:
      scene_key: spatial_cube_surface_net_puzzle
      task_key: cube_surface_net_query
      object_description_face_relation_label: a labeled cube net with one marked reference
        face and labeled face options
      object_description_rolling_result_label: a labeled start cube, an arrow path
        showing cube rolls, and labeled face options
      object_description_surface_path_label: a labeled cube net with a marked start
        face, numbered folded-edge move instructions, and labeled answer options
      answer_hint_option_letter: set "answer" to the single option label as a capital
