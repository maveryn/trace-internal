prompt:
  shared:
    bundle_id: puzzles_spatial_v1
    answer_hint: set "answer" to the exact option letter of the correct image option
  task_overrides:
    task_puzzles_spatial_assembly_label:
      task_family_key: spatial_assembly_puzzle
      task_key: assembly_label_query
      object_description_assembly_strip: a shape-assembly puzzle with several piece silhouettes above labeled target-shape options
      object_description_assembly_card: a card-style shape-assembly puzzle with several piece silhouettes above labeled target-shape options
      object_description_assembly_outline: an outline-style shape-assembly puzzle with several piece silhouettes above labeled target-shape options
      evidence_hint_can_be_built: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct option panel
      json_example_can_be_built: '{"evidence":[[222,488,398,692]],"answer":"C"}'
      json_example_answer_only_can_be_built: '{"answer":"C"}'
    task_puzzles_spatial_fold_result_label:
      task_family_key: spatial_fold_result_puzzle
      task_key: fold_result_query
      object_description_fold_strip: a paper-fold puzzle with one marked sheet above six labeled folded-result options
      object_description_fold_card: a card-style paper-fold puzzle with one marked sheet above six labeled folded-result options
      object_description_fold_outline: an outline-style paper-fold puzzle with one marked sheet above six labeled folded-result options
      evidence_hint_vertical_fold_result: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct folded-result option image
      evidence_hint_horizontal_fold_result: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the correct folded-result option image
      json_example_vertical_fold_result: '{"evidence":[[206,388,324,613]],"answer":"A"}'
      json_example_horizontal_fold_result: '{"evidence":[[482,388,718,500]],"answer":"B"}'
      json_example_answer_only_vertical_fold_result: '{"answer":"A"}'
      json_example_answer_only_horizontal_fold_result: '{"answer":"B"}'
    task_puzzles_spatial_cube_removal_count:
      task_family_key: spatial_cube_removal_puzzle
      task_key: cube_removal_count_query
      answer_hint: set "answer" to the exact number of cubes removed as an integer
      object_description_stack_strip: a block-comparison puzzle with the original block on the left and the remaining block on the right
      object_description_stack_card: a card-style block-comparison puzzle with the original block on the left and the remaining block on the right
      object_description_stack_outline: an outline-style block-comparison puzzle with the original block on the left and the remaining block on the right
      evidence_hint_cube_removal_count: set "evidence" to an array containing exactly two bounding boxes [x1, y1, x2, y2], first for the original block on the left and second for the remaining block on the right
      json_example_cube_removal_count: '{"evidence":[[132,175,459,656],[750,207,1080,656]],"answer":4}'
      json_example_answer_only_cube_removal_count: '{"answer":4}'

