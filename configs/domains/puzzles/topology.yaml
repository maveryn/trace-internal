      balanced_query_variant_sampling: true
      balanced_target_reachability_sampling: true
      balanced_scene_variant_sampling: true
      query_variant_weights:
        exit_reachability_label: 1.0
        reachable_exit_count: 1.0
      target_reachability_weights:
        reachable: 1.0
        unreachable: 1.0
      scene_variant_weights:
        classic_wall_maze: 1.0
        paper_labyrinth_maze: 1.0
        block_wall_maze: 1.0
    task_puzzles__pipe_flow__pipe_flow_repair_tile_label:
      balanced_grid_size_variant_sampling: true
      balanced_scene_variant_sampling: true
      grid_size_variant_weights:
        6x6: 1.0
        7x7: 1.0
        8x8: 1.0
        9x9: 1.0
        10x10: 1.0
      scene_variant_weights:
        water_pipe: 1.0
        circuit_trace: 1.0
        industrial_conduit: 1.0
      path_length_min: 10
      path_length_max: 24
      candidate_count_min: 6
      candidate_count_max: 6
      branch_count_min: 2
      branch_count_max: 5
      branch_length_min: 2
      branch_length_max: 4
    task_puzzles__voxel_ladder__voxel_ladder_route_label:
      balanced_query_id_sampling: true
      balanced_scene_variant_sampling: true
      balanced_answer_sampling: true
      route_checkpoint_count_min: 2
      route_checkpoint_count_max: 4
      route_option_count_min: 4
      route_option_count_max: 5
      shortest_ladder_count_min: 1
      shortest_ladder_count_max: 3
