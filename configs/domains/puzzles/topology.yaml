        necklace_board: 1.0
        charm_card_grid: 1.0
        route_loop_diagram: 1.0
        token_ring_outline: 1.0
      loop_path_style_weights:
        ellipse: 1.0
        rounded_rect: 1.0
        polygon_loop: 1.0
        wavy_loop: 1.0
        beaded_string: 1.0
