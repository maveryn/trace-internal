prompt:
  shared:
    bundle_id: puzzles_topology_v0
  task_overrides:
    puzzles_topology_cyclic_order_match_internal:
      scene_key: topology_cyclic_order_puzzle
      task_key: cyclic_order_match_query
      object_description_necklace_board: a reference token loop above several labeled option loops
      object_description_charm_card_grid: a card-style reference token loop above several labeled option loops
      object_description_route_loop_diagram: a route-style reference token loop above several labeled option loops
      object_description_token_ring_outline: an outline-style reference token loop above several labeled option loops
      answer_hint_cyclic_order_equivalent_label: set "answer" to the exact option letter of the equivalent loop
      evidence_hint_cyclic_order_equivalent_label: set "evidence" to an array containing exactly one bounding box [x0, y0, x1, y1] for the equivalent option image
      json_example_cyclic_order_equivalent_label: '{"evidence":[[574,463,746,617]],"answer":"C"}'
      json_example_answer_only_cyclic_order_equivalent_label: '{"answer":"C"}'
    puzzles_topology_string_component_internal:
      scene_key: topology_string_component_puzzle
      task_key: string_topology_count_query
      answer_hint: set "answer" to the exact number of requested string components as an integer
      object_description_string_strip: several separate ropes, rings, and knotted loops on an open canvas
      object_description_string_card: a card-style diagram of separate ropes, rings, and knotted loops on an open canvas
      object_description_string_outline: an outline-style diagram of separate ropes, rings, and knotted loops on an open canvas
      evidence_hint_open_rope_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each open-ended rope
      evidence_hint_closed_loop_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each separate string piece that forms a closed loop, including knotted closed loops
      evidence_hint_knotted_component_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each separate string piece that contains at least one knot
      json_example_open_rope_count: '{"evidence":[[92,132,266,228],[512,176,686,272],[786,430,960,526],[224,602,398,698]],"answer":4}'
      json_example_closed_loop_count: '{"evidence":[[122,168,284,270],[790,168,952,270]],"answer":2}'
      json_example_knotted_component_count: '{"evidence":[[456,168,628,290]],"answer":1}'
      json_example_answer_only_open_rope_count: '{"answer":4}'
      json_example_answer_only_closed_loop_count: '{"answer":2}'
      json_example_answer_only_knotted_component_count: '{"answer":1}'
    puzzles_topology_maze_exit_internal:
      scene_key: topology_maze_exit_puzzle
      task_key: maze_exit_label_query
      object_description_classic_wall_maze: an orthogonal wall maze with a START cell and labeled exits on the outer boundary
      object_description_paper_labyrinth_maze: a paper-style orthogonal wall maze with a START cell and labeled exits on the outer boundary
      object_description_block_wall_maze: a heavy-wall orthogonal maze with a START cell and labeled exits on the outer boundary
      answer_hint_exit_reachability_label: set "answer" to the exact {target_reachability_description} exit label as a string
      answer_hint_reachable_exit_count: set "answer" to the exact number of reachable exits as an integer
      evidence_hint_exit_reachability_label: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for the target {target_reachability_description} exit label and doorway
      evidence_hint_reachable_exit_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each reachable exit label and doorway
      json_example_exit_reachability_label: '{"evidence":[[166,91,221,146]],"answer":"C"}'
      json_example_reachable_exit_count: '{"evidence":[[166,91,221,146],[472,789,527,844],[979,676,1034,731]],"answer":3}'
      json_example_answer_only_exit_reachability_label: '{"answer":"C"}'
      json_example_answer_only_reachable_exit_count: '{"answer":3}'
    task_puzzles__pipe_flow__pipe_flow_repair_tile_label:
      scene_key: topology_pipe_flow_puzzle
      task_key: pipe_flow_repair_query
      object_description_water_pipe: a pipe-tile grid with a green start marker and a red triangular finish flag
      object_description_circuit_trace: a circuit-trace tile grid with a green start marker and a red triangular finish flag
      object_description_industrial_conduit: an industrial conduit tile grid with a green start marker and a red triangular finish flag
      answer_hint: set "answer" to the single capital-letter option label of the 2x2 piece that can be rotated to complete the flow path
      evidence_hint: set "evidence" to an array containing the correct option panel box and the black 2x2 missing-region box, each as [x0, y0, x1, y1] pixel boxes
      json_example: '{"evidence":[[774,248,902,376],[424,312,512,400]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_puzzles__voxel_ladder__voxel_ladder_route_label:
      scene_key: topology_voxel_ladder
      task_key: voxel_ladder_route_label_query
      object_description_clean_isometric_voxels: an isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      object_description_worksheet_voxel_maze: a worksheet-style isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      object_description_game_board_voxel_maze: a compact game-board style isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      answer_hint_checkpoint_sequence_label: set "answer" to the single capital-letter option whose color-swatch sequence matches the checkpoint colors passed on the shortest START-to-GOAL route
      answer_hint_unreachable_checkpoint_label: set "answer" to the lowercase color name of the only unreachable checkpoint cube as a string
      evidence_hint_checkpoint_sequence_label: set "evidence" to an array containing bounding boxes [x0, y0, x1, y1] for the START cube, the checkpoint cubes on the shortest route, the ladders used on that route, and the GOAL cube
      evidence_hint_unreachable_checkpoint_label: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for the unreachable checkpoint cube
      json_example_checkpoint_sequence_label: '{"evidence":[[128,522,206,590],[318,404,390,474],[472,276,544,346],[592,206,626,336],[664,128,736,198]],"answer":"B"}'
      json_example_unreachable_checkpoint_label: '{"evidence":[[758,318,830,388]],"answer":"purple"}'
      json_example_answer_only_checkpoint_sequence_label: '{"answer":"B"}'
      json_example_answer_only_unreachable_checkpoint_label: '{"answer":"purple"}'
    task_puzzles__voxel_ladder__voxel_ladder_route_count:
      scene_key: topology_voxel_ladder
      task_key: voxel_ladder_route_count_query
      object_description_clean_isometric_voxels: an isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      object_description_worksheet_voxel_maze: a worksheet-style isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      object_description_game_board_voxel_maze: a compact game-board style isometric cube maze with a blue START cube, a red GOAL cube, colored checkpoint cubes, and black ladders between height levels
      answer_hint_reachable_checkpoint_count: set "answer" to the exact number of colored checkpoint cubes reachable from START as an integer
      answer_hint_shortest_ladder_count: set "answer" to the exact number of black ladders used on the shortest START-to-GOAL route as an integer
      evidence_hint_reachable_checkpoint_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each reachable checkpoint cube
      evidence_hint_shortest_ladder_count: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] for each black ladder used on the shortest START-to-GOAL route
      json_example_reachable_checkpoint_count: '{"evidence":[[318,404,390,474],[472,276,544,346],[664,128,736,198]],"answer":3}'
      json_example_shortest_ladder_count: '{"evidence":[[592,206,626,336],[704,128,738,258]],"answer":2}'
      json_example_answer_only_reachable_checkpoint_count: '{"answer":3}'
      json_example_answer_only_shortest_ladder_count: '{"answer":2}'

