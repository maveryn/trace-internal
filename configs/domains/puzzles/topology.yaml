generation:
  task_overrides:
    puzzles_topology_cyclic_order_match_internal:
      option_count_min: 6
      option_count_max: 6
      valid_option_count_min: 1
      valid_option_count_max: 5
      bead_count_min: 4
      bead_count_max: 6
