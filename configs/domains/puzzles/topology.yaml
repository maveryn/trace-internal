      visual_group_count_min: 6
      visual_group_count_max: 20
      target_count_min: 3
      target_count_max: 10
      distractor_count_min: 3
      distractor_count_max: 10
      balanced_sampling: true
      balanced_query_variant_sampling: true
      balanced_scene_variant_sampling: true
      query_variant_weights:
        open_rope_count: 1.0
        closed_loop_count: 1.0
        knotted_component_count: 1.0
      scene_variant_weights:
        string_strip: 1.0
        string_card: 1.0
        string_outline: 1.0
