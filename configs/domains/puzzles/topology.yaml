        cyclic_order_equivalent_label:
          option_count_min: 6
          option_count_max: 6
          bead_count_min: 4
          bead_count_max: 5
      min_color_distance: 50.0
      color_distance_space: lab
      balanced_query_variant_sampling: true
      balanced_token_render_style_sampling: true
      balanced_scene_variant_sampling: true
      balanced_loop_path_style_sampling: true
      query_variant_weights:
        cyclic_order_equivalent_label: 1.0
      token_render_style_weights:
        colored_beads: 1.0
        shape_tokens: 1.0
        colored_shape_tokens: 1.0
        outline_shape_tokens: 1.0
