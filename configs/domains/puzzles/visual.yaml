prompt:
  shared:
    bundle_id: puzzles_visual_v0
    scene_key: color_gradient
    task_key: color_gradient_violation_query
    object_description_swatch_clean: a labeled grid of color swatches arranged as a smooth color progression
    object_description_swatch_card: a card-style labeled grid of color swatches arranged as a smooth color progression
    object_description_swatch_notebook: a notebook-style labeled grid of color swatches arranged as a smooth color progression
    evidence_hint: set "evidence" to an array containing the bounding box of the swatch cell that breaks the progression, as [x0,y0,x1,y1] in pixels
    answer_hint: set "answer" to the single capital-letter label of the swatch that breaks the progression
    json_example: '{"evidence":[[324,188,432,296]],"answer":"F"}'
    json_example_answer_only: '{"answer":"F"}'
  task_overrides:
    task_puzzles__color_gradient__color_gradient_completion_label:
      task_key: color_gradient_completion_query
      object_description_swatch_clean: a linear row of color swatches with one blank swatch and labeled color options
      object_description_swatch_card: a card-style linear row of color swatches with one blank swatch and labeled color options
      object_description_swatch_notebook: a notebook-style linear row of color swatches with one blank swatch and labeled color options
      evidence_hint: set "evidence" to an object/dictionary with keys "blank_swatch" and "selected_option"; each value is a bounding box [x0,y0,x1,y1] in pixels
      answer_hint: set "answer" to the single capital-letter label of the option that completes the color gradient
      json_example: '{"evidence":{"blank_swatch":[268,188,372,292],"selected_option":[524,420,628,524]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'

visual:
  noise:
    apply_prob: 0.0
