generation:
  task_overrides:
    task_puzzles__word_search__search_location_label:
      grid_size_min: 5
      grid_size_max: 8
      word_length_min: 3
      word_length_max: 4
      option_count_min: 6
      option_count_max: 8
      balanced_scene_variant_sampling: true
      scene_variant_weights:
        word_search_classic: 1.0
        word_search_notebook: 1.0
        word_search_card: 1.0
    task_puzzles__word_search__search_letter_count_value:
      grid_size_min: 5
      grid_size_max: 8
      target_count_min: 1
      target_count_max: 8
      balanced_scene_variant_sampling: true
      scene_variant_weights:
        word_search_classic: 1.0
        word_search_notebook: 1.0
        word_search_card: 1.0
    task_puzzles__word_search__search_present_word_count:
      grid_size_min: 5
      grid_size_max: 8
      word_length_min: 3
      word_length_max: 4
      word_bank_size: 5
      present_count_min: 1
      present_count_max: 5
      balanced_scene_variant_sampling: true
      scene_variant_weights:
        word_search_classic: 1.0
        word_search_notebook: 1.0
        word_search_card: 1.0
    task_puzzles__code_grid__decoded_word_label:
      grid_size_min: 4
      grid_size_max: 5
      target_word_length_min: 3
      target_word_length_max: 6
      balanced_query_id_sampling: true
      balanced_scene_variant_sampling: true
      query_id_weights:
        decode_coordinate_sequence: 1.0
        decode_spaced_coordinate_sequence: 1.0
      scene_variant_weights:
        code_grid_classic: 1.0
        code_grid_notebook: 1.0
        code_grid_card: 1.0

