prompt:
  shared:
    bundle_id: symbolic_automaton_v0
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer" in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for the final answer.
  task_overrides:
    task_symbolic__agent_automaton__agent_final_pose_label:
      scene_key: agent_automaton
      task_key: agent_final_pose_query
      object_description_clean_grid: an agent automaton grid with an arrow marker showing the starting cell and direction
      object_description_lab_panel: an agent automaton grid with an arrow marker showing the starting cell and direction
      object_description_notebook_grid: an agent automaton grid with an arrow marker showing the starting cell and direction
      query_instruction_binary_rule_final_pose: Binary rule, applied at each step before moving. On a light cell, turn right and change the cell to the colored state. On a colored-state cell, turn left and change the cell to light. Then move one cell forward, wrapping around the grid edge.
      query_instruction_three_state_rule_final_pose: Three-state rule, applied at each step before moving. On a cell marked 0, turn right and advance it to 1. On a cell marked 1, keep direction and advance it to 2. On a cell marked 2, turn left and advance it to 0. Then move one cell forward, wrapping around the grid edge.
      annotation_hint: set "annotation" to an object/dictionary keyed by witness role with pixel bounding boxes [x0, y0, x1, y1] for "start_marker" and "selected_option"
      answer_hint: set "answer" to the single selected option letter
      json_example: '{"annotation":{"start_marker":[322,136,376,190],"selected_option":[624,512,774,628]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_symbolic__agent_automaton__agent_cell_flip_count:
      scene_key: agent_automaton
      task_key: agent_flip_count_query
      object_description_clean_grid: an agent automaton grid with an arrow marker showing the starting cell and direction, numbered update-step markers, and a marked target cell or region
      object_description_lab_panel: an agent automaton grid with an arrow marker showing the starting cell and direction, numbered update-step markers, and a marked target cell or region
      object_description_notebook_grid: an agent automaton grid with an arrow marker showing the starting cell and direction, numbered update-step markers, and a marked target cell or region
      rule_instruction_binary_rule: Binary rule, applied at each step before moving. On a light cell, turn right and change the cell to the colored state. On a colored-state cell, turn left and change the cell to light. Then move one cell forward, wrapping around the grid edge.
      rule_instruction_three_state_rule: Three-state rule, applied at each step before moving. On a cell marked 0, turn right and advance it to 1. On a cell marked 1, keep direction and advance it to 2. On a cell marked 2, turn left and advance it to 0. Then move one cell forward, wrapping around the grid edge.
      query_instruction_marked_region_flip_count: Count only visits where the agent changes a cell inside the marked region during the update step.
      annotation_hint: set "annotation" to an array containing the marked-region pixel bounding box [x0, y0, x1, y1]
      answer_hint: set "answer" to the integer count
      json_example: '{"annotation":[[434,248,542,356]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
    task_symbolic__life_automaton__life_future_grid_label:
      scene_key: life_automaton
      task_key: life_future_grid_query
      object_description_clean_grid: a cellular-automaton grid where dark cells are alive and light cells are empty
      object_description_lab_panel: a lab-style cellular-automaton grid where dark cells are alive and light cells are empty
      object_description_notebook_grid: a notebook-style cellular-automaton grid where dark cells are alive and light cells are empty
      query_instruction_one_step_future_grid: Use the rule that an alive cell survives with exactly 2 or 3 alive neighbors, an empty cell becomes alive with exactly 3 alive neighbors, and all other cells are empty in the next grid.
      query_instruction_two_step_future_grid: Apply the same alive-neighbor rule for two updates in sequence.
      annotation_hint: set "annotation" to an object/dictionary with keys "source_grid" and "selected_option", each mapped to that pixel bounding box [x0, y0, x1, y1]
      answer_hint: set "answer" to the single selected option letter
      json_example: '{"annotation":{"source_grid":[322,104,718,500],"selected_option":[624,552,774,706]},"answer":"D"}'
      json_example_answer_only: '{"answer":"D"}'
    task_symbolic__life_automaton__life_population_count:
      scene_key: life_automaton
      task_key: life_population_count_query
      object_description_clean_grid: a future cellular-automaton grid where dark cells are alive and light cells are empty
      object_description_lab_panel: a lab-style future cellular-automaton grid where dark cells are alive and light cells are empty
      object_description_notebook_grid: a notebook-style future cellular-automaton grid where dark cells are alive and light cells are empty
      query_instruction_marked_line_live_count: Use the marked row or column as the target line.
      query_instruction_marked_region_live_count: Count the alive cells inside the marked region in the shown future grid.
      annotation_hint: set "annotation" to an array containing the marked row or column pixel bounding box [x0, y0, x1, y1]
      answer_hint: set "answer" to the integer count
      json_example: '{"annotation":[[322,104,718,158]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
    task_symbolic__turing_tape__turing_written_symbol_count:
      scene_key: turing_tape
      task_key: turing_written_symbol_count_query
      object_description_clean_grid: a tape-machine automaton with a starting tape, head marker, state label, step count, queried symbol, and transition table
      object_description_lab_panel: a lab-style tape-machine automaton with a starting tape, head marker, state label, step count, queried symbol, and transition table
      object_description_notebook_grid: a notebook-style tape-machine automaton with a starting tape, head marker, state label, step count, queried symbol, and transition table
      query_instruction_written_symbol_count: At each step, find the row with the current state and the symbol under the head, write the new symbol, move the head L or R, and switch to the next state.
      annotation_hint: set "annotation" to an array of [x0, y0, x1, y1] pixel boxes containing the starting tape/head panel bounding box and the transition-table bounding box
      answer_hint: set "answer" to the integer count
      json_example: '{"annotation":[[248,96,792,238],[316,282,724,536]],"answer":4}'
      json_example_answer_only: '{"answer":4}'

visual:
  background:
    enabled: true
    styles:
      automaton_plain:
        kind: solid
        color: [248, 250, 252]
      automaton_cool:
        kind: solid
        color: [244, 248, 251]
      automaton_warm:
        kind: solid
        color: [250, 248, 244]
    weights:
      automaton_plain: 1.0
      automaton_cool: 1.0
      automaton_warm: 1.0
  noise:
    apply_prob: 0.5
    edit_count_range: [1, 2]
