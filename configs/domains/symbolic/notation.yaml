prompt:
  shared:
    bundle_id: symbolic_v0
    scene_key: music_staff
    task_key: music_notation_query
    object_description_engraved_sheet: a clean engraved-style sheet-music staff panel
      with marked notation items
    object_description_exam_scan: an exam-scan-style sheet-music staff panel with
      marked notation items
    object_description_notebook_staff: a notebook-style sheet-music staff panel with
      marked notation items
    json_output_contract: Use a valid JSON object with keys "annotation" and "answer"
      in that order for the final answer.
    json_output_contract_answer_only: Use a valid JSON object with key "answer" for
      the final answer.
    annotation_hint_note_name_label: set "annotation" to an array containing the pixel-space
      bounding box [x0, y0, x1, y1] for the marked note
    answer_hint_note_name_label: set "answer" to the note name string, using
    json_example_note_name_label: '{"annotation":[[270,188,315,252]],"answer":"F#"}'
    json_example_answer_only_note_name_label: '{"answer":"F#"}'
    annotation_hint_interval_name_label: set "annotation" to an array containing the
      two marked note pixel-space bounding boxes [x0, y0, x1, y1]
    answer_hint_interval_name_label: set "answer" to the interval name string, such
      as "major 3rd" or "perfect 5th"
    json_example_interval_name_label: '{"annotation":[[242,190,286,253],[338,154,383,224]],"answer":"major
      3rd"}'
    json_example_answer_only_interval_name_label: '{"answer":"major 3rd"}'
    annotation_hint_same_pitch_pair_count: set "annotation" to an array containing
      every counted note-pair range pixel-space bounding box [x0, y0, x1, y1]; use
      an empty array when no shown pairs have the same pitch
    answer_hint_same_pitch_pair_count: set "answer" to the integer count of note pairs
      that have the same pitch
    json_example_same_pitch_pair_count: '{"annotation":[[240,160,330,245],[420,160,510,245]],"answer":2}'
    json_example_answer_only_same_pitch_pair_count: '{"answer":2}'
    annotation_hint_transposed_pitch_pair_count: set "annotation" to an array containing
      every counted transposition-pair range pixel-space bounding box [x0, y0, x1,
      y1]; use an empty array when no shown pairs match the requested transposition
    answer_hint_transposed_pitch_pair_count: set "answer" to the integer count of
      note pairs that match the requested upward interval
    json_example_transposed_pitch_pair_count: '{"annotation":[[240,160,330,245],[420,160,510,245]],"answer":2}'
    json_example_answer_only_transposed_pitch_pair_count: '{"answer":2}'
    annotation_hint_key_signature_label: set "annotation" to an array containing the
      key-signature pixel-space bounding box [x0, y0, x1, y1]
    answer_hint_key_signature_label: set "answer" to the key name string
    json_example_key_signature_label: '{"annotation":[[190,178,250,222]],"answer":"G
      major"}'
    json_example_answer_only_key_signature_label: '{"answer":"G major"}'
    annotation_hint_scale_validation_count: set "annotation" to an array containing
      every counted scale-fragment range pixel-space bounding box [x0, y0, x1, y1];
      use an empty array when no shown fragments correctly fit the requested key
    answer_hint_scale_validation_count: set "answer" to the integer count of scale
      fragments that correctly fit the requested key
    json_example_scale_validation_count: '{"annotation":[[240,160,330,245],[420,160,510,245]],"answer":2}'
    json_example_answer_only_scale_validation_count: '{"answer":2}'
    annotation_hint_scale_degree_function_label: set "annotation" to an array containing
      the key-signature pixel-space bounding box and the marked note pixel-space bounding
      box [x0, y0, x1, y1]
    answer_hint_scale_degree_function_label: set "answer" to the scale-degree function
      string
    json_example_scale_degree_function_label: '{"annotation":[[190,178,250,222],[330,188,374,250]],"answer":"dominant"}'
    json_example_answer_only_scale_degree_function_label: '{"answer":"dominant"}'
    annotation_hint_chord_quality_label: set "annotation" to an array containing the
      marked chord pixel-space bounding box [x0, y0, x1, y1]
    answer_hint_chord_quality_label: set "answer" to the chord-quality string
    json_example_chord_quality_label: '{"annotation":[[300,145,354,248]],"answer":"minor
      triad"}'
    json_example_answer_only_chord_quality_label: '{"answer":"minor triad"}'
    annotation_hint_roman_numeral_label: set "annotation" to an array containing the
      key-signature pixel-space bounding box and marked chord pixel-space bounding
      box [x0, y0, x1, y1]
    answer_hint_roman_numeral_label: set "answer" to the roman-numeral string
    json_example_roman_numeral_label: '{"annotation":[[190,178,250,222],[300,145,354,248]],"answer":"V"}'
    json_example_answer_only_roman_numeral_label: '{"answer":"V"}'
    annotation_hint_chord_inversion_label: set "annotation" to an array containing
      the marked chord pixel-space bounding box [x0, y0, x1, y1]
    answer_hint_chord_inversion_label: set "answer" to the inversion-name string
    json_example_chord_inversion_label: '{"annotation":[[300,145,354,248]],"answer":"first
      inversion"}'
    json_example_answer_only_chord_inversion_label: '{"answer":"first inversion"}'
    annotation_hint_dominant_count_value: set "annotation" to an array containing
      every counted dominant-chord pixel-space bounding box [x0, y0, x1, y1]; use
      an empty array when no shown chords are dominant
    answer_hint_dominant_count_value: set "answer" to the integer count of dominant
      chords
    json_example_dominant_count_value: '{"annotation":[[300,145,354,248],[410,145,464,248]],"answer":2}'
    json_example_answer_only_dominant_count_value: '{"answer":2}'
    annotation_hint_bar_count_value: set "annotation" to an array containing every
      visible bar pixel-space bounding box [x0, y0, x1, y1]
    answer_hint_bar_count_value: set "answer" to the integer number of bars
    json_example_bar_count_value: '{"annotation":[[240,160,330,245],[330,160,420,245],[420,160,510,245]],"answer":3}'
    json_example_answer_only_bar_count_value: '{"answer":3}'
    annotation_hint_duration_equivalence_label: set "annotation" to an array containing
      the target-duration note pixel-space bounding box and the selected option-card
      pixel-space bounding box [x0, y0, x1, y1]
    answer_hint_duration_equivalence_label: set "answer" to the single capital-letter
      option label
    json_example_duration_equivalence_label: '{"annotation":[[280,188,324,250],[890,190,1110,260]],"answer":"C"}'
    json_example_answer_only_duration_equivalence_label: '{"answer":"C"}'
    annotation_hint_meter_type_count: set "annotation" to an array containing every
      counted measure pixel-space bounding box [x0, y0, x1, y1]; use an empty array
      when no shown measures have the requested meter type
    answer_hint_meter_type_count: set "answer" to the integer count of measures with
      the requested meter type
    json_example_meter_type_count: '{"annotation":[[240,160,330,245],[420,160,510,245]],"answer":2}'
    json_example_answer_only_meter_type_count: '{"answer":2}'
    annotation_hint_articulation_symbol_label: set "annotation" to an array containing
      the marked note pixel-space bounding box and the articulation-symbol pixel-space
      bounding box [x0, y0, x1, y1]
    answer_hint_articulation_symbol_label: set "answer" to the articulation-symbol
      name string
    json_example_articulation_symbol_label: '{"annotation":[[280,188,324,250],[286,140,318,158]],"answer":"tenuto"}'
    json_example_answer_only_articulation_symbol_label: '{"answer":"tenuto"}'
  task_overrides:
    task_symbolic__organic_structure__bond_order_count:
      scene_key: organic_structure
      task_key: organic_structure_bond_order_count
      object_description_clean_worksheet: a clean worksheet-style organic skeletal
        structure drawn with plausible line-angle single, double, and triple bonds
      object_description_exam_scan: an exam-scan-style organic skeletal structure
        drawn with plausible line-angle single, double, and triple bonds
      object_description_notebook_problem: a notebook-style organic skeletal structure
        drawn with plausible line-angle single, double, and triple bonds
      annotation_hint_bond_order_count: set "annotation" to an array containing one
        pixel-space endpoint pair for every matching bond, where each endpoint is
        a point [x, y] formatted as [[x1, y1], [x2, y2]]
      answer_hint_bond_order_count: set "answer" to the integer count of matching
        bonds
      json_example_bond_order_count: '{"annotation":[[[420,260],[512,310]],[[610,340],[704,388]]],"answer":2}'
      json_example_answer_only_bond_order_count: '{"answer":2}'
    task_symbolic__organic_structure__branch_point_count:
      scene_key: organic_structure
      task_key: organic_structure_branch_point_count
      object_description_clean_worksheet: a clean worksheet-style organic skeletal
        structure drawn with plausible line-angle vertices and bonds
      object_description_exam_scan: an exam-scan-style organic skeletal structure
        drawn with plausible line-angle vertices and bonds
      object_description_notebook_problem: a notebook-style organic skeletal structure
        drawn with plausible line-angle vertices and bonds
      annotation_hint_branch_point_count: set "annotation" to an array containing
        the pixel-space center point [x, y] of every branch vertex
      answer_hint_branch_point_count: set "answer" to the integer count of branch
        vertices
      json_example_branch_point_count: '{"annotation":[[420,260],[512,310]],"answer":2}'
      json_example_answer_only_branch_point_count: '{"answer":2}'
    task_symbolic__organic_structure__ring_size_count:
      scene_key: organic_structure
      task_key: organic_structure_ring_size_count
      object_description_clean_worksheet: a clean worksheet-style organic skeletal
        structure drawn with separated pentagonal and hexagonal rings
      object_description_exam_scan: an exam-scan-style organic skeletal structure
        drawn with separated pentagonal and hexagonal rings
      object_description_notebook_problem: a notebook-style organic skeletal structure
        drawn with separated pentagonal and hexagonal rings
      annotation_hint_ring_size_count: set "annotation" to an array containing the
        pixel-space bounding box [x0, y0, x1, y1] around every matching ring
      answer_hint_ring_size_count: set "answer" to the integer count of matching rings
      json_example_ring_size_count: '{"annotation":[[220,250,340,370],[520,250,640,370]],"answer":2}'
      json_example_answer_only_ring_size_count: '{"answer":2}'
    task_symbolic__braille_cell__raised_dot_count:
      scene_key: braille_cell
      task_key: braille_raised_dot_count
      object_description_clean_card: a clean card of Braille cells with one target
        cell marked
      object_description_notebook_card: a notebook-style card of Braille cells with
        one target cell marked
      object_description_exam_scan: an exam-scan-style card of Braille cells with
        one target cell marked
      annotation_hint_raised_dot_count: set "annotation" to an array containing the
        pixel-space center point [x, y] of every raised dot in the marked target cell
      answer_hint_raised_dot_count: set "answer" to the integer count of raised dots
        in the marked target cell
      json_example_raised_dot_count: '{"annotation":[[420,260],[462,260],[420,316]],"answer":3}'
      json_example_answer_only_raised_dot_count: '{"answer":3}'
    task_symbolic__braille_cell__matching_pattern_label:
      scene_key: braille_cell
      task_key: braille_matching_pattern_label
      object_description_clean_card: a clean Braille reference cell and six labeled
        Braille option cells
      object_description_notebook_card: a notebook-style Braille reference cell and
        six labeled Braille option cells
      object_description_exam_scan: an exam-scan-style Braille reference cell and
        six labeled Braille option cells
      annotation_hint_matching_pattern_label: set "annotation" to an object with keys
        "reference_cell" and "selected_option", each mapped to a pixel-space bounding
        box [x0, y0, x1, y1]
      answer_hint_matching_pattern_label: set "answer" to the single capital-letter
        option label
      json_example_matching_pattern_label: '{"annotation":{"reference_cell":[90,248,222,432],"selected_option":[548,110,680,294]},"answer":"C"}'
      json_example_answer_only_matching_pattern_label: '{"answer":"C"}'
    task_symbolic__logic_gate_circuit__output_value_count:
      scene_key: logic_gate_circuit
      task_key: logic_gate_output_value_count
      object_description_clean_worksheet: a clean worksheet-style Boolean logic-gate
        circuit diagram with visible input values, labeled gates, wires, and hidden
        output values
      object_description_notebook_problem: a notebook-style Boolean logic-gate circuit
        diagram with visible input values, labeled gates, wires, and hidden output
        values
      object_description_exam_scan: an exam-scan-style Boolean logic-gate circuit
        diagram with visible input values, labeled gates, wires, and hidden output
        values
      annotation_hint_output_one_count: set "annotation" to an array containing the
        pixel-space center point [x, y] of every final OUT node whose circuit evaluates
        to 1
      answer_hint_output_one_count: set "answer" to the integer count of circuits
        whose final OUT value is 1
      json_example_output_one_count: '{"annotation":[[310,180],[845,410]],"answer":2}'
      json_example_answer_only_output_one_count: '{"answer":2}'
      annotation_hint_output_zero_count: set "annotation" to an array containing the
        pixel-space center point [x, y] of every final OUT node whose circuit evaluates
        to 0
      answer_hint_output_zero_count: set "answer" to the integer count of circuits
        whose final OUT value is 0
      json_example_output_zero_count: '{"annotation":[[310,180],[845,410],[310,640]],"answer":3}'
      json_example_answer_only_output_zero_count: '{"answer":3}'
    task_symbolic__logic_gate_circuit__satisfying_assignment_label:
      scene_key: logic_gate_circuit
      task_key: logic_gate_satisfying_assignment_label
      object_description_clean_worksheet: a clean worksheet-style Boolean logic-gate
        circuit diagram with one source circuit and six visible assignment options
      object_description_notebook_problem: a notebook-style Boolean logic-gate circuit
        diagram with one source circuit and six visible assignment options
      object_description_exam_scan: an exam-scan-style Boolean logic-gate circuit
        diagram with one source circuit and six visible assignment options
      annotation_hint_assignment_outputs_one_label: set "annotation" to an object
        with keys "source_circuit" and "selected_option", each mapped to a pixel-space
        bounding box [x0, y0, x1, y1]
      answer_hint_assignment_outputs_one_label: set "answer" to the single capital-letter
        option label
      json_example_assignment_outputs_one_label: '{"annotation":{"source_circuit":[48,120,730,690],"selected_option":[793,302,1132,358]},"answer":"D"}'
      json_example_answer_only_assignment_outputs_one_label: '{"answer":"D"}'
      annotation_hint_assignment_outputs_zero_label: set "annotation" to an object
        with keys "source_circuit" and "selected_option", each mapped to a pixel-space
        bounding box [x0, y0, x1, y1]
      answer_hint_assignment_outputs_zero_label: set "answer" to the single capital-letter
        option label
      json_example_assignment_outputs_zero_label: '{"annotation":{"source_circuit":[48,120,730,690],"selected_option":[793,434,1132,490]},"answer":"F"}'
      json_example_answer_only_assignment_outputs_zero_label: '{"answer":"F"}'
