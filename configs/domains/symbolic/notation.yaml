      balanced_target_answer_sampling: true
      target_answer_min: 0
      target_answer_max: 4
    task_symbolic__music_staff__scale_degree_function_label:
      query_id_weights:
        scale_degree_function_label: 1.0
    task_symbolic__music_staff__chord_harmony_label:
      query_id_weights:
        chord_quality_label: 1.0
        roman_numeral_label: 1.0
        chord_inversion_label: 1.0
