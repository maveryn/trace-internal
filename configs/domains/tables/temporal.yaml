generation:
  task_overrides:
    task_tables_temporal_value:
      task_variant_weights:
        value_at_year: 1.0
        delta_between_years: 1.0
        absolute_difference_between_years: 1.0
        sum_over_year_interval: 1.0
        mean_over_year_interval: 1.0

prompt:
  shared:
    bundle_id: tables_temporal_v1
    task_family_key: styled_table_temporal
    task_key: temporal_value_query
    answer_hint: set "answer" to the exact integer temporal result
    object_description_spreadsheet: a spreadsheet-style table with one Name column, several year columns in chronological order, full grid lines, and a shaded header row
    object_description_zebra: a zebra-striped table with one Name column, several year columns in chronological order, alternating row shading, and a shaded header row
    object_description_ledger: a ledger-style table with one Name column, several year columns in chronological order, strong horizontal rules, and minimal vertical separators
    object_description_card_table: a card-style table with one Name column, several year columns in chronological order, a rounded outer frame, and a shaded header row
  task_overrides:
    task_tables_temporal_value:
      evidence_hint_value_at_year: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the queried year cell
      evidence_hint_delta_between_years: set "evidence" to an array containing exactly two bounding boxes [x1, y1, x2, y2] ordered as [start-year cell, end-year cell]
      evidence_hint_absolute_difference_between_years: set "evidence" to an array containing exactly two bounding boxes [x1, y1, x2, y2] ordered as [start-year cell, end-year cell]
      evidence_hint_sum_over_year_interval: set "evidence" to an array containing the ordered queried year-cell bounding boxes from the start year through the end year
      evidence_hint_mean_over_year_interval: set "evidence" to an array containing the ordered queried year-cell bounding boxes from the start year through the end year
      json_example_value_at_year: '{"evidence":[[260,180,372,236]],"answer":17}'
      json_example_delta_between_years: '{"evidence":[[260,180,372,236],[374,180,486,236]],"answer":-4}'
      json_example_absolute_difference_between_years: '{"evidence":[[260,180,372,236],[374,180,486,236]],"answer":4}'
      json_example_sum_over_year_interval: '{"evidence":[[260,180,372,236],[374,180,486,236],[488,180,600,236]],"answer":29}'
      json_example_mean_over_year_interval: '{"evidence":[[260,180,372,236],[374,180,486,236],[488,180,600,236]],"answer":14}'
      json_example_answer_only_value_at_year: '{"answer":17}'
      json_example_answer_only_delta_between_years: '{"answer":-4}'
      json_example_answer_only_absolute_difference_between_years: '{"answer":4}'
      json_example_answer_only_sum_over_year_interval: '{"answer":29}'
      json_example_answer_only_mean_over_year_interval: '{"answer":14}'
