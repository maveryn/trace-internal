generation:
  shared:
    scene_variant_weights:
      classic: 1.0
      minimal: 1.0
      outline: 1.0
    style_variant_weights:
      studio: 1.0
      accented: 1.0
      marker: 1.0
    accent_color_name_weights:
      red: 1.0
      blue: 1.0
      green: 1.0
      yellow: 1.0
      orange: 1.0
      purple: 1.0
      brown: 1.0
      cyan: 1.0
      magenta: 1.0
      maroon: 1.0
    balanced_task_variant_sampling: true
    balanced_scene_variant_sampling: true
    balanced_style_variant_sampling: true
    balanced_accent_color_name_sampling: true
    hour_min: 1
    hour_max: 12
    minute_min: 0
    minute_max: 55
    minute_step: 5
    min_hand_angle_gap_deg: 10.0
  task_overrides:
    task_temporal_clock_readout:
      task_variant_weights:
        shown_time: 1.0
        minutes_after: 1.0
        minutes_before: 1.0
      balanced_task_variant_sampling: true
      delta_minutes_support: [5, 10, 15, 20, 25, 30, 35, 40, 45, 50, 55]
    task_temporal_clock_compare:
      task_variant_weights:
        earliest_time: 1.0
        latest_time: 1.0
      balanced_task_variant_sampling: true
      clock_label_support: ["A", "B", "C", "D", "E", "F", "G", "H", "I"]
      clock_count_support: [5, 6, 7, 8, 9]
      min_compare_gap_minutes: 15

rendering:
  shared:
    canvas_width: 640
    canvas_height: 640
    outer_margin_px: 36
    face_radius_px: 236
    bezel_width_px: 10
    numeral_font_size_px: 28
    major_tick_length_px: 18
    minor_tick_length_px: 8
    major_tick_width_px: 4
    minor_tick_width_px: 2
    minor_tick_dot_radius_px: 3
    hour_hand_width_px: 12
    minute_hand_width_px: 8
    hand_bbox_padding_px: 6
    center_dot_radius_px: 8
    inner_ring_inset_px: 18
    inner_ring_width_px: 4
  task_overrides:
    task_temporal_clock_compare:
      canvas_width: 960
      canvas_height: 760
      outer_margin_px: 40
      face_radius_px: 84
      bezel_width_px: 8
      numeral_font_size_px: 18
      major_tick_length_px: 14
      minor_tick_length_px: 6
      major_tick_width_px: 3
      minor_tick_width_px: 2
      minor_tick_dot_radius_px: 2
      hour_hand_width_px: 8
      minute_hand_width_px: 6
      hand_bbox_padding_px: 5
      center_dot_radius_px: 6
      inner_ring_inset_px: 14
      inner_ring_width_px: 3
      label_font_size_px: 28
      label_gap_px: 20
      grid_col_gap_px: 30
      grid_row_gap_px: 34

complexity:
  shared:
    criteria_weights:
      time_reading: 0.55
      visual_scan: 0.20
      ambiguity: 0.15
      clutter: 0.10

prompt:
  shared:
    bundle_id: temporal_clock_v1
  task_overrides:
    task_temporal_clock_readout:
      task_family_key: single_analog_clock
      task_key: clock_readout_query
      object_description_classic: one analog clock with all hour numerals, minute ticks, and two visible hands
      object_description_minimal: one clean analog clock with hour numerals and two visible hands
      object_description_outline: one outline-style analog clock with hour numerals and two visible hands
      evidence_hint: set "evidence" to an array containing exactly two bounding boxes [x1, y1, x2, y2] for the clock hands
      answer_hint: set "answer" to the exact time in HH:MM 12-hour format with leading zeros
    task_temporal_clock_compare:
      task_family_key: multi_analog_clock
      task_key: clock_compare_query
      object_description_classic: five to nine labeled analog clocks arranged in a centered multi-row grid, each with hour numerals, minute ticks, and two visible hands
      object_description_minimal: five to nine labeled analog clocks arranged in a clean centered multi-row grid, each with hour numerals and two visible hands
      object_description_outline: five to nine labeled outline-style analog clocks arranged in a centered multi-row grid, each with hour numerals and two visible hands
      evidence_hint: set "evidence" to an array containing exactly one bounding box [x1, y1, x2, y2] for the winning clock face
      answer_hint: set "answer" to the single winning clock label as a string
