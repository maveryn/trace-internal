prompt:
  shared:
    bundle_id: three_d_spatial_v0
  task_overrides:
    task_three_d__object_scene__camera_distance_extremum_label:
      scene_key: object_scene
      task_key: camera_distance_extremum_query
      object_description: an open perspective setup with a gridded floor or platform, small candidate objects, larger props,
        and an option list below the scene
      annotation_hint: set "annotation" to an array containing one bounding box [x0, y0, x1, y1] around the selected small object
        in the scene
      answer_hint: set "answer" to the selected option letter
      json_example: '{"annotation":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__marked_point_depth_extremum_label:
      scene_key: object_scene
      task_key: marked_point_depth_extremum_query
      object_description: an open perspective setup with a gridded floor or platform, objects, and lettered point markers
        in the scene
      annotation_hint: set "annotation" to an object with key "selected_point"; the value is the point [x, y] at the center of
        the selected marker letter
      answer_hint: set "answer" to the selected marked-point letter
      json_example: '{"annotation":{"selected_point":[318,260]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__marked_point_vertical_relation_label:
      scene_key: object_scene
      task_key: marked_point_vertical_relation_query
      object_description: an open perspective setup with a gridded floor or platform, uniquely named small objects, and six
        lettered point markers in the scene
      annotation_hint: set "annotation" to an object with key "selected_point"; the value is the point [x, y] at the center of
        the selected marker letter
      answer_hint: set "answer" to the selected marked-point letter
      json_example: '{"annotation":{"selected_point":[318,260]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
