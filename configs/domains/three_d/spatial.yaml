prompt:
  shared:
    bundle_id: three_d_spatial_v0
  task_overrides:
    task_three_d__object_scene__camera_distance_extremum_label:
      scene_key: object_scene
      task_key: camera_distance_extremum_query
      object_description: an open synthetic 3D setup with a gridded floor or platform, perspective depth cues, small lettered 3D objects, and larger unlettered props
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected small lettered 3D object
      answer_hint: set "answer" to the selected small object letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__counterfactual_attribute_count:
      scene_key: object_scene
      task_key: counterfactual_attribute_count_query
      object_description: a perspective 3D scene with a gridded floor and many unlettered colored objects
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around each visible starting object matching the final counted description
      answer_hint: set "answer" to the final count
      json_example: '{"evidence":[[118,442,176,503],[391,316,448,374]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
    task_three_d__object_scene__object_relation_label:
      scene_key: object_scene
      task_key: object_relation_query
      object_description: an open synthetic 3D setup with a gridded floor or platform, perspective depth cues, small lettered 3D objects, and larger unlettered props
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected small lettered 3D object
      answer_hint: set "answer" to the selected small object letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__reference_nearest_label:
      scene_key: object_scene
      task_key: reference_nearest_query
      object_description: a gridded 3D platform with perspective depth cues and several objects, some marked with option letters
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected lettered 3D object
      answer_hint: set "answer" to the selected letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__between_references_label:
      scene_key: object_scene
      task_key: between_references_query
      object_description: a gridded 3D platform with perspective depth cues, two named unlettered reference objects, and several lettered option objects
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected lettered 3D object
      answer_hint: set "answer" to the selected letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__occlusion_order_label:
      scene_key: object_scene
      task_key: occlusion_order_query
      object_description: a gridded 3D platform with perspective depth cues and several objects, some marked with option letters
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected lettered 3D object
      answer_hint: set "answer" to the selected letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__height_extremum_label:
      scene_key: object_scene
      task_key: height_extremum_query
      object_description: a gridded 3D platform with perspective depth cues, larger support props, and small lettered objects at different heights above the floor
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around the selected lettered 3D object
      answer_hint: set "answer" to the selected letter
      json_example: '{"evidence":[[318,260,366,308]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__multiview_object_match_label:
      scene_key: object_scene
      task_key: multiview_object_match_query
      object_description: two side-by-side perspective views of the same open 3D setup with a gridded floor or platform, one red-boxed object in the left view, and lettered candidate objects in the right view
      evidence_hint: set "evidence" to an object with keys "reference_view_object" and "second_view_match"; each value is a bounding box [x0, y0, x1, y1] around the red-boxed object in the left view and the matching lettered object in the right view
      answer_hint: set "answer" to the selected object letter from the right view
      json_example: '{"evidence":{"reference_view_object":[112,210,168,276],"second_view_match":[842,228,902,296]},"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__object_scene__named_object_count:
      scene_key: object_scene
      task_key: named_object_count_query
      object_description: an open synthetic 3D setup with a gridded floor or platform, perspective depth cues, and many unlettered small 3D objects
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around each counted object
      answer_hint: set "answer" to the number of counted objects
      json_example: '{"evidence":[[118,442,176,503],[391,316,448,374],[702,521,758,579]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_three_d__object_scene__spatial_relation_count:
      scene_key: object_scene
      task_key: spatial_relation_count_query
      object_description: an open synthetic 3D setup with a gridded floor or platform, perspective depth cues, one named unlettered reference prop, and many unlettered small 3D objects
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around each counted small object
      answer_hint: set "answer" to the number of counted small objects
      json_example: '{"evidence":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_three_d__object_scene__view_relation_count:
      scene_key: object_scene
      task_key: view_relation_count_query
      object_description: an open synthetic 3D setup with a gridded floor or platform, perspective depth cues, one uniquely named unlettered small reference object, and many other unlettered small 3D objects
      evidence_hint: set "evidence" to an array containing one bounding box [x0, y0, x1, y1] around each counted small object
      answer_hint: set "answer" to the number of counted small objects
      json_example: '{"evidence":[[118,442,176,503],[391,316,448,374],[702,521,758,579]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
