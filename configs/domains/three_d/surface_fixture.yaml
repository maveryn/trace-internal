prompt:
  shared:
    bundle_id: three_d_surface_fixture_v0
  task_overrides:
    task_three_d__surface_fixture__repeated_element_count:
      scene_key: surface_fixture
      task_key: surface_fixture_repeated_element_count_query
      object_description: a fixture surface with repeated tiles, holes, slots, compartments,
        vents, windows, doors, drawer pulls, bricks, pavers, lockers, mailboxes, drive
        bays, buttons, or solar panels
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each counted surface element
      answer_hint: set "answer" to the number of counted surface elements
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374],[702,521,758,579]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_three_d__surface_fixture__colored_element_count:
      scene_key: surface_fixture
      task_key: surface_fixture_colored_element_count_query
      object_description: a fixture surface with repeated colored surface elements
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each counted colored surface element
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_three_d__surface_fixture__state_element_count:
      scene_key: surface_fixture
      task_key: surface_fixture_state_element_count_query
      object_description: a fixture surface with repeated elements that can have visible
        states
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each counted surface element in the requested state
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_three_d__surface_fixture__scoped_colored_element_count:
      scene_key: surface_fixture
      task_key: surface_fixture_scoped_colored_element_count_query
      object_description: a fixture surface arranged in rows and columns with repeated
        colored surface elements
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each counted colored surface element in the requested row
        or column
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_three_d__surface_fixture__empty_or_missing_cell_count:
      scene_key: surface_fixture
      task_key: surface_fixture_empty_or_missing_cell_count_query
      object_description: a fixture surface arranged in a visible grid with some empty
        or missing positions
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each missing fixture position
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_three_d__surface_fixture__adjacent_to_reference_count:
      scene_key: surface_fixture
      task_key: surface_fixture_adjacent_to_reference_count_query
      object_description: a fixture surface arranged in rows and columns with one
        uniquely colored reference element
      annotation_hint: set "annotation" to an array containing one bounding box [x0,
        y0, x1, y1] around each counted element that shares an edge with the reference
        element
      answer_hint: set "answer" to the count as an integer
      json_example: '{"annotation":[[118,442,176,503],[391,316,448,374]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
