prompt:
  shared:
    bundle_id: three_d_warehouse_v0
  task_overrides:
    task_three_d__warehouse__robot_forward_path_label:
      scene_key: warehouse
      task_key: warehouse_robot_forward_path_query
      object_description: a perspective warehouse aisle with shelf racks, pallets,
        crate stacks, barrels, carts, forklifts, workbenches, bins, safety equipment,
        one red-boxed robot with a red travel-direction arrow, a highlighted forward
        path corridor, candidate warehouse objects, and an option list below the scene
      annotation_hint: set "annotation" to one bounding box around the selected warehouse
        object in the scene
      answer_hint: set "answer" to the selected option letter
      json_example: '{"annotation":[[142,118,238,178]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__warehouse__nearest_candidate_to_reference_label:
      scene_key: warehouse
      task_key: warehouse_robot_nearest_object_query
      object_description: a perspective warehouse aisle with shelf racks, warehouse
        equipment, one reference object, candidate items, and an option list below
        the scene
      object_description_closest_robot_to_reference: a perspective warehouse aisle
        with shelf racks, warehouse equipment, one red sphere reference object, five
        candidate robots, and an option list below the scene
      object_description_closest_object_to_robot: a perspective warehouse aisle with
        shelf racks, warehouse equipment, one robot, five candidate warehouse objects,
        and an option list below the scene
      annotation_hint: set "annotation" to one bounding box around the selected candidate
        in the scene
      annotation_hint_closest_robot_to_reference: set "annotation" to one bounding
        box around the selected robot in the scene
      annotation_hint_closest_object_to_robot: set "annotation" to one bounding box
        around the selected warehouse object in the scene
      answer_hint: set "answer" to the selected option letter
      answer_hint_closest_robot_to_reference: set "answer" to the selected option
        letter
      answer_hint_closest_object_to_robot: set "answer" to the selected option letter
      json_example: '{"annotation":[[142,118,238,178]],"answer":"C"}'
      json_example_answer_only: '{"answer":"C"}'
    task_three_d__warehouse__scoped_attribute_count:
      scene_key: warehouse
      task_key: warehouse_shelf_level_object_count_query
      object_description: a warehouse shelf area with a gridded floor, two to four
        distinctly colored shelf racks, and visible items on bottom, middle, and top
        shelf levels
      annotation_hint: set "annotation" to an array containing one bounding box [x0,y0,x1,y1]
        around each counted shelf item; use [] if the count is zero
      answer_hint: set "answer" to the number of shelf items on the queried shelf
        level of the queried colored rack
      json_example: '{"annotation":[[142,118,238,178],[260,119,338,179]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
