generation:
  task_overrides:
    task_tile_count_color_count:
      palette_size_min: 3
      palette_size_max: 6
    task_tile_count_color_components:
      palette_size_min: 2
      palette_size_max: 3
      target_component_count_min: 1
    task_tile_count_largest_component_size:
      palette_size_min: 2
      palette_size_max: 3
      target_largest_component_size_min: 2
      target_largest_component_size_max: 10

complexity:
  task_overrides:
    task_tile_count_color_count:
      criteria_weights:
        visual_scan: 0.60
        reasoning_load: 0.40
    task_tile_count_color_components:
      criteria_weights:
        visual_scan: 0.45
        reasoning_load: 0.55
    task_tile_count_largest_component_size:
      criteria_weights:
        visual_scan: 0.40
        reasoning_load: 0.60

prompt:
  shared:
    bundle_id: tile_count_v1
    task_family_key: rectangular_tile_board
  task_overrides:
    task_tile_count_color_count:
      task_key: color_count_query
      answer_hint: set "answer" to the number of tiles matching the query color as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for every tile matching the query color
    task_tile_count_color_components:
      task_key: color_component_count_query
      answer_hint: set "answer" to the number of 4-neighbor connected components formed by the query-color tiles as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for every tile matching the query color
      json_example: '{"evidence":[[0,0],[0,1],[2,2]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
    task_tile_count_largest_component_size:
      task_key: largest_component_size_query
      answer_hint: set "answer" to the size of the largest 4-neighbor connected component formed by the query-color tiles as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for the tiles in that largest query-color component
      json_example: '{"evidence":[[0,0],[0,1],[1,1],[1,2]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
