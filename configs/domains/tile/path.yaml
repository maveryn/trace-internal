generation:
  task_overrides:
    task_tile_path_shortest_path:
      rows: 8
      cols: 8
      min_shortest_len: 6
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
      evidence_type: point_path

rendering:
  task_overrides:
    task_tile_path_shortest_path:
      canvas_size: 640
      margin: 24

prompt:
  shared:
    bundle_id: tile_path_v1
    task_family_key: maze_path
    task_key: shortest_path_query
    answer_hint: set "answer" to the shortest path length as an integer
    evidence_hint_point_path: provide the shortest path as an ordered [x, y] pixel-coordinate point list
    evidence_hint_bbox_set: provide the shortest path as a set of [x_min, y_min, x_max, y_max] pixel bounding boxes
    json_example_point_path: '{"evidence":[[100,140],[180,140],[260,140],[260,220]],"answer":3}'
    json_example_bbox_set: '{"evidence":[[60,100,140,180],[140,100,220,180],[220,100,300,180],[220,180,300,260]],"answer":3}'
    json_example_answer_only: '{"answer":3}'
visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [246, 246, 246]
    weights:
      solid_light: 1.0
  noise:
    apply_prob: 0.0
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
