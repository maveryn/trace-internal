generation:
  task_overrides:
    task_tile_path_shortest_path:
      rows: 7
      cols: 7
      target_shortest_len_min: 4
      target_shortest_len_max: 13
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
    task_tile_path_reachable_target_count:
      rows: 7
      cols: 7
      target_reachable_target_count_min: 0
      target_reachable_target_count_max: 6
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
      reachable_fraction_min: 0.20
      reachable_fraction_max: 0.85

rendering:
  task_overrides:
    task_tile_path_shortest_path:
      aspect_ratio_min: 1.0
      aspect_ratio_max: 1.0
    task_tile_path_reachable_target_count:
      aspect_ratio_min: 1.0
      aspect_ratio_max: 1.0

complexity:
  task_overrides:
    task_tile_path_shortest_path:
      criteria_weights:
        visual_scan: 0.30
        reasoning_load: 0.70
    task_tile_path_reachable_target_count:
      criteria_weights:
        visual_scan: 0.45
        reasoning_load: 0.55

prompt:
  shared:
    bundle_id: tile_path_v1
    task_family_key: rectangular_tile_board
  task_overrides:
    task_tile_path_shortest_path:
      task_key: shortest_path_query
      answer_hint: set "answer" to the shortest path length as an integer
      evidence_hint: set "evidence" to the ordered list of [row, col] coordinates along one shortest path from the start tile to the goal tile, inclusive
      json_example: '{"evidence":[[0,0],[0,1],[1,1],[1,2]],"answer":3}'
      json_example_answer_only: '{"answer":3}'
    task_tile_path_reachable_target_count:
      task_key: reachable_target_count_query
      answer_hint: set "answer" to the number of reachable target tiles as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for the reachable target tiles
      json_example: '{"evidence":[[0,2],[2,1]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [246, 246, 246]
    weights:
      solid_light: 1.0
  noise:
    apply_prob: 0.0
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
