generation:
  task_overrides:
    tile_shortest_path:
      rows: 8
      cols: 8
      min_shortest_len: 6
      obstacle_prob_min: 0.16
      obstacle_prob_max: 0.36
      evidence_type: point_path

rendering:
  task_overrides:
    tile_shortest_path:
      canvas_size: 640
      margin: 24

prompt:
  shared:
    bundle_id: tile_path_v1
    task_type_key: maze_path

sampling:
  shared:
    query_weights:
      shortest_path: 1.0

visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [246, 246, 246]
      grid_light:
        kind: grid
        base_color: [245, 246, 247]
        line_color: [225, 228, 232]
        spacing: 24
        line_width: 1
    weights:
      solid_light: 0.65
      grid_light: 0.35
  noise:
    apply_prob: 0.0
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
