      palette_size_min: 2
      palette_size_max: 3
      run_length: 3
      target_qualifying_line_count_min: 1

prompt:
  shared:
    bundle_id: tile_pattern_v1
    task_family_key: rectangular_tile_board
  task_overrides:
    task_tile_pattern_match3_run_count:
      task_key: match3_run_count_query
      answer_hint: set "answer" to the number of qualifying rows or columns as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for one canonical 3-tile witness run from each counted line
      json_example_rows: '{"evidence":[[0,1],[0,2],[0,3],[2,0],[2,1],[2,2]],"answer":2}'
      json_example_cols: '{"evidence":[[0,1],[0,3],[1,1],[1,3],[2,1],[2,3]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
