generation:
  task_overrides:
    task_tile_reachability_region_size:
      obstacle_fraction_min: 0.12
      obstacle_fraction_max: 0.38
      reachable_fraction_min: 0.20
      reachable_fraction_max: 0.85
      answer_max: 12

complexity:
  task_overrides:
    task_tile_reachability_region_size:
      criteria_weights:
        visual_scan: 0.45
        reasoning_load: 0.55

prompt:
  shared:
    bundle_id: tile_reachability_v1
    task_family_key: rectangular_tile_board
  task_overrides:
    task_tile_reachability_region_size:
      task_key: region_size_query
      answer_hint: set "answer" to the size of the reachable region, including the start tile, as an integer
      evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for every reachable tile, including the start tile
      json_example: '{"evidence":[[0,0],[0,1],[1,1],[2,1]],"answer":4}'
      json_example_answer_only: '{"answer":4}'
