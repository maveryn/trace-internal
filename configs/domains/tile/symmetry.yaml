generation:
  task_overrides:
    task_tile_symmetry_violation_count:
      palette_size_min: 2
      palette_size_max: 4
      target_violation_count_min: 1
      target_violation_count_max: 10

complexity:
  task_overrides:
    task_tile_symmetry_violation_count:
      criteria_weights:
        visual_scan: 0.45
        reasoning_load: 0.55

prompt:
  shared:
    bundle_id: tile_symmetry_v1
    task_family_key: rectangular_tile_board
    task_key: symmetry_violation_count_query
    answer_hint: set "answer" to the number of violating tiles as an integer
    evidence_hint: set "evidence" to the row-major list of [row, col] coordinates for every violating tile on the counted side
    json_example: '{"evidence":[[0,2],[1,2]],"answer":2}'
    json_example_answer_only: '{"answer":2}'
