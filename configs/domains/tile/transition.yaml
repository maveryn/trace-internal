generation:
  task_overrides:
    task_tile_transition_gravity_max_drop:
      target_max_drop_min: 1

prompt:
  shared:
    bundle_id: tile_transition_v1
    task_family_key: rectangular_tile_board
  task_overrides:
    task_tile_transition_gravity_max_drop:
      task_key: gravity_max_drop_query
      answer_hint: set "answer" to the maximum downward drop distance in cells as an integer
      evidence_hint: set "evidence" to the ordered [row, col] path of the uniquely farthest-falling tile from its start cell to its final cell
      json_example: '{"evidence":[[0,1],[1,1],[2,1]],"answer":2}'
      json_example_answer_only: '{"answer":2}'
