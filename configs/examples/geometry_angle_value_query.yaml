output_root: ./out

dataset_name: demo_geometry_angle_value_query
instance_version: v1
image_format: png
strict_repro: false
max_attempts_per_instance: 150
sampling_seed: 0
tasks:
  - task_id: geometry_angle_value_query
    count: 12
    params:
      candidate_count: 7
      angle_step: 15
      target_x: 90
    query_weights:
      min: 1.0
      max: 1.0
      median: 1.0
      closest_to_x: 1.0
      smallest_above_x: 0.5
      largest_below_x: 0.5
      difference_max_min: 1.0
