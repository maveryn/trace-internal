generation:
  candidate_count: 7
  min_angle: 15
  max_angle: 165
  angle_step: 15
  target_x: 90

rendering:
  canvas_size: 768
  ray_length: 84
  line_width: 4

prompt:
  bundle_id: geometry_measurement_v1
  task_type_key: angle_measurement
  entity_plural: angles

visual:
  background:
    enabled: true
    styles:
      solid_light:
        kind: solid
        color: [248, 248, 248]
      graph_paper:
        kind: grid
        base_color: [246, 247, 248]
        line_color: [224, 229, 236]
        spacing: 28
        line_width: 1
      warm_paper:
        kind: solid
        color: [250, 246, 240]
    weights:
      solid_light: 0.5
      graph_paper: 0.35
      warm_paper: 0.15
  noise:
    apply_prob: 0.75
    edit_types:
      - blur
      - downsample
      - jpeg
      - noise
    edit_count_range: [1, 2]
    value_ranges:
      blur:
        radius: [0.2, 0.6]
      downsample:
        scale: [0.85, 0.95]
      jpeg:
        quality: [70.0, 90.0]
      noise:
        alpha: [0.03, 0.08]
