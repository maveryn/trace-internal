[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trace"
version = "0.1.0"
description = "TRACE grounded visual reasoning environment"
requires-python = ">=3.10"

dependencies = [
    "Pillow>=9.0.0",
    "cairosvg>=2.7.0",
    "tqdm>=4.0.0",
    "PyYAML>=6.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pydantic>=2.0.0",
    "rfc8785>=0.1.4",
    "blake3>=1.0.0",
    "zstandard>=0.22.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
review = [
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]
all = [
    "pytest>=8.0.0",
    "openpyxl>=3.1.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "jinja2>=3.1.0",
    "httpx>=0.27.0",
]

[tool.setuptools]

[tool.setuptools.packages.find]
include = ["trace*"]

[tool.setuptools.package-data]
"trace.review_app" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests", "rlvr/tests"]
pythonpath = [".", "rlvr"]

[tool.black]
line-length = 88
target-version = ["py312"]
